name: Publish CLI

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    name: Publish @veltrixsecops/cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./cli/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match cli/package.json version $PKG_VERSION"
            exit 1
          fi

      # Idempotent: a dispatch/re-run on a version already on npm is a green no-op
      # (a plain `npm publish` would 403/EEXIST). Matches the SDK workflow.
      - name: Resolve publish decision
        id: resolve
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@veltrixsecops/cli@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "@veltrixsecops/cli@$VERSION is already on npm — nothing to publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "@veltrixsecops/cli@$VERSION is not on npm — will publish."
          fi

      - name: Install
        if: steps.resolve.outputs.already_published == 'false'
        working-directory: cli
        run: npm ci --no-audit --no-fund

      # The smoke test runs a real client-bundle check on splunk-enterprise, which
      # imports the BUNDLED SDK subpaths (@veltrixsecops/app-sdk/byol, /connections).
      # Those are not host-runtime shims (unlike app-sdk / /hooks / /client / /ui,
      # which the bundler externalizes), so esbuild must RESOLVE them — from the
      # app's own node_modules (bundleAppClient uses nodePaths=[appDir/node_modules]).
      # Build the in-repo SDK and link it there so the check passes.
      - name: Build + link the app SDK for the smoke test
        if: steps.resolve.outputs.already_published == 'false'
        run: |
          npm --prefix sdk ci --no-audit --no-fund
          npm --prefix sdk run build
          mkdir -p apps/splunk-enterprise/node_modules/@veltrixsecops
          ln -sfn "$PWD/sdk" apps/splunk-enterprise/node_modules/@veltrixsecops/app-sdk

      - name: Smoke test
        if: steps.resolve.outputs.already_published == 'false'
        working-directory: cli
        run: |
          node bin/veltrix.mjs --help
          node bin/veltrix.mjs validate ../apps/splunk-enterprise

      # Preflight the credential so a bad/expired token fails with a clear reason
      # instead of npm's cryptic "E404 Not Found - PUT".
      - name: Verify npm auth
        if: steps.resolve.outputs.already_published == 'false'
        run: |
          npm whoami >/dev/null 2>&1 || {
            echo "::error title=NPM_TOKEN invalid::npm authentication failed — the NPM_TOKEN repo secret is missing, expired, revoked, or lacks publish access to @veltrixsecops. Regenerate an npm Automation token (2FA-bypass) with read+write to the @veltrixsecops scope and update the NPM_TOKEN secret."
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: steps.resolve.outputs.already_published == 'false'
        working-directory: cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
