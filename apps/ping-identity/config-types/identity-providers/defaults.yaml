# Defaults for a new identity-provider item.
#
# Intentionally empty: the platform no longer seeds default values into a new
# item - it starts blank (per-field defaultValue in canvas.yaml still applies
# when a new item is added). Any values here would be a FLAT map keyed by the
# canvas field keys (name, description, enabled, type, registrationPopulationId,
# ...), since a provider's presentational groups share one flat item record,
# e.g.:
#   enabled: true
#   type: OPENID_CONNECT
#
# Deliberately NOT seeding any credential/endpoint fields: the correct shape is
# per-type and every secret field is sensitive, so there is no safe non-empty
# default to suggest.
