# Defaults for a new password-policy item.
#
# Intentionally empty: the platform no longer seeds system default values into
# a new item - it starts blank (per-field defaultValue in canvas.yaml still
# applies when a new item is added). Any values here would be a FLAT map keyed
# by the canvas field keys (name, description, default, minLength, ...), since
# a policy's presentational groups share one flat item record, e.g.:
#   minLength: 8
#   maxLength: 255
#   excludesCommonlyUsedPasswords: false
