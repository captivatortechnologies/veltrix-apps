id: thehive
name: TheHive
version: "0.4.0"
vendor: Veltrix
description: >
  Manage TheHive (open-source Security Incident Response Platform / SOAR) as code.
  Author case templates, custom fields, observable types, users, organisations,
  RBAC profiles and Knowledge Base page templates, and drive them through the
  Security-as-Code pipeline — validate, deploy, health check, drift detection and
  rollback — over the TheHive REST API (Bearer API key, self-signed tolerated).
  Primary target is TheHive 5 (StrangeBee, /api/v1); TheHive 4
  (/api/case/template) is a flagged alternate. Also provides BYOL infrastructure
  provisioning for a self-managed TheHive 5 stack (application + Cassandra +
  Elasticsearch + object storage).
category: SOAR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/thehive
icon: "🐝"

platform:
  minVersion: "1.0.0"

# TheHive's brand amber. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#f9a825"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: case-templates
      actions: [read, write, delete]
      description: Manage TheHive case templates (add / edit / delete)
    - resource: custom-fields
      actions: [read, write, delete]
      description: Manage TheHive custom fields (add / edit / delete)
    - resource: observable-types
      actions: [read, write, delete]
      description: Manage TheHive observable (datatype) types (add / delete)
    - resource: users
      actions: [read, write, delete]
      description: Manage TheHive users (add / edit / delete)
    - resource: organisations
      actions: [read, write]
      description: Manage TheHive organisations (add / edit). TheHive has no delete endpoint for organisations — removal locks instead.
    - resource: profiles
      actions: [read, write, delete]
      description: Manage TheHive profiles / RBAC roles (add / edit / delete)
    - resource: page-templates
      actions: [read, write, delete]
      description: Manage TheHive page templates / Knowledge Base (add / edit / delete). TheHive 5 only.
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL TheHive stack infrastructure
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: thehive_

pipeline:
  configurationTypes:
    - id: case-templates
      group: "Incident Response"
      name: Case Templates
      description: TheHive case templates — display name, title prefix, severity, TLP/PAP, tags, description and prefilled tasks — applied over the TheHive REST API (Bearer API key)
      canvasTemplate: config-types/case-templates/canvas.yaml
      defaultConfig: config-types/case-templates/defaults.yaml
      handlers:
        validate: config-types/case-templates/validate
        deploy: config-types/case-templates/deploy
        rollback: config-types/case-templates/rollback
        healthCheck: config-types/case-templates/healthCheck
        driftDetect: config-types/case-templates/driftDetect
        getStatus: config-types/case-templates/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: custom-fields
      group: "Incident Response"
      name: Custom Fields
      description: TheHive custom fields — name, display name, group, description, data type (string/integer/float/boolean/date/url), mandatory flag and enumeration options — applied over the TheHive REST API (Bearer API key)
      canvasTemplate: config-types/custom-fields/canvas.yaml
      defaultConfig: config-types/custom-fields/defaults.yaml
      handlers:
        validate: config-types/custom-fields/validate
        deploy: config-types/custom-fields/deploy
        rollback: config-types/custom-fields/rollback
        healthCheck: config-types/custom-fields/healthCheck
        driftDetect: config-types/custom-fields/driftDetect
        getStatus: config-types/custom-fields/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: observable-types
      group: "Incident Response"
      name: Observable Types
      description: TheHive observable (datatype) types — name and file-attachment flag — applied over the TheHive REST API (Bearer API key). Create-only (TheHive has no update endpoint); existing types are left untouched.
      canvasTemplate: config-types/observable-types/canvas.yaml
      defaultConfig: config-types/observable-types/defaults.yaml
      handlers:
        validate: config-types/observable-types/validate
        deploy: config-types/observable-types/deploy
        rollback: config-types/observable-types/rollback
        healthCheck: config-types/observable-types/healthCheck
        driftDetect: config-types/observable-types/driftDetect
        getStatus: config-types/observable-types/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: users
      group: "Organization"
      name: Users
      description: TheHive users — login (identity), display name, email, profile (role) and organisation — applied over the TheHive REST API (Bearer API key). Passwords and API keys are provisioned out of band.
      canvasTemplate: config-types/users/canvas.yaml
      defaultConfig: config-types/users/defaults.yaml
      handlers:
        validate: config-types/users/validate
        deploy: config-types/users/deploy
        rollback: config-types/users/rollback
        healthCheck: config-types/users/healthCheck
        driftDetect: config-types/users/driftDetect
        getStatus: config-types/users/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: organisations
      group: "Organization"
      name: Organisations
      description: TheHive organisations (multi-tenant containers) — name, description, task/observable sharing rules and locked state — applied over the TheHive REST API (Bearer API key). TheHive has no delete endpoint for organisations; removing an item locks it rather than deleting it.
      canvasTemplate: config-types/organisations/canvas.yaml
      defaultConfig: config-types/organisations/defaults.yaml
      handlers:
        validate: config-types/organisations/validate
        deploy: config-types/organisations/deploy
        rollback: config-types/organisations/rollback
        healthCheck: config-types/organisations/healthCheck
        driftDetect: config-types/organisations/driftDetect
        getStatus: config-types/organisations/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: profiles
      group: "Organization"
      name: Profiles
      description: TheHive profiles (RBAC roles) — name and permission set — applied over the TheHive REST API (Bearer API key). TheHive's five built-in profiles other than "analyst" are immutable and will reject a write.
      canvasTemplate: config-types/profiles/canvas.yaml
      defaultConfig: config-types/profiles/defaults.yaml
      handlers:
        validate: config-types/profiles/validate
        deploy: config-types/profiles/deploy
        rollback: config-types/profiles/rollback
        healthCheck: config-types/profiles/healthCheck
        driftDetect: config-types/profiles/driftDetect
        getStatus: config-types/profiles/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: page-templates
      group: "Incident Response"
      name: Page Templates
      description: TheHive page templates (Knowledge Base) — title, category, content and sort order — applied over the TheHive REST API (Bearer API key). TheHive 5 only; there is no TheHive 4 equivalent.
      canvasTemplate: config-types/page-templates/canvas.yaml
      defaultConfig: config-types/page-templates/defaults.yaml
      handlers:
        validate: config-types/page-templates/validate
        deploy: config-types/page-templates/deploy
        rollback: config-types/page-templates/rollback
        healthCheck: config-types/page-templates/healthCheck
        driftDetect: config-types/page-templates/driftDetect
        getStatus: config-types/page-templates/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/thehive

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL stack infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs the TheHive instance (component) with
    # the API key (credential), with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint + API key
# against the TheHive REST API (GET /api/v1/user/current).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: thehive_port
    type: number
    label: TheHive Port
    description: Port for the TheHive web UI / REST API (443 behind a proxy, or 9000 direct)
    default: 9000
    required: false
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the TheHive endpoint. Off by default —
      TheHive is commonly fronted by a self-signed certificate.
    default: false
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
