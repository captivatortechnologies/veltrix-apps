id: thehive
name: TheHive
version: "0.3.0"
vendor: Veltrix
description: >
  Manage TheHive (open-source Security Incident Response Platform / SOAR) as code.
  Author case templates and drive them through the Security-as-Code pipeline —
  validate, deploy, health check, drift detection and rollback — over the TheHive
  REST API (Bearer API key, self-signed tolerated). Primary target is TheHive 5
  (StrangeBee, /api/v1); TheHive 4 (/api/case/template) is a flagged alternate.
  Also provides BYOL infrastructure provisioning for a self-managed TheHive 5
  stack (application + Cassandra + Elasticsearch + object storage).
category: SOAR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/thehive
icon: "🐝"

platform:
  minVersion: "1.0.0"

# TheHive's brand amber. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#f9a825"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: case-templates
      actions: [read, write, delete]
      description: Manage TheHive case templates (add / edit / delete)
    - resource: custom-fields
      actions: [read, write, delete]
      description: Manage TheHive custom fields (add / edit / delete)
    - resource: observable-types
      actions: [read, write, delete]
      description: Manage TheHive observable (datatype) types (add / delete)
    - resource: users
      actions: [read, write, delete]
      description: Manage TheHive users (add / edit / delete)
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL TheHive stack infrastructure
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: thehive_

pipeline:
  configurationTypes:
    - id: case-templates
      group: "Incident Response"
      name: Case Templates
      description: TheHive case templates — display name, title prefix, severity, TLP/PAP, tags, description and prefilled tasks — applied over the TheHive REST API (Bearer API key)
      canvasTemplate: config-types/case-templates/canvas.yaml
      defaultConfig: config-types/case-templates/defaults.yaml
      handlers:
        validate: config-types/case-templates/validate
        deploy: config-types/case-templates/deploy
        rollback: config-types/case-templates/rollback
        healthCheck: config-types/case-templates/healthCheck
        driftDetect: config-types/case-templates/driftDetect
        getStatus: config-types/case-templates/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: custom-fields
      group: "Incident Response"
      name: Custom Fields
      description: TheHive custom fields — name, display name, group, description, data type (string/integer/float/boolean/date/url), mandatory flag and enumeration options — applied over the TheHive REST API (Bearer API key)
      canvasTemplate: config-types/custom-fields/canvas.yaml
      defaultConfig: config-types/custom-fields/defaults.yaml
      handlers:
        validate: config-types/custom-fields/validate
        deploy: config-types/custom-fields/deploy
        rollback: config-types/custom-fields/rollback
        healthCheck: config-types/custom-fields/healthCheck
        driftDetect: config-types/custom-fields/driftDetect
        getStatus: config-types/custom-fields/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: observable-types
      group: "Incident Response"
      name: Observable Types
      description: TheHive observable (datatype) types — name and file-attachment flag — applied over the TheHive REST API (Bearer API key). Create-only (TheHive has no update endpoint); existing types are left untouched.
      canvasTemplate: config-types/observable-types/canvas.yaml
      defaultConfig: config-types/observable-types/defaults.yaml
      handlers:
        validate: config-types/observable-types/validate
        deploy: config-types/observable-types/deploy
        rollback: config-types/observable-types/rollback
        healthCheck: config-types/observable-types/healthCheck
        driftDetect: config-types/observable-types/driftDetect
        getStatus: config-types/observable-types/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: users
      group: "Organization"
      name: Users
      description: TheHive users — login (identity), display name, email, profile (role) and organisation — applied over the TheHive REST API (Bearer API key). Passwords and API keys are provisioned out of band.
      canvasTemplate: config-types/users/canvas.yaml
      defaultConfig: config-types/users/defaults.yaml
      handlers:
        validate: config-types/users/validate
        deploy: config-types/users/deploy
        rollback: config-types/users/rollback
        healthCheck: config-types/users/healthCheck
        driftDetect: config-types/users/driftDetect
        getStatus: config-types/users/getStatus
      targets:
        componentTypes: [thehive, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/thehive

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL stack infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs the TheHive instance (component) with
    # the API key (credential), with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint + API key
# against the TheHive REST API (GET /api/v1/user/current).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: thehive_port
    type: number
    label: TheHive Port
    description: Port for the TheHive web UI / REST API (443 behind a proxy, or 9000 direct)
    default: 9000
    required: false
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the TheHive endpoint. Off by default —
      TheHive is commonly fronted by a self-signed certificate.
    default: false
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
