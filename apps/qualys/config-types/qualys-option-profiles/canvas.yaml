# =============================================================================
# Canvas Template — Qualys VM Option Profiles
#
# Declares ONE VM option profile — the item. An option profile controls how a
# scan runs (ports, performance, detection scope). Qualys assigns a numeric id,
# so identity for reconciliation is the natural key (title). The common flags
# (global, default) are first-class; every other VM option-profile parameter is
# supplied as a flat JSON object in `settings_json`. Field keys must match
# config-types/qualys-option-profiles/validate.ts.
# =============================================================================

id: "qualys-option-profiles"
name: "Qualys VM Option Profile Configuration"
toolType: "qualys"
entityType: "qualys-option-profiles"
description: "Define Qualys VM option profiles as code through the classic v2 API (create/update/delete via /api/2.0/fo/subscription/option_profile/vm/, read via export). Reconciled by title."

item:
  label: "Option Profile"
  identityField: "title"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Option Profile"
      icon: "sliders"
      description: "Title, sharing and scan settings"
      fields:
        - key: "title"
          label: "Title"
          fieldType: "text"
          required: true
          helpText: "The option profile title (its logical identity for reconciliation). Must be unique."

        - key: "global"
          label: "Global (available to all users)"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "When enabled, the option profile is shared across all users in the subscription."

        - key: "is_default"
          label: "Default option profile"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "When enabled, this profile is the default for scans/maps. Only one profile can be the default."

        - key: "settings_json"
          label: "Scan Settings (JSON)"
          fieldType: "textarea"
          helpText: >
            Optional flat JSON object of VM option-profile parameters. Example:
            {"scan_tcp_ports":"standard","scan_udp_ports":"standard","scan_overall_performance":"normal",
            "vulnerability_detection":"complete","scan_dead_hosts":0,"basic_host_information_checks":1}.
            Allowed values — scan_tcp_ports / scan_udp_ports: none | standard | light | full;
            scan_overall_performance: high | normal | low | custom; vulnerability_detection: complete | custom | runtime.
