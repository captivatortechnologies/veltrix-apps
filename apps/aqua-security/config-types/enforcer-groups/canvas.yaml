# =============================================================================
# Canvas Template — Aqua Security Enforcer Groups
#
# Declares ONE enforcer group's CONFIGURATION — the item. An Enforcer Group is
# the set of protection controls (runtime/network/host/image/admission
# protections) applied to every Aqua Enforcer registered into it, plus the
# orchestrator it targets. Applied via the Aqua Console REST API
# (/api/v1/hostsbatch — Aqua's internal object name for an enforcer group —
# see lib/aquasec.ts for the endpoint citation against the official Aqua
# Terraform provider).
#
# This config type manages the GROUP'S PROTECTION CONFIGURATION only — it does
# NOT install Enforcers or manage the install token/command (out of scope;
# see README "Coverage"). Identity is `groupId` (wire field `id`), an
# operator-chosen stable slug — NOT auto-generated by Aqua, so this app can
# create a group with a known id up front.
#
# Field keys must match config-types/enforcer-groups/_shared.ts.
# =============================================================================

id: "aqua-security-enforcer-groups"
name: "Enforcer Groups"
toolType: "aqua-security"
entityType: "enforcer-groups"
description: "Manage Aqua Security Enforcer Group protection configuration — runtime/network/host/image protections, orchestrator targeting and allow-lists — via the Aqua Console REST API (/api/v1/hostsbatch)"

item:
  label: "Enforcer Group"
  identityField: "groupId"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Identity"
      icon: "shield"
      fields:
        - key: "groupId"
          label: "Group ID"
          fieldType: "text"
          required: true
          validation:
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
          helpText: "Stable, operator-chosen identifier (letters, digits, - and _ only) — the identity used for upsert and drift, e.g. prod-k8s-enforcers"

        - key: "logicalName"
          label: "Display Name"
          fieldType: "text"
          required: false
          helpText: "Human-readable name shown in the Aqua console. Defaults to the Group ID."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 1000

        - key: "type"
          label: "Enforcer Type"
          fieldType: "text"
          required: true
          defaultValue: "agent"
          helpText: 'Aqua Enforcer type for this group, e.g. "agent" (standard Enforcer) or "kube_enforcer" (KubeEnforcer). Confirm the exact accepted value against your Aqua Console version.'

        - key: "enforce"
          label: "Enforce Mode"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Whether Enforcers in this group run in enforce (blocking) mode. Off means audit-only."

    - name: "Orchestrator"
      icon: "network"
      fields:
        - key: "orchestratorType"
          label: "Orchestrator Type"
          fieldType: "text"
          required: true
          defaultValue: "kubernetes"
          helpText: 'e.g. "kubernetes", "openshift", "docker", "swarm". Confirm the exact accepted value against your Aqua Console version.'

        - key: "orchestratorMaster"
          label: "Master / Control-Plane Node"
          fieldType: "checkbox"
          defaultValue: false

        - key: "orchestratorServiceAccount"
          label: "Service Account"
          fieldType: "text"
          required: false
          helpText: "Kubernetes/OpenShift/PKS service account the Enforcer runs as, when applicable."

        - key: "orchestratorNamespace"
          label: "Namespace"
          fieldType: "text"
          required: false
          helpText: "Kubernetes/OpenShift/PKS namespace the Enforcer runs in, when applicable."

    - name: "Protections"
      icon: "lock"
      description: "Which control families are active for Enforcers in this group"
      fields:
        - key: "containerActivityProtection"
          label: "Container Activity Protection"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Apply Container Runtime Policies, Image Profiles and Firewall Policies to containers."

        - key: "networkProtection"
          label: "Container Network Protection"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Apply Firewall Policies to containers and record network maps."

        - key: "hostNetworkProtection"
          label: "Host Network Protection"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Apply Firewall Policies to the host itself."

        - key: "hostProtection"
          label: "Host Protection"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Enable Host Runtime Policy controls (except OS user allow/block lists)."

        - key: "hostAssurance"
          label: "Host Assurance"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Enable host scanning and Host Assurance Policy controls."

        - key: "imageAssurance"
          label: "Image Assurance"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Enable Image Assurance Policy and related Container Runtime Policy controls (block non-compliant / unregistered images)."

        - key: "admissionControl"
          label: "Admission Control"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Kubernetes only — block deployment of images that fail Container Runtime Policy controls. Requires Enforce Mode."

        - key: "autoDiscoveryEnabled"
          label: "Workload Auto-Discovery"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Discover workloads on the cluster automatically (KubeEnforcer groups)."

    - name: "Allow Lists"
      icon: "list"
      fields:
        - key: "allowedApplications"
          label: "Allowed Applications"
          fieldType: "tags"
          helpText: "Only containers of these named applications are allowed to run. Leave empty to allow any."

        - key: "allowedLabels"
          label: "Allowed Labels"
          fieldType: "tags"

        - key: "allowedRegistries"
          label: "Allowed Registries"
          fieldType: "tags"
          helpText: "Only images from these registry names are allowed to run on hosts in this group. Leave empty to allow any."

    - name: "Scheduled Scan"
      icon: "clock"
      fields:
        - key: "scheduleScanDisabled"
          label: "Disable Scheduled Scan"
          fieldType: "checkbox"
          defaultValue: false

        - key: "scheduleScanDays"
          label: "Scan Days"
          fieldType: "tags"
          helpText: "Day-of-week numbers (0=Sunday .. 6=Saturday) to run the scheduled scan on. Leave empty for every day."

        - key: "scheduleScanTime"
          label: "Scan Times (Hour)"
          fieldType: "tags"
          helpText: "Hour(s) of day (0-23, server local time) to run the scheduled scan at."
