# =============================================================================
# Canvas Template — Cisco Umbrella Network Tunnels
#
# Declares ONE Umbrella Network Tunnel (/deployments/v2/tunnels) — an IPsec
# tunnel used to onramp traffic to Umbrella's Secure Internet Gateway. Users
# add as many as they need. Tunnels are addressed by an opaque id (no
# lookup-by-name), so the app matches a declared tunnel to a live one by NAME
# and stores the id from the deploy for rename-safety.
#
# IMPORTANT: Umbrella has no confirmed update endpoint for a tunnel — once
# created, deploy will NOT edit an existing tunnel in place (device type or
# secret changes are reported as a note, not applied). Remove the item and
# re-declare it to recreate the tunnel with new settings. Reconcile deletes
# tunnels this app created but no longer declares.
#
# Field keys must match what config-types/network-tunnels/validate.ts checks.
# =============================================================================

id: "cisco-umbrella-network-tunnels"
name: "Network Tunnels Configuration"
toolType: "cisco-umbrella"
entityType: "network-tunnels"
description: "Define Cisco Umbrella IPsec network tunnels as code through the Umbrella Deployments API."

item:
  label: "Network Tunnel"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Tunnel"
      icon: "shield"
      description: "Tunnel identity and device"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 50
          helpText: >
            The tunnel's name. Must be unique within this canvas — the app
            matches live Umbrella tunnels on it (Umbrella has no
            lookup-by-name, so the id is stored after deploy for rename-safety).

        - key: "deviceType"
          label: "Device type"
          fieldType: "text"
          required: true
          defaultValue: "other"
          helpText: >
            The onramp device/vendor type. Cisco has not published a closed
            list for this field in the public API reference — "other" is the
            only value confirmed to work in every available sample; check your
            Umbrella dashboard's tunnel setup wizard for a vendor-specific
            value if you have one (e.g. a named router/firewall platform).

        - key: "siteName"
          label: "Site (optional)"
          fieldType: "text"
          required: false
          helpText: >
            The name of an existing Umbrella Site to associate this tunnel
            with. Resolved to Umbrella's site id at deploy time; leave blank
            for no site association.

    - name: "Authentication"
      icon: "lock"
      description: "Pre-shared key (PSK) authentication for the tunnel"
      fields:
        - key: "pskSecret"
          label: "PSK secret"
          fieldType: "password"
          required: true
          helpText: >
            ⚠ WRITE-ONLY secret — Umbrella never returns it, so it cannot be
            diffed, logged, or captured for rollback. Sent only when creating
            the tunnel; Umbrella has no confirmed update endpoint, so changing
            it here has no effect on an already-created tunnel (remove and
            re-declare the item to recreate it with a new secret).

        - key: "idPrefix"
          label: "ID prefix"
          fieldType: "text"
          required: false
          helpText: "Optional identifier prefix used in the tunnel's PSK authentication (the local IKE ID)."
