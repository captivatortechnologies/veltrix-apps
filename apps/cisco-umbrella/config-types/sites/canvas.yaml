# =============================================================================
# Canvas Template — Cisco Umbrella Sites
#
# Declares ONE Umbrella Site (/deployments/v2/sites) — a physical location
# grouping for deployed Umbrella Virtual Appliances. Users add as many as they
# need. Sites are addressed by an opaque siteId (no lookup-by-name), so the app
# matches a declared site to a live one by NAME and stores the siteId from the
# deploy for rename-safety. Reconcile deletes sites this app created but no longer
# declares; the Umbrella default site is never deleted.
#
# Field keys must match what config-types/sites/validate.ts checks.
# =============================================================================

id: "cisco-umbrella-sites"
name: "Sites Configuration"
toolType: "cisco-umbrella"
entityType: "sites"
description: "Define Cisco Umbrella sites (location groupings for Virtual Appliances) as code through the Umbrella Deployments API."

item:
  label: "Site"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Site"
      icon: "map-pin"
      description: "Site identity"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 50
          helpText: >
            The site's name. Must be unique within this canvas — the app matches
            live Umbrella sites on it (Umbrella has no lookup-by-name, so the
            siteId is stored after deploy for rename-safety).
