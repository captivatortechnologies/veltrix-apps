id: automox
name: Automox
version: "0.2.0"
vendor: Veltrix
description: >
  Manage Automox (cloud-native endpoint patch management) configuration as
  code through the Automox Console API. Author Policies (patch), Worklets
  (custom scripts / required software) and Server Groups, and drive them
  through the Security-as-Code pipeline (validate, deploy, health check, drift
  detection and rollback) over the Automox REST API. Authenticates with a
  Bearer API key, scoped to an Organization ID sent as the `o` query parameter
  on every request.
category: Endpoint Management
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/automox
icon: "🛠️"

platform:
  minVersion: "1.0.0"

# Automox brand blue.
branding:
  primaryColor: "#0072CE"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: policies
      actions: [read, write, delete]
      description: Manage Automox patch Policies
    - resource: worklets
      actions: [read, write, delete]
      description: Manage Automox Worklets (custom scripts) and Required Software policies
    - resource: server-groups
      actions: [read, write, delete]
      description: Manage Automox Server Groups

pipeline:
  configurationTypes:
    - id: policies
      group: "Policies"
      name: Policies
      description: >
        Automox patch Policies, applied over the Automox Console API
        (GET/POST /policies, GET/PUT/DELETE /policies/{id}). Reconciled by
        policy name (scoped to policy_type_name: patch) within the configured
        Organization ID.
      canvasTemplate: config-types/policies/canvas.yaml
      defaultConfig: config-types/policies/defaults.yaml
      handlers:
        validate: config-types/policies/validate
        deploy: config-types/policies/deploy
        rollback: config-types/policies/rollback
        healthCheck: config-types/policies/healthCheck
        driftDetect: config-types/policies/driftDetect
        getStatus: config-types/policies/getStatus
      targets:
        componentTypes: [automox-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: worklets
      group: "Policies"
      name: Worklets
      description: >
        Automox Custom (Worklet) and Required Software policies, applied over
        the same Automox Console API (GET/POST /policies, GET/PUT/DELETE
        /policies/{id}) as Policies, but reconciled independently (scoped to
        policy_type_name: custom / required_software) so the two config types
        never collide on a shared name.
      canvasTemplate: config-types/worklets/canvas.yaml
      defaultConfig: config-types/worklets/defaults.yaml
      handlers:
        validate: config-types/worklets/validate
        deploy: config-types/worklets/deploy
        rollback: config-types/worklets/rollback
        healthCheck: config-types/worklets/healthCheck
        driftDetect: config-types/worklets/driftDetect
        getStatus: config-types/worklets/getStatus
      targets:
        componentTypes: [automox-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: server-groups
      group: "Groups"
      name: Server Groups
      description: >
        Automox Server Groups, applied over the Automox Console API
        (GET/POST /servergroups, GET/PUT/DELETE /servergroups/{id}).
        Reconciled by group name within the configured Organization ID.
      canvasTemplate: config-types/server-groups/canvas.yaml
      defaultConfig: config-types/server-groups/defaults.yaml
      handlers:
        validate: config-types/server-groups/validate
        deploy: config-types/server-groups/deploy
        rollback: config-types/server-groups/rollback
        healthCheck: config-types/server-groups/healthCheck
        driftDetect: config-types/server-groups/driftDetect
        getStatus: config-types/server-groups/getStatus
      targets:
        componentTypes: [automox-org]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/automox

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs an Automox organization (component)
    # with the API-key credential used to reach it, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies the API key against the fixed
# Automox Console API endpoint (GET /orgs — the one policy-adjacent endpoint
# that does not require an Organization ID), and cross-checks the configured
# Organization ID against the orgs the key can see.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Automox Console API calls.
    default: 30
    required: false
