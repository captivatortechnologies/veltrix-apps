# =============================================================================
# Canvas Template — Automox Policies (patch)
#
# Declares ONE Automox patch Policy (the item). ONE item = ONE Policy, matched
# on its NAME (the logical identity used for upsert and drift). Field keys
# must match config-types/policies/_shared.ts (extractPolicySpecs).
#
# This config type always writes `policy_type_name: "patch"`. Required
# Software and Custom (Worklet) policies are a SEPARATE config type
# (config-types/worklets) — see its canvas.yaml — so the two never race to
# reconcile the same underlying /policies object by name.
#
# Applied over the Automox Console API, org-scoped via the `o` query parameter:
#   GET/POST   /policies?o=<organizationId>
#   GET/PUT/DELETE /policies/{id}?o=<organizationId>
# Auth is `Authorization: Bearer <api key>`.
# =============================================================================

id: "automox-policies"
name: "Policy"
toolType: "automox"
entityType: "policies"
description: "Define Automox patch Policies as code through the Automox Console API (/policies)."

item:
  label: "Policy"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Policy"
      icon: "shield"
      description: "Identity"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The Policy's display name. Must be unique within the canvas — this is the stable identity used to find, update and drift-check the policy on each deploy."

        - key: "notes"
          label: "Notes"
          fieldType: "textarea"
          helpText: "Free-text notes shown on the policy in the Automox Console. Required by the API — leave empty to send an empty string."

        - key: "server_groups"
          label: "Server Group IDs"
          fieldType: "tags"
          helpText: "Automox Server Group ids this policy applies to (numeric ids — see the Server Groups config type, or the Automox Console). Leave empty to leave the policy unassigned to any group."

    - name: "Schedule"
      icon: "calendar"
      description: "When the policy runs"
      fields:
        - key: "schedule_days"
          label: "Schedule Days"
          fieldType: "multiselect"
          options:
            - { label: "Sunday", value: "sunday" }
            - { label: "Monday", value: "monday" }
            - { label: "Tuesday", value: "tuesday" }
            - { label: "Wednesday", value: "wednesday" }
            - { label: "Thursday", value: "thursday" }
            - { label: "Friday", value: "friday" }
            - { label: "Saturday", value: "saturday" }
          helpText: "Days of the week the policy runs. Converted to the Automox schedule_days bitmask. Leave empty to deploy the policy unscheduled (it will not run automatically)."

        - key: "schedule_time"
          label: "Schedule Time"
          fieldType: "text"
          defaultValue: "00:00"
          validation:
            pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          helpText: "24-hour time the policy runs on its scheduled days, e.g. \"02:00\"."

        - key: "schedule_weeks_of_month"
          label: "Schedule Weeks of Month (advanced)"
          fieldType: "number"
          helpText: "Automox bitmask for which weeks of the month the policy runs. Leave blank to run every week (auto-set to 62) whenever Schedule Days is non-empty."

        - key: "schedule_months"
          label: "Schedule Months (advanced)"
          fieldType: "number"
          helpText: "Automox bitmask for which months the policy runs. Leave blank to run every month (auto-set to 8190) whenever Schedule Days is non-empty."

        - key: "use_scheduled_timezone"
          label: "Use Scheduled Timezone"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Run the schedule in a specific timezone rather than each device's local time."

        - key: "scheduled_timezone"
          label: "Scheduled Timezone"
          fieldType: "text"
          visibleWhen:
            field: "use_scheduled_timezone"
            equals: true
          helpText: "IANA timezone name, e.g. \"America/Denver\". Required when Use Scheduled Timezone is enabled."

    - name: "Patch Policy"
      icon: "shield-check"
      description: "What the policy patches and how"
      fields:
        - key: "patch_rule"
          label: "Patch Rule"
          fieldType: "select"
          defaultValue: "all"
          options:
            - { label: "Patch All", value: "all" }
            - { label: "Patch All Except / Patch Only / Patch by Severity (Filter)", value: "filter" }
            - { label: "Manually Approve", value: "manual" }
            - { label: "Advanced", value: "advanced" }
          helpText: "How the policy selects which patches to apply. \"Advanced\" filters are not yet modeled by this app — author them in the Automox Console."

        - key: "filter_type"
          label: "Filter Type"
          fieldType: "select"
          defaultValue: "include"
          visibleWhen:
            field: "patch_rule"
            equals: "filter"
          options:
            - { label: "Patch Only (include)", value: "include" }
            - { label: "Patch All Except (exclude)", value: "exclude" }
            - { label: "Patch by Severity", value: "severity" }
          helpText: "Only used when Patch Rule is \"Filter\"."

        - key: "filters"
          label: "Filter Patterns"
          fieldType: "tags"
          visibleWhen:
            field: "patch_rule"
            equals: "filter"
          helpText: "Package name patterns, e.g. \"*Google Chrome*\". Used when Filter Type is Include or Exclude — ignored for Patch by Severity."

        - key: "severity_filter"
          label: "Severities"
          fieldType: "multiselect"
          visibleWhen:
            field: "filter_type"
            equals: "severity"
          options:
            - { label: "No Known CVEs", value: "no_known_cves" }
            - { label: "None", value: "none" }
            - { label: "Unknown", value: "unknown" }
            - { label: "Low", value: "low" }
            - { label: "Medium", value: "medium" }
            - { label: "High", value: "high" }
            - { label: "Critical", value: "critical" }
          helpText: "Used only for Patch by Severity (Filter Type = severity)."

        - key: "auto_patch"
          label: "Auto Patch"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Automatically execute the policy on its schedule."

        - key: "auto_reboot"
          label: "Auto Reboot"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Automatically reboot devices when a patch requires it."

        - key: "notify_user"
          label: "Notify User"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Show the end user a notification before patching."

        - key: "notify_reboot_user"
          label: "Notify User Before Reboot"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Show a notification 15 minutes before a reboot that follows patching."

        - key: "include_optional"
          label: "Include Optional Patches"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Include optional Windows patches in this policy."

        - key: "missed_patch_window"
          label: "Missed Patch Window"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Run the policy as soon as possible if a device missed its scheduled window."

    - name: "Device Targeting"
      icon: "filter"
      description: "Optional device-level targeting"
      fields:
        - key: "device_filters_json"
          label: "Device Filters (JSON)"
          fieldType: "textarea"
          helpText: >-
            Optional JSON array of device targeting clauses, e.g.
            [{"field":"tag","op":"in","value":["Windows","Win10"]}]. field: tag |
            hostname | ip_addr | os_family | os_version_id | organizational_unit.
            op: in | not_in | like_any | not_like_any. Leave empty for no
            device-level targeting.
