id: "cisco-meraki-appliance-content-filtering"
name: "appliance content filtering settings"
toolType: "cisco-meraki"
entityType: "appliance-content-filtering"
description: "Manage Cisco Meraki appliance content filtering settings as code."
item:
  label: "Network settings"
  identityField: "network_id"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Network"
      fields:
        - key: "network_id"
          label: "Meraki Network ID"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[A-Za-z0-9_-]+$"
    - name: "Settings"
      fields:
        - key: "settings"
          label: "Settings (JSON)"
          fieldType: "textarea"
          required: true
          validation:
            maxLength: 200000
          helpText: "Exact documented Meraki Dashboard API request object; unknown fields are passed through for forward compatibility."

