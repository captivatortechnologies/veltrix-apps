id: pfsense
name: pfSense
version: "0.3.0"
vendor: Veltrix
description: >
  Manage pfSense firewall configuration as code. pfSense CE ships NO REST API
  of its own — this app talks to the widely-used third-party "pfSense REST
  API" package (pfSense-pkg-RESTAPI, formerly known as jaredhendrickson13/
  pfsense-api; https://github.com/pfrest/pfSense-pkg-RESTAPI, docs at
  https://pfrest.org/), which MUST be installed on the pfSense box first
  (System > Package Manager > Available Packages > search "RESTAPI") before
  this app can reach it — see the Setup Guide. Covers firewall aliases (host /
  network / port groups), firewall (filter) rules, NAT port forwards and
  virtual IPs over the package's v2 API, with pending changes applied once
  per deploy (aliases/rules/port-forwards share /api/v2/firewall/apply;
  virtual IPs use their own /api/v2/firewall/virtual_ip/apply) — with
  validation, drift detection and rollback handled by the Security-as-Code
  pipeline.
  Version 0.3.0 additionally covers outbound and 1:1 NAT, schedules, gateways,
  static routes, DNS Resolver overrides, and local users/groups, with each
  subsystem dispatched through its correct apply lifecycle.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/pfsense
icon: "🚦"

platform:
  minVersion: "1.0.0"

# pfSense/Netgate brand: signature orange with a dark navy accent.
branding:
  primaryColor: "#EA7125"
  accentColor: "#03314B"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: firewall-aliases
      actions: [read, write, delete]
      description: Manage pfSense firewall aliases (host / network / port groups) via the pfSense REST API package (/api/v2/firewall/alias)
    - resource: firewall-rules
      actions: [read, write, delete]
      description: Manage pfSense firewall (filter) rules via the pfSense REST API package (/api/v2/firewall/rule)
    - resource: nat-port-forwards
      actions: [read, write, delete]
      description: Manage pfSense NAT port-forward rules via the pfSense REST API package (/api/v2/firewall/nat/port_forward)
    - resource: virtual-ips
      actions: [read, write, delete]
      description: Manage pfSense virtual IPs (IP Alias / Proxy ARP / CARP / Other) via the pfSense REST API package (/api/v2/firewall/virtual_ip)
    - resource: nat-outbound-mode
      actions: [read, write, delete]
      description: Manage the pfSense system-wide outbound NAT mode via the pfSense REST API package (/api/v2/firewall/nat/outbound/mode)
    - resource: nat-outbound-mappings
      actions: [read, write, delete]
      description: Manage pfSense outbound NAT mappings via the pfSense REST API package (/api/v2/firewall/nat/outbound/mapping)
    - resource: nat-one-to-one
      actions: [read, write, delete]
      description: Manage pfSense 1:1 NAT mappings via the pfSense REST API package (/api/v2/firewall/nat/one_to_one/mapping)
    - resource: firewall-schedules
      actions: [read, write, delete]
      description: Manage pfSense firewall schedules via the pfSense REST API package (/api/v2/firewall/schedule)
    - resource: gateways
      actions: [read, write, delete]
      description: Manage pfSense routing gateways via the pfSense REST API package (/api/v2/routing/gateway)
    - resource: static-routes
      actions: [read, write, delete]
      description: Manage pfSense static routes via the pfSense REST API package (/api/v2/routing/static_route)
    - resource: dns-resolver-host-overrides
      actions: [read, write, delete]
      description: Manage pfSense DNS Resolver host overrides via the pfSense REST API package (/api/v2/services/dns_resolver/host_override)
    - resource: dns-resolver-domain-overrides
      actions: [read, write, delete]
      description: Manage pfSense DNS Resolver domain overrides via the pfSense REST API package (/api/v2/services/dns_resolver/domain_override)
    - resource: users
      actions: [read, write, delete]
      description: Manage pfSense local user accounts via the pfSense REST API package (/api/v2/user)
    - resource: user-groups
      actions: [read, write, delete]
      description: Manage pfSense local user groups via the pfSense REST API package (/api/v2/user/group)


pipeline:
  configurationTypes:
    - id: firewall-aliases
      group: "Firewall"
      name: Firewall Aliases
      description: >
        Host, network or port aliases — name-keyed, upserted against
        /api/v2/firewall/alias(es) — with pending changes applied once per
        deploy via /api/v2/firewall/apply. An alias's name is immutable once
        created (the REST API package rejects renames); reconciliation
        creates/updates/removes aliases by name.
      canvasTemplate: config-types/firewall-aliases/canvas.yaml
      defaultConfig: config-types/firewall-aliases/defaults.yaml
      handlers:
        validate: config-types/firewall-aliases/validate
        deploy: config-types/firewall-aliases/deploy
        rollback: config-types/firewall-aliases/rollback
        healthCheck: config-types/firewall-aliases/healthCheck
        driftDetect: config-types/firewall-aliases/driftDetect
        getStatus: config-types/firewall-aliases/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-rules
      group: "Firewall"
      name: Firewall Rules
      description: >
        Firewall (filter) rules against /api/v2/firewall/rule(s), with
        pending changes applied once per deploy via /api/v2/firewall/apply.
        pfSense rules have no name field, so identity is tracked per canvas
        item (not by description) across deploys. Order is evaluated
        top-to-bottom; an optional explicit position maps to the REST API
        package's generic `placement` field — see README.md for the full
        ordering model and its caveats.
      canvasTemplate: config-types/firewall-rules/canvas.yaml
      defaultConfig: config-types/firewall-rules/defaults.yaml
      handlers:
        validate: config-types/firewall-rules/validate
        deploy: config-types/firewall-rules/deploy
        rollback: config-types/firewall-rules/rollback
        healthCheck: config-types/firewall-rules/healthCheck
        driftDetect: config-types/firewall-rules/driftDetect
        getStatus: config-types/firewall-rules/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: nat-port-forwards
      group: "NAT"
      name: NAT Port Forwards
      description: >
        NAT port-forward rules against /api/v2/firewall/nat/port_forward(s),
        with pending changes applied once per deploy via
        /api/v2/firewall/apply. Like firewall rules, port forwards have no
        name field, so identity is tracked per canvas item; an optional
        explicit position controls evaluation order the same way.
      canvasTemplate: config-types/nat-port-forwards/canvas.yaml
      defaultConfig: config-types/nat-port-forwards/defaults.yaml
      handlers:
        validate: config-types/nat-port-forwards/validate
        deploy: config-types/nat-port-forwards/deploy
        rollback: config-types/nat-port-forwards/rollback
        healthCheck: config-types/nat-port-forwards/healthCheck
        driftDetect: config-types/nat-port-forwards/driftDetect
        getStatus: config-types/nat-port-forwards/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: virtual-ips
      group: "Firewall"
      name: Virtual IPs
      description: >
        Virtual IPs (IP Alias / Proxy ARP / CARP / Other) against
        /api/v2/firewall/virtual_ip(s); identity is the VIP's own unique
        address (subnet), matching firewall-aliases' name-keyed pattern.
        Pending changes are applied once per deploy via the
        virtual-IP-specific /api/v2/firewall/virtual_ip/apply — a SEPARATE
        endpoint from the one aliases/rules/port-forwards share.
      canvasTemplate: config-types/virtual-ips/canvas.yaml
      defaultConfig: config-types/virtual-ips/defaults.yaml
      handlers:
        validate: config-types/virtual-ips/validate
        deploy: config-types/virtual-ips/deploy
        rollback: config-types/virtual-ips/rollback
        healthCheck: config-types/virtual-ips/healthCheck
        driftDetect: config-types/virtual-ips/driftDetect
        getStatus: config-types/virtual-ips/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false


    - id: nat-outbound-mode
      group: "NAT"
      name: Outbound NAT Mode
      description: >
        The system-wide outbound NAT mode (automatic / hybrid / advanced /
        disabled) — a PATCH-only singleton against
        /api/v2/firewall/nat/outbound/mode, with pending changes applied via
        /api/v2/firewall/apply. "Automatic" ignores the separate NAT
        Outbound Mappings config type entirely; use "Hybrid" or "Advanced"
        for those mappings to take effect.
      canvasTemplate: config-types/nat-outbound-mode/canvas.yaml
      defaultConfig: config-types/nat-outbound-mode/defaults.yaml
      handlers:
        validate: config-types/nat-outbound-mode/validate
        deploy: config-types/nat-outbound-mode/deploy
        rollback: config-types/nat-outbound-mode/rollback
        healthCheck: config-types/nat-outbound-mode/healthCheck
        driftDetect: config-types/nat-outbound-mode/driftDetect
        getStatus: config-types/nat-outbound-mode/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: nat-outbound-mappings
      group: "NAT"
      name: Outbound NAT Mappings
      description: >
        Outbound NAT mappings against
        /api/v2/firewall/nat/outbound/mapping(s), with pending changes
        applied once per deploy via /api/v2/firewall/apply. Only takes
        effect when the separate Outbound NAT Mode config type is Hybrid or
        Advanced. pfSense mappings have no name field, so identity is
        tracked per canvas item; an optional explicit position controls
        evaluation order via the REST API package's generic `placement` field.
      canvasTemplate: config-types/nat-outbound-mappings/canvas.yaml
      defaultConfig: config-types/nat-outbound-mappings/defaults.yaml
      handlers:
        validate: config-types/nat-outbound-mappings/validate
        deploy: config-types/nat-outbound-mappings/deploy
        rollback: config-types/nat-outbound-mappings/rollback
        healthCheck: config-types/nat-outbound-mappings/healthCheck
        driftDetect: config-types/nat-outbound-mappings/driftDetect
        getStatus: config-types/nat-outbound-mappings/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: nat-one-to-one
      group: "NAT"
      name: 1:1 NAT Mappings
      description: >
        1:1 NAT mappings against /api/v2/firewall/nat/one_to_one/mapping(s),
        with pending changes applied once per deploy via
        /api/v2/firewall/apply. Like outbound mappings, 1:1 mappings have no
        name field, so identity is tracked per canvas item.
      canvasTemplate: config-types/nat-one-to-one/canvas.yaml
      defaultConfig: config-types/nat-one-to-one/defaults.yaml
      handlers:
        validate: config-types/nat-one-to-one/validate
        deploy: config-types/nat-one-to-one/deploy
        rollback: config-types/nat-one-to-one/rollback
        healthCheck: config-types/nat-one-to-one/healthCheck
        driftDetect: config-types/nat-one-to-one/driftDetect
        getStatus: config-types/nat-one-to-one/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-schedules
      group: "Firewall"
      name: Firewall Schedules
      description: >
        Named time-based schedules (referenced by a Firewall Rule's Schedule
        field) against /api/v2/firewall/schedule(s), name-keyed like
        aliases. Each schedule carries exactly one embedded time range
        (recurring weekdays OR specific month/day date pairs) — multiple
        time ranges per schedule are out of scope. Pending changes are
        applied once per deploy via /api/v2/firewall/apply.
      canvasTemplate: config-types/firewall-schedules/canvas.yaml
      defaultConfig: config-types/firewall-schedules/defaults.yaml
      handlers:
        validate: config-types/firewall-schedules/validate
        deploy: config-types/firewall-schedules/deploy
        rollback: config-types/firewall-schedules/rollback
        healthCheck: config-types/firewall-schedules/healthCheck
        driftDetect: config-types/firewall-schedules/driftDetect
        getStatus: config-types/firewall-schedules/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: gateways
      group: "Routing"
      name: Gateways
      description: >
        Routing gateways against /api/v2/routing/gateway(s), name-keyed
        (name immutable once created, like aliases). Pending changes are
        applied once per deploy via /api/v2/routing/apply — a distinct
        endpoint from every firewall/NAT/DNS apply endpoint, shared only
        with the separate Static Routes config type.
      canvasTemplate: config-types/gateways/canvas.yaml
      defaultConfig: config-types/gateways/defaults.yaml
      handlers:
        validate: config-types/gateways/validate
        deploy: config-types/gateways/deploy
        rollback: config-types/gateways/rollback
        healthCheck: config-types/gateways/healthCheck
        driftDetect: config-types/gateways/driftDetect
        getStatus: config-types/gateways/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: static-routes
      group: "Routing"
      name: Static Routes
      description: >
        Static routes against /api/v2/routing/static_route(s), sharing the
        same /api/v2/routing/apply endpoint as Gateways. pfSense routes have
        no name field, so identity is tracked per canvas item.
      canvasTemplate: config-types/static-routes/canvas.yaml
      defaultConfig: config-types/static-routes/defaults.yaml
      handlers:
        validate: config-types/static-routes/validate
        deploy: config-types/static-routes/deploy
        rollback: config-types/static-routes/rollback
        healthCheck: config-types/static-routes/healthCheck
        driftDetect: config-types/static-routes/driftDetect
        getStatus: config-types/static-routes/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: dns-resolver-host-overrides
      group: "Services"
      name: DNS Resolver Host Overrides
      description: >
        DNS Resolver (Unbound) host overrides against
        /api/v2/services/dns_resolver/host_override(s). `host`+`domain`
        together (case-insensitive) are the identity — pfSense itself
        enforces this pair as unique, not either field alone. Pending
        changes are applied once per deploy via the dedicated
        /api/v2/services/dns_resolver/apply endpoint. Nested per-override
        alias hostnames are out of scope for v0.3.0.
      canvasTemplate: config-types/dns-resolver-host-overrides/canvas.yaml
      defaultConfig: config-types/dns-resolver-host-overrides/defaults.yaml
      handlers:
        validate: config-types/dns-resolver-host-overrides/validate
        deploy: config-types/dns-resolver-host-overrides/deploy
        rollback: config-types/dns-resolver-host-overrides/rollback
        healthCheck: config-types/dns-resolver-host-overrides/healthCheck
        driftDetect: config-types/dns-resolver-host-overrides/driftDetect
        getStatus: config-types/dns-resolver-host-overrides/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: dns-resolver-domain-overrides
      group: "Services"
      name: DNS Resolver Domain Overrides
      description: >
        DNS Resolver (Unbound) domain overrides against
        /api/v2/services/dns_resolver/domain_override(s), forwarding all
        queries for a domain to a specific upstream DNS server (optionally
        over DNS-over-TLS). Identity is the domain itself (case-insensitive).
        Shares the same /api/v2/services/dns_resolver/apply endpoint as
        DNS Resolver Host Overrides.
      canvasTemplate: config-types/dns-resolver-domain-overrides/canvas.yaml
      defaultConfig: config-types/dns-resolver-domain-overrides/defaults.yaml
      handlers:
        validate: config-types/dns-resolver-domain-overrides/validate
        deploy: config-types/dns-resolver-domain-overrides/deploy
        rollback: config-types/dns-resolver-domain-overrides/rollback
        healthCheck: config-types/dns-resolver-domain-overrides/healthCheck
        driftDetect: config-types/dns-resolver-domain-overrides/driftDetect
        getStatus: config-types/dns-resolver-domain-overrides/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: users
      group: "System"
      name: Local Users
      description: >
        Local pfSense user accounts against /api/v2/user, name-keyed.
        Writes apply IMMEDIATELY (User is `always_apply` server-side) — no
        separate apply step, unlike every firewall/NAT/routing/DNS config
        type in this app. Passwords are write-only: never read back,
        diffed by drift, or restored by rollback; leaving the password
        blank on an existing user keeps it unchanged. System-scoped
        accounts (e.g. "admin") are never touched.
      canvasTemplate: config-types/users/canvas.yaml
      defaultConfig: config-types/users/defaults.yaml
      handlers:
        validate: config-types/users/validate
        deploy: config-types/users/deploy
        rollback: config-types/users/rollback
        healthCheck: config-types/users/healthCheck
        driftDetect: config-types/users/driftDetect
        getStatus: config-types/users/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

    - id: user-groups
      group: "System"
      name: Local User Groups
      description: >
        Local pfSense user groups against /api/v2/user/group, name-keyed.
        Writes apply IMMEDIATELY (UserGroup is `always_apply` server-side)
        — no separate apply step. System-scoped groups (pfSense's own
        built-ins) are never touched.
      canvasTemplate: config-types/user-groups/canvas.yaml
      defaultConfig: config-types/user-groups/defaults.yaml
      handlers:
        validate: config-types/user-groups/validate
        deploy: config-types/user-groups/deploy
        rollback: config-types/user-groups/rollback
        healthCheck: config-types/user-groups/healthCheck
        driftDetect: config-types/user-groups/driftDetect
        getStatus: config-types/user-groups/getStatus
      targets:
        componentTypes: [pfsense]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/pfsense

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a pfSense firewall (component)
    # with the REST API package credential (API key or webConfigurator
    # username/password for JWT) used to reach it, with a per-row
    # connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: GET /api/v2/system/version against the
# REST API package, self-signed tolerated per the verify_tls setting.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the pfSense webConfigurator / REST
      API endpoint. Off by default — pfSense ships a self-signed certificate
      until an administrator installs a CA-signed one.
    default: false
    required: false
  - key: port
    type: number
    label: HTTPS Port
    description: >
      The pfSense webConfigurator HTTPS port the REST API package answers on
      (the package shares the webConfigurator's port and TLS listener).
    default: 443
    required: false
  - key: api_base_path
    type: select
    label: REST API Base Path
    description: >
      The REST API package's versioned base path. This app is built and
      tested against v2 (/api/v2) — the package's current stable version at
      the time of writing. Left here for forward compatibility only; changing
      it is untested.
    default: "/api/v2"
    required: false
    options:
      - { label: "v2 (current, tested)", value: "/api/v2" }
      - { label: "v1 (legacy, untested)", value: "/api/v1" }
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for REST API package calls.
    default: 30
    required: false
