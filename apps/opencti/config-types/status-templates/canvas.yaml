# =============================================================================
# Canvas Template — OpenCTI Status Templates
#
# Declares ONE OpenCTI status template (the item) — a reusable name/color pair
# from the platform's status-template library (e.g. "In Progress", "Resolved").
# Users add as many as they need. Field keys must match
# config-types/status-templates/validate.ts. Applied via the OpenCTI GraphQL API
# (statusTemplateAdd / statusTemplateFieldPatch).
#
# NOTE: this manages only the reusable template library. Assigning a template to
# a specific entity subtype's ordered kanban workflow
# (subTypeEdit(id){ statusAdd / statusFieldPatch / statusDelete }) is a separate,
# materially bigger cross-referencing surface intentionally excluded here.
# =============================================================================

id: "opencti-status-templates"
name: "Status Templates"
toolType: "opencti"
entityType: "status-templates"
description: "Manage OpenCTI status templates — name and color — via the OpenCTI GraphQL API (443)"

item:
  label: "Status Template"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Status Template"
      icon: "flag"
      description: "The status template's name and how it renders in OpenCTI"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The status template name and the stable identity for upsert/drift, e.g. In Progress or Resolved."

        - key: "color"
          label: "Color"
          fieldType: "text"
          required: true
          validation:
            pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
            maxLength: 7
          helpText: "Hex color OpenCTI uses to render the status chip, e.g. #ff9800. Required."
