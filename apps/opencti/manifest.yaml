id: opencti
name: OpenCTI
version: "0.4.0"
vendor: Veltrix
description: >
  Manage OpenCTI (open-source cyber threat-intelligence platform) as code. Author
  threat-intel configuration — data-marking definitions (TLP / PAP / statement),
  labels, kill-chain phases, vocabularies, RBAC groups/roles, case + task
  templates, notifiers and notification triggers, retention rules, stream/TAXII
  collections, rolling export feeds, status templates, entity settings and
  TAXII2 ingestion feeds — and drive it through the Security-as-Code pipeline:
  validate, deploy, health check, drift detection and rollback, over the OpenCTI
  GraphQL API (HTTPS, Bearer token, self-signed tolerated), with BYOL
  infrastructure provisioning for the OpenCTI stack (platform + workers +
  Elasticsearch + Redis + RabbitMQ + object storage).
category: Threat Intelligence
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/opencti
icon: "🔭"

platform:
  minVersion: "1.0.0"

# OpenCTI's brand cyan. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#0692c4"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: marking-definitions
      actions: [read, write, delete]
      description: Manage OpenCTI data-marking definitions (add / edit / delete)
    - resource: labels
      actions: [read, write, delete]
      description: Manage OpenCTI labels (add / edit / delete)
    - resource: kill-chain-phases
      actions: [read, write, delete]
      description: Manage OpenCTI kill-chain phases (add / edit / delete)
    - resource: vocabularies
      actions: [read, write, delete]
      description: Manage OpenCTI open-vocabulary entries (add / edit / delete)
    - resource: status-templates
      actions: [read, write, delete]
      description: Manage OpenCTI status templates (add / edit / delete)
    - resource: groups
      actions: [read, write, delete]
      description: Manage OpenCTI RBAC groups (add / edit / delete)
    - resource: roles
      actions: [read, write, delete]
      description: Manage OpenCTI RBAC roles (add / edit / delete)
    - resource: case-templates
      actions: [read, write, delete]
      description: Manage OpenCTI case templates (add / edit / delete)
    - resource: case-task-templates
      actions: [read, write, delete]
      description: Manage OpenCTI case task templates (add / edit / delete)
    - resource: notifiers
      actions: [read, write, delete]
      description: Manage OpenCTI notifiers (add / edit / delete)
    - resource: notification-triggers
      actions: [read, write, delete]
      description: Manage OpenCTI live knowledge-event notification triggers (add / edit / delete)
    - resource: retention-rules
      actions: [read, write, delete]
      description: Manage OpenCTI data retention rules (add / edit / delete)
    - resource: stream-collections
      actions: [read, write, delete]
      description: Manage OpenCTI live stream collections (add / edit / delete)
    - resource: taxii-collections
      actions: [read, write, delete]
      description: Manage OpenCTI TAXII collections (add / edit / delete)
    - resource: feeds
      actions: [read, write, delete]
      description: Manage OpenCTI rolling CSV/TAXII export feeds (add / edit / delete)
    - resource: entity-settings
      actions: [read, write]
      description: Manage OpenCTI per-entity-type platform settings (patch only — OpenCTI never creates or deletes these singletons)
    - resource: ingestion-feeds
      actions: [read, write, delete]
      description: Manage OpenCTI TAXII2 ingestion feeds (add / edit / delete)
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL OpenCTI stack infrastructure
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: opencti_

pipeline:
  configurationTypes:
    - id: marking-definitions
      group: "Data Management"
      name: Marking Definitions
      description: OpenCTI data-marking definitions — type, definition, color and order — applied over the OpenCTI GraphQL API (443)
      canvasTemplate: config-types/marking-definitions/canvas.yaml
      defaultConfig: config-types/marking-definitions/defaults.yaml
      handlers:
        validate: config-types/marking-definitions/validate
        deploy: config-types/marking-definitions/deploy
        rollback: config-types/marking-definitions/rollback
        healthCheck: config-types/marking-definitions/healthCheck
        driftDetect: config-types/marking-definitions/driftDetect
        getStatus: config-types/marking-definitions/getStatus
      targets:
        componentTypes: [opencti-platform, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: labels
      group: "Data Management"
      name: Labels
      description: OpenCTI labels — value and color — applied over the OpenCTI GraphQL API (443)
      canvasTemplate: config-types/labels/canvas.yaml
