server:
  entry: server/index
  routes:
    prefix: /api/apps/opencti

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL stack infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs the OpenCTI platform (component) with
    # the user's OpenCTI API token (credential), with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint + API token
# against the OpenCTI GraphQL API (HTTPS, self-signed tolerated).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: opencti_port
    type: number
    label: OpenCTI HTTPS Port
    description: HTTPS port for the OpenCTI web UI / GraphQL API
    default: 443
    required: false
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the OpenCTI endpoint. Off by default —
      self-hosted OpenCTI instances commonly ship a self-signed certificate.
    default: false
    required: false
