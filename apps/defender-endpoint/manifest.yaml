id: defender-endpoint
name: Microsoft Defender for Endpoint
version: "1.4.0"
vendor: Veltrix
description: >
  Manage Microsoft Defender for Endpoint threat intelligence and operational
  content as code. Covers file, network and certificate indicators (IoCs) via
  the Defender /api/indicators API, custom detection rules (PREVIEW) via the
  Microsoft Graph beta API, device tags and business criticality, the Live
  Response library, and Defender Vulnerability Management authenticated (SNMP)
  network scan definitions — with validation, drift detection and rollback
  handled by the Security-as-Code pipeline. Auth is an Azure AD app
  registration (OAuth2 client credentials); the component hostname is the
  Defender API host (api.security.microsoft.com) and the tenant is set via the
  Tenant ID app setting.
category: EDR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/defender-endpoint
icon: "🛡️"

platform:
  minVersion: "1.0.0"

# Microsoft Defender brand: Microsoft blue with a Defender cyan accent.
branding:
  primaryColor: "#0078D4"
  accentColor: "#50E6FF"
  logo: ./assets/logo.svg
  logoDark: ./assets/logo-dark.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: mde-file-indicators
      actions: [read, write, delete]
      description: Manage Defender file-hash indicators
    - resource: mde-network-indicators
      actions: [read, write, delete]
      description: Manage Defender network indicators (IP / domain / URL)
    - resource: mde-cert-indicators
      actions: [read, write, delete]
      description: Manage Defender certificate indicators
    - resource: mde-detection-rules
      actions: [read, write, delete]
      description: Manage Defender custom detection rules (preview)
    - resource: mde-machine-tags
      actions: [read, write, delete]
      description: Manage Defender device (machine) tags
    - resource: mde-device-values
      actions: [read, write]
      description: Manage Defender device value (business criticality)
    - resource: mde-live-response-library
      actions: [read, write, delete]
      description: Manage Defender Live Response library scripts
    - resource: mde-scan-definitions
      actions: [read, write, delete]
      description: Manage Defender Vulnerability Management authenticated (SNMP) scan definitions

pipeline:
  configurationTypes:
    - id: mde-file-indicators
      group: "Custom Indicators"
      name: Defender File Indicators
      description: File-hash indicators (SHA-256 / SHA-1 / MD5) via /api/indicators; reconciled by (type, value)
      canvasTemplate: config-types/mde-file-indicators/canvas.yaml
      defaultConfig: config-types/mde-file-indicators/defaults.yaml
      handlers:
        validate: config-types/mde-file-indicators/validate
        deploy: config-types/mde-file-indicators/deploy
        rollback: config-types/mde-file-indicators/rollback
        healthCheck: config-types/mde-file-indicators/healthCheck
        driftDetect: config-types/mde-file-indicators/driftDetect
        getStatus: config-types/mde-file-indicators/getStatus
      targets:
        componentTypes: [mde-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: mde-network-indicators
      group: "Custom Indicators"
      name: Defender Network Indicators
      description: Network indicators (IP / domain / URL) via /api/indicators; IPs are single addresses (no CIDR)
      canvasTemplate: config-types/mde-network-indicators/canvas.yaml
      defaultConfig: config-types/mde-network-indicators/defaults.yaml
      handlers:
        validate: config-types/mde-network-indicators/validate
        deploy: config-types/mde-network-indicators/deploy
        rollback: config-types/mde-network-indicators/rollback
        healthCheck: config-types/mde-network-indicators/healthCheck
        driftDetect: config-types/mde-network-indicators/driftDetect
        getStatus: config-types/mde-network-indicators/getStatus
      targets:
        componentTypes: [mde-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: mde-cert-indicators
      group: "Custom Indicators"
      name: Defender Certificate Indicators
      description: Certificate indicators (SHA-1 thumbprints) via /api/indicators; reconciled by (type, value)
      canvasTemplate: config-types/mde-cert-indicators/canvas.yaml
      defaultConfig: config-types/mde-cert-indicators/defaults.yaml
      handlers:
        validate: config-types/mde-cert-indicators/validate
        deploy: config-types/mde-cert-indicators/deploy
        rollback: config-types/mde-cert-indicators/rollback
        healthCheck: config-types/mde-cert-indicators/healthCheck
        driftDetect: config-types/mde-cert-indicators/driftDetect
        getStatus: config-types/mde-cert-indicators/getStatus
      targets:
        componentTypes: [mde-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: mde-detection-rules
      group: "Detection Rules"
      name: Defender Custom Detection Rules (Preview)
      description: Scheduled KQL custom detection rules via the Microsoft Graph beta API. PREVIEW — commercial cloud only, needs the Graph CustomDetection.ReadWrite.All permission
      canvasTemplate: config-types/mde-detection-rules/canvas.yaml
      defaultConfig: config-types/mde-detection-rules/defaults.yaml
      handlers:
        validate: config-types/mde-detection-rules/validate
        deploy: config-types/mde-detection-rules/deploy
        rollback: config-types/mde-detection-rules/rollback
        healthCheck: config-types/mde-detection-rules/healthCheck
        driftDetect: config-types/mde-detection-rules/driftDetect
        getStatus: config-types/mde-detection-rules/getStatus
      targets:
        componentTypes: [mde-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: mde-machine-tags
      group: "Device Management"
      name: Defender Machine Tags
      description: Device (machine) tags via POST /api/machines/{id}/tags; reconciled per (device, tag) and non-destructive. Needs the Machine.ReadWrite.All application permission
      canvasTemplate: config-types/mde-machine-tags/canvas.yaml
      defaultConfig: config-types/mde-machine-tags/defaults.yaml
      handlers:
        validate: config-types/mde-machine-tags/validate
        deploy: config-types/mde-machine-tags/deploy
        rollback: config-types/mde-machine-tags/rollback
        healthCheck: config-types/mde-machine-tags/healthCheck
        driftDetect: config-types/mde-machine-tags/driftDetect
        getStatus: config-types/mde-machine-tags/getStatus
      targets:
        componentTypes: [mde-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: mde-device-values
      group: "Device Management"
      name: Defender Device Value
      description: Device business criticality (Normal / Low / High) via PATCH /api/machines/{id}; a single-valued property reconciled per device with previous-value rollback. Needs the Machine.ReadWrite.All application permission
      canvasTemplate: config-types/mde-device-values/canvas.yaml
      defaultConfig: config-types/mde-device-values/defaults.yaml
      handlers:
        validate: config-types/mde-device-values/validate
        deploy: config-types/mde-device-values/deploy
        rollback: config-types/mde-device-values/rollback
        healthCheck: config-types/mde-device-values/healthCheck
        driftDetect: config-types/mde-device-values/driftDetect
        getStatus: config-types/mde-device-values/getStatus
      targets:
        componentTypes: [mde-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: mde-live-response-library
      group: "Live Response"
      name: Defender Live Response Library
      description: Live Response library scripts via POST/DELETE /api/libraryfiles; reconciled by file name. Needs the Library.Manage application permission (separate from Ti.ReadWrite.All / Machine.ReadWrite.All)
      canvasTemplate: config-types/mde-live-response-library/canvas.yaml
      defaultConfig: config-types/mde-live-response-library/defaults.yaml
      handlers:
        validate: config-types/mde-live-response-library/validate
        deploy: config-types/mde-live-response-library/deploy
        rollback: config-types/mde-live-response-library/rollback
        healthCheck: config-types/mde-live-response-library/healthCheck
        driftDetect: config-types/mde-live-response-library/driftDetect
        getStatus: config-types/mde-live-response-library/getStatus
      targets:
        componentTypes: [mde-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: mde-scan-definitions
      group: "Vulnerability Management"
      name: Defender Authenticated Scan Definitions
      description: Defender Vulnerability Management authenticated (SNMP) network-device scan definitions via /api/DeviceAuthenticatedScanDefinitions; reconciled by scan name. Needs the Machine.ReadWrite.All application permission (already required by machine tags / device values)
      canvasTemplate: config-types/mde-scan-definitions/canvas.yaml
      defaultConfig: config-types/mde-scan-definitions/defaults.yaml
      handlers:
        validate: config-types/mde-scan-definitions/validate
        deploy: config-types/mde-scan-definitions/deploy
        rollback: config-types/mde-scan-definitions/rollback
        healthCheck: config-types/mde-scan-definitions/healthCheck
        driftDetect: config-types/mde-scan-definitions/driftDetect
        getStatus: config-types/mde-scan-definitions/getStatus
      targets:
        componentTypes: [mde-tenant]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/defender-endpoint

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a Defender tenant (component) with
    # the Entra app credential used to reach it, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: runs the OAuth2 token handshake and one
# lightweight authenticated GET /api/indicators.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: tenant_id
    type: string
    label: Tenant ID
    description: >
      The Microsoft Entra (Azure AD) directory/tenant GUID. Required to acquire an
      access token for the app registration.
    default: ""
    required: true
  - key: azure_cloud
    type: select
    label: Azure Cloud
    description: >
      The Azure environment the tenant lives in. Determines the login host, token
      audience and default API host. Custom detection rules (Graph) are available
      only in the commercial cloud.
    default: commercial
    required: false
    options:
      - label: Commercial
        value: commercial
      - label: US Gov (GCC)
        value: gcc
      - label: US Gov (GCC High)
        value: gcc-high
      - label: US Gov (DoD)
        value: dod
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Defender / Graph API calls.
    default: 30
    required: false
