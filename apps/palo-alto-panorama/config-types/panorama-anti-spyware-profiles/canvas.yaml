# =============================================================================
# Canvas Template — Panorama Anti-Spyware Profiles (/Objects/AntiSpywareSecurityProfiles)
#
# One anti-spyware profile with a SINGLE rule: which threat severities (and
# optionally category / threat-name) get which action and packet capture. Field
# keys must match config-types/panorama-anti-spyware-profiles/validate.ts.
#
# NOTE: this models one rule per profile (the common "block critical/high/medium"
# case). Multi-rule profiles, DNS/botnet-domain signature policies, block-ip and
# sinkhole actions, and threat exceptions are not represented.
# =============================================================================

id: "panorama-anti-spyware-profiles"
name: "Panorama Anti-Spyware Profile Configuration"
toolType: "palo-alto-panorama"
entityType: "panorama-anti-spyware-profiles"
description: "Define Panorama anti-spyware profiles as code via the PAN-OS REST API (/Objects/AntiSpywareSecurityProfiles). Reconciled by name."

item:
  label: "Anti-Spyware Profile"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Profile"
      icon: "shield"
      description: "Name"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          helpText: "The anti-spyware profile name — its identity for reconciliation."

        - key: "description"
          label: "Description"
          fieldType: "text"
          helpText: "Optional description."

        - key: "rule_name"
          label: "Rule Name"
          fieldType: "text"
          defaultValue: "block-critical-high-medium"
          helpText: "Name of the single rule inside the profile."

    - name: "Rule"
      icon: "filter"
      description: "Match and action"
      fields:
        - key: "severity"
          label: "Severities"
          fieldType: "tags"
          helpText: "Threat severities the rule matches (critical, high, medium, low, informational). Defaults to critical/high/medium when blank."

        - key: "action"
          label: "Action"
          fieldType: "select"
          required: true
          defaultValue: "reset-both"
          options:
            - { label: "Reset Both", value: "reset-both" }
            - { label: "Reset Client", value: "reset-client" }
            - { label: "Reset Server", value: "reset-server" }
            - { label: "Drop", value: "drop" }
            - { label: "Alert", value: "alert" }
            - { label: "Allow", value: "allow" }
            - { label: "Default (signature-recommended)", value: "default" }
          helpText: "Action taken on matching spyware detections."

        - key: "packet_capture"
          label: "Packet Capture"
          fieldType: "select"
          required: true
          defaultValue: "disable"
          options:
            - { label: "Disable", value: "disable" }
            - { label: "Single Packet", value: "single-packet" }
            - { label: "Extended Capture", value: "extended-capture" }
          helpText: "Whether to capture packets for matching threats."

        - key: "category"
          label: "Category"
          fieldType: "text"
          defaultValue: "any"
          helpText: "Spyware category to match. Defaults to 'any'."

        - key: "threat_name"
          label: "Threat Name"
          fieldType: "text"
          defaultValue: "any"
          helpText: "Threat name filter. Defaults to 'any'."
