id: palo-alto-panorama
name: Palo Alto Panorama
version: "1.3.0"
vendor: Veltrix
description: >
  Manage Palo Alto Networks Panorama / PAN-OS configuration as code through the
  PAN-OS REST API. Covers tags, address objects, service objects, address groups,
  service groups, application groups, schedules, custom URL categories, external
  dynamic lists, security/NAT/decryption/policy-based-forwarding/authentication
  pre-rules, security profiles (antivirus, anti-spyware, vulnerability, URL
  filtering, file blocking, WildFire analysis, data filtering), security profile
  groups and log forwarding profiles — with validation, drift detection and
  rollback handled by the Security-as-Code pipeline. Writes land in the Panorama
  candidate config and are committed to Panorama (XML API) when auto-commit is
  on. The component hostname is the Panorama management host; auth is a
  pre-generated PAN-OS API key sent as the X-PAN-KEY header.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/palo-alto-panorama
icon: "🔥"

platform:
  minVersion: "1.0.0"

# Palo Alto Networks brand: the PANW orange with a lighter accent.
branding:
  primaryColor: "#FA582D"
  accentColor: "#FF7A4D"
  logo: ./assets/logo.svg
  logoDark: ./assets/logo-dark.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: panorama-tags
      actions: [read, write, delete]
      description: Manage Panorama tags
    - resource: panorama-address-objects
      actions: [read, write, delete]
      description: Manage Panorama address objects
    - resource: panorama-service-objects
      actions: [read, write, delete]
      description: Manage Panorama service objects
    - resource: panorama-address-groups
      actions: [read, write, delete]
      description: Manage Panorama address groups
    - resource: panorama-service-groups
      actions: [read, write, delete]
      description: Manage Panorama service groups
    - resource: panorama-security-rules
      actions: [read, write, delete]
      description: Manage Panorama security pre-rules
    - resource: panorama-nat-rules
      actions: [read, write, delete]
      description: Manage Panorama NAT pre-rules
    - resource: panorama-application-groups
      actions: [read, write, delete]
      description: Manage Panorama application groups
    - resource: panorama-security-profile-groups
      actions: [read, write, delete]
      description: Manage Panorama security profile groups
    - resource: panorama-antivirus-profiles
      actions: [read, write, delete]
      description: Manage Panorama antivirus profiles
    - resource: panorama-anti-spyware-profiles
      actions: [read, write, delete]
      description: Manage Panorama anti-spyware profiles
    - resource: panorama-url-filtering-profiles
      actions: [read, write, delete]
      description: Manage Panorama URL filtering profiles
    - resource: panorama-wildfire-analysis-profiles
      actions: [read, write, delete]
      description: Manage Panorama WildFire analysis profiles
    - resource: panorama-schedules
      actions: [read, write, delete]
      description: Manage Panorama schedule objects
    - resource: panorama-custom-url-categories
      actions: [read, write, delete]
      description: Manage Panorama custom URL categories
    - resource: panorama-external-dynamic-lists
      actions: [read, write, delete]
      description: Manage Panorama external dynamic lists
    - resource: panorama-vulnerability-profiles
      actions: [read, write, delete]
      description: Manage Panorama vulnerability protection profiles
    - resource: panorama-file-blocking-profiles
      actions: [read, write, delete]
      description: Manage Panorama file blocking profiles
    - resource: panorama-data-filtering-profiles
      actions: [read, write, delete]
      description: Manage Panorama data filtering profiles
    - resource: panorama-log-forwarding-profiles
      actions: [read, write, delete]
      description: Manage Panorama log forwarding profiles
    - resource: panorama-decryption-rules
      actions: [read, write, delete]
      description: Manage Panorama decryption pre-rules
    - resource: panorama-pbf-rules
      actions: [read, write, delete]
      description: Manage Panorama policy-based forwarding pre-rules
    - resource: panorama-authentication-rules
      actions: [read, write, delete]
      description: Manage Panorama authentication pre-rules

