# =============================================================================
# Canvas Template — Microsoft Sentinel Automation Rule
#
# Declares ONE automation rule — the item. Users add as many as they need.
# Reconciled by the rule name (slugged into the ARM automationRuleId). Supports a
# modify-properties action (set incident severity and/or status) and/or a
# run-playbook action (bind a Logic App playbook). Field keys must match
# config-types/sentinel-automation-rules/validate.ts.
# =============================================================================

id: "sentinel-automation-rules"
name: "Automation Rule"
toolType: "microsoft-sentinel"
entityType: "sentinel-automation-rules"
description: "Define Microsoft Sentinel automation rules as code via Azure Resource Manager — modify-properties and run-playbook actions. Reconciled by rule name."

item:
  label: "Automation Rule"
  identityField: "rule_name"
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: "Rule"
      icon: "zap"
      description: "Identity, state and execution order"
      fields:
        - key: "rule_name"
          label: "Rule name"
          fieldType: "text"
          required: true
          helpText: "Display name of the rule. Slugged into the ARM automationRuleId — this is the reconciliation identity."

        - key: "enabled"
          label: "Enabled"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Whether the rule is active."

        - key: "order"
          label: "Order"
          fieldType: "number"
          defaultValue: 1
          helpText: "Execution order relative to other automation rules (1–1000, lower runs first)."

    - name: "Trigger"
      icon: "activity"
      description: "When the rule runs"
      fields:
        - key: "triggers_on"
          label: "Triggers on"
          fieldType: "select"
          defaultValue: "Incidents"
          options:
            - { label: "Incidents", value: "Incidents" }
            - { label: "Alerts", value: "Alerts" }

        - key: "triggers_when"
          label: "Triggers when"
          fieldType: "select"
          defaultValue: "Created"
          options:
            - { label: "Created", value: "Created" }
            - { label: "Updated", value: "Updated" }

    - name: "Action"
      icon: "edit"
      description: "Configure at least one action — modify properties and/or run a playbook"
      fields:
        - key: "set_severity"
          label: "Set severity"
          fieldType: "select"
          defaultValue: ""
          helpText: "Optionally set the incident/alert severity (modify-properties action)."
          options:
            - { label: "(No change)", value: "" }
            - { label: "High", value: "High" }
            - { label: "Medium", value: "Medium" }
            - { label: "Low", value: "Low" }
            - { label: "Informational", value: "Informational" }

        - key: "set_status"
          label: "Set status"
          fieldType: "select"
          defaultValue: ""
          helpText: "Optionally set the incident status (modify-properties action)."
          options:
            - { label: "(No change)", value: "" }
            - { label: "New", value: "New" }
            - { label: "Active", value: "Active" }
            - { label: "Closed", value: "Closed" }

    - name: "Playbook"
      icon: "play"
      description: "Run-playbook action — bind a Logic App playbook to run on the trigger"
      fields:
        - key: "run_playbook_resource_id"
          label: "Playbook (Logic App) resource ID"
          fieldType: "text"
          defaultValue: ""
          helpText: >
            Optional. The full ARM resource id of the Logic App playbook to run, e.g.
            /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Logic/workflows/<name>.
            The Sentinel service principal needs the Microsoft Sentinel Automation
            Contributor role on the playbook's resource group.

        - key: "run_playbook_tenant_id"
          label: "Playbook tenant ID"
          fieldType: "text"
          defaultValue: ""
          helpText: "Optional. Only needed for a cross-tenant playbook; leave blank to use the workspace tenant."
