id: microsoft-sentinel
name: Microsoft Sentinel
version: "1.2.0"
vendor: Veltrix
description: >
  Manage Microsoft Sentinel detection and response content as code through the
  Azure Resource Manager (ARM) API: scheduled (KQL) and near-real-time (NRT)
  analytics rules, automation rules (modify-properties and run-playbook actions),
  watchlists, hunting queries / saved searches, and the Microsoft first-party
  (tenant-based) data connectors — each with validation, drift detection and
  rollback handled by the Security-as-Code pipeline. Auth is an Azure Entra app
  registration (OAuth2 client credentials) with the "Microsoft Sentinel
  Contributor" role scoped to the workspace resource group. The workspace is
  addressed via the Tenant ID, Subscription ID, Resource Group and Workspace Name
  app settings. NRT rules are written against a preview api-version (kind:NRT is
  not part of the stable contract). ML/Fusion/Threat-Intelligence analytics
  kinds, threat-intel indicator upload, and CCP/codeless/portal-only data
  connectors remain out of scope.
category: SIEM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/microsoft-sentinel
icon: "🛡️"

platform:
  minVersion: "1.0.0"

# Microsoft Sentinel brand: Azure blue with a bright cyan accent.
branding:
  primaryColor: "#0078D4"
  accentColor: "#50E6FF"
  logo: ./assets/logo.svg
  logoDark: ./assets/logo-dark.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: sentinel-analytics-rules
      actions: [read, write, delete]
      description: Manage Microsoft Sentinel scheduled analytics (detection) rules
    - resource: sentinel-automation-rules
      actions: [read, write, delete]
      description: Manage Microsoft Sentinel automation rules
    - resource: sentinel-watchlists
      actions: [read, write, delete]
      description: Manage Microsoft Sentinel watchlists and their items
    - resource: sentinel-hunting-queries
      actions: [read, write, delete]
      description: Manage Microsoft Sentinel hunting queries and Log Analytics saved searches
    - resource: sentinel-data-connectors
      actions: [read, write, delete]
      description: Manage Microsoft Sentinel first-party (tenant-based) data connectors

pipeline:
  configurationTypes:
    - id: sentinel-analytics-rules
      name: Analytics Rules (Scheduled / NRT)
      description: >
        Scheduled (KQL) and near-real-time (NRT) analytics rules via
        Microsoft.SecurityInsights/alertRules. Scheduled rules use the GA
        api-version (2024-09-01); NRT rules (kind:NRT) use a preview api-version
        (2024-01-01-preview) because NRT is not part of the stable alertRules
        contract. Reconciled by rule name (slugged into the ARM ruleId for an
        idempotent PUT).
      canvasTemplate: config-types/sentinel-analytics-rules/canvas.yaml
      defaultConfig: config-types/sentinel-analytics-rules/defaults.yaml
      handlers:
        validate: config-types/sentinel-analytics-rules/validate
        deploy: config-types/sentinel-analytics-rules/deploy
        rollback: config-types/sentinel-analytics-rules/rollback
        healthCheck: config-types/sentinel-analytics-rules/healthCheck
        driftDetect: config-types/sentinel-analytics-rules/driftDetect
        getStatus: config-types/sentinel-analytics-rules/getStatus
      targets:
        componentTypes: [sentinel-workspace]
        requiresCredential: true
        requiresConnectivity: false
    - id: sentinel-automation-rules
      name: Automation Rules
      description: >
        Automation rules via Microsoft.SecurityInsights/automationRules
        (api-version 2024-09-01, GA). Supports a modify-properties action (set
        incident severity and/or status) and a run-playbook action (bind a Logic
        App playbook via logicAppResourceId/tenantId).
      canvasTemplate: config-types/sentinel-automation-rules/canvas.yaml
      defaultConfig: config-types/sentinel-automation-rules/defaults.yaml
      handlers:
        validate: config-types/sentinel-automation-rules/validate
        deploy: config-types/sentinel-automation-rules/deploy
        rollback: config-types/sentinel-automation-rules/rollback
        healthCheck: config-types/sentinel-automation-rules/healthCheck
        driftDetect: config-types/sentinel-automation-rules/driftDetect
        getStatus: config-types/sentinel-automation-rules/getStatus
      targets:
        componentTypes: [sentinel-workspace]
        requiresCredential: true
        requiresConnectivity: false
    - id: sentinel-watchlists
      name: Watchlists
      description: >
        Watchlists (with inline CSV items) via Microsoft.SecurityInsights/watchlists
        (api-version 2024-09-01, GA — PUT/DELETE are asynchronous and polled to
        completion). Reconciled by alias.
      canvasTemplate: config-types/sentinel-watchlists/canvas.yaml
      defaultConfig: config-types/sentinel-watchlists/defaults.yaml
      handlers:
        validate: config-types/sentinel-watchlists/validate
        deploy: config-types/sentinel-watchlists/deploy
        rollback: config-types/sentinel-watchlists/rollback
        healthCheck: config-types/sentinel-watchlists/healthCheck
        driftDetect: config-types/sentinel-watchlists/driftDetect
        getStatus: config-types/sentinel-watchlists/getStatus
      targets:
        componentTypes: [sentinel-workspace]
        requiresCredential: true
        requiresConnectivity: false
    - id: sentinel-hunting-queries
      name: Hunting Queries & Saved Searches
      description: >
        Hunting queries and Log Analytics saved searches via
        Microsoft.OperationalInsights/workspaces/savedSearches (api-version
        2023-09-01, GA). Sentinel hunting queries are saved searches with category
        "Hunting Queries"; a function alias exposes the query as a reusable KQL
        function. Reconciled by name (slugged into the savedSearchId).
      canvasTemplate: config-types/sentinel-hunting-queries/canvas.yaml
      defaultConfig: config-types/sentinel-hunting-queries/defaults.yaml
      handlers:
        validate: config-types/sentinel-hunting-queries/validate
        deploy: config-types/sentinel-hunting-queries/deploy
        rollback: config-types/sentinel-hunting-queries/rollback
        healthCheck: config-types/sentinel-hunting-queries/healthCheck
        driftDetect: config-types/sentinel-hunting-queries/driftDetect
        getStatus: config-types/sentinel-hunting-queries/getStatus
      targets:
        componentTypes: [sentinel-workspace]
        requiresCredential: true
        requiresConnectivity: false
    - id: sentinel-data-connectors
      name: Data Connectors
      description: >
        Microsoft first-party (tenant-based) data connectors via
        Microsoft.SecurityInsights/dataConnectors (api-version 2024-09-01, GA):
        Microsoft Entra ID Protection, Defender for Identity, Defender for
        Endpoint, Defender for Cloud Apps and Microsoft 365 — each a { tenantId,
        dataTypes state } body. Reconciled by the ARM dataConnectorId.
        CCP/codeless and portal-only connectors are out of scope.
      canvasTemplate: config-types/sentinel-data-connectors/canvas.yaml
      defaultConfig: config-types/sentinel-data-connectors/defaults.yaml
      handlers:
        validate: config-types/sentinel-data-connectors/validate
        deploy: config-types/sentinel-data-connectors/deploy
        rollback: config-types/sentinel-data-connectors/rollback
        healthCheck: config-types/sentinel-data-connectors/healthCheck
        driftDetect: config-types/sentinel-data-connectors/driftDetect
        getStatus: config-types/sentinel-data-connectors/getStatus
      targets:
        componentTypes: [sentinel-workspace]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/microsoft-sentinel

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a Sentinel workspace (component)
    # with the Entra app credential used to reach ARM, with a connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: runs the OAuth2 token handshake and one
# lightweight authenticated GET of the Log Analytics workspace resource.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: tenant_id
    type: string
    label: Tenant ID
    description: >
      The Microsoft Entra (Azure AD) directory/tenant GUID. Required to acquire an
      access token for the app registration.
    default: ""
    required: true
  - key: subscription_id
    type: string
    label: Subscription ID
    description: The Azure subscription GUID that contains the Sentinel workspace.
    default: ""
    required: true
  - key: resource_group
    type: string
    label: Resource Group
    description: The resource group that contains the Log Analytics workspace.
    default: ""
    required: true
  - key: workspace_name
    type: string
    label: Workspace Name
    description: The Log Analytics workspace name that Microsoft Sentinel is enabled on.
    default: ""
    required: true
  - key: azure_cloud
    type: select
    label: Azure Cloud
    description: >
      The Azure environment the workspace lives in. Determines the login authority
      and ARM host. GCC-High / DoD use management.usgovcloudapi.net.
    default: commercial
    required: false
    options:
      - label: Commercial
        value: commercial
      - label: US Gov (GCC)
        value: gcc
      - label: US Gov (GCC High)
        value: gcc-high
      - label: US Gov (DoD)
        value: dod
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Azure Resource Manager calls.
    default: 30
    required: false
