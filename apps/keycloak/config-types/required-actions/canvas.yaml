# =============================================================================
# Canvas Template — Keycloak Required Actions
#
# Declares ONE required action (the item). Users add as many as they need. Field
# keys must match config-types/required-actions/validate.ts. Applied via the
# Keycloak Admin REST API (/admin/realms/{realm}/authentication/required-actions).
# The alias is the stable identity used for upsert and drift AND is the {alias}
# path segment. A provider Keycloak's server knows about but this realm has not yet
# enabled is registered on first deploy (POST .../register-required-action).
# =============================================================================

id: "keycloak-required-actions"
name: "Required Actions"
toolType: "keycloak"
entityType: "required-actions"
description: "Enable, configure and reorder Keycloak required actions — alias, name, enabled/default state, priority and provider-specific config — via the Keycloak Admin REST API"

item:
  label: "Required action"
  identityField: "alias"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Identity"
      icon: "shield"
      description: "Action identity"
      fields:
        - key: "alias"
          label: "Alias"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The required action provider alias (case-sensitive). Keycloak's well-known built-ins: CONFIGURE_RECOVERY_AUTHN_CODES, CONFIGURE_TOTP, delete_account, delete_credential, idp_link, TERMS_AND_CONDITIONS, UPDATE_PASSWORD, UPDATE_PROFILE, update_user_locale, VERIFY_EMAIL, VERIFY_PROFILE, webauthn-register, webauthn-register-passwordless. Custom SPI-registered providers can add more. Used as the stable identity for upsert and drift, and as the {alias} path segment. Registered in this realm on first deploy if not already enabled."

        - key: "name"
          label: "Display name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The display name shown in the Keycloak admin console. Required here because it is needed to register the action when the alias is not yet enabled in this realm."

    - name: "Behavior"
      icon: "settings"
      description: "Enabled state, default assignment, ordering and provider config"
      fields:
        - key: "enabled"
          label: "Enabled"
          fieldType: "checkbox"
          required: false
          defaultValue: true
          helpText: "Whether this required action is enabled in the realm"

        - key: "defaultAction"
          label: "Default action"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "When enabled, this action is assigned to every newly-created user"

        - key: "priority"
          label: "Priority"
          fieldType: "number"
          required: false
          validation:
            min: 0
          helpText: "Determines the order required actions run in for a user — lower numbers run first. Leave blank to leave the existing priority untouched."

        - key: "config"
          label: "Provider config"
          fieldType: "keyvalue"
          required: false
          helpText: "Provider-specific config as key/value pairs — e.g. max_auth_age for UPDATE_PASSWORD. This list is authoritative: keys not listed here are cleared on deploy."
