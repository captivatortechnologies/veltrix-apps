# =============================================================================
# Canvas Template — Keycloak Authentication Flows
#
# Declares ONE authentication flow CONTAINER (the item). Users add as many as they
# need. Field keys must match config-types/authentication-flows/validate.ts.
# Applied via the Keycloak Admin REST API (/admin/realms/{realm}/authentication/flows).
# The flow alias is the stable identity used for upsert and drift. There is no
# direct get-by-alias endpoint — flows are matched by listing every flow in the
# realm and comparing alias client-side.
#
# SAFETY: this config type refuses to modify or delete a live flow whose builtIn is
# true (Keycloak's own browser / direct grant / registration / reset credentials /
# clients / docker auth / first broker login / … flows) — author a new custom flow
# with a different alias instead.
#
# SCOPE: this manages only the flow container (alias, description, provider type).
# It does NOT author the execution/step graph inside a flow — which authenticators
# run, in what order, under what requirement/priority, or nested subflows. A flow
# created here is an empty, immediately-usable container an operator finishes
# wiring up in Keycloak's own flow designer.
# =============================================================================

id: "keycloak-authentication-flows"
name: "Authentication Flows"
toolType: "keycloak"
entityType: "authentication-flows"
description: "Manage Keycloak custom top-level authentication flow containers — alias, description and provider type — via the Keycloak Admin REST API. Does not author the execution/step graph inside a flow."

item:
  label: "Authentication flow"
  identityField: "alias"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Identity"
      icon: "shield"
      description: "Flow identity and type"
      fields:
        - key: "alias"
          label: "Flow alias"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The flow's display name (e.g. \"My Custom Browser Flow\"). Unlike most identities in this app, flow aliases commonly contain spaces, so no whitespace restriction applies. Unique in the realm; used as the stable identity for upsert and drift. There is no direct get-by-alias endpoint — flows are matched by listing every flow and comparing alias client-side."

        - key: "description"
          label: "Description"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "Human-readable description shown in the Keycloak admin console"

        - key: "providerId"
          label: "Provider type"
          fieldType: "select"
          required: true
          defaultValue: "basic-flow"
          options:
            - label: "Basic flow (basic-flow)"
              value: "basic-flow"
            - label: "Client flow (client-flow)"
              value: "client-flow"
          helpText: "basic-flow is for user authentication flows (browser, direct grant, …); client-flow is for client (service-account) authentication flows. Immutable after creation — later edits to this field on an existing flow are ignored."
