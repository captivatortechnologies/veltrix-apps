# =============================================================================
# Canvas Template — Fleet Teams
#
# Declares ONE team (the item). Users add as many as they need. Field keys must
# match config-types/teams/validate.ts. Applied via the Fleet REST API
# (/api/v1/fleet/teams). Teams is a Fleet Premium feature. Verify field semantics
# against a live Fleet (fleetdm) instance.
# =============================================================================

id: "fleet-teams"
name: "Teams"
toolType: "fleet"
entityType: "teams"
description: "Manage Fleet teams — the team name and description used to segment hosts and scope access — via the Fleet REST API (/api/v1/fleet/teams). Fleet Premium feature."

item:
  label: "Team"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Team"
      icon: "users"
      description: "The team identity and description"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[A-Za-z0-9 ._:-]+$"
            maxLength: 255
          helpText: "Unique team name used to upsert the team, e.g. Workstations"

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 1000
          helpText: "What this team is for — shown in the Fleet console"

        - key: "comment"
          label: "Comment"
          fieldType: "text"
          required: false
          validation:
            maxLength: 500
          helpText: "Optional change note for operators (not sent to Fleet)"
