id: fleet
name: Fleet
version: "0.5.0"
vendor: Veltrix
description: >
  Manage Fleet (open-source osquery fleet management) as code — endpoint
  visibility, vulnerability and device management across your osquery agent
  fleet. Author saved osquery queries and drive them through the
  Security-as-Code pipeline (validate, deploy, health check, drift detection and
  rollback) over the Fleet REST API, with BYOL infrastructure provisioning
  groundwork for a Fleet stack (server / MySQL / Redis).
category: Endpoint Management
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/fleet
icon: "🚀"

platform:
  minVersion: "1.0.0"

# Fleet's brand purple. Assets are placeholders until the official lockup is
# added — see assets/README.
branding:
  primaryColor: "#6a67ce"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: queries
      actions: [read, write, delete]
      description: Manage Fleet saved osquery queries (name, SQL, schedule interval, platform)
    - resource: policies
      actions: [read, write, delete]
      description: Manage Fleet global compliance policies (name, osquery check, resolution, platform, criticality)
    - resource: labels
      actions: [read, write, delete]
      description: Manage Fleet dynamic labels (name, description, osquery selector, platform)
    - resource: teams
      actions: [read, write, delete]
      description: Manage Fleet teams (name, description) — Fleet Premium feature
    - resource: agent-config
      actions: [read, write]
      description: Manage the Fleet org-wide osquery agent options singleton (agent_options)
    - resource: config-profiles
      actions: [read, write, delete]
      description: Manage Fleet MDM OS settings configuration profiles (macOS/iOS/iPadOS .mobileconfig or declaration JSON, Windows XML), per team or "Unassigned"
    - resource: scripts
      actions: [read, write, delete]
      description: Manage the Fleet scripts library (shell/PowerShell scripts available to run on hosts), per team or "Unassigned"
    - resource: software
      actions: [read, write, delete]
      description: Manage Fleet software titles (Fleet-maintained apps and App Store / VPP apps) made available for install, per team
    - resource: enroll-secrets
      actions: [read, write]
      description: Manage Fleet's valid enroll secrets, globally or per team
    - resource: global-settings
      actions: [read, write]
      description: Manage Fleet's non-secret org-wide settings singleton (organization info, server settings, features, retention, webhooks)
    - resource: mdm-settings
      actions: [read, write]
      description: Manage Fleet's MDM settings (OS update deadlines, disk encryption enforcement, setup-experience toggles), globally or per team
    - resource: calendar-integrations
      actions: [read, write]
      description: Manage Fleet's per-team calendar-automation toggle for failing-policy remediation
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL Fleet stack infrastructure (server / MySQL / Redis)
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: fleet_

# Fleet is managed entirely over its HTTPS REST API (/api/v1/fleet), so there are
# NO remoteCommands — unlike Security Onion, whose grid is Salt-driven.

pipeline:
  configurationTypes:
    - id: queries
      group: "Osquery"
      name: Saved Queries
      description: Fleet saved osquery queries — SQL, schedule interval, target platform and observer access — via the Fleet REST API (/api/v1/fleet/queries)
      canvasTemplate: config-types/queries/canvas.yaml
      defaultConfig: config-types/queries/defaults.yaml
      handlers:
        validate: config-types/queries/validate
        deploy: config-types/queries/deploy
        rollback: config-types/queries/rollback
        healthCheck: config-types/queries/healthCheck
        driftDetect: config-types/queries/driftDetect
        getStatus: config-types/queries/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: policies
      group: "Detections"
      name: Global Policies
      description: Fleet global compliance policies — the pass/fail osquery check, resolution guidance, target platform and criticality — via the Fleet REST API (/api/v1/fleet/global/policies)
      canvasTemplate: config-types/policies/canvas.yaml
      defaultConfig: config-types/policies/defaults.yaml
      handlers:
        validate: config-types/policies/validate
        deploy: config-types/policies/deploy
        rollback: config-types/policies/rollback
        healthCheck: config-types/policies/healthCheck
        driftDetect: config-types/policies/driftDetect
        getStatus: config-types/policies/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: labels
      group: "Detections"
      name: Labels
      description: Fleet dynamic labels — the osquery SQL that assigns hosts to a label, its description and target platform — via the Fleet REST API (/api/v1/fleet/labels)
      canvasTemplate: config-types/labels/canvas.yaml
      defaultConfig: config-types/labels/defaults.yaml
      handlers:
        validate: config-types/labels/validate
        deploy: config-types/labels/deploy
        rollback: config-types/labels/rollback
        healthCheck: config-types/labels/healthCheck
        driftDetect: config-types/labels/driftDetect
        getStatus: config-types/labels/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: teams
      group: "Teams"
      name: Teams
      description: Fleet teams — the team name and description used to segment hosts and scope access — via the Fleet REST API (/api/v1/fleet/teams). Fleet Premium feature.
      canvasTemplate: config-types/teams/canvas.yaml
      defaultConfig: config-types/teams/defaults.yaml
      handlers:
        validate: config-types/teams/validate
        deploy: config-types/teams/deploy
        rollback: config-types/teams/rollback
        healthCheck: config-types/teams/healthCheck
        driftDetect: config-types/teams/driftDetect
        getStatus: config-types/teams/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: agent-config
      group: "Configuration"
      name: Agent Configuration
      description: Fleet org-wide osquery agent options — the singleton agent_options JSON applied to every enrolled host — via the Fleet REST API (/api/v1/fleet/config)
      canvasTemplate: config-types/agent-config/canvas.yaml
      defaultConfig: config-types/agent-config/defaults.yaml
      handlers:
        validate: config-types/agent-config/validate
        deploy: config-types/agent-config/deploy
        rollback: config-types/agent-config/rollback
        healthCheck: config-types/agent-config/healthCheck
        driftDetect: config-types/agent-config/driftDetect
        getStatus: config-types/agent-config/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: config-profiles
      group: "MDM"
      name: Configuration Profiles
      description: Fleet MDM OS settings configuration profiles — macOS/iOS/iPadOS .mobileconfig or declaration (DDM) JSON, and Windows XML — per team or "Unassigned", via the Fleet REST API (/api/v1/fleet/configuration_profiles/batch)
      canvasTemplate: config-types/config-profiles/canvas.yaml
      defaultConfig: config-types/config-profiles/defaults.yaml
      handlers:
        validate: config-types/config-profiles/validate
        deploy: config-types/config-profiles/deploy
        rollback: config-types/config-profiles/rollback
        healthCheck: config-types/config-profiles/healthCheck
        driftDetect: config-types/config-profiles/driftDetect
        getStatus: config-types/config-profiles/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: scripts
      group: "Scripts"
      name: Scripts
      description: The Fleet scripts library — shell/PowerShell scripts available to run on hosts, per team or "Unassigned" — via the Fleet REST API (/api/v1/fleet/scripts, multipart upload)
      canvasTemplate: config-types/scripts/canvas.yaml
      defaultConfig: config-types/scripts/defaults.yaml
      handlers:
        validate: config-types/scripts/validate
        deploy: config-types/scripts/deploy
        rollback: config-types/scripts/rollback
        healthCheck: config-types/scripts/healthCheck
        driftDetect: config-types/scripts/driftDetect
        getStatus: config-types/scripts/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: software
      group: "Software"
      name: Software
      description: Fleet software titles — Fleet-maintained apps and App Store / Google Play (VPP) apps made available for install, per team — via the Fleet REST API (/api/v1/fleet/software/fleet_maintained_apps, /api/v1/fleet/software/app_store_apps)
      canvasTemplate: config-types/software/canvas.yaml
      defaultConfig: config-types/software/defaults.yaml
      handlers:
        validate: config-types/software/validate
        deploy: config-types/software/deploy
        rollback: config-types/software/rollback
        healthCheck: config-types/software/healthCheck
        driftDetect: config-types/software/driftDetect
        getStatus: config-types/software/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: enroll-secrets
      group: "Enrollment"
      name: Enroll Secrets
      description: Fleet's valid enroll secrets, globally or per team, via the Fleet REST API (/api/v1/fleet/spec/enroll_secret, /api/v1/fleet/fleets/{id}/secrets)
      canvasTemplate: config-types/enroll-secrets/canvas.yaml
      defaultConfig: config-types/enroll-secrets/defaults.yaml
      handlers:
        validate: config-types/enroll-secrets/validate
        deploy: config-types/enroll-secrets/deploy
        rollback: config-types/enroll-secrets/rollback
        healthCheck: config-types/enroll-secrets/healthCheck
        driftDetect: config-types/enroll-secrets/driftDetect
        getStatus: config-types/enroll-secrets/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: global-settings
      group: "Configuration"
      name: Global Settings
      description: Fleet's non-secret org-wide settings singleton — organization info, server settings, features, retention and webhooks — via the Fleet REST API (/api/v1/fleet/config)
      canvasTemplate: config-types/global-settings/canvas.yaml
      defaultConfig: config-types/global-settings/defaults.yaml
      handlers:
        validate: config-types/global-settings/validate
        deploy: config-types/global-settings/deploy
        rollback: config-types/global-settings/rollback
        healthCheck: config-types/global-settings/healthCheck
        driftDetect: config-types/global-settings/driftDetect
        getStatus: config-types/global-settings/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: mdm-settings
      group: "MDM"
      name: MDM Settings
      description: Fleet's MDM settings — OS update deadlines, disk encryption enforcement and setup-experience toggles — globally or per team, via the Fleet REST API (/api/v1/fleet/config, /api/v1/fleet/fleets/{id})
      canvasTemplate: config-types/mdm-settings/canvas.yaml
      defaultConfig: config-types/mdm-settings/defaults.yaml
      handlers:
        validate: config-types/mdm-settings/validate
        deploy: config-types/mdm-settings/deploy
        rollback: config-types/mdm-settings/rollback
        healthCheck: config-types/mdm-settings/healthCheck
        driftDetect: config-types/mdm-settings/driftDetect
        getStatus: config-types/mdm-settings/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: calendar-integrations
      group: "Integrations"
      name: Calendar Integrations
      description: Fleet's per-team calendar-automation toggle for failing-policy remediation, via the Fleet REST API (/api/v1/fleet/fleets/{id})
      canvasTemplate: config-types/calendar-integrations/canvas.yaml
      defaultConfig: config-types/calendar-integrations/defaults.yaml
      handlers:
        validate: config-types/calendar-integrations/validate
        deploy: config-types/calendar-integrations/deploy
        rollback: config-types/calendar-integrations/rollback
        healthCheck: config-types/calendar-integrations/healthCheck
        driftDetect: config-types/calendar-integrations/driftDetect
        getStatus: config-types/calendar-integrations/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/fleet

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL Fleet stack infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs the Fleet server (component) with
    # the Fleet API-token credential, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint +
# credential against the Fleet REST API (HTTPS /api/v1/fleet/me).
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall
  onEvent: hooks/onEvent
  onWebhook: hooks/onWebhook

settings:
  - key: fleet_port
    type: number
    label: Fleet Server Port
    description: HTTPS port for the Fleet server REST API / web UI (fleetdm default 8080; hosted commonly 443)
    default: 443
    required: false
  - key: default_query_interval
    type: number
    label: Default Query Interval (seconds)
    description: Default schedule interval applied to new saved queries
    default: 3600
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
