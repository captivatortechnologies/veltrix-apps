id: fleet
name: Fleet
version: "0.3.0"
vendor: Veltrix
description: >
  Manage Fleet (open-source osquery fleet management) as code — endpoint
  visibility, vulnerability and device management across your osquery agent
  fleet. Author saved osquery queries and drive them through the
  Security-as-Code pipeline (validate, deploy, health check, drift detection and
  rollback) over the Fleet REST API, with BYOL infrastructure provisioning
  groundwork for a Fleet stack (server / MySQL / Redis).
category: Endpoint Management
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/fleet
icon: "🚀"

platform:
  minVersion: "1.0.0"

# Fleet's brand purple. Assets are placeholders until the official lockup is
# added — see assets/README.
branding:
  primaryColor: "#6a67ce"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: queries
      actions: [read, write, delete]
      description: Manage Fleet saved osquery queries (name, SQL, schedule interval, platform)
    - resource: policies
      actions: [read, write, delete]
      description: Manage Fleet global compliance policies (name, osquery check, resolution, platform, criticality)
    - resource: labels
      actions: [read, write, delete]
      description: Manage Fleet dynamic labels (name, description, osquery selector, platform)
    - resource: teams
      actions: [read, write, delete]
      description: Manage Fleet teams (name, description) — Fleet Premium feature
    - resource: agent-config
      actions: [read, write]
      description: Manage the Fleet org-wide osquery agent options singleton (agent_options)
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL Fleet stack infrastructure (server / MySQL / Redis)
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: fleet_

# Fleet is managed entirely over its HTTPS REST API (/api/v1/fleet), so there are
# NO remoteCommands — unlike Security Onion, whose grid is Salt-driven.

pipeline:
  configurationTypes:
    - id: queries
      group: "Osquery"
      name: Saved Queries
      description: Fleet saved osquery queries — SQL, schedule interval, target platform and observer access — via the Fleet REST API (/api/v1/fleet/queries)
      canvasTemplate: config-types/queries/canvas.yaml
      defaultConfig: config-types/queries/defaults.yaml
      handlers:
        validate: config-types/queries/validate
        deploy: config-types/queries/deploy
        rollback: config-types/queries/rollback
        healthCheck: config-types/queries/healthCheck
        driftDetect: config-types/queries/driftDetect
        getStatus: config-types/queries/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: policies
      group: "Detections"
      name: Global Policies
      description: Fleet global compliance policies — the pass/fail osquery check, resolution guidance, target platform and criticality — via the Fleet REST API (/api/v1/fleet/global/policies)
      canvasTemplate: config-types/policies/canvas.yaml
      defaultConfig: config-types/policies/defaults.yaml
      handlers:
        validate: config-types/policies/validate
        deploy: config-types/policies/deploy
        rollback: config-types/policies/rollback
        healthCheck: config-types/policies/healthCheck
        driftDetect: config-types/policies/driftDetect
        getStatus: config-types/policies/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: labels
      group: "Detections"
      name: Labels
      description: Fleet dynamic labels — the osquery SQL that assigns hosts to a label, its description and target platform — via the Fleet REST API (/api/v1/fleet/labels)
      canvasTemplate: config-types/labels/canvas.yaml
      defaultConfig: config-types/labels/defaults.yaml
      handlers:
        validate: config-types/labels/validate
        deploy: config-types/labels/deploy
        rollback: config-types/labels/rollback
        healthCheck: config-types/labels/healthCheck
        driftDetect: config-types/labels/driftDetect
        getStatus: config-types/labels/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: teams
      group: "Teams"
      name: Teams
      description: Fleet teams — the team name and description used to segment hosts and scope access — via the Fleet REST API (/api/v1/fleet/teams). Fleet Premium feature.
      canvasTemplate: config-types/teams/canvas.yaml
      defaultConfig: config-types/teams/defaults.yaml
      handlers:
        validate: config-types/teams/validate
        deploy: config-types/teams/deploy
        rollback: config-types/teams/rollback
        healthCheck: config-types/teams/healthCheck
        driftDetect: config-types/teams/driftDetect
        getStatus: config-types/teams/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: agent-config
      group: "Configuration"
      name: Agent Configuration
      description: Fleet org-wide osquery agent options — the singleton agent_options JSON applied to every enrolled host — via the Fleet REST API (/api/v1/fleet/config)
      canvasTemplate: config-types/agent-config/canvas.yaml
      defaultConfig: config-types/agent-config/defaults.yaml
      handlers:
        validate: config-types/agent-config/validate
        deploy: config-types/agent-config/deploy
        rollback: config-types/agent-config/rollback
        healthCheck: config-types/agent-config/healthCheck
        driftDetect: config-types/agent-config/driftDetect
        getStatus: config-types/agent-config/getStatus
      targets:
        componentTypes: [fleet-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/fleet

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL Fleet stack infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: BYOL Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs the Fleet server (component) with
    # the Fleet API-token credential, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint +
# credential against the Fleet REST API (HTTPS /api/v1/fleet/me).
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall
  onEvent: hooks/onEvent
  onWebhook: hooks/onWebhook

settings:
  - key: fleet_port
    type: number
    label: Fleet Server Port
    description: HTTPS port for the Fleet server REST API / web UI (fleetdm default 8080; hosted commonly 443)
    default: 443
    required: false
  - key: default_query_interval
    type: number
    label: Default Query Interval (seconds)
    description: Default schedule interval applied to new saved queries
    default: 3600
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
