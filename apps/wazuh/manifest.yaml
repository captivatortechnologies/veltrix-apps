id: wazuh
name: Wazuh
version: "0.5.0"
vendor: Veltrix
description: >
  Manage Wazuh (open-source SIEM / XDR / HIDS) as code. Author CDB lists,
  custom rules/decoders, agent groups, the manager's ossec.conf, and the full
  RBAC surface (API users/roles/policies/rules, security settings) — over the
  Wazuh REST API (55000, self-signed, token-authenticated) — and drive them
  through the Security-as-Code pipeline with validation, drift detection and
  rollback. BYOL cluster provisioning (manager / indexer / dashboard) is
  declared as a generic InfraSpec.
category: SIEM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/wazuh
icon: "🛡️"

platform:
  minVersion: "1.0.0"

# Wazuh's brand blue. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#00A9E0"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: cdb-lists
      actions: [read, write, delete]
      description: Manage Wazuh CDB lists (constant databases — key:value lookup files)
    - resource: agent-groups
      actions: [read, write, delete]
      description: Manage Wazuh agent groups and their shared agent.conf
    - resource: custom-rules
      actions: [read, write, delete]
      description: Manage Wazuh custom ruleset files (etc/rules)
    - resource: custom-decoders
      actions: [read, write, delete]
      description: Manage Wazuh custom decoder files (etc/decoders)
    - resource: manager-configuration
      actions: [read, write, delete]
      description: Manage the Wazuh manager's ossec.conf as a whole file
    - resource: api-users
      actions: [read, write, delete]
      description: Manage Wazuh REST API users, their run_as flag and attached roles
    - resource: api-roles
      actions: [read, write, delete]
      description: Manage Wazuh RBAC roles and their attached policies/RBAC rules
    - resource: api-policies
      actions: [read, write, delete]
      description: Manage Wazuh RBAC policies (actions + resources + effect)
    - resource: rbac-rules
      actions: [read, write, delete]
      description: Manage Wazuh RBAC (security) rules — authentication-context matching conditions
    - resource: api-security-settings
      actions: [read, write, delete]
      description: Manage the Wazuh REST API's manager-wide security settings (auth token lifetime, RBAC mode)
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL Wazuh cluster infrastructure
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: wazuh_

# NOTE: Wazuh is managed purely over the REST API (55000) — there are no
# app-declared remoteCommands. Salt/SSH-style seams are intentionally absent.

pipeline:
  configurationTypes:
    - id: cdb-lists
      group: "Lists & Data"
      name: CDB Lists
      description: Wazuh CDB lists (constant databases) — key:value lookup files backing blocklists/allowlists, via the Wazuh REST API (55000)
      canvasTemplate: config-types/cdb-lists/canvas.yaml
      defaultConfig: config-types/cdb-lists/defaults.yaml
      handlers:
        validate: config-types/cdb-lists/validate
        deploy: config-types/cdb-lists/deploy
        rollback: config-types/cdb-lists/rollback
        healthCheck: config-types/cdb-lists/healthCheck
        driftDetect: config-types/cdb-lists/driftDetect
        getStatus: config-types/cdb-lists/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

    - id: agent-groups
      group: "Agents"
      name: Agent Groups
      description: Wazuh agent groups and their shared agent.conf, via the Wazuh REST API (55000)
      canvasTemplate: config-types/agent-groups/canvas.yaml
      defaultConfig: config-types/agent-groups/defaults.yaml
      handlers:
        validate: config-types/agent-groups/validate
        deploy: config-types/agent-groups/deploy
        rollback: config-types/agent-groups/rollback
        healthCheck: config-types/agent-groups/healthCheck
        driftDetect: config-types/agent-groups/driftDetect
        getStatus: config-types/agent-groups/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

    - id: custom-rules
      group: "Ruleset"
      name: Custom Rules
      description: Wazuh custom ruleset files (etc/rules), via the Wazuh REST API (55000); a manager restart activates the change
      canvasTemplate: config-types/custom-rules/canvas.yaml
      defaultConfig: config-types/custom-rules/defaults.yaml
      handlers:
        validate: config-types/custom-rules/validate
        deploy: config-types/custom-rules/deploy
        rollback: config-types/custom-rules/rollback
        healthCheck: config-types/custom-rules/healthCheck
        driftDetect: config-types/custom-rules/driftDetect
        getStatus: config-types/custom-rules/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

    - id: custom-decoders
      group: "Ruleset"
      name: Custom Decoders
      description: Wazuh custom decoder files (etc/decoders), via the Wazuh REST API (55000); a manager restart activates the change
      canvasTemplate: config-types/custom-decoders/canvas.yaml
      defaultConfig: config-types/custom-decoders/defaults.yaml
      handlers:
        validate: config-types/custom-decoders/validate
        deploy: config-types/custom-decoders/deploy
        rollback: config-types/custom-decoders/rollback
        healthCheck: config-types/custom-decoders/healthCheck
        driftDetect: config-types/custom-decoders/driftDetect
        getStatus: config-types/custom-decoders/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

    - id: manager-configuration
      group: "Manager"
      name: Manager Configuration
      description: The Wazuh manager's ossec.conf, replaced whole-file, via the Wazuh REST API (55000); a manager restart activates the change
      canvasTemplate: config-types/manager-configuration/canvas.yaml
      defaultConfig: config-types/manager-configuration/defaults.yaml
      handlers:
        validate: config-types/manager-configuration/validate
        deploy: config-types/manager-configuration/deploy
        rollback: config-types/manager-configuration/rollback
        healthCheck: config-types/manager-configuration/healthCheck
        driftDetect: config-types/manager-configuration/driftDetect
        getStatus: config-types/manager-configuration/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

    - id: api-users
      group: "Security & Access"
      name: API Users
      description: Wazuh REST API users, their run_as flag and attached roles, via the Wazuh REST API (55000)
      canvasTemplate: config-types/api-users/canvas.yaml
      defaultConfig: config-types/api-users/defaults.yaml
      handlers:
        validate: config-types/api-users/validate
        deploy: config-types/api-users/deploy
        rollback: config-types/api-users/rollback
        healthCheck: config-types/api-users/healthCheck
        driftDetect: config-types/api-users/driftDetect
        getStatus: config-types/api-users/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

    - id: api-roles
      group: "Security & Access"
      name: API Roles
      description: Wazuh RBAC roles and their attached policies/RBAC rules, via the Wazuh REST API (55000)
      canvasTemplate: config-types/api-roles/canvas.yaml
      defaultConfig: config-types/api-roles/defaults.yaml
      handlers:
        validate: config-types/api-roles/validate
        deploy: config-types/api-roles/deploy
        rollback: config-types/api-roles/rollback
        healthCheck: config-types/api-roles/healthCheck
        driftDetect: config-types/api-roles/driftDetect
        getStatus: config-types/api-roles/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

    - id: api-policies
      group: "Security & Access"
      name: API Policies
      description: Wazuh RBAC policies (actions + resources + effect), via the Wazuh REST API (55000)
      canvasTemplate: config-types/api-policies/canvas.yaml
      defaultConfig: config-types/api-policies/defaults.yaml
      handlers:
        validate: config-types/api-policies/validate
        deploy: config-types/api-policies/deploy
        rollback: config-types/api-policies/rollback
        healthCheck: config-types/api-policies/healthCheck
        driftDetect: config-types/api-policies/driftDetect
        getStatus: config-types/api-policies/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

    - id: rbac-rules
      group: "Security & Access"
      name: RBAC Rules
      description: Wazuh RBAC (security) rules — authentication-context matching conditions attached to roles — via the Wazuh REST API (55000)
      canvasTemplate: config-types/rbac-rules/canvas.yaml
      defaultConfig: config-types/rbac-rules/defaults.yaml
      handlers:
        validate: config-types/rbac-rules/validate
        deploy: config-types/rbac-rules/deploy
        rollback: config-types/rbac-rules/rollback
        healthCheck: config-types/rbac-rules/healthCheck
        driftDetect: config-types/rbac-rules/driftDetect
        getStatus: config-types/rbac-rules/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

    - id: api-security-settings
      group: "Security & Access"
      name: API Security Settings
      description: The Wazuh REST API's manager-wide security settings (auth token lifetime, RBAC mode), via the Wazuh REST API (55000)
      canvasTemplate: config-types/api-security-settings/canvas.yaml
      defaultConfig: config-types/api-security-settings/defaults.yaml
      handlers:
        validate: config-types/api-security-settings/validate
        deploy: config-types/api-security-settings/deploy
        rollback: config-types/api-security-settings/rollback
        healthCheck: config-types/api-security-settings/healthCheck
        driftDetect: config-types/api-security-settings/driftDetect
        getStatus: config-types/api-security-settings/getStatus
      targets:
        componentTypes: [manager, manager-master, manager-worker]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/wazuh

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL cluster infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs the Wazuh manager (component) with
    # the API credential, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: authenticates a Connection's endpoint +
# credential against the Wazuh REST API (HTTPS 55000 /security/user/authenticate).
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall
  onEvent: hooks/onEvent
  onWebhook: hooks/onWebhook

settings:
  - key: wazuh_api_port
    type: number
    label: Wazuh API Port
    description: HTTPS port for the Wazuh manager REST API
    default: 55000
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
