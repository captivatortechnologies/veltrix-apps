# =============================================================================
# Canvas Template — Cribl Stream Pipelines
#
# Declares ONE Cribl pipeline (the item). Users add as many as they need. Field
# keys must match config-types/pipelines/validate.ts. Applied via the Cribl REST
# API (/api/v1[/m/<group>]/pipelines).
#
# A pipeline pairs a stable `id` with a `conf` JSON block whose `functions` array
# is the ordered Function chain. Provide the conf as JSON — either a full
# { "functions": [ ... ] } object (asyncFuncTimeout / groups optional) or a bare
# [ ... ] array of Functions, which is wrapped for you.
# =============================================================================

id: "cribl-pipelines"
name: "Pipelines"
toolType: "cribl"
entityType: "pipelines"
description: "Manage Cribl Stream pipelines — an id and a Function chain (conf JSON) — via the Cribl REST API (/api/v1[/m/<group>]/pipelines)"

item:
  label: "Pipeline"
  identityField: "id"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Pipeline"
      icon: "git-branch"
      description: "Pipeline identity and target Worker Group"
      fields:
        - key: "id"
          label: "Pipeline ID"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[A-Za-z0-9_-]+$"
            maxLength: 255
          helpText: "Pipeline id shown in Cribl (letters, digits, _ and - only). Used as the stable identity for upsert and drift."

        - key: "worker_group"
          label: "Worker Group / Fleet"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "Worker Group or Edge Fleet to deploy into, e.g. default. Blank falls back to the app's Default Worker Group setting; set that blank for a single-instance deployment."

    - name: "Configuration"
      icon: "code"
      description: "The pipeline's Function chain, as JSON"
      fields:
        - key: "conf"
          label: "Pipeline Config (JSON)"
          fieldType: "textarea"
          required: true
          validation:
            maxLength: 100000
          helpText: 'The pipeline conf as JSON — a { "functions": [ ... ] } object (asyncFuncTimeout / groups optional) or a bare [ ... ] array of Functions. Each Function is { "id", "filter", "disabled", "conf" }.'

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this pipeline is configured — recorded for audit"
