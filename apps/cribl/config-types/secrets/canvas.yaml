# =============================================================================
# Canvas Template — Cribl Stream Secrets
#
# Declares ONE Secret (the item) — referenced elsewhere in Cribl as
# `${{secret:<id>}}` (e.g. from a Database Connection or Destination). Users
# add as many as they need. Field keys must match config-types/secrets/validate.ts.
# Applied via the Cribl REST API (/api/v1[/m/<group>]/system/secrets).
#
# ⚠ Secret material is WRITE-ONLY — Cribl never returns it, so it cannot be
# diffed, logged, or captured for rollback.
# =============================================================================

id: "cribl-secrets"
name: "Secrets"
toolType: "cribl"
entityType: "secrets"
description: "Manage the Cribl Secrets store via the Cribl REST API (/api/v1[/m/<group>]/system/secrets)"

item:
  label: "Secret"
  identityField: "id"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Secret"
      icon: "key"
      description: "Secret identity, type and target Worker Group"
      fields:
        - key: "id"
          label: "Secret ID"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Name shown in Cribl's Secrets store — referenced elsewhere as \\${{secret:<id>}}. Used as the stable identity for upsert and drift."

        - key: "secret_type"
          label: "Secret Type"
          fieldType: "select"
          required: true
          options:
            - { label: "Text (single value)", value: "text" }
            - { label: "Credentials (username + password)", value: "credentials" }
            - { label: "Key Pair (API key + secret key)", value: "keypair" }
          helpText: "Which shape this secret holds. Determines which field below is required."

        - key: "worker_group"
          label: "Worker Group / Fleet"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "Worker Group or Edge Fleet to deploy into, e.g. default. Blank falls back to the app's Default Worker Group setting; set that blank for a single-instance deployment."

    - name: "Material"
      icon: "lock"
      description: "Write-only — see the warning above"
      fields:
        - key: "value"
          label: "Value (Text type)"
          fieldType: "password"
          required: false
          visibleWhen:
            field: "secret_type"
            equals: "text"
          helpText: >
            ⚠ WRITE-ONLY secret. Required by Cribl when creating a NEW text secret;
            leaving it blank on an EXISTING secret keeps its current value unchanged.

        - key: "username"
          label: "Username (Credentials type)"
          fieldType: "text"
          required: false
          visibleWhen:
            field: "secret_type"
            equals: "credentials"

        - key: "password"
          label: "Password (Credentials type)"
          fieldType: "password"
          required: false
          visibleWhen:
            field: "secret_type"
            equals: "credentials"
          helpText: >
            ⚠ WRITE-ONLY secret. Required by Cribl when creating a NEW credentials secret;
            leaving it blank on an EXISTING secret keeps its current value unchanged.

        - key: "api_key"
          label: "API Key (Key Pair type)"
          fieldType: "password"
          required: false
          visibleWhen:
            field: "secret_type"
            equals: "keypair"
          helpText: "⚠ WRITE-ONLY secret. Required by Cribl when creating a NEW key-pair secret."

        - key: "secret_key"
          label: "Secret Key (Key Pair type)"
          fieldType: "password"
          required: false
          visibleWhen:
            field: "secret_type"
            equals: "keypair"
          helpText: "⚠ WRITE-ONLY secret. Required by Cribl when creating a NEW key-pair secret."

    - name: "Details"
      icon: "info"
      description: "Optional metadata"
      fields:
        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "What this secret is used for — recorded for audit"

        - key: "tags"
          label: "Tags"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "Comma-separated tags for filtering, e.g. env:prod,team:security"
