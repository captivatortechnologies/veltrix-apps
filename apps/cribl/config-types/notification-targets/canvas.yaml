# =============================================================================
# Canvas Template — Cribl Stream Notification Targets
#
# Declares ONE Notification Target (the item) — a destination for alert
# Notifications (Webhook, PagerDuty, Slack, SNS, SMTP). Users add as many as
# they need. Field keys must match config-types/notification-targets/validate.ts.
# Applied via the Cribl REST API (/api/v1/notification-targets). Unlike Sources
# and Destinations, this collection is NOT Worker-Group-scoped — it is global.
# =============================================================================

id: "cribl-notification-targets"
name: "Notification Targets"
toolType: "cribl"
entityType: "notification-targets"
description: "Manage Cribl Stream Notification Targets — where alerts are sent — via the Cribl REST API (/api/v1/notification-targets)"

item:
  label: "Notification Target"
  identityField: "id"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Target"
      icon: "bell"
      description: "Target identity and type"
      fields:
        - key: "id"
          label: "Target ID"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[A-Za-z0-9_-]+$"
            maxLength: 255
          helpText: "Notification target id shown in Cribl (letters, digits, _ and - only). Used as the stable identity for upsert and drift."

        - key: "type"
          label: "Target Type"
          fieldType: "select"
          required: true
          options:
            - { label: "Webhook", value: "webhook" }
            - { label: "PagerDuty", value: "pagerduty" }
            - { label: "Slack", value: "slack" }
            - { label: "Amazon SNS", value: "sns" }
            - { label: "SMTP (Email)", value: "smtp" }
          helpText: "The notification channel. Immutable once created."

    - name: "Configuration"
      icon: "code"
      description: "The target's type-specific settings, as JSON"
      fields:
        - key: "conf"
          label: "Target Config (JSON)"
          fieldType: "textarea"
          required: true
          validation:
            maxLength: 20000
          helpText: >
            The target settings as a JSON object — everything except id and type. e.g.
            Webhook: { "url": "https://hooks.example.com/x", "format": "json_array", "method": "POST" };
            Slack: { "url": "https://hooks.slack.com/services/..." };
            PagerDuty: { "routingKey": "..." }. Sent to Cribl as { id, type, ...conf }.

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this target is configured — recorded for audit"
