# =============================================================================
# Canvas Template - Cato Application Control Rules
#
# Declares ONE Application Control rule (CASB) - the item. A rule is exactly
# ONE of three kinds - application / data / file - selected by `ruleType`;
# Cato assigns a numeric id and evaluates rules by their position within a
# section. Identity is the NAME (no upsert): deploy lists rules, matches by
# name, and updateRule or addRule accordingly.
#
# UNLIKE Internet/WAN Firewall, this app does not own Application Control
# SECTION lifecycle (create/rename/reorder) in this release - `section` must
# already exist (create it in the Cato Management Application UI). See
# README.md Coverage.
#
# Each rule kind's full matching body (application/source/device/tracking/
# schedule/severity/applicationCriteria/dlpProfile/fileAttribute/...) is large
# and shaped differently per kind, so it lives in a single JSON escape-hatch
# field, `rule_json`, wrapped under the key matching Rule Type - e.g. for
# Application Control rules: {"applicationRule": {"application":
# {"appCategory":{"by":"NAME","input":"Social Media"}},
# "action":"BLOCK","source":{"site":[{"by":"NAME","input":"HQ"}]}}}. First-class
# fields (name/description/enabled/ruleType) always win over a same-named JSON
# key.
#
# API: policy(accountId).applicationControl - addRule / updateRule / moveRule
# (ApplicationControlAddRuleInput / ApplicationControlUpdateRuleInput /
# PolicyMoveRuleInput). Changes are staged and published as a batch - see
# README.md.
#
# Field keys must match what validate.ts checks.
# =============================================================================

id: "cato-networks-application-control-rules"
name: "Application Control Rule Configuration"
toolType: "cato-networks"
entityType: "application-control-rules"
description: "Define Cato Application Control (CASB) rules as code through the CMA GraphQL API. Changes are staged and published as a batch."

item:
  label: "Rule"
  identityField: "name"
  repeatable: true
  minItems: 0
  maxItems: 500
  groups:
    - name: "Rule"
      icon: "shield"
      description: "Name, section, state and rule type"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The rule name (its logical identity). Cato assigns the numeric id."

        - key: "description"
          label: "Description"
          fieldType: "textarea"

        - key: "enabled"
          label: "Enabled"
          fieldType: "checkbox"
          defaultValue: true

        - key: "section"
          label: "Section"
          fieldType: "text"
          required: true
          helpText: "Name of an existing Application Control section (create it in the Cato Management Application UI - this app does not manage Application Control sections in this release)."

        - key: "ruleType"
          label: "Rule Type"
          fieldType: "select"
          defaultValue: "APPLICATION"
          options:
            - label: "Application rule"
              value: "APPLICATION"
            - label: "Data rule"
              value: "DATA"
            - label: "File rule"
              value: "FILE"
          helpText: "Which of Cato's three Application Control rule kinds this is - determines which key rule_json must be wrapped under."

    - name: "Position"
      icon: "list"
      description: "Where this rule sits within its section"
      fields:
        - key: "position"
          label: "Position"
          fieldType: "select"
          defaultValue: "FIRST_IN_SECTION"
          options:
            - label: "First in section"
              value: "FIRST_IN_SECTION"
            - label: "Last in section"
              value: "LAST_IN_SECTION"
            - label: "Before another rule"
              value: "BEFORE_RULE"
            - label: "After another rule"
              value: "AFTER_RULE"
          helpText: "Asserted on every deploy."

        - key: "positionRuleName"
          label: "Relative To Rule"
          fieldType: "text"
          helpText: 'Required when Position is "Before another rule" or "After another rule" - the name of the existing sibling rule.'

    - name: "Rule Body (JSON)"
      icon: "settings"
      description: "The full rule body for the selected Rule Type"
      fields:
        - key: "rule_json"
          label: "Rule Body (JSON)"
          fieldType: "textarea"
          required: true
          helpText: >-
            A JSON object with exactly ONE key matching Rule Type -
            "applicationRule", "dataRule" or "fileRule" - holding that kind's
            full body (application/source/device/tracking/schedule/severity/
            accessMethod/applicationCriteria, plus dlpProfile for Data rules or
            fileAttribute for File rules), using Cato's own GraphQL input field
            names verbatim, e.g. {"applicationRule":
            {"application":{"appCategory":{"by":"NAME","input":"Social
            Media"}},"action":"BLOCK","source":{"site":[{"by":"NAME","input":"HQ"}]}}}.
