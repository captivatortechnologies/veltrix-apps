id: rubrik
name: Rubrik
version: "0.1.0"
vendor: Veltrix
description: >
  Manage Rubrik (backup, ransomware recovery and data security) configuration as
  code through the Rubrik CDM (Cloud Data Management) REST API. Author SLA Domains
  — backup policies with snapshot frequencies and retention — and drive them
  through the Security-as-Code pipeline (validate, deploy, health check, drift
  detection and rollback) over HTTPS with a service-account session (self-signed
  certificates tolerated).
category: COMPLIANCE
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/rubrik
icon: "🛡️"

platform:
  minVersion: "1.0.0"

# Rubrik brand green.
branding:
  primaryColor: "#00b388"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: sla-domains
      actions: [read, write, delete]
      description: Manage Rubrik SLA Domains (backup policies — frequencies and retention)

pipeline:
  configurationTypes:
    - id: sla-domains
      group: "Data Protection"
      name: SLA Domains
      description: Rubrik SLA Domains — backup policies with snapshot frequencies and retention — applied over the Rubrik CDM v2 REST API
      canvasTemplate: config-types/sla-domains/canvas.yaml
      defaultConfig: config-types/sla-domains/defaults.yaml
      handlers:
        validate: config-types/sla-domains/validate
        deploy: config-types/sla-domains/deploy
        rollback: config-types/sla-domains/rollback
        healthCheck: config-types/sla-domains/healthCheck
        driftDetect: config-types/sla-domains/driftDetect
        getStatus: config-types/sla-domains/getStatus
      targets:
        componentTypes: [rubrik-cluster]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/rubrik

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the Rubrik cluster (component) with
    # the service-account credential, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's cluster endpoint +
# service-account credential against the Rubrik CDM REST API (opens a session,
# then GET /api/v1/cluster/me).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the Rubrik cluster endpoint. Off by
      default — Rubrik clusters commonly ship a self-signed certificate.
    default: false
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Rubrik CDM API calls.
    default: 15
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
