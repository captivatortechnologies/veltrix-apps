# =============================================================================
# Canvas Template — Axonius Saved Queries
#
# Declares ONE Axonius saved query (the item). Users add as many as they need. A
# saved query is a named, reusable asset view: an AQL filter over the devices or
# users module plus the columns to display. Field keys must match
# config-types/saved-queries/validate.ts. Applied via the Axonius REST API
# (api/queries/...) on 443.
# =============================================================================

id: "axonius-saved-queries"
name: "Saved Queries"
toolType: "axonius"
entityType: "saved-queries"
description: "Manage Axonius saved queries — a named AQL filter over the devices or users module plus display columns — via the Axonius REST API (443)"

item:
  label: "Saved Query"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Query"
      icon: "search"
      description: "Identity and the asset module this view targets"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Saved query name shown in Axonius. Used as the stable identity for upsert and drift."

        - key: "entity"
          label: "Asset Module"
          fieldType: "select"
          required: true
          defaultValue: "devices"
          options:
            - label: "Devices"
              value: "devices"
            - label: "Users"
              value: "users"
          helpText: "Which Axonius asset module the query runs against"

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Optional description recorded on the saved query for audit"

    - name: "Definition"
      icon: "filter"
      description: "The AQL filter and the columns the view shows"
      fields:
        - key: "query"
          label: "AQL Filter"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 8000
          helpText: "Axonius Query Language filter, e.g. (specific_data.data.hostname == regex(\"web\", \"i\")). Leave blank to match all assets in the module."

        - key: "fields"
          label: "Columns"
          fieldType: "tags"
          required: false
          helpText: "Axonius field names to show as columns, e.g. specific_data.data.hostname, specific_data.data.name. Leave empty to use Axonius defaults."
