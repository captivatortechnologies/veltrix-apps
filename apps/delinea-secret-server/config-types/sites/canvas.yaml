# =============================================================================
# Canvas Template — Delinea Secret Server Sites
#
# Declares ONE Distributed Engine site (the item). Users add as many as they
# need. Field keys must match config-types/sites/_shared.ts + validate.ts.
# Applied via the Secret Server REST API (/api/v1/distributed-engine/site[s]).
# A site is reconciled by its name, so siteName is the identity.
#
# On-premises Secret Server requires an existing Site Connector (see the
# "Connection Managers" configuration type) to create a site; Secret Server
# Cloud subscriptions do not.
# =============================================================================

id: "delinea-sites"
name: "Sites"
toolType: "delinea-secret-server"
entityType: "sites"
description: "Manage Delinea Secret Server Distributed Engine sites — name, engine callback interval, WinRM/CredSSP and RDP/SSH proxy settings — via the Secret Server REST API (/api/v1/distributed-engine/site[s])"

item:
  label: "Site"
  identityField: "siteName"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Site"
      icon: "map-pin"
      description: "Site identity and state"
      fields:
        - key: "siteName"
          label: "Site Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The site name shown in Secret Server. Reconciled by name (upsert + drift)."

        - key: "active"
          label: "Active"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Whether the site is active. Turn off to retire a site without deleting it (site deletion is not managed by this app)."

        - key: "siteConnectorId"
          label: "Site Connector ID"
          fieldType: "number"
          defaultValue: 1
          validation:
            min: 1
          helpText: "ID of the Site Connector this site uses (see the Connection Managers configuration type). On-premises Secret Server requires an existing connector to create a site; Secret Server Cloud subscriptions do not."

        - key: "callbackInterval"
          label: "Engine Callback Interval (seconds)"
          fieldType: "number"
          defaultValue: 300
          validation:
            min: 30
            max: 300
          helpText: "How often engines at this site call back to Secret Server, in seconds (30-300). Default 300."

    - name: "PowerShell / WinRM"
      icon: "settings"
      description: "How engines at this site run PowerShell-based password changing"
      fields:
        - key: "winRmEndpoint"
          label: "WinRM Endpoint URL"
          fieldType: "text"
          defaultValue: "http://localhost:5985/wsman"
          validation:
            maxLength: 500
          helpText: "WinRM endpoint engines at this site use for PowerShell remoting."

        - key: "enableCredSsp"
          label: "Enable CredSSP"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Enable CredSSP for WinRM remoting at this site."

        - key: "powershellRunAsSecretId"
          label: "PowerShell Run-As Secret ID"
          fieldType: "number"
          required: false
          validation:
            min: 1
          helpText: "Optional ID of an EXISTING Secret Server secret used to run PowerShell scripts at this site. A reference by ID only — this field never carries the secret's contents."

    - name: "Proxies"
      icon: "shield"
      description: "Optional RDP/SSH proxy exposed by engines at this site"
      fields:
        - key: "enableRdpProxy"
          label: "Enable RDP Proxy"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Enable the RDP proxy for launcher-based RDP sessions through this site."

        - key: "rdpProxyPort"
          label: "RDP Proxy Port"
          fieldType: "number"
          required: false
          validation:
            min: 1
            max: 65535
          visibleWhen:
            field: "enableRdpProxy"
            equals: true
          helpText: "Port the RDP proxy listens on. Required when the RDP proxy is enabled."

        - key: "enableSshProxy"
          label: "Enable SSH Proxy"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Enable the SSH proxy for launcher-based SSH sessions through this site."

        - key: "sshProxyPort"
          label: "SSH Proxy Port"
          fieldType: "number"
          required: false
          validation:
            min: 1
            max: 65535
          visibleWhen:
            field: "enableSshProxy"
            equals: true
          helpText: "Port the SSH proxy listens on. Required when the SSH proxy is enabled."

    - name: "Audit"
      icon: "book"
      description: "Change record"
      fields:
        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this site is configured — recorded for audit."
