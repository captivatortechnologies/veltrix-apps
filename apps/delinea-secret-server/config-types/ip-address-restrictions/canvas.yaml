# =============================================================================
# Canvas Template — Delinea Secret Server IP Address Restrictions
#
# Declares ONE IP address restriction — aka an "allowed IP range" — the item.
# Users add as many as they need. Field keys must match
# config-types/ip-address-restrictions/_shared.ts + validate.ts. Applied via
# the Secret Server REST API (/api/v1/ipaddress-restrictions). A restriction
# is reconciled by its name, so `name` is the identity.
#
# Scope: the named ranges themselves. Attaching a restriction to a user or
# group (Admin > Security > IP Address Restrictions > assign) is not managed
# by this app — see the README Coverage section.
# =============================================================================

id: "delinea-ip-address-restrictions"
name: "IP Address Restrictions"
toolType: "delinea-secret-server"
entityType: "ip-address-restrictions"
description: "Manage Delinea Secret Server IP address restrictions (allowed IP ranges) — name and CIDR/IP range — via the Secret Server REST API (/api/v1/ipaddress-restrictions)"

item:
  label: "IP Address Restriction"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Restriction"
      icon: "shield"
      description: "Restriction identity and range"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The restriction name shown in Secret Server. Reconciled by name (upsert + drift)."

        - key: "range"
          label: "IP Range (CIDR or single IP)"
          fieldType: "text"
          required: true
          validation:
            maxLength: 100
            pattern: "^[0-9a-fA-F.:/]+$"
            message: "Enter a CIDR range (e.g. 172.56.23.0/24) or a single IPv4/IPv6 address."
          helpText: "A CIDR range (e.g. 172.56.23.0/24) or a single IP address this restriction allows."

    - name: "Audit"
      icon: "book"
      description: "Change record"
      fields:
        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this restriction is configured — recorded for audit."
