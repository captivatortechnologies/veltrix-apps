# =============================================================================
# Canvas Template — Delinea Secret Server Secret Policies
#
# Declares ONE Secret Server secret policy (the item). Users add as many as they
# need. Field keys must match config-types/secret-policies/_shared.ts +
# validate.ts. Applied via the Secret Server REST API (/api/v1/secret-policy). A
# policy is reconciled by its name, so secretPolicyName is the identity.
# =============================================================================

id: "delinea-secret-policies"
name: "Secret Policies"
toolType: "delinea-secret-server"
entityType: "secret-policies"
description: "Manage Delinea Secret Server secret policies — name, description and active state — via the Secret Server REST API (/api/v1/secret-policy)"

item:
  label: "Secret Policy"
  identityField: "secretPolicyName"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Policy"
      icon: "shield"
      description: "Policy identity and state"
      fields:
        - key: "secretPolicyName"
          label: "Policy Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The secret policy name shown in Secret Server. Reconciled by name (upsert + drift)."

        - key: "secretPolicyDescription"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 1000
          helpText: "What this policy enforces — surfaced in the Secret Server policy list."

        - key: "active"
          label: "Active"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Whether the policy is active. Turn off to retire a policy without deleting it (policy deletion is not managed by this app)."

    - name: "Audit"
      icon: "book"
      description: "Change record"
      fields:
        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this policy is configured — recorded for audit."
