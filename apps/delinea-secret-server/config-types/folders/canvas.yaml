# =============================================================================
# Canvas Template — Delinea Secret Server Folders
#
# Declares ONE Secret Server folder (the item). Users add as many as they need.
# Field keys must match config-types/folders/_shared.ts + validate.ts. Applied
# via the Secret Server REST API (/api/v1/folders). A folder is reconciled by its
# name WITHIN a parent, so parentFolderName + folderName together are the identity.
# =============================================================================

id: "delinea-folders"
name: "Folders"
toolType: "delinea-secret-server"
entityType: "folders"
description: "Manage Delinea Secret Server folders — name, parent, permission and secret-policy inheritance — via the Secret Server REST API (/api/v1/folders)"

item:
  label: "Folder"
  identityField: "folderName"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Folder"
      icon: "folder"
      description: "Folder identity and placement"
      fields:
        - key: "folderName"
          label: "Folder Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The folder name shown in Secret Server. Reconciled by name within its parent (upsert + drift)."

        - key: "parentFolderName"
          label: "Parent Folder"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "Optional name of the parent folder. Resolved to a parentFolderId; leave blank to create the folder at the root."

    - name: "Inheritance"
      icon: "shield"
      description: "Permission and secret-policy inheritance"
      fields:
        - key: "inheritPermissions"
          label: "Inherit Permissions"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Inherit permissions from the parent folder. Turn off to manage this folder's permissions independently."

        - key: "inheritSecretPolicy"
          label: "Inherit Secret Policy"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Inherit the secret policy from the parent folder. Turn off to assign a policy on the folder directly (in Secret Server)."

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this folder is configured — recorded for audit."
