id: microsoft-intune
name: Microsoft Intune
version: "1.5.0"
vendor: Veltrix
description: >
  Manage Microsoft Intune endpoint-security policies as code through the
  Microsoft Graph API. v1.0 ships Attack Surface Reduction (ASR) rules — the
  finite, well-defined Defender hardening rule set — with validation, drift
  detection and rollback handled by the Security-as-Code pipeline. These policies
  configure Microsoft Defender for Endpoint and can be delivered via Intune MDM
  or Defender security settings management. Auth is an Azure AD app registration
  (OAuth2 client credentials) with the Graph DeviceManagementConfiguration
  permission; the tenant is set via the Tenant ID app setting.
category: EDR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/microsoft-intune
icon: "🖥️"

platform:
  minVersion: "1.0.0"

# Microsoft Intune brand: Intune blue with a bright sky-blue accent.
branding:
  primaryColor: "#0F3C82"
  accentColor: "#32B0E7"
  logo: ./assets/logo.svg
  logoDark: ./assets/logo-dark.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: intune-asr-rules
      actions: [read, write, delete]
      description: Manage Intune Attack Surface Reduction (ASR) rule policies
    - resource: intune-security-policy
      actions: [read, write, delete]
      description: Manage imported Intune endpoint-security policies (AV / firewall / EDR / …)
    - resource: intune-compliance-policies
      actions: [read, write, delete]
      description: Manage Intune device compliance policies (per-platform) and their assignments
    - resource: intune-windows-update-rings
      actions: [read, write, delete]
      description: Manage Intune Windows Update rings (Windows Update for Business) and their assignments
    - resource: intune-assignment-filters
      actions: [read, write, delete]
      description: Manage Intune assignment filters (device/app targeting rules)
    - resource: intune-app-protection-ios
      actions: [read, write, delete]
      description: Manage Intune iOS app protection (MAM) policies and their targeted apps + assignments
    - resource: intune-app-protection-android
      actions: [read, write, delete]
      description: Manage Intune Android app protection (MAM) policies and their targeted apps + assignments
    - resource: intune-feature-update-profiles
      actions: [read, write, delete]
      description: Manage Intune Windows feature update profiles and their assignments
    - resource: intune-quality-update-profiles
      actions: [read, write, delete]
      description: Manage Intune Windows quality (expedited) update profiles and their assignments
    - resource: intune-device-remediations
      actions: [read, write, delete]
      description: Manage Intune device remediations (proactive remediation detect/remediate scripts) and their assignments
    - resource: intune-platform-scripts
      actions: [read, write, delete]
      description: Manage Intune platform scripts (Windows PowerShell management scripts) and their assignments
    - resource: intune-scope-tags
      actions: [read, write, delete]
      description: Manage Intune role scope tags (RBAC scoping)
    - resource: intune-app-config-policies
      actions: [read, write, delete]
      description: Manage Intune app configuration policies for managed apps (custom key/value settings) and their targeted apps + assignments

pipeline:
  configurationTypes:
    - id: intune-asr-rules
      group: "Endpoint Security"
      name: Attack Surface Reduction Rules
      description: >
        Defender Attack Surface Reduction (ASR) rule policies via the Graph beta
        settings catalog (endpointSecurityAttackSurfaceReduction). PREVIEW — the
        Graph deviceManagement/configurationPolicies API is beta; needs an Intune
        license and the DeviceManagementConfiguration.ReadWrite.All permission
      canvasTemplate: config-types/intune-asr-rules/canvas.yaml
      defaultConfig: config-types/intune-asr-rules/defaults.yaml
      handlers:
        validate: config-types/intune-asr-rules/validate
        deploy: config-types/intune-asr-rules/deploy
        rollback: config-types/intune-asr-rules/rollback
        healthCheck: config-types/intune-asr-rules/healthCheck
        driftDetect: config-types/intune-asr-rules/driftDetect
        getStatus: config-types/intune-asr-rules/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-security-policy
      group: "Endpoint Security"
      name: Endpoint Security Policy (Import)
      description: >
        Manage Defender endpoint-security policies (Antivirus / Firewall / EDR /
        Disk encryption / Account protection) as code by importing an exported
        settings-catalog policy JSON. Reconciled by name. PREVIEW — the Graph
        deviceManagement/configurationPolicies API is beta
      canvasTemplate: config-types/intune-security-policy/canvas.yaml
      defaultConfig: config-types/intune-security-policy/defaults.yaml
      handlers:
        validate: config-types/intune-security-policy/validate
        deploy: config-types/intune-security-policy/deploy
        rollback: config-types/intune-security-policy/rollback
        healthCheck: config-types/intune-security-policy/healthCheck
        driftDetect: config-types/intune-security-policy/driftDetect
        getStatus: config-types/intune-security-policy/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-compliance-policies
      group: "Compliance"
      name: Device Compliance Policies
      description: >
        Manage Intune device compliance policies per platform (Windows/iOS/macOS/
        Android) via Microsoft Graph v1.0 deviceCompliancePolicies, including the
        required non-compliance scheduled actions and group assignments
      canvasTemplate: config-types/intune-compliance-policies/canvas.yaml
      defaultConfig: config-types/intune-compliance-policies/defaults.yaml
      handlers:
        validate: config-types/intune-compliance-policies/validate
        deploy: config-types/intune-compliance-policies/deploy
        rollback: config-types/intune-compliance-policies/rollback
        healthCheck: config-types/intune-compliance-policies/healthCheck
        driftDetect: config-types/intune-compliance-policies/driftDetect
        getStatus: config-types/intune-compliance-policies/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-windows-update-rings
      group: "Windows Updates"
      name: Windows Update Rings
      description: >
        Manage Intune Windows Update rings (Windows Update for Business) via Graph
        v1.0 deviceConfigurations (windowsUpdateForBusinessConfiguration) — deferral,
        deadline, active hours, delivery optimization — and their assignments
      canvasTemplate: config-types/intune-windows-update-rings/canvas.yaml
      defaultConfig: config-types/intune-windows-update-rings/defaults.yaml
      handlers:
        validate: config-types/intune-windows-update-rings/validate
        deploy: config-types/intune-windows-update-rings/deploy
        rollback: config-types/intune-windows-update-rings/rollback
        healthCheck: config-types/intune-windows-update-rings/healthCheck
        driftDetect: config-types/intune-windows-update-rings/driftDetect
        getStatus: config-types/intune-windows-update-rings/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-assignment-filters
      group: "Assignments"
      name: Assignment Filters
      description: >
        Manage Intune assignment filters (deviceAndAppManagementAssignmentFilter)
        via Graph — platform + filter rule DSL — used to include/exclude devices
        or apps in policy assignments
      canvasTemplate: config-types/intune-assignment-filters/canvas.yaml
      defaultConfig: config-types/intune-assignment-filters/defaults.yaml
      handlers:
        validate: config-types/intune-assignment-filters/validate
        deploy: config-types/intune-assignment-filters/deploy
        rollback: config-types/intune-assignment-filters/rollback
        healthCheck: config-types/intune-assignment-filters/healthCheck
        driftDetect: config-types/intune-assignment-filters/driftDetect
        getStatus: config-types/intune-assignment-filters/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-app-protection-ios
      group: "App Protection"
      name: iOS App Protection Policies
      description: >
        Manage Intune iOS app protection (MAM) policies via Graph
        iosManagedAppProtection — PIN, data transfer/clipboard controls, encryption,
        offline wipe — with targeted apps and group assignments
      canvasTemplate: config-types/intune-app-protection-ios/canvas.yaml
      defaultConfig: config-types/intune-app-protection-ios/defaults.yaml
      handlers:
        validate: config-types/intune-app-protection-ios/validate
        deploy: config-types/intune-app-protection-ios/deploy
        rollback: config-types/intune-app-protection-ios/rollback
        healthCheck: config-types/intune-app-protection-ios/healthCheck
        driftDetect: config-types/intune-app-protection-ios/driftDetect
        getStatus: config-types/intune-app-protection-ios/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-app-protection-android
      group: "App Protection"
      name: Android App Protection Policies
      description: >
        Manage Intune Android app protection (MAM) policies via Graph
        androidManagedAppProtection — PIN, data transfer/clipboard controls,
        encryption, root detection — with targeted apps and group assignments
      canvasTemplate: config-types/intune-app-protection-android/canvas.yaml
      defaultConfig: config-types/intune-app-protection-android/defaults.yaml
      handlers:
        validate: config-types/intune-app-protection-android/validate
        deploy: config-types/intune-app-protection-android/deploy
        rollback: config-types/intune-app-protection-android/rollback
        healthCheck: config-types/intune-app-protection-android/healthCheck
        driftDetect: config-types/intune-app-protection-android/driftDetect
        getStatus: config-types/intune-app-protection-android/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-feature-update-profiles
      group: "Windows Updates"
      name: Windows Feature Update Profiles
      description: >
        Manage Intune Windows feature update profiles (windowsFeatureUpdateProfile)
        — target feature version + gradual rollout — and their assignments
      canvasTemplate: config-types/intune-feature-update-profiles/canvas.yaml
      defaultConfig: config-types/intune-feature-update-profiles/defaults.yaml
      handlers:
        validate: config-types/intune-feature-update-profiles/validate
        deploy: config-types/intune-feature-update-profiles/deploy
        rollback: config-types/intune-feature-update-profiles/rollback
        healthCheck: config-types/intune-feature-update-profiles/healthCheck
        driftDetect: config-types/intune-feature-update-profiles/driftDetect
        getStatus: config-types/intune-feature-update-profiles/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-quality-update-profiles
      group: "Windows Updates"
      name: Windows Quality Update Profiles
      description: >
        Manage Intune Windows quality (expedited) update profiles
        (windowsQualityUpdateProfile) — expedite a released quality update — and
        their assignments
      canvasTemplate: config-types/intune-quality-update-profiles/canvas.yaml
      defaultConfig: config-types/intune-quality-update-profiles/defaults.yaml
      handlers:
        validate: config-types/intune-quality-update-profiles/validate
        deploy: config-types/intune-quality-update-profiles/deploy
        rollback: config-types/intune-quality-update-profiles/rollback
        healthCheck: config-types/intune-quality-update-profiles/healthCheck
        driftDetect: config-types/intune-quality-update-profiles/driftDetect
        getStatus: config-types/intune-quality-update-profiles/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-device-remediations
      group: "Scripts & Remediations"
      name: Device Remediations
      description: >
        Manage Intune device remediations (deviceHealthScript) — a detection +
        remediation PowerShell script pair with a run schedule — and their assignments
      canvasTemplate: config-types/intune-device-remediations/canvas.yaml
      defaultConfig: config-types/intune-device-remediations/defaults.yaml
      handlers:
        validate: config-types/intune-device-remediations/validate
        deploy: config-types/intune-device-remediations/deploy
        rollback: config-types/intune-device-remediations/rollback
        healthCheck: config-types/intune-device-remediations/healthCheck
        driftDetect: config-types/intune-device-remediations/driftDetect
        getStatus: config-types/intune-device-remediations/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-platform-scripts
      group: "Scripts & Remediations"
      name: Platform Scripts
      description: >
        Manage Intune platform scripts (deviceManagementScript) — Windows PowerShell
        scripts run on managed devices — run-as account, signature check — and assignments
      canvasTemplate: config-types/intune-platform-scripts/canvas.yaml
      defaultConfig: config-types/intune-platform-scripts/defaults.yaml
      handlers:
        validate: config-types/intune-platform-scripts/validate
        deploy: config-types/intune-platform-scripts/deploy
        rollback: config-types/intune-platform-scripts/rollback
        healthCheck: config-types/intune-platform-scripts/healthCheck
        driftDetect: config-types/intune-platform-scripts/driftDetect
        getStatus: config-types/intune-platform-scripts/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-scope-tags
      group: "Governance"
      name: Role Scope Tags
      description: >
        Manage Intune role scope tags (roleScopeTag) — RBAC scoping labels referenced
        by policies and role assignments
      canvasTemplate: config-types/intune-scope-tags/canvas.yaml
      defaultConfig: config-types/intune-scope-tags/defaults.yaml
      handlers:
        validate: config-types/intune-scope-tags/validate
        deploy: config-types/intune-scope-tags/deploy
        rollback: config-types/intune-scope-tags/rollback
        healthCheck: config-types/intune-scope-tags/healthCheck
        driftDetect: config-types/intune-scope-tags/driftDetect
        getStatus: config-types/intune-scope-tags/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: intune-app-config-policies
      group: "App Protection"
      name: App Configuration Policies
      description: >
        Manage Intune app configuration policies for managed apps
        (targetedManagedAppConfiguration) — custom key/value settings pushed into
        managed apps — with targeted apps and group assignments
      canvasTemplate: config-types/intune-app-config-policies/canvas.yaml
      defaultConfig: config-types/intune-app-config-policies/defaults.yaml
      handlers:
        validate: config-types/intune-app-config-policies/validate
        deploy: config-types/intune-app-config-policies/deploy
        rollback: config-types/intune-app-config-policies/rollback
        healthCheck: config-types/intune-app-config-policies/healthCheck
        driftDetect: config-types/intune-app-config-policies/driftDetect
        getStatus: config-types/intune-app-config-policies/getStatus
      targets:
        componentTypes: [intune-tenant]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/microsoft-intune

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs an Intune tenant (component) with
    # the Entra app credential used to reach Graph, with a connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: runs the OAuth2 token handshake and one
# lightweight authenticated GET /deviceManagement/configurationPolicies.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: tenant_id
    type: string
    label: Tenant ID
    description: >
      The Microsoft Entra (Azure AD) directory/tenant GUID. Required to acquire an
      access token for the app registration.
    default: ""
    required: true
  - key: azure_cloud
    type: select
    label: Azure Cloud
    description: >
      The Azure environment the tenant lives in. Determines the login host and
      Graph host. US Gov High / DoD use graph.microsoft.us.
    default: commercial
    required: false
    options:
      - label: Commercial
        value: commercial
      - label: US Gov (GCC)
        value: gcc
      - label: US Gov (GCC High)
        value: gcc-high
      - label: US Gov (DoD)
        value: dod
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Microsoft Graph calls.
    default: 30
    required: false
