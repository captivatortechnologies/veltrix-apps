# Defaults for a new Android app protection policy item.
#
# Intentionally empty: the platform no longer seeds system default values into a
# new item — it starts blank and in-UI defaults come from each field's
# `defaultValue` in canvas.yaml (pinRequired=true, the data-protection toggles on,
# data-transfer/clipboard = allApps, appGroupType=selectedPublicApps). Any values
# here would be a flat map keyed by the canvas field keys (name, pinRequired,
# allowedInboundDataTransferSources, appGroupType, targetedApps, includeGroups, …).
