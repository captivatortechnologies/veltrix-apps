      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: event-definitions
      group: "Alerting"
      name: Event Definitions
      description: Graylog event definitions — the modern alerting conditions that raise Events and trigger notifications — applied over the Graylog REST API (/api/events/definitions)
      canvasTemplate: config-types/event-definitions/canvas.yaml
      defaultConfig: config-types/event-definitions/defaults.yaml
      handlers:
        validate: config-types/event-definitions/validate
        deploy: config-types/event-definitions/deploy
        rollback: config-types/event-definitions/rollback
        healthCheck: config-types/event-definitions/healthCheck
        driftDetect: config-types/event-definitions/driftDetect
        getStatus: config-types/event-definitions/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: notifications
      group: "Alerting"
      name: Notifications
      description: Graylog event notifications — email/HTTP actions triggered by an event definition — applied over the Graylog REST API (/api/events/notifications)
      canvasTemplate: config-types/notifications/canvas.yaml
      defaultConfig: config-types/notifications/defaults.yaml
      handlers:
        validate: config-types/notifications/validate
        deploy: config-types/notifications/deploy
        rollback: config-types/notifications/rollback
        healthCheck: config-types/notifications/healthCheck
        driftDetect: config-types/notifications/driftDetect
        getStatus: config-types/notifications/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: roles
      group: "Access Control"
      name: Roles
      description: Graylog RBAC roles — named permission sets assigned to users — applied over the Graylog REST API (/api/roles)
      canvasTemplate: config-types/roles/canvas.yaml
      defaultConfig: config-types/roles/defaults.yaml
      handlers:
        validate: config-types/roles/validate
        deploy: config-types/roles/deploy
        rollback: config-types/roles/rollback
        healthCheck: config-types/roles/healthCheck
        driftDetect: config-types/roles/driftDetect
        getStatus: config-types/roles/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: sidecar-collectors
      group: "Sidecar"
      name: Sidecar Collectors
      description: Graylog Sidecar collector binary definitions — which log-shipper binary runs and how — applied over the Graylog REST API (/api/sidecar/collectors)
      canvasTemplate: config-types/sidecar-collectors/canvas.yaml
      defaultConfig: config-types/sidecar-collectors/defaults.yaml
      handlers:
        validate: config-types/sidecar-collectors/validate
        deploy: config-types/sidecar-collectors/deploy
        rollback: config-types/sidecar-collectors/rollback
        healthCheck: config-types/sidecar-collectors/healthCheck
        driftDetect: config-types/sidecar-collectors/driftDetect
        getStatus: config-types/sidecar-collectors/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: sidecar-configurations
      group: "Sidecar"
      name: Sidecar Configurations
      description: Graylog Sidecar configurations — the rendered config file pushed to matching hosts — applied over the Graylog REST API (/api/sidecar/configurations)
      canvasTemplate: config-types/sidecar-configurations/canvas.yaml
      defaultConfig: config-types/sidecar-configurations/defaults.yaml
      handlers:
        validate: config-types/sidecar-configurations/validate
        deploy: config-types/sidecar-configurations/deploy
        rollback: config-types/sidecar-configurations/rollback
        healthCheck: config-types/sidecar-configurations/healthCheck
        driftDetect: config-types/sidecar-configurations/driftDetect
        getStatus: config-types/sidecar-configurations/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: outputs
      group: "Outputs"
      name: Outputs
      description: Graylog message outputs — forwarding destinations such as GELF over TCP/UDP — applied over the Graylog REST API (/api/system/outputs)
      canvasTemplate: config-types/outputs/canvas.yaml
      defaultConfig: config-types/outputs/defaults.yaml
      handlers:
        validate: config-types/outputs/validate
        deploy: config-types/outputs/deploy
        rollback: config-types/outputs/rollback
        healthCheck: config-types/outputs/healthCheck
        driftDetect: config-types/outputs/driftDetect
        getStatus: config-types/outputs/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: decorators
      group: "Search"
      name: Decorators
      description: Graylog message-list decorators — display-time search-result enrichment, global or per-stream — applied over the Graylog REST API (/api/search/decorators)
      canvasTemplate: config-types/decorators/canvas.yaml
      defaultConfig: config-types/decorators/defaults.yaml
      handlers:
        validate: config-types/decorators/validate
        deploy: config-types/decorators/deploy
        rollback: config-types/decorators/rollback
        healthCheck: config-types/decorators/healthCheck
        driftDetect: config-types/decorators/driftDetect
        getStatus: config-types/decorators/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/graylog

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL stack infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs the Graylog node (component) with a
    # Graylog credential (user/password or access token), with a per-row test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint + credential
# against the Graylog REST API (GET /api/system, HTTP Basic, self-signed tolerated).
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onEvent: hooks/onEvent

settings:
  - key: graylog_port
    type: number
    label: Graylog REST port
    description: Port the Graylog REST API listens on (default 9000; use 443 behind a TLS reverse proxy)
    default: 9000
    required: false
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the Graylog endpoint. Off by default —
      self-hosted Graylog commonly sits behind a self-signed certificate.
    default: false
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
