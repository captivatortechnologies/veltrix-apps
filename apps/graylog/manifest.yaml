id: graylog
name: Graylog
version: "0.4.0"
vendor: Veltrix
description: >
  Manage Graylog (open-source SIEM / log management) as code. Author message
  streams, inputs, extractors, grok patterns, processing pipelines/rules/connections,
  index sets, lookup tables/caches/data-adapters, event definitions, notifications,
  roles, Sidecar collectors/configurations, outputs and decorators, and drive them
  through the Security-as-Code pipeline — validate, deploy, health check, drift
  detection and rollback — over the Graylog REST API (HTTP Basic auth,
  X-Requested-By CSRF guard, self-signed TLS tolerated), with BYOL infrastructure
  provisioning for the Graylog stack (Graylog server + OpenSearch + MongoDB).
category: SIEM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/graylog
icon: "📊"

platform:
  minVersion: "1.0.0"

# Graylog's brand orange. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#f37f26"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: streams
      actions: [read, write, delete]
      description: Manage Graylog message streams (create / edit / resume / pause / delete)
    - resource: inputs
      actions: [read, write, delete]
      description: Manage Graylog message inputs (create / edit / delete)
    - resource: pipeline-rules
      actions: [read, write, delete]
      description: Manage Graylog processing pipeline rules (create / edit / delete)
    - resource: index-sets
      actions: [read, write, delete]
      description: Manage Graylog index sets (create / edit / delete)
    - resource: extractors
      actions: [read, write, delete]
      description: Manage Graylog input extractors (create / edit / delete)
    - resource: grok-patterns
      actions: [read, write, delete]
      description: Manage Graylog grok patterns (create / edit / delete)
    - resource: pipelines
      actions: [read, write, delete]
      description: Manage Graylog processing pipelines (create / edit / delete)
    - resource: pipeline-connections
      actions: [read, write, delete]
      description: Manage Graylog pipeline-to-stream connections (create / edit / delete)
    - resource: lookup-caches
      actions: [read, write, delete]
      description: Manage Graylog lookup-table caches (create / edit / delete)
    - resource: lookup-data-adapters
      actions: [read, write, delete]
      description: Manage Graylog lookup-table data adapters (create / edit / delete)
    - resource: lookup-tables
      actions: [read, write, delete]
      description: Manage Graylog lookup tables (create / edit / delete)
    - resource: event-definitions
      actions: [read, write, delete]
      description: Manage Graylog event definitions (create / edit / delete)
    - resource: notifications
      actions: [read, write, delete]
      description: Manage Graylog event notifications (create / edit / delete)
    - resource: roles
      actions: [read, write, delete]
      description: Manage Graylog RBAC roles (create / edit / delete)
    - resource: sidecar-collectors
      actions: [read, write, delete]
      description: Manage Graylog Sidecar collector definitions (create / edit / delete)
    - resource: sidecar-configurations
      actions: [read, write, delete]
      description: Manage Graylog Sidecar configurations (create / edit / delete)
    - resource: outputs
      actions: [read, write, delete]
      description: Manage Graylog message outputs (create / edit / delete)
    - resource: decorators
      actions: [read, write, delete]
      description: Manage Graylog message-list decorators (create / edit / delete)
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL Graylog stack infrastructure
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: graylog_

pipeline:
  configurationTypes:
    - id: streams
      group: "Streams"
      name: Streams
      description: Graylog message streams — title, description, matching type and rules — applied over the Graylog REST API (/api/streams)
      canvasTemplate: config-types/streams/canvas.yaml
      defaultConfig: config-types/streams/defaults.yaml
      handlers:
        validate: config-types/streams/validate
        deploy: config-types/streams/deploy
        rollback: config-types/streams/rollback
        healthCheck: config-types/streams/healthCheck
        driftDetect: config-types/streams/driftDetect
        getStatus: config-types/streams/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: inputs
      group: "Collection"
      name: Inputs
      description: Graylog message inputs — title, type, global flag and configuration — applied over the Graylog REST API (/api/system/inputs)
      canvasTemplate: config-types/inputs/canvas.yaml
      defaultConfig: config-types/inputs/defaults.yaml
      handlers:
        validate: config-types/inputs/validate
        deploy: config-types/inputs/deploy
        rollback: config-types/inputs/rollback
        healthCheck: config-types/inputs/healthCheck
        driftDetect: config-types/inputs/driftDetect
        getStatus: config-types/inputs/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: pipeline-rules
      group: "Processing"
      name: Pipeline Rules
      description: Graylog processing pipeline rules — title, description and rule DSL source — applied over the Graylog REST API (/api/system/pipelines/rule)
      canvasTemplate: config-types/pipeline-rules/canvas.yaml
      defaultConfig: config-types/pipeline-rules/defaults.yaml
      handlers:
        validate: config-types/pipeline-rules/validate
        deploy: config-types/pipeline-rules/deploy
        rollback: config-types/pipeline-rules/rollback
        healthCheck: config-types/pipeline-rules/healthCheck
        driftDetect: config-types/pipeline-rules/driftDetect
        getStatus: config-types/pipeline-rules/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: index-sets
      group: "Indices"
      name: Index Sets
      description: Graylog index sets — title, index prefix, rotation and retention strategy — applied over the Graylog REST API (/api/system/indices/index_sets)
      canvasTemplate: config-types/index-sets/canvas.yaml
      defaultConfig: config-types/index-sets/defaults.yaml
      handlers:
        validate: config-types/index-sets/validate
        deploy: config-types/index-sets/deploy
        rollback: config-types/index-sets/rollback
        healthCheck: config-types/index-sets/healthCheck
        driftDetect: config-types/index-sets/driftDetect
        getStatus: config-types/index-sets/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: extractors
      group: "Collection"
      name: Extractors
      description: Graylog input extractors — field-extraction/parsing rules attached to a message input — applied over the Graylog REST API (/api/system/inputs/{inputId}/extractors)
      canvasTemplate: config-types/extractors/canvas.yaml
      defaultConfig: config-types/extractors/defaults.yaml
      handlers:
        validate: config-types/extractors/validate
        deploy: config-types/extractors/deploy
        rollback: config-types/extractors/rollback
        healthCheck: config-types/extractors/healthCheck
        driftDetect: config-types/extractors/driftDetect
        getStatus: config-types/extractors/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: grok-patterns
      group: "Collection"
      name: Grok Patterns
      description: Graylog grok patterns — named regular-expression building blocks used by extractors and pipeline rules — applied over the Graylog REST API (/api/system/grok)
      canvasTemplate: config-types/grok-patterns/canvas.yaml
      defaultConfig: config-types/grok-patterns/defaults.yaml
      handlers:
        validate: config-types/grok-patterns/validate
        deploy: config-types/grok-patterns/deploy
        rollback: config-types/grok-patterns/rollback
        healthCheck: config-types/grok-patterns/healthCheck
        driftDetect: config-types/grok-patterns/driftDetect
        getStatus: config-types/grok-patterns/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: pipelines
      group: "Processing"
      name: Pipelines
      description: Graylog processing pipelines — title, description and stage/rule DSL source — applied over the Graylog REST API (/api/system/pipelines/pipeline)
      canvasTemplate: config-types/pipelines/canvas.yaml
      defaultConfig: config-types/pipelines/defaults.yaml
      handlers:
        validate: config-types/pipelines/validate
        deploy: config-types/pipelines/deploy
        rollback: config-types/pipelines/rollback
        healthCheck: config-types/pipelines/healthCheck
        driftDetect: config-types/pipelines/driftDetect
        getStatus: config-types/pipelines/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: pipeline-connections
      group: "Processing"
      name: Pipeline Connections
      description: Wires Graylog processing pipelines to streams — the complete pipeline set per stream — applied over the Graylog REST API (/api/system/pipelines/connections)
      canvasTemplate: config-types/pipeline-connections/canvas.yaml
      defaultConfig: config-types/pipeline-connections/defaults.yaml
      handlers:
        validate: config-types/pipeline-connections/validate
        deploy: config-types/pipeline-connections/deploy
        rollback: config-types/pipeline-connections/rollback
        healthCheck: config-types/pipeline-connections/healthCheck
        driftDetect: config-types/pipeline-connections/driftDetect
        getStatus: config-types/pipeline-connections/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: lookup-caches
      group: "Lookup Tables"
      name: Lookup Caches
      description: Graylog lookup-table caches — the caching layer in front of a lookup data adapter — applied over the Graylog REST API (/api/system/lookup/caches)
      canvasTemplate: config-types/lookup-caches/canvas.yaml
      defaultConfig: config-types/lookup-caches/defaults.yaml
      handlers:
        validate: config-types/lookup-caches/validate
        deploy: config-types/lookup-caches/deploy
        rollback: config-types/lookup-caches/rollback
        healthCheck: config-types/lookup-caches/healthCheck
        driftDetect: config-types/lookup-caches/driftDetect
        getStatus: config-types/lookup-caches/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: lookup-data-adapters
      group: "Lookup Tables"
      name: Lookup Data Adapters
      description: Graylog lookup-table data adapters — the data source a lookup table reads from (CSV, DNS, HTTP JSONPath, ...) — applied over the Graylog REST API (/api/system/lookup/adapters)
      canvasTemplate: config-types/lookup-data-adapters/canvas.yaml
      defaultConfig: config-types/lookup-data-adapters/defaults.yaml
      handlers:
        validate: config-types/lookup-data-adapters/validate
        deploy: config-types/lookup-data-adapters/deploy
        rollback: config-types/lookup-data-adapters/rollback
        healthCheck: config-types/lookup-data-adapters/healthCheck
        driftDetect: config-types/lookup-data-adapters/driftDetect
        getStatus: config-types/lookup-data-adapters/getStatus
      targets:
        componentTypes: [graylog, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: lookup-tables
      group: "Lookup Tables"
      name: Lookup Tables
      description: Graylog lookup tables — wiring a cache to a data adapter for pipeline-rule lookups — applied over the Graylog REST API (/api/system/lookup/tables)
      canvasTemplate: config-types/lookup-tables/canvas.yaml
      defaultConfig: config-types/lookup-tables/defaults.yaml
      handlers:
