id: jumpcloud
name: JumpCloud
version: "0.3.0"
vendor: Veltrix
description: >
  Manage JumpCloud directory, policy, network-access and organization
  configuration as code through the JumpCloud REST API (v1 + v2). Thirteen
  configuration types spanning Directory (User/System Groups, Memberships, LDAP
  Server Settings), Policies (Policies, Policy Groups), Access Control (IP
  Lists, RADIUS Servers, Conditional Access Policies), Automation (Commands)
  and Organization (Custom Email, Password Manager Policies, Software Apps),
  each driven through the Security-as-Code pipeline (validate, deploy, health
  check, drift detection and rollback) over the JumpCloud API (x-api-key).
category: IAM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/jumpcloud
icon: "🟢"

platform:
  minVersion: "1.0.0"

# JumpCloud brand green.
branding:
  primaryColor: "#37b34a"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: user-groups
      actions: [read, write, delete]
      description: Manage JumpCloud User Groups (create / edit / delete)
    - resource: system-groups
      actions: [read, write, delete]
      description: Manage JumpCloud System (device) Groups (create / edit / delete)
    - resource: policies
      actions: [read, write, delete]
      description: Manage JumpCloud Policies (create / edit / delete)
    - resource: group-memberships
      actions: [read, write, delete]
      description: Manage JumpCloud User Group memberships (add / remove users)
    - resource: ldap-server-settings
      actions: [read, write]
      description: Manage settings on an existing JumpCloud LDAP-as-a-Service server (no create/delete — none exists in the API)
    - resource: policy-groups
      actions: [read, write, delete]
      description: Manage JumpCloud Policy Groups and their member Policies
    - resource: ip-lists
      actions: [read, write, delete]
      description: Manage JumpCloud IP Lists (named IP / CIDR collections)
    - resource: radius-servers
      actions: [read, write, delete]
      description: Manage JumpCloud RADIUS servers (create / edit / delete)
    - resource: conditional-access-policies
      actions: [read, write, delete]
      description: Manage JumpCloud Authentication (Conditional Access) Policies
    - resource: commands
      actions: [read, write, delete]
      description: Manage JumpCloud Commands (saved scripts)
    - resource: custom-email-config
      actions: [read, write, delete]
      description: Manage JumpCloud custom transactional email overrides
    - resource: password-manager-policies
      actions: [read, write]
      description: Manage the JumpCloud Password Manager organization policy (a tenant singleton)
    - resource: software-apps
      actions: [read, write, delete]
      description: Manage JumpCloud catalog-based managed Software Apps

pipeline:
  configurationTypes:
    - id: user-groups
      group: "Directory"
      name: User Groups
      description: JumpCloud User Groups — name, description, email and membership method — applied over the JumpCloud API v2 (/usergroups)
      canvasTemplate: config-types/user-groups/canvas.yaml
      defaultConfig: config-types/user-groups/defaults.yaml
      handlers:
        validate: config-types/user-groups/validate
        deploy: config-types/user-groups/deploy
        rollback: config-types/user-groups/rollback
        healthCheck: config-types/user-groups/healthCheck
        driftDetect: config-types/user-groups/driftDetect
        getStatus: config-types/user-groups/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: system-groups
      group: "Directory"
      name: System Groups
      description: JumpCloud System (device) Groups — name and description — applied over the JumpCloud API v2 (/systemgroups)
      canvasTemplate: config-types/system-groups/canvas.yaml
      defaultConfig: config-types/system-groups/defaults.yaml
      handlers:
        validate: config-types/system-groups/validate
        deploy: config-types/system-groups/deploy
        rollback: config-types/system-groups/rollback
        healthCheck: config-types/system-groups/healthCheck
        driftDetect: config-types/system-groups/driftDetect
        getStatus: config-types/system-groups/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: policies
      group: "Policies"
      name: Policies
      description: JumpCloud Policies — a Policy Template instance plus its configuration values — applied over the JumpCloud API v2 (/policies)
      canvasTemplate: config-types/policies/canvas.yaml
      defaultConfig: config-types/policies/defaults.yaml
      handlers:
        validate: config-types/policies/validate
        deploy: config-types/policies/deploy
        rollback: config-types/policies/rollback
        healthCheck: config-types/policies/healthCheck
        driftDetect: config-types/policies/driftDetect
        getStatus: config-types/policies/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: group-memberships
      group: "Directory"
      name: User Group Memberships
      description: JumpCloud User Group membership — which users belong to a group, declared by email / username / id — applied over the JumpCloud API v2 (/usergroups/{id}/members)
      canvasTemplate: config-types/group-memberships/canvas.yaml
      defaultConfig: config-types/group-memberships/defaults.yaml
      handlers:
        validate: config-types/group-memberships/validate
        deploy: config-types/group-memberships/deploy
        rollback: config-types/group-memberships/rollback
        healthCheck: config-types/group-memberships/healthCheck
        driftDetect: config-types/group-memberships/driftDetect
        getStatus: config-types/group-memberships/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: ldap-server-settings
      group: "Directory"
      name: LDAP Server Settings
      description: Settings on an existing JumpCloud LDAP-as-a-Service server — name, lockout action, password-expiration action — applied over the JumpCloud API v2 (/ldapservers/{id}). PATCH only; cannot create or delete a server.
      canvasTemplate: config-types/ldap-server-settings/canvas.yaml
      defaultConfig: config-types/ldap-server-settings/defaults.yaml
      handlers:
        validate: config-types/ldap-server-settings/validate
        deploy: config-types/ldap-server-settings/deploy
        rollback: config-types/ldap-server-settings/rollback
        healthCheck: config-types/ldap-server-settings/healthCheck
        driftDetect: config-types/ldap-server-settings/driftDetect
        getStatus: config-types/ldap-server-settings/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: policy-groups
      group: "Policies"
      name: Policy Groups
      description: JumpCloud Policy Groups — a name plus the exact set of member Policies — applied over the JumpCloud API v2 (/policygroups)
      canvasTemplate: config-types/policy-groups/canvas.yaml
      defaultConfig: config-types/policy-groups/defaults.yaml
      handlers:
        validate: config-types/policy-groups/validate
        deploy: config-types/policy-groups/deploy
        rollback: config-types/policy-groups/rollback
        healthCheck: config-types/policy-groups/healthCheck
        driftDetect: config-types/policy-groups/driftDetect
        getStatus: config-types/policy-groups/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: ip-lists
      group: "Access Control"
      name: IP Lists
      description: JumpCloud IP Lists — named IP / CIDR collections referenced by Conditional Access Policies and RADIUS — applied over the JumpCloud API v2 (/iplists)
      canvasTemplate: config-types/ip-lists/canvas.yaml
      defaultConfig: config-types/ip-lists/defaults.yaml
      handlers:
        validate: config-types/ip-lists/validate
        deploy: config-types/ip-lists/deploy
        rollback: config-types/ip-lists/rollback
        healthCheck: config-types/ip-lists/healthCheck
        driftDetect: config-types/ip-lists/driftDetect
        getStatus: config-types/ip-lists/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: radius-servers
      group: "Access Control"
      name: RADIUS Servers
      description: JumpCloud RADIUS servers — network source, shared secret, MFA and certificate settings — applied over the JumpCloud API v1 (/radiusservers)
      canvasTemplate: config-types/radius-servers/canvas.yaml
      defaultConfig: config-types/radius-servers/defaults.yaml
      handlers:
        validate: config-types/radius-servers/validate
        deploy: config-types/radius-servers/deploy
        rollback: config-types/radius-servers/rollback
        healthCheck: config-types/radius-servers/healthCheck
        driftDetect: config-types/radius-servers/driftDetect
        getStatus: config-types/radius-servers/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: conditional-access-policies
      group: "Access Control"
      name: Conditional Access Policies
      description: JumpCloud Authentication Policies — allow/deny + MFA obligations gated by device trust, IP List membership or country — applied over the JumpCloud API v2 (/authn/policies)
      canvasTemplate: config-types/conditional-access-policies/canvas.yaml
      defaultConfig: config-types/conditional-access-policies/defaults.yaml
      handlers:
        validate: config-types/conditional-access-policies/validate
        deploy: config-types/conditional-access-policies/deploy
        rollback: config-types/conditional-access-policies/rollback
        healthCheck: config-types/conditional-access-policies/healthCheck
        driftDetect: config-types/conditional-access-policies/driftDetect
        getStatus: config-types/conditional-access-policies/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: commands
      group: "Automation"
      name: Commands
      description: JumpCloud Commands — saved scripts (OS, run-as user, schedule/trigger) — applied over the JumpCloud API v1 (/commands)
      canvasTemplate: config-types/commands/canvas.yaml
      defaultConfig: config-types/commands/defaults.yaml
      handlers:
        validate: config-types/commands/validate
        deploy: config-types/commands/deploy
        rollback: config-types/commands/rollback
        healthCheck: config-types/commands/healthCheck
        driftDetect: config-types/commands/driftDetect
        getStatus: config-types/commands/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: custom-email-config
      group: "Organization"
      name: Custom Email Configuration
      description: JumpCloud custom transactional email overrides (subject, header, body, button, contact info) — applied over the JumpCloud API v2 (/customemails)
      canvasTemplate: config-types/custom-email-config/canvas.yaml
      defaultConfig: config-types/custom-email-config/defaults.yaml
      handlers:
        validate: config-types/custom-email-config/validate
        deploy: config-types/custom-email-config/deploy
        rollback: config-types/custom-email-config/rollback
        healthCheck: config-types/custom-email-config/healthCheck
        driftDetect: config-types/custom-email-config/driftDetect
        getStatus: config-types/custom-email-config/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: password-manager-policies
      group: "Organization"
      name: Password Manager Policies
      description: The JumpCloud Password Manager organization policy (vault export control) — a tenant singleton — applied over the JumpCloud API v2 (/passwordmanager/company/policies)
      canvasTemplate: config-types/password-manager-policies/canvas.yaml
      defaultConfig: config-types/password-manager-policies/defaults.yaml
      handlers:
        validate: config-types/password-manager-policies/validate
        deploy: config-types/password-manager-policies/deploy
        rollback: config-types/password-manager-policies/rollback
        healthCheck: config-types/password-manager-policies/healthCheck
        driftDetect: config-types/password-manager-policies/driftDetect
        getStatus: config-types/password-manager-policies/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: software-apps
      group: "Organization"
      name: Software Apps (Catalog)
      description: JumpCloud catalog-based managed Software Apps — auto-update, delay and install/uninstall state — applied over the JumpCloud API v2 (/softwareapps)
      canvasTemplate: config-types/software-apps/canvas.yaml
      defaultConfig: config-types/software-apps/defaults.yaml
      handlers:
        validate: config-types/software-apps/validate
        deploy: config-types/software-apps/deploy
        rollback: config-types/software-apps/rollback
        healthCheck: config-types/software-apps/healthCheck
        driftDetect: config-types/software-apps/driftDetect
        getStatus: config-types/software-apps/getStatus
      targets:
        componentTypes: [jumpcloud-org]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/jumpcloud

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's API key (and
# optional org id) against the JumpCloud API (GET /api/v2/usergroups).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for JumpCloud API calls.
    default: 30
    required: false
