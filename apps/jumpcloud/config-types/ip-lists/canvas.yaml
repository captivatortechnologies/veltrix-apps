# =============================================================================
# Canvas Template — JumpCloud IP Lists
#
# Declares ONE JumpCloud IP List (the item). ONE item = ONE IP List, matched on
# its NAME (the logical identity used for upsert and drift). Field keys must
# match config-types/ip-lists/validate.ts.
#
# IP Lists are named collections of IP addresses / CIDR ranges. On their own they
# do nothing — they become access controls once referenced from a Conditional
# Access Policy's `conditions.ipAddressIn` (see the "Conditional Access Policies"
# config type) or from an Admin Portal / RADIUS network-source restriction.
#
# VERIFIED against JumpCloud's published API v2 OpenAPI spec
# (github.com/TheJumpCloud/jumpcloud-docs-public, docs/api/2.0/index.yaml):
#   GET/POST   /api/v2/iplists
#   GET/PUT/DELETE /api/v2/iplists/{id}
# Auth is the `x-api-key` header (plus optional `x-org-id` for multi-tenant admins).
# =============================================================================

id: "jumpcloud-ip-lists"
name: "IP Lists"
toolType: "jumpcloud"
entityType: "ip-lists"
description: "Define JumpCloud IP Lists (named IP / CIDR collections) as code through the JumpCloud API v2 (/iplists). Reference them from Conditional Access Policies or RADIUS network-source restrictions."

item:
  label: "IP List"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "IP List"
      icon: "globe"
      description: "List identity and members"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The IP List's display name. Must be unique within the canvas — this is the stable identity used to find, update and drift-check the list on each deploy."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          helpText: "Optional description shown in the JumpCloud Admin Console."

        - key: "ips"
          label: "IP Addresses / CIDR Ranges"
          fieldType: "tags"
          required: true
          helpText: "The full set of IP addresses or CIDR ranges (e.g. 203.0.113.0/24) this list should contain. This canvas item OWNS the complete list — a PUT replaces it wholesale on every deploy."
