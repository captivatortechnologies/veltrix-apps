# =============================================================================
# Canvas Template — JumpCloud System Groups
#
# Declares ONE JumpCloud System Group (device group). Users add as many as they
# need. ONE item = ONE System Group, matched on its NAME (the logical identity
# used for upsert and drift). Field keys must match
# config-types/system-groups/validate.ts.
#
# Applied over the JumpCloud API v2:
#   GET/POST   /api/v2/systemgroups
#   PUT/DELETE /api/v2/systemgroups/{id}
# Auth is the `x-api-key` header (plus optional `x-org-id` for multi-tenant admins).
# =============================================================================

id: "jumpcloud-system-groups"
name: "System Groups"
toolType: "jumpcloud"
entityType: "system-groups"
description: "Define JumpCloud System Groups (device groups) as code — name and description — through the JumpCloud API v2 (/systemgroups)."

item:
  label: "System Group"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "System Group"
      icon: "server"
      description: "Device group identity"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The System Group's display name. Must be unique within the canvas — this is the stable identity used to find, update and drift-check the group on each deploy."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Optional description shown in the JumpCloud Admin Portal."
