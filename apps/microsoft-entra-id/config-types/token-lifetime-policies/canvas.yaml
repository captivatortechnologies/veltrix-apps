# =============================================================================
# Canvas Template — Entra ID Token Lifetime Policies
#
# Declares ONE token lifetime policy — the item. Users add as many as they need.
# A policy's logical identity is its NAME (displayName); deploy lists policies,
# matches on the name (or a stored id, rename-safe), and PATCHes (update) or
# POSTs (create) accordingly.
#
# The policy body is a nested JSON "definition" that controls access/ID token
# lifetimes. Reconcile only deletes policies this app created.
#
# Field keys must match config-types/token-lifetime-policies/validate.ts.
# =============================================================================

id: "microsoft-entra-id-token-lifetime-policies"
name: "Token Lifetime Policy Configuration"
toolType: "microsoft-entra-id"
entityType: "token-lifetime-policies"
description: "Define Entra ID token lifetime policies (access / ID token lifetimes) as code through the Microsoft Graph API. The policy body is a JSON definition."

item:
  label: "Token Lifetime Policy"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: "Token Lifetime Policy"
      icon: "clock"
      description: "Name and JSON definition"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 256
          helpText: >
            Display name of the policy (max 256 chars). Must be unique within
            this canvas — it is the logical identity deploy matches on.

        - key: "definition"
          label: "Definition (JSON)"
          fieldType: "textarea"
          required: true
          helpText: >
            A JSON object with a "TokenLifetimePolicy" root key, e.g.
            {"TokenLifetimePolicy":{"Version":1,"AccessTokenLifetime":"8:00:00"}}.
            Durations use the format "dd.hh:mm:ss".

        - key: "isOrganizationDefault"
          label: "Organization Default"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: >
            When set, this policy applies as the organization-wide default. Only
            one token lifetime policy can be the organization default at a time.

    - name: "Applies To"
      icon: "target"
      description: "Service principals this policy is assigned to"
      fields:
        - key: "appliesTo"
          label: "Applies To (service principals)"
          fieldType: "remote-multiselect"
          optionsSource: "servicePrincipals"
          optionsMulti: true
          required: false
          helpText: >
            Service principals to assign this token lifetime policy to — pick
            from the live tenant. Stores each service principal's object id; a
            hand-typed display name or id from an older canvas also resolves
            at deploy time. Only ONE token lifetime policy can be assigned to
            a given service principal at a time — assigning here when a
            different one is already assigned fails at deploy with a Graph
            error naming the conflict; remove the existing assignment first.
            This app only ever un-assigns a service principal it itself
            assigned. Leave empty to manage no assignment through this canvas
            (use Organization Default above for a tenant-wide default instead).
