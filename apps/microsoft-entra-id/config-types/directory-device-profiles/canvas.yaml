id: microsoft-entra-id-directory-device-profiles
name: Device Profiles Configuration
toolType: microsoft-entra-id
entityType: directory-device-profiles
description: Manage Device Profiles through documented Microsoft Graph operations.
item:
  label: Device Profiles
  identityField: name
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: Configuration
      fields:
        - key: name
          label: Configuration name
          fieldType: text
          required: true
        - key: resourceId
          label: Existing resource ID
          fieldType: text
          required: true
          helpText: >-
            Existing object or provisioning job ID. This configuration never creates user or device
            accounts.
        - key: properties
          label: Managed properties (JSON)
          fieldType: textarea
          required: true
          helpText: >-
            Allowed properties: displayName, accountEnabled, extensionAttributes. Only declared
            fields are managed. Example: {"displayName":"Pilot Device","accountEnabled":true}.
            Secret values are not accepted. Removing a canvas item does not delete the remote
            resource.
