# =============================================================================
# Canvas Template — Entra ID Home Realm Discovery Policies
#
# Declares ONE home realm discovery policy — the item. Users add as many as they
# need. A policy's logical identity is its NAME (displayName); deploy lists
# policies, matches on the name (or a stored id, rename-safe), and PATCHes
# (update) or POSTs (create) accordingly. Reconcile only deletes policies this
# app created.
#
# The policy body is a nested JSON "definition" controlling accelerated sign-in
# / federated-domain behavior.
#
# Field keys must match config-types/home-realm-discovery-policies/validate.ts.
# =============================================================================

id: "microsoft-entra-id-home-realm-discovery-policies"
name: "Home Realm Discovery Policy Configuration"
toolType: "microsoft-entra-id"
entityType: "home-realm-discovery-policies"
description: "Define Entra ID home realm discovery policies as code through the Microsoft Graph API. The policy body is a JSON definition."

item:
  label: "Home Realm Discovery Policy"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: "Home Realm Discovery Policy"
      icon: "globe"
      description: "Name and JSON definition"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 256
          helpText: >
            Display name of the policy (max 256 chars). Must be unique within
            this canvas — it is the logical identity deploy matches on.

        - key: "definition"
          label: "Definition (JSON)"
          fieldType: "textarea"
          required: true
          helpText: >
            A JSON object with a "HomeRealmDiscoveryPolicy" root key, e.g.
            {"HomeRealmDiscoveryPolicy":{"AccelerateToFederatedDomain":true,"PreferredDomain":"contoso.com"}}.

        - key: "isOrganizationDefault"
          label: "Organization Default"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: >
            When set, this policy applies as the organization-wide default. Only
            one home realm discovery policy can be the organization default.

    - name: "Applies To"
      icon: "target"
      description: "Service principals this policy is assigned to"
      fields:
        - key: "appliesTo"
          label: "Applies To (service principals)"
          fieldType: "remote-multiselect"
          optionsSource: "servicePrincipals"
          optionsMulti: true
          required: false
          helpText: >
            Service principals to assign this home realm discovery policy to —
            pick from the live tenant. Stores each service principal's object
            id; a hand-typed display name or id from an older canvas also
            resolves at deploy time. This app only ever un-assigns a service
            principal it itself assigned — a pre-existing assignment left off
            this list is never removed. Leave empty to manage no assignment
            through this canvas (use Organization Default above for a
            tenant-wide default instead).
