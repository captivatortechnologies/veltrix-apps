id: microsoft-entra-id-directory-user-profiles
name: User Profiles Configuration
toolType: microsoft-entra-id
entityType: directory-user-profiles
description: Manage User Profiles through documented Microsoft Graph operations.
item:
  label: User Profiles
  identityField: name
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: Configuration
      fields:
        - key: name
          label: Configuration name
          fieldType: text
          required: true
        - key: resourceId
          label: Existing resource ID
          fieldType: text
          required: true
          helpText: >-
            Existing object or provisioning job ID. This configuration never creates user or device
            accounts.
        - key: properties
          label: Managed properties (JSON)
          fieldType: textarea
          required: true
          helpText: >-
            Allowed properties: displayName, givenName, surname, jobTitle, department, companyName,
            officeLocation, businessPhones, mobilePhone, streetAddress, city, state, postalCode,
            country, usageLocation, employeeId, employeeType, employeeHireDate, preferredLanguage,
            accountEnabled, otherMails. Only declared fields are managed. Example:
            {"displayName":"Pilot User","department":"Security"}. Secret values are not accepted.
            Removing a canvas item does not delete the remote resource.
