# =============================================================================
# Canvas Template — Entra ID Group (Directory) Settings
#
# Declares ONE tenant/group directory settings object — the item. Users add one
# per groupSettingTemplate they want to configure. The identity is the TEMPLATE
# ID (one settings object per template); deploy lists /groupSettings, matches on
# templateId and PATCHes (values) or POSTs (create) accordingly. Reconcile only
# deletes settings this app created.
#
# templateId is a live picker sourced from GET /groupSettingTemplates (e.g. the
# Group.Unified template governs guest owners, naming, classifications) — see
# ../lib/entraOptions.ts. The `values` name/value pairs a template accepts are
# NOT independently picker-able: settingTemplateValue is a nested array
# property of the template resource itself (not a separate directory-object
# reference), so it stays authored as JSON — GET the chosen template
# (/groupSettingTemplates/{id}) to see its available value names and defaults.
#
# Field keys must match config-types/group-settings/validate.ts.
# =============================================================================

id: "microsoft-entra-id-group-settings"
name: "Group Settings Configuration"
toolType: "microsoft-entra-id"
entityType: "group-settings"
description: "Define Entra tenant/group directory settings (guest owners, group naming, classifications, creation) as code through the Microsoft Graph API, one object per groupSettingTemplate."

item:
  label: "Group Setting"
  identityField: "templateId"
  repeatable: true
  minItems: 1
  maxItems: 50
  groups:
    - name: "Group Setting"
      icon: "settings"
      description: "Template and name/value pairs"
      fields:
        - key: "templateId"
          label: "Template"
          fieldType: "remote-select"
          optionsSource: "groupSettingTemplates"
          required: true
          helpText: >
            The groupSettingTemplate this settings object is based on — pick from
            the live tenant catalog (e.g. "Group.Unified"). Templates are
            system-defined and cannot be created, updated or deleted, so this list
            is always the tenant's full available set. Stores the template's GUID
            id; a hand-typed id from an older canvas is still accepted as-is.

        - key: "values"
          label: "Values (JSON array)"
          fieldType: "textarea"
          required: false
          helpText: >
            A JSON array of { name, value } pairs matching the template, e.g.
            [{"name":"EnableGroupCreation","value":"false"},{"name":"AllowGuestsToBeGroupOwner","value":"false"}].
            Provide the complete set of values for the template.
