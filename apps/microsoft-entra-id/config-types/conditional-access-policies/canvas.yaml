# =============================================================================
# Canvas Template — Entra ID Conditional Access Policies
#
# Declares ONE Conditional Access policy — the item. Users add as many as they
# need. A policy's logical identity is its NAME (displayName); deploy lists
# policies, matches on the name (or a stored id, rename-safe), and PATCHes
# (update) or POSTs (create) accordingly.
#
# SAFETY: state defaults to "report-only" (Graph
# enabledForReportingButNotEnforced) — a new policy is never enforced until the
# author explicitly sets it to Enabled. When enforcing, exclude a break-glass /
# emergency-access group (validate warns if you don't).
#
# Groups are referenced by DISPLAY NAME and resolved to ids at deploy time, so a
# policy composes naturally with the Security Groups configuration type.
#
# Field keys must match what config-types/conditional-access-policies/validate.ts
# checks.
# =============================================================================

id: "microsoft-entra-id-conditional-access-policies"
name: "Conditional Access Policy Configuration"
toolType: "microsoft-entra-id"
entityType: "conditional-access-policies"
description: "Define Entra ID Conditional Access policies as code through the Microsoft Graph API — user/group and cloud-app targeting with grant controls (MFA, compliant device, block). New policies default to report-only."

item:
  label: "Conditional Access Policy"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: "Policy"
      icon: "shield"
      description: "Policy name and enforcement state"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 256
          helpText: >
            Display name of the policy (max 256 chars). Must be unique within
            this canvas — it is the logical identity deploy matches on.

        - key: "state"
          label: "State"
          fieldType: "select"
          required: true
          defaultValue: "report-only"
          options:
            - label: "Report-only (log, do not enforce)"
              value: "report-only"
            - label: "Enabled (enforce)"
              value: "enabled"
            - label: "Disabled (off)"
              value: "disabled"
          helpText: >
            Report-only logs what the policy WOULD do without enforcing it — the
            safe default. Switch to Enabled only after reviewing report-only
            sign-in impact.

    - name: "Users"
      icon: "users"
      description: "Who the policy applies to"
      fields:
        - key: "includeAllUsers"
          label: "All users"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Target every user. When off, target the included groups/users/roles below instead."

        - key: "includeGroups"
          label: "Included Groups"
          fieldType: "remote-multiselect"
          optionsSource: "groups"
          optionsMulti: true
          required: false
          helpText: >
            Groups to target — pick from the live tenant. Stores the group id;
            a hand-typed display name from an older canvas still resolves the
            same way at deploy time. Combines with Included Users and Included
            Roles below (a user is targeted if they match ANY of the three).
            Ignored when "All users" is on.

        - key: "excludeGroups"
          label: "Excluded Groups (break-glass)"
          fieldType: "remote-multiselect"
          optionsSource: "groups"
          optionsMulti: true
          required: false
          helpText: >
            Groups to exclude — pick from the live tenant. Always applied — use
            this to exclude an emergency-access group so an enforced policy
            can't lock every admin out.

        - key: "includeUsers"
          label: "Included Users"
          fieldType: "remote-multiselect"
          optionsSource: "usersInclude"
          optionsMulti: true
          required: false
          helpText: >
            Individual users to target — pick from the live tenant, or choose
            All users / No users / Guests or external users. Stores the
            user's object id or the literal sentinel; a hand-typed display
            name or UPN also resolves at deploy time. Combines with Included
            Groups and Included Roles. Ignored when "All users" is on.

        - key: "excludeUsers"
          label: "Excluded Users"
          fieldType: "remote-multiselect"
          optionsSource: "usersExclude"
          optionsMulti: true
          required: false
          helpText: >
            Individual users to exclude — pick from the live tenant, or choose
            Guests or external users. Always applied, even when "All users" is
            on.

        - key: "includeRoles"
          label: "Included Roles"
          fieldType: "remote-multiselect"
          optionsSource: "roleDefinitions"
          optionsMulti: true
          required: false
          helpText: >
            Directory roles to target by membership — pick from the live
            tenant. Only BUILT-IN directory roles are supported by
            Conditional Access; administrative-unit-scoped roles and custom
            roles are not, even though they may appear in this list (Graph
            rejects them at deploy — pick a built-in role such as "Global
            Administrator"). Combines with Included Groups and Included
            Users. Ignored when "All users" is on.

        - key: "excludeRoles"
          label: "Excluded Roles"
          fieldType: "remote-multiselect"
          optionsSource: "roleDefinitions"
          optionsMulti: true
          required: false
          helpText: >
            Directory roles to exclude — same built-in-role-only restriction
            as Included Roles. Always applied, even when "All users" is on.

    - name: "Locations"
      icon: "globe"
      description: "Which network locations the policy applies to"
      fields:
        - key: "includeLocations"
          label: "Included Locations"
          fieldType: "remote-multiselect"
          optionsSource: "namedLocationsInclude"
          optionsMulti: true
          required: false
          helpText: >
            Named locations to target — pick from the live tenant's Named
            Locations, or choose All locations / All trusted locations.
            Stores the location id or the literal sentinel; a hand-typed
            display name also resolves at deploy time. Leave both location
            fields empty to apply the policy regardless of location.

        - key: "excludeLocations"
          label: "Excluded Locations"
          fieldType: "remote-multiselect"
          optionsSource: "namedLocations"
          optionsMulti: true
          required: false
          helpText: >
            Named locations to exclude (e.g. a trusted corporate network) —
            pick from the live tenant. Applied whenever either location field
            is set.

    - name: "Cloud apps"
      icon: "grid"
      description: "Which cloud apps the policy applies to"
      fields:
        - key: "includeAllApps"
          label: "All cloud apps"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Target all cloud apps. When off, target the app ids / keywords below."

        - key: "includeApps"
          label: "Included Apps"
          fieldType: "remote-multiselect"
          optionsSource: "applications"
          optionsMulti: true
          required: false
          helpText: >
            Cloud apps to target — pick from the live tenant's app
            registrations, or one of the well-known groupings (All cloud apps,
            Office 365, Microsoft Admin Portals). Stores the app's client id
            (appId) or the keyword; a hand-typed value from an older canvas is
            still passed to Graph as-is. Ignored when "All cloud apps" is on.

    - name: "Grant controls"
      icon: "lock"
      description: "What is required to grant access"
      fields:
        - key: "grantOperator"
          label: "Operator"
          fieldType: "select"
          required: true
          defaultValue: "OR"
          options:
            - label: "OR (require any of the selected controls)"
              value: "OR"
            - label: "AND (require all of the selected controls)"
              value: "AND"
          helpText: "How multiple controls combine. Ignored when Block access is selected."

        - key: "builtInControls"
          label: "Controls"
          fieldType: "multiselect"
          required: true
          defaultValue: ["mfa"]
          options:
            - label: "Require MFA"
              value: "mfa"
            - label: "Require compliant device"
              value: "compliantDevice"
            - label: "Require Hybrid Azure AD joined device"
              value: "domainJoinedDevice"
            - label: "Require approved client app"
              value: "approvedApplication"
            - label: "Require app protection policy"
              value: "compliantApplication"
            - label: "Require password change"
              value: "passwordChange"
            - label: "Block access"
              value: "block"
          helpText: >
            Grant requirements. "Block access" denies sign-in and cannot be
            combined with any other control.

        - key: "authenticationStrength"
          label: "Authentication Strength"
          fieldType: "remote-select"
          optionsSource: "authStrengthPolicies"
          required: false
          helpText: >
            An authentication strength policy to require, in place of or in
            addition to the Controls above — pick from the live tenant's
            built-in and custom strengths (e.g. "Phishing-resistant MFA").
            Stores the policy id; a hand-typed display name from an older
            canvas also resolves at deploy time. Optional — leave unset to
            rely on the Controls above only.

        - key: "termsOfUse"
          label: "Terms of Use"
          fieldType: "remote-multiselect"
          optionsSource: "termsOfUse"
          optionsMulti: true
          required: false
          helpText: >
            Terms-of-use agreements the user must accept to be granted
            access — pick from the live tenant. NOTE: Microsoft Graph does
            not support listing terms-of-use agreements with application
            permissions (it's delegated-only), so this live picker may come
            back empty even when agreements exist. If so, copy the agreement
            id from the Entra admin center (Identity Governance > Terms of
            use) and enter it directly — a hand-typed id or display name
            still resolves the same way at deploy time.
