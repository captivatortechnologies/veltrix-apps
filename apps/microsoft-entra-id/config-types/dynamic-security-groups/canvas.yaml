id: microsoft-entra-id-dynamic-security-groups
name: Dynamic Security Groups Configuration
toolType: microsoft-entra-id
entityType: dynamic-security-groups
description: Manage Dynamic Security Groups through documented Microsoft Graph operations.
item:
  label: Dynamic Security Groups
  identityField: name
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: Configuration
      fields:
        - key: name
          label: Configuration name
          fieldType: text
          required: true
        - key: resourceId
          label: Existing resource ID
          fieldType: text
          required: false
          helpText: >-
            Leave empty to create or match by the declared identity; use an ID to update an existing
            resource.
        - key: properties
          label: Managed properties (JSON)
          fieldType: textarea
          required: true
          helpText: >-
            Allowed properties: displayName, description, mailNickname, mailEnabled,
            securityEnabled, groupTypes, membershipRule, membershipRuleProcessingState, visibility.
            Only declared fields are managed. Example: {"displayName":"Pilot
            dynamic","mailNickname":"pilot-dynamic","mailEnabled":false,"securityEnabled":true,"groupTypes":["DynamicMembership"],"membershipRule":"user.department
            -eq \"Security\"","membershipRuleProcessingState":"On"}. Secret values are not accepted.
            Removing a canvas item does not delete the remote resource.
