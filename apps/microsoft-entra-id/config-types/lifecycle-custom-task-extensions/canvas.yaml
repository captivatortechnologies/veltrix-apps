id: microsoft-entra-id-lifecycle-custom-task-extensions
name: Lifecycle Custom Task Extensions Configuration
toolType: microsoft-entra-id
entityType: lifecycle-custom-task-extensions
description: Manage Lifecycle Custom Task Extensions through documented Microsoft Graph operations.
item:
  label: Lifecycle Custom Task Extensions
  identityField: name
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: Configuration
      fields:
        - key: name
          label: Configuration name
          fieldType: text
          required: true
        - key: resourceId
          label: Existing resource ID
          fieldType: text
          required: false
          helpText: >-
            Leave empty to create or match by the declared identity; use an ID to update an existing
            resource.
        - key: properties
          label: Managed properties (JSON)
          fieldType: textarea
          required: true
          helpText: >-
            Allowed properties: displayName, description, clientConfiguration,
            endpointConfiguration, authenticationConfiguration, callbackConfiguration. Only declared
            fields are managed. Example: {"displayName":"Lifecycle
            extension","endpointConfiguration":{"@odata.type":"#microsoft.graph.logicAppTriggerEndpointConfiguration","subscriptionId":"11111111-1111-1111-1111-111111111111","resourceGroupName":"identity","logicAppWorkflowName":"Onboarding"},"authenticationConfiguration":{"@odata.type":"#microsoft.graph.azureAdTokenAuthentication","resourceId":"https://management.azure.com"}}.
            Secret values are not accepted. Removing a canvas item does not delete the remote
            resource.
