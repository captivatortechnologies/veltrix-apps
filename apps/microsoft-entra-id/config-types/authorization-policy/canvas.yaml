# =============================================================================
# Canvas Template — Entra ID Tenant Authorization Policy (singleton)
#
# The authorization policy is a tenant-wide singleton (id "authorizationPolicy")
# with no create/delete — deploy reads it, PATCHes the managed fields and stores
# the prior values for rollback. Declare it at most once per canvas.
#
# permissionGrantPoliciesAssigned is a genuine reference field: each entry is
# `managePermissionGrantsForSelf.{permissionGrantPolicy id}` (see
# https://learn.microsoft.com/graph/api/resources/defaultuserrolepermissions).
# It has its OWN live picker (below) separate from the free-JSON
# defaultUserRolePermissions field — when the picker field has any selection it
# TAKES PRECEDENCE over a same-named key hand-authored inside the JSON blob
# (see deploy.ts). Leaving the picker empty does NOT clear a live value (the
# JSON field remains the way to explicitly set it to `[]`, since an empty list
# is itself meaningful — it disables user consent to apps entirely).
#
# Field keys must match config-types/authorization-policy/validate.ts.
# =============================================================================

id: "microsoft-entra-id-authorization-policy"
name: "Tenant Authorization Policy Configuration"
toolType: "microsoft-entra-id"
entityType: "authorization-policy"
description: "Manage the Entra tenant authorization policy (default user/guest/consent controls) as code through the Microsoft Graph API. This is a tenant-wide singleton."

item:
  label: "Authorization Policy"
  repeatable: false
  minItems: 1
  maxItems: 1
  groups:
    - name: "Guest & Invitations"
      icon: "users"
      description: "Who can invite guests and the access level guests receive"
      fields:
        - key: "allowInvitesFrom"
          label: "Who can invite guests"
          fieldType: "select"
          required: false
          defaultValue: ""
          options:
            - label: "Do not manage"
              value: ""
            - label: "No one"
              value: "none"
            - label: "Admins and guest inviters only"
              value: "adminsAndGuestInviters"
            - label: "Admins, guest inviters and all members"
              value: "adminsGuestInvitersAndAllMembers"
            - label: "Everyone (including guests)"
              value: "everyone"
          helpText: "Controls allowInvitesFrom. Leave on \"Do not manage\" to keep the tenant's current value."

        - key: "guestUserRoleId"
          label: "Guest access level"
          fieldType: "select"
          required: false
          defaultValue: ""
          options:
            - label: "Do not manage"
              value: ""
            - label: "User (same as members)"
              value: "a0b1b346-4d3e-4e8b-98f8-753987be4970"
            - label: "Guest User (default, limited)"
              value: "10dae51f-b6af-4016-8d66-8c2a99b929b3"
            - label: "Restricted Guest User (most restricted)"
              value: "2af84b1e-32c8-42b7-82bc-daa82404023b"
          helpText: "Controls guestUserRoleId. Leave on \"Do not manage\" to keep the current value."

        - key: "allowEmailVerifiedUsersToJoinOrganization"
          label: "Allow email-verified users to join the tenant"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "When off, users cannot self-join the tenant by email validation."

    - name: "User Permissions & Consent"
      icon: "shield"
      description: "Default user role capabilities and app consent behavior"
      fields:
        - key: "allowedToUseSSPR"
          label: "Admins can use self-service password reset"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "Controls allowedToUseSSPR."

        - key: "allowUserConsentForRiskyApps"
          label: "Allow user consent for risky apps"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "Recommended off. Controls allowUserConsentForRiskyApps."

        - key: "blockMsolPowerShell"
          label: "Block MSOL PowerShell access"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "When on, disables the legacy MSOL PowerShell service endpoint."

        - key: "allowedToSignUpEmailBasedSubscriptions"
          label: "Allow email-based subscription sign-up"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "Controls allowedToSignUpEmailBasedSubscriptions."

        - key: "permissionGrantPoliciesAssigned"
          label: "App Consent Policies (permission grant policies)"
          fieldType: "remote-multiselect"
          optionsSource: "permissionGrantPolicies"
          optionsMulti: true
          required: false
          helpText: >
            Which permission grant (app consent) policies govern user consent
            to apps — pick from the live tenant (includes built-ins like
            "microsoft-user-default-legacy" and this app's own
            permission-grant-policies type's custom policies). Stores each
            policy's id, formatted as Graph's required
            "managePermissionGrantsForSelf.{id}" string. A hand-typed id or
            display name from an older canvas also resolves at deploy time.
            TAKES PRECEDENCE over a permissionGrantPoliciesAssigned key
            hand-authored in the JSON field below when non-empty. Leave empty
            to not manage this through the picker (the JSON field below can
            still explicitly set it, including to an empty list to disable
            user consent to apps entirely).

        - key: "defaultUserRolePermissions"
          label: "Default user role permissions (JSON)"
          fieldType: "textarea"
          required: false
          helpText: >
            Optional JSON object for defaultUserRolePermissions, e.g.
            {"allowedToCreateApps":false,"allowedToCreateSecurityGroups":false,
            "allowedToReadOtherUsers":true,"permissionGrantPoliciesAssigned":[]}.
            Leave blank to leave these untouched. Prefer the picker field above
            for permissionGrantPoliciesAssigned — it takes precedence when set.
