id: microsoft-entra-id-application-api-settings
name: Application API and Token Settings Configuration
toolType: microsoft-entra-id
entityType: application-api-settings
description: Manage Application API and Token Settings through documented Microsoft Graph operations.
item:
  label: Application API and Token Settings
  identityField: name
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: Configuration
      fields:
        - key: name
          label: Configuration name
          fieldType: text
          required: true
        - key: resourceId
          label: Existing resource ID
          fieldType: text
          required: true
          helpText: >-
            Existing object or provisioning job ID. This configuration never creates user or device
            accounts.
        - key: properties
          label: Managed properties (JSON)
          fieldType: textarea
          required: true
          helpText: >-
            Allowed properties: api, optionalClaims, web, spa, publicClient, info,
            isFallbackPublicClient, serviceManagementReference. Only declared fields are managed.
            Example:
            {"optionalClaims":{"idToken":[{"name":"email","essential":false}]},"api":{"requestedAccessTokenVersion":2}}.
            Secret values are not accepted. Removing a canvas item does not delete the remote
            resource.
