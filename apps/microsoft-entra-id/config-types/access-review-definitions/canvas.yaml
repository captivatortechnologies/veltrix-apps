# =============================================================================
# Canvas Template — Entra ID Access Review Schedule Definitions
#
# Declares ONE access review definition — the item. Users add as many as they
# need. The logical identity is its NAME (displayName); deploy lists definitions,
# matches on the name (or a stored id, rename-safe), and PATCHes (update) or
# POSTs (create) accordingly. Reconcile only deletes definitions this app created.
#
# SCOPE (accessReviewScheduleDefinition.scope, an accessReviewScope —
# https://learn.microsoft.com/graph/accessreviews-scope-concept) is decomposed
# into a "Scope Type" selector + one live picker per type, each building the
# exact accessReviewQueryScope query string Microsoft's own worked examples
# use (cited per field below). "Custom (JSON)" keeps full flexibility for
# every other documented shape (principalResourceMembershipsScope with
# hand-picked principal/resource pools, accessReviewInactiveUsersQueryScope,
# the "all Microsoft 365 groups" instanceEnumerationScope pattern, etc).
#
# REVIEWERS / FALLBACK REVIEWERS (accessReviewReviewerScope collections —
# https://learn.microsoft.com/graph/accessreviews-reviewers-concept) are
# decomposed into "specific users" / "group owners" / "people managers"
# pickers whose entries are APPENDED to whatever the matching "Custom (JSON)"
# field adds — not either/or. Leaving every reviewer field (typed and JSON)
# empty is a valid, documented self-review (reviewers: []).
#
# Field keys must match config-types/access-review-definitions/validate.ts.
# =============================================================================

id: "microsoft-entra-id-access-review-definitions"
name: "Access Review Definition Configuration"
toolType: "microsoft-entra-id"
entityType: "access-review-definitions"
description: "Define Entra access review schedule definitions (recurring reviews of group/role/access-package/application membership) as code through the Microsoft Graph API."

item:
  label: "Access Review Definition"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: "Access Review Definition"
      icon: "check-square"
      description: "Name and admin description"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 256
          helpText: >
            Display name of the review (max 256 chars). Must be unique within
            this canvas — it is the logical identity deploy matches on.

        - key: "descriptionForAdmins"
          label: "Description for admins"
          fieldType: "text"
          required: false
          helpText: "Optional description shown to administrators."

    - name: "Review Scope"
      icon: "crosshair"
      description: "What is being reviewed (accessReviewScheduleDefinition.scope)"
      fields:
        - key: "scopeType"
          label: "Scope Type"
          fieldType: "select"
          required: true
          defaultValue: "groupMembership"
          options:
            - label: "Group membership"
              value: "groupMembership"
            - label: "Directory (admin) role assignment"
              value: "directoryRole"
            - label: "Access package assignments"
              value: "accessPackageAssignments"
            - label: "Application access (service principal)"
              value: "applicationAccess"
            - label: "Custom (JSON)"
              value: "custom"
          helpText: "Which documented accessReviewScope shape to build (https://learn.microsoft.com/graph/accessreviews-scope-concept)."

        - key: "scopeGroupId"
          label: "Group"
          fieldType: "remote-select"
          optionsSource: "groups"
          required: false
          visibleWhen:
            field: "scopeType"
            equals: "groupMembership"
          helpText: >
            Reviews direct and transitive members of this group — builds
            {"@odata.type":"#microsoft.graph.accessReviewQueryScope","query":"/groups/{id}/transitiveMembers","queryType":"MicrosoftGraph"}
            (Microsoft's own "Example 1" —
            https://learn.microsoft.com/graph/accessreviews-scope-concept).
            Stores the group's id; a hand-typed display name also resolves at
            deploy time.

        - key: "scopeRoleDefinitionId"
          label: "Directory Role"
          fieldType: "remote-select"
          optionsSource: "roleDefinitions"
          required: false
          visibleWhen:
            field: "scopeType"
            equals: "directoryRole"
          helpText: >
            Reviews users with an ACTIVE assignment to this directory role —
            builds
            {"@odata.type":"#microsoft.graph.accessReviewQueryScope","query":"/roleManagement/directory/roleAssignmentScheduleInstances?$expand=principal&$filter=(assignmentType eq 'Assigned' and isof(principal,'microsoft.graph.user') and roleDefinitionId eq '{id}')","queryType":"MicrosoftGraph"}
            (Microsoft's own "Example 12.2" —
            https://learn.microsoft.com/graph/accessreviews-scope-concept).
            Stores the role's id; a hand-typed display name also resolves at
            deploy time.

        - key: "scopeAccessPackageId"
          label: "Access Package"
          fieldType: "remote-select"
          optionsSource: "accessPackages"
          required: false
          visibleWhen:
            field: "scopeType"
            equals: "accessPackageAssignments"
          helpText: >
            Reviews every assignment of this access package — builds
            {"@odata.type":"#microsoft.graph.accessReviewQueryScope","query":"/identityGovernance/entitlementManagement/accessPackageAssignments?$filter=(accessPackageId eq '{id}')","queryType":"MicrosoftGraph"}
            (a single-clause subset of Microsoft's own "Example 10", which
            additionally ANDs assignmentPolicyId/catalogId —
            https://learn.microsoft.com/graph/accessreviews-scope-concept — use
            Custom (JSON) if you need those extra filter clauses). Stores the
            package's id; a hand-typed display name also resolves at deploy time.

        - key: "scopeServicePrincipalId"
          label: "Application (service principal)"
          fieldType: "remote-select"
          optionsSource: "servicePrincipals"
          required: false
          visibleWhen:
            field: "scopeType"
            equals: "applicationAccess"
          helpText: >
            Reviews every user with direct or transitive access to this
            application — builds the exact principalResourceMembershipsScope of
            Microsoft's own "Example 15" (all users + group members as
            principalScopes, this service principal as the sole resourceScope
            — https://learn.microsoft.com/graph/accessreviews-scope-concept).
            Stores the service principal's OBJECT id (not the application's
            appId — resourceScopes targets `/servicePrincipals/{id}`, the same
            object-id space entraOptions' "servicePrincipals" source uses); a
            hand-typed display name also resolves at deploy time.

        - key: "scopeCustomJson"
          label: "Custom Scope (JSON)"
          fieldType: "textarea"
          required: false
          visibleWhen:
            field: "scopeType"
            equals: "custom"
          helpText: >
            A full accessReviewScope JSON object — any documented shape:
            accessReviewQueryScope, accessReviewInactiveUsersQueryScope, or a
            hand-authored principalResourceMembershipsScope with your own
            principalScopes/resourceScopes
            (https://learn.microsoft.com/graph/accessreviews-scope-concept).
            Required (and used) only when Scope Type is "Custom (JSON)".

        - key: "instanceEnumerationScopeJson"
          label: "Custom Instance Enumeration Scope (JSON)"
          fieldType: "textarea"
          required: false
          visibleWhen:
            field: "scopeType"
            equals: "custom"
          helpText: >
            Optional accessReviewScope JSON object for
            accessReviewScheduleDefinition.instanceEnumerationScope — only
            used for the "review every Microsoft 365 group" pattern, e.g.
            {"query":"/groups?$filter=(groupTypes/any(c:c eq 'Unified'))","queryType":"MicrosoftGraph"}
            (Microsoft's "Example 5" —
            https://learn.microsoft.com/graph/accessreviews-scope-concept).
            Leave empty unless Custom Scope (JSON) above uses a relative query
            like "./members/microsoft.graph.user".

    - name: "Reviewers"
      icon: "users"
      description: "Who reviews (accessReviewScheduleDefinition.reviewers) — leave every field below empty for a self-review"
      fields:
        - key: "reviewerUsers"
          label: "Specific reviewer users"
          fieldType: "remote-multiselect"
          optionsSource: "users"
          optionsMulti: true
          required: false
          helpText: >
            Builds {"query":"/users/{id}","queryType":"MicrosoftGraph"} per
            user (Microsoft's "Example 2" —
            https://learn.microsoft.com/graph/accessreviews-reviewers-concept).

        - key: "reviewerGroupOwners"
          label: "Reviewer group owners"
          fieldType: "remote-multiselect"
          optionsSource: "groups"
          optionsMulti: true
          required: false
          helpText: >
            Builds {"query":"/groups/{id}/owners","queryType":"MicrosoftGraph"}
            per group (Microsoft's "Example 4" — typically the SAME group
            being reviewed, though Graph does not enforce that —
            https://learn.microsoft.com/graph/accessreviews-reviewers-concept).

        - key: "reviewerManagersSelfReview"
          label: "Reviewers are each user's manager"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: >
            Adds {"query":"./manager","queryType":"MicrosoftGraph","queryRoot":"decisions"}
            (Microsoft's "Example 5" — each reviewed user's own manager reviews
            their access — https://learn.microsoft.com/graph/accessreviews-reviewers-concept).

        - key: "reviewersCustomJson"
          label: "Additional Reviewers (JSON array)"
          fieldType: "textarea"
          required: false
          helpText: >
            Optional JSON array of additional accessReviewReviewerScope
            entries, APPENDED after the typed fields above — e.g. application
            owners: [{"query":"/servicePrincipals/{id}/owners","queryType":"MicrosoftGraph"}]
            (Microsoft's "Example 6" —
            https://learn.microsoft.com/graph/accessreviews-reviewers-concept).

        - key: "fallbackReviewerUsers"
          label: "Specific fallback reviewer users"
          fieldType: "remote-multiselect"
          optionsSource: "users"
          optionsMulti: true
          required: false
          helpText: >
            fallbackReviewers, notified when no reviewer above can be resolved
            (e.g. a group with no owner, or a user with no manager) — builds
            {"query":"/users/{id}","queryType":"MicrosoftGraph"} per user.

        - key: "fallbackReviewerGroupOwners"
          label: "Fallback reviewer group owners"
          fieldType: "remote-multiselect"
          optionsSource: "groups"
          optionsMulti: true
          required: false
          helpText: >
            fallbackReviewers — builds
            {"query":"/groups/{id}/owners","queryType":"MicrosoftGraph"} per group.

        - key: "fallbackReviewersCustomJson"
          label: "Additional Fallback Reviewers (JSON array)"
          fieldType: "textarea"
          required: false
          helpText: "Optional JSON array of additional accessReviewReviewerScope entries, appended after the typed fallback fields above."

    - name: "Settings"
      icon: "settings"
      description: "Recurrence and decision settings (accessReviewScheduleSettings — scalar only, no directory references)"
      fields:
        - key: "settings"
          label: "Settings (JSON)"
          fieldType: "textarea"
          required: true
          helpText: >
            An accessReviewScheduleSettings JSON object, e.g.
            {"recurrence":{"pattern":{"type":"monthly","interval":1}},"defaultDecision":"None","instanceDurationInDays":7,"autoApplyDecisionsEnabled":false}.
