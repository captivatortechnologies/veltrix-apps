id: microsoft-entra-id-entitlement-resource-role-scopes
name: Access Package Resource Roles Configuration
toolType: microsoft-entra-id
entityType: entitlement-resource-role-scopes
description: Manage Access Package Resource Roles through documented Microsoft Graph operations.
item:
  label: Access Package Resource Roles
  identityField: name
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: Configuration
      fields:
        - key: name
          label: Configuration name
          fieldType: text
          required: true
        - key: parentId
          label: Parent object ID
          fieldType: text
          required: true
          helpText: >-
            Application, enterprise application, or partner tenant object ID as described for this
            configuration.
        - key: resourceId
          label: Existing resource ID
          fieldType: text
          required: false
          helpText: >-
            Leave empty to create or match by the declared identity; use an ID to update an existing
            resource.
        - key: properties
          label: Managed properties (JSON)
          fieldType: textarea
          required: true
          helpText: >-
            Allowed properties: role, scope. Only declared fields are managed. Example:
            {"role":{"id":"11111111-1111-1111-1111-111111111111"},"scope":{"id":"22222222-2222-2222-2222-222222222222"}}.
            Secret values are not accepted. Removing a canvas item does not delete the remote
            resource.
