# =============================================================================
# Canvas Template — Entra ID Token Issuance (SAML) Policies
#
# Declares ONE token issuance policy — the item. Users add as many as they need.
# A policy's logical identity is its NAME (displayName); deploy lists policies,
# matches on the name (or a stored id, rename-safe), and PATCHes (update) or
# POSTs (create) accordingly. Reconcile only deletes policies this app created.
#
# The policy body is a nested JSON "definition" controlling SAML token issuance
# (signing algorithm, token version, response signing).
#
# Field keys must match config-types/token-issuance-policies/validate.ts.
# =============================================================================

id: "microsoft-entra-id-token-issuance-policies"
name: "Token Issuance Policy Configuration"
toolType: "microsoft-entra-id"
entityType: "token-issuance-policies"
description: "Define Entra ID SAML token issuance policies as code through the Microsoft Graph API. The policy body is a JSON definition."

item:
  label: "Token Issuance Policy"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: "Token Issuance Policy"
      icon: "key"
      description: "Name and JSON definition"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 256
          helpText: >
            Display name of the policy (max 256 chars). Must be unique within
            this canvas — it is the logical identity deploy matches on.

        - key: "definition"
          label: "Definition (JSON)"
          fieldType: "textarea"
          required: true
          helpText: >
            A JSON object with a "TokenIssuancePolicy" root key, e.g.
            {"TokenIssuancePolicy":{"Version":1,"SigningAlgorithm":"http://www.w3.org/2001/04/xmldsig-more#rsa-sha256","TokenResponseSigningPolicy":"TokenOnly","SamlTokenVersion":"1.1"}}.

    - name: "Applies To"
      icon: "target"
      description: "Applications this policy is assigned to"
      fields:
        - key: "appliesTo"
          label: "Applies To (applications)"
          fieldType: "remote-multiselect"
          optionsSource: "applicationObjects"
          optionsMulti: true
          required: false
          helpText: >
            Applications to assign this SAML token issuance policy to — pick
            from the live tenant's app registrations. Stores each
            application's object id; a hand-typed display name or id from an
            older canvas also resolves at deploy time. Token issuance policies
            apply to APPLICATIONS, not service principals — verified directly
            against Microsoft Graph (POST /applications/{id}/tokenIssuancePolicies/$ref
            exists and works; the service-principal equivalent does not).
            This app only ever un-assigns an application it itself assigned —
            a pre-existing assignment left off this list is never removed.
            Leave empty to manage no assignment through this canvas.
