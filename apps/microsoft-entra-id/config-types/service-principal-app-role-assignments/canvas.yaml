id: microsoft-entra-id-service-principal-app-role-assignments
name: Enterprise Application Role Assignments Configuration
toolType: microsoft-entra-id
entityType: service-principal-app-role-assignments
description: Manage Enterprise Application Role Assignments through documented Microsoft Graph operations.
item:
  label: Enterprise Application Role Assignments
  identityField: name
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: Configuration
      fields:
        - key: name
          label: Configuration name
          fieldType: text
          required: true
        - key: parentId
          label: Parent object ID
          fieldType: text
          required: true
          helpText: >-
            Application, enterprise application, or partner tenant object ID as described for this
            configuration.
        - key: resourceId
          label: Existing resource ID
          fieldType: text
          required: false
          helpText: >-
            Leave empty to create or match by the declared identity; use an ID to update an existing
            resource.
        - key: properties
          label: Managed properties (JSON)
          fieldType: textarea
          required: true
          helpText: >-
            Allowed properties: principalId, resourceId, appRoleId. Only declared fields are
            managed. Example:
            {"principalId":"11111111-1111-1111-1111-111111111111","resourceId":"22222222-2222-2222-2222-222222222222","appRoleId":"33333333-3333-3333-3333-333333333333"}.
            Secret values are not accepted. Removing a canvas item does not delete the remote
            resource.
