settings:
  - key: tenant_id
    type: string
    label: Tenant ID
    description: >
      Entra directory (tenant) ID — a GUID or verified domain. Used with the
      app-registration credential to authenticate to Microsoft Graph.
    required: true
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Microsoft Graph API calls.
    default: 30
    required: false

  - key: readiness_features
    type: string
    label: Configuration types to test
    description: Comma-separated configuration type IDs. Test checks selected read endpoints only; write access and licensing remain unverified.
    default: ""
    required: false
  - key: azure_cloud
    type: string
    label: Microsoft cloud
    description: "One of global, us-gov, us-gov-dod, china. Selects an allowlisted authority, Graph host and token scope."
    default: global
    required: false
  - key: connection_tenants
    type: string
    label: Per-connection tenant overrides
    description: 'JSON object keyed by credential ID, e.g. {"credential-id":{"tenantId":"directory-guid","cloud":"global"}}. Unmapped connections retain the Tenant ID setting.'
    default: "{}"
    required: false

  - key: readiness_targets
    type: string
    label: Scoped readiness targets
    description: 'JSON object keyed by configuration type ID with parentId and/or resourceId for scoped feature probes.'
    default: "{}"
    required: false
