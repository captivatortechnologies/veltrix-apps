id: microsoft-entra-id
name: Microsoft Entra ID
version: "0.8.3"
vendor: Veltrix
description: >
  Manage Microsoft Entra ID (formerly Azure AD) configuration as code through the
  Microsoft Graph API. Covers Conditional Access, named locations, security groups,
  administrative units, custom roles and authentication strengths/contexts; the
  tenant authorization, security-defaults, authentication-methods, authentication-flows,
  admin-consent-request, permission-grant, cross-tenant access, app-management,
  token-issuance / lifetime / claims-mapping, home-realm-discovery, activity-timeout
  and feature-rollout policies; group directory settings, custom security attributes,
  external identity providers, delegated permission grants, user-flow attributes and
  self-service sign-up flows; and identity governance (entitlement catalogs, access
  packages, assignment policies, connected organizations, access reviews, lifecycle
  workflows and PIM role activation policies); plus company branding — with
  validation, drift detection and rollback handled by the Security-as-Code pipeline.
category: IAM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/microsoft-entra-id
icon: "🔷"

platform:
  minVersion: "1.0.0"

# Microsoft brand: Entra blue primary, cyan accent.
branding:
  primaryColor: "#0078D4"
  accentColor: "#50E6FF"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: named-locations
      actions: [read, write, delete]
      description: Manage Entra Conditional Access named locations (IP CIDR ranges and country/region locations)
    - resource: groups
      actions: [read, write, delete]
      description: Manage Entra assigned security groups (name, description, mail nickname; mail/M365/dynamic groups protected)
    - resource: conditional-access-policies
      actions: [read, write, delete]
      description: Manage Entra Conditional Access policies (user/group + cloud-app targeting, grant controls; report-only by default)
    - resource: administrative-units
      actions: [read, write, delete]
      description: Manage Entra administrative units (name, description, visibility, members; scoped role assignments not managed)
    - resource: authentication-strength-policies
      actions: [read, write, delete]
      description: Manage custom Entra Conditional Access authentication strengths (allowed method combinations; built-in strengths protected)
    - resource: token-lifetime-policies
      actions: [read, write, delete]
      description: Manage Entra token lifetime policies (access / ID token lifetimes via JSON definition)
    - resource: claims-mapping-policies
      actions: [read, write, delete]
      description: Manage Entra claims mapping policies (token claims customization via JSON definition)
    - resource: directory-role-definitions
      actions: [read, write, delete]
      description: Manage Entra custom directory roles (allowed resource actions; built-in roles protected)
    - resource: authentication-context-class-references
      actions: [read, write, delete]
      description: Manage Entra Conditional Access authentication contexts (c1..c25) referenced by policies and the acrs claim
    - resource: authorization-policy
      actions: [read, write, delete]
      description: Manage the Entra tenant authorization policy (default user/guest/consent controls; tenant-wide singleton)
    - resource: identity-security-defaults
      actions: [read, write, delete]
      description: Manage the Entra security defaults enforcement policy (isEnabled; tenant-wide singleton, mutually exclusive with Conditional Access)
    - resource: token-issuance-policies
      actions: [read, write, delete]
      description: Manage Entra SAML token issuance policies (signing algorithm / token version via JSON definition)
    - resource: home-realm-discovery-policies
      actions: [read, write, delete]
      description: Manage Entra home realm discovery policies (accelerated / federated sign-in via JSON definition)
    - resource: activity-based-timeout-policies
      actions: [read, write, delete]
      description: Manage Entra activity-based (idle) timeout policies (idle web-session sign-out via JSON definition)
    - resource: admin-consent-request-policy
      actions: [read, write, delete]
      description: Manage the Entra admin consent request workflow policy (enablement, reviewers, reminders; tenant-wide singleton)
    - resource: app-management-policies
      actions: [read, write, delete]
      description: Manage Entra application management (credential restriction) policies (password / key hygiene via JSON restrictions)
    - resource: authentication-methods-policy
      actions: [read, write, delete]
      description: Manage the enablement (state) of Entra authentication methods (FIDO2, Authenticator, SMS, TAP, email, certificate, OATH, voice)
    - resource: cross-tenant-access-partners
      actions: [read, write, delete]
      description: Manage Entra cross-tenant access (B2B) partner configurations (b2b collaboration / direct connect / trust via JSON settings)
    - resource: permission-grant-policies
      actions: [read, write, delete]
      description: Manage Entra app consent (permission grant) policies and their include / exclude condition sets (microsoft-* built-ins protected)
    - resource: feature-rollout-policies
      actions: [read, write, delete]
      description: Manage Entra staged feature rollout policies (cloud MFA, seamless SSO, certificate-based auth; group targeting not managed)
    - resource: group-settings
      actions: [read, write, delete]
      description: Manage Entra tenant/group directory settings (guest owners, group naming, classifications) via groupSettingTemplate values
    - resource: custom-security-attribute-sets
      actions: [read, write, delete]
      description: Manage Entra custom security attribute sets (containers for attribute definitions; sets cannot be deleted)
    - resource: custom-security-attribute-definitions
      actions: [read, write, delete]
      description: Manage Entra custom security attribute definitions (typed attributes within a set; deactivated via status, never deleted)
    - resource: entitlement-access-package-catalogs
      actions: [read, write, delete]
      description: Manage Entra entitlement management access package catalogs (built-in General catalog protected)
    - resource: authentication-flows-policy
      actions: [read, write, delete]
      description: Manage the Entra authentication flows policy (self-service sign-up toggle; tenant-wide singleton)
    - resource: external-identity-providers
      actions: [read, write, delete]
      description: Manage Entra external (social) identity providers for B2B guest sign-in (client secret write-only)
    - resource: oauth2-permission-grants
      actions: [read, write, delete]
      description: Manage Entra delegated permission grants (admin-consented OAuth2 scopes; keyed by client + resource + consent)
    - resource: user-flow-attributes
      actions: [read, write, delete]
      description: Manage Entra custom user flow attributes (self-service sign-up profile fields; custom only)
    - resource: b2x-user-flows
      actions: [read, write, delete]
      description: Manage Entra self-service sign-up user flows (b2xIdentityUserFlow; create/delete only)
    - resource: entitlement-connected-organizations
      actions: [read, write, delete]
      description: Manage Entra entitlement management connected organizations (external partner directories/domains)
    - resource: entitlement-access-packages
      actions: [read, write, delete]
      description: Manage Entra entitlement management access packages (bundles of access within a catalog)
    - resource: entitlement-assignment-policies
      actions: [read, write, delete]
      description: Manage Entra access package assignment policies (targeting, approval and expiration)
    - resource: access-review-definitions
      actions: [read, write, delete]
      description: Manage Entra access review schedule definitions (recurring reviews of group/role/access-package membership)
    - resource: lifecycle-workflows
      actions: [read, write, delete]
      description: Manage Entra lifecycle workflows (joiner / mover / leaver automation; requires Entra ID Governance)
    - resource: organizational-branding
      actions: [read, write, delete]
      description: Manage the Entra company branding default sign-in page text, colors and footer links (scalar-bounded; images/CSS not managed)
    - resource: pim-role-management-policies
      actions: [read, write, delete]
      description: Manage Entra PIM role activation requirements (MFA / justification / ticketing / approval / max duration) for Directory-scope roles

    - resource: directory-role-assignments
      actions: [read, write, delete]
      description: Manage Entra directory role assignments (active/permanent privileged role holders)
    - resource: pim-role-eligibility
      actions: [read, write, delete]
      description: Manage Entra PIM eligible role assignments (roleEligibilityScheduleRequests)
    - resource: applications
      actions: [read, write, delete]
      description: Manage Entra application registrations (redirect URIs, app roles, API permissions)
    - resource: service-principals
      actions: [read, write, delete]
      description: Manage Entra service principals / enterprise apps (enablement, SSO mode, assignment-required, tags)
    - resource: terms-of-use-agreements
      actions: [read, write, delete]
      description: Manage Entra terms of use agreements
    - resource: cross-tenant-access-default
      actions: [read, write]
      description: Manage the Entra cross-tenant access DEFAULT policy (tenant-wide B2B defaults)

pipeline:
  configurationTypes:
    - id: conditional-access-policies
      group: "Conditional Access"
      name: Conditional Access Policies
      description: Conditional Access policies — user/group + cloud-app targeting and grant controls (report-only by default)
      canvasTemplate: config-types/conditional-access-policies/canvas.yaml
      defaultConfig: config-types/conditional-access-policies/defaults.yaml
      handlers:
        validate: config-types/conditional-access-policies/validate
        deploy: config-types/conditional-access-policies/deploy
        rollback: config-types/conditional-access-policies/rollback
        healthCheck: config-types/conditional-access-policies/healthCheck
        driftDetect: config-types/conditional-access-policies/driftDetect
        getStatus: config-types/conditional-access-policies/getStatus
        options: config-types/conditional-access-policies/options
      targets:
        componentTypes: [entra-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: named-locations
      group: "Conditional Access"
      name: Named Locations
      description: Conditional Access named locations — IP (trusted CIDR ranges) and country/region
