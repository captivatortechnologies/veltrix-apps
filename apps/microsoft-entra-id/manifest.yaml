server:
  entry: server/index
  routes:
    prefix: /api/apps/microsoft-entra-id

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /operations
      component: OperationsPage
      label: Operations
      icon: play
      nav: sidebar
    - path: /reports
      component: ReportsPage
      label: Reports
      icon: list
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the app-registration credential by
# running the OAuth2 client-credentials exchange and calling GET /organization.
connectivity:
  testHandler: handlers/testConnection

operations:
  - id: create-domain
    name: Add Domain
    description: Adds an unverified domain; publish DNS proof before verification.
    handler: operations/create-domain
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: domain-federation-configurations
      action: write
  - id: verify-domain
    name: Verify Domain
    description: Verifies ownership using DNS proof already published by the operator.
    handler: operations/verify-domain
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: domain-federation-configurations
      action: write
  - id: delete-unverified-domain
    name: Remove Unverified Domain
    description: Removes only a noninitial, nondefault, unverified domain.
    handler: operations/delete-unverified-domain
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: domain-federation-configurations
      action: delete
  - id: invite-guest
    name: Invite Guest User
    description: Creates a guest invitation. Sending the invitation email is optional and defaults to false.
    handler: operations/invite-guest
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: directory-user-profiles
      action: write
  - id: set-user-manager
    name: Assign User Manager
    description: Assigns a manager by object ID.
    handler: operations/set-user-manager
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: directory-user-profiles
      action: write
  - id: clear-user-manager
    name: Remove User Manager
    description: Removes the manager relationship without deleting either user.
    handler: operations/clear-user-manager
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: directory-user-profiles
      action: delete
  - id: revoke-user-sessions
    name: Revoke User Sessions
    description: Invalidates refresh tokens and sessions; external-user sessions belong to the home tenant.
    handler: operations/revoke-user-sessions
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: directory-user-profiles
      action: write
  - id: delete-cloud-user
    name: Delete Cloud User
    description: Soft-deletes a cloud-managed user. Synchronized users must be managed at their source.
    handler: operations/delete-cloud-user
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: directory-user-profiles
      action: delete
  - id: delete-device
    name: Delete Device Registration
    description: Deletes the directory device registration; this action does not wipe an endpoint.
    handler: operations/delete-device
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: directory-device-profiles
      action: delete
  - id: restore-directory-object
    name: Restore Deleted Directory Object
    description: Requests restoration of a supported soft-deleted directory object.
    handler: operations/restore-directory-object
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: directory-reports
      action: write
  - id: permanently-delete-directory-object
    name: Permanently Delete Directory Object
    description: Permanently deletes an already soft-deleted object. This cannot be rolled back.
    handler: operations/permanently-delete-directory-object
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: directory-reports
      action: delete
  - id: revoke-app-role-assignment
    name: Revoke Application Role Assignment
    description: Removes a specific application permission or user/group app-role assignment.
    handler: operations/revoke-app-role-assignment
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: service-principal-app-role-assignments
      action: delete
  - id: delete-federated-credential
    name: Remove Federated Application Credential
    description: Removes the selected workload identity trust.
    handler: operations/delete-federated-credential
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: application-federated-credentials
      action: delete
  - id: create-provisioning-job
    name: Create Provisioning Job
    description: Creates a provisioning job from a documented synchronization template.
    handler: operations/create-provisioning-job
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: provisioning-job-schemas
      action: write
  - id: start-provisioning-job
    name: Start Provisioning Job
    description: start the selected provisioning job.
    handler: operations/start-provisioning-job
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: provisioning-job-schemas
      action: write
  - id: pause-provisioning-job
    name: Pause Provisioning Job
    description: pause the selected provisioning job.
    handler: operations/pause-provisioning-job
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: provisioning-job-schemas
      action: write
  - id: restart-provisioning-job
    name: Restart Provisioning Job
    description: Restarts provisioning with a full reset; inspect mappings before submitting.
    handler: operations/restart-provisioning-job
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: provisioning-job-schemas
      action: write
  - id: provision-on-demand
    name: Provision Subjects On Demand
    description: Runs provisioning for the specified rule and subject objects.
    handler: operations/provision-on-demand
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: provisioning-job-schemas
      action: write
  - id: execute-lifecycle-workflow
    name: Execute Lifecycle Workflow
    description: Requests on-demand workflow execution for explicit user IDs.
    handler: operations/execute-lifecycle-workflow
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: lifecycle-workflows
      action: write
  - id: review-apply-decisions
    name: Apply Access Review Decisions
    description: Applies reviewed access decisions to the reviewed resources.
    handler: operations/review-apply-decisions
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: access-review-definitions
      action: write
  - id: review-stop
    name: Stop Access Review
    description: stop for the selected review instance.
    handler: operations/review-stop
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: access-review-definitions
      action: write
  - id: review-reset-decisions
    name: Reset Access Review Decisions
    description: resetDecisions for the selected review instance.
    handler: operations/review-reset-decisions
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: access-review-definitions
      action: write
  - id: risky-users-dismiss
    name: Dismiss User Risk
    description: Changes risk state for explicit users; investigate the detections before submitting.
    handler: operations/risky-users-dismiss
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: identity-risk-reports
      action: write
  - id: risky-users-confirm-compromised
    name: Confirm Users Compromised
    description: Changes risk state for explicit users; investigate the detections before submitting.
    handler: operations/risky-users-confirm-compromised
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: identity-risk-reports
      action: write
  - id: request-directory-role-assignment
    name: Request Scheduled Directory Role Assignment
    description: Submits an administrative PIM schedule request. Approval and activation are asynchronous.
    handler: operations/request-directory-role-assignment
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: pim-role-eligibility
      action: write
  - id: request-group-eligibility
    name: Request Group Eligibility
    description: Submits a PIM for Groups administrative request; verify approval and resulting schedule.
    handler: operations/request-group-eligibility
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: pim-role-eligibility
      action: write
  - id: request-group-assignment
    name: Request Group Assignment
    description: Submits a PIM for Groups administrative request; verify approval and resulting schedule.
    handler: operations/request-group-assignment
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: pim-role-eligibility
      action: write
  - id: add-group-member
    name: Add Group Member
    description: >-
      Changes a specific relationship without deleting the referenced directory object. Dynamic membership and
      role-assignable groups remain subject to Graph restrictions.
    handler: operations/add-group-member
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: groups
      action: write
  - id: remove-group-member
    name: Remove Group Member
    description: >-
      Changes a specific relationship without deleting the referenced directory object. Dynamic membership and
      role-assignable groups remain subject to Graph restrictions.
    handler: operations/remove-group-member
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: groups
      action: delete
  - id: add-group-owner
    name: Add Group Owner
    description: >-
      Changes a specific relationship without deleting the referenced directory object. Dynamic membership and
      role-assignable groups remain subject to Graph restrictions.
    handler: operations/add-group-owner
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: groups
      action: write
  - id: remove-group-owner
    name: Remove Group Owner
    description: >-
      Changes a specific relationship without deleting the referenced directory object. Dynamic membership and
      role-assignable groups remain subject to Graph restrictions.
    handler: operations/remove-group-owner
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: groups
      action: delete
  - id: request-access-package-assignment
    name: Request Access Package Assignment
    description: Requests an access package assignment or removal. Review and fulfillment may be asynchronous.
    handler: operations/request-access-package-assignment
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: entitlement-assignment-policies
      action: write
  - id: request-catalog-resource
    name: Onboard or Remove Catalog Resource
    description: >-
      Requests catalog resource onboarding or removal. The app also needs permission to manage the source
      group, application, or SharePoint resource.
    handler: operations/request-catalog-resource
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: entitlement-access-package-catalogs
      action: write
  - id: cancel-access-package-request
    name: Cancel Access Package Request
    description: cancel the specified assignment request; check the resulting request state in Reports.
    handler: operations/cancel-access-package-request
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: entitlement-assignment-policies
      action: write
  - id: reprocess-access-package-request
    name: Reprocess Access Package Request
    description: reprocess the specified assignment request; check the resulting request state in Reports.
    handler: operations/reprocess-access-package-request
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: entitlement-assignment-policies
      action: write
  - id: remove-access-package-resource-role
    name: Remove Access Package Resource Role
    description: Removes a resource role from the access package and can affect existing assignments.
    handler: operations/remove-access-package-resource-role
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: entitlement-resource-role-scopes
      action: delete
  - id: create-multitenant-organization
    name: Create Multitenant Organization
    description: Creates the organization owned by the selected tenant.
    handler: operations/create-multitenant-organization
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: multitenant-organization-settings
      action: write
  - id: add-multitenant-member
    name: Add Multitenant Organization Member
    description: Adds a tenant to the organization; that tenant must separately accept the join request.
    handler: operations/add-multitenant-member
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: multitenant-organization-settings
      action: write
  - id: join-multitenant-organization
    name: Join Multitenant Organization
    description: Accepts the organization invitation from the specified owner tenant. Joining completes asynchronously.
    handler: operations/join-multitenant-organization
    requiresCredential: true
    destructive: true
    requiresPermission:
      resource: multitenant-organization-settings
      action: write
  - id: remove-multitenant-member
    name: Remove Multitenant Organization Member
    description: Removes the selected tenant from the organization.
