id: kandji
name: Kandji
version: "0.1.0"
vendor: Veltrix
description: >
  Manage Kandji (Apple device management / MDM) configuration as code through
  the Kandji tenant API (`https://<subdomain>.api.kandji.io/api/v1/...`,
  Bearer API token) — Blueprints (the core device-assignment construct),
  Tags, and two Library Item types with real single-request CRUD: Custom
  Scripts and Custom Profiles (an opaque `.mobileconfig` passthrough, like
  this catalog's Jamf app treats its configuration profiles) — each
  reconciled by id/name, with validation, drift detection and rollback
  handled by the Security-as-Code pipeline. Note: Kandji's own current API
  docs are titled "Iru Endpoint Management API" following the vendor's
  rebrand to Iru; the API surface, auth model and `api.kandji.io` hostnames
  are unchanged for existing tenants. See README § Coverage for every
  managed vs. intentionally excluded Kandji API surface (Custom/In-House Apps
  need a multi-step S3 binary upload and are out of scope, the same way this
  catalog's Jamf app treats package binaries).
category: Endpoint Management
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/kandji
icon: "🪼"

platform:
  minVersion: "1.0.0"

# Kandji brand: deep navy + teal — the teal echoes the jellyfish mark used on
# Kandji's own developer/API documentation site (api-docs.kandji.io);
# approximate placeholders until an official lockup is added, per the
# assets/README convention used by sibling apps (see apps/jamf).
branding:
  primaryColor: "#0A1F2B"
  accentColor: "#2DD4BF"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: blueprints
      actions: [read, write, delete]
      description: Manage Kandji Blueprints (device assignment maps) — name, description, icon/color, enrollment code and active state
    - resource: tags
      actions: [read, write, delete]
      description: Manage Kandji tenant tags used to group/scope devices
    - resource: custom-scripts
      actions: [read, write, delete]
      description: Manage Kandji Library "Custom Script" items — the shell script, execution frequency, remediation script and Self Service visibility
    - resource: custom-profiles
      actions: [read, write, delete]
      description: Manage Kandji Library "Custom Profile" items — an opaque `.mobileconfig` payload passthrough, active state and target platforms

pipeline:
  configurationTypes:
    - id: blueprints
      group: "Device Assignment"
      name: Blueprints
      description: >
        Kandji Blueprints — the core device-assignment construct (name,
        description, icon/color, enrollment code, active state) — via
        GET/POST /api/v1/blueprints and GET/PATCH/DELETE
        /api/v1/blueprints/{id}. Reconciled by name; the Blueprint `type`
        (classic vs. assignment map) is set at creation only and never
        changed on an existing Blueprint. Library-item and device
        assignment inside a Blueprint are not managed by this release — see
        README § Coverage.
      canvasTemplate: config-types/blueprints/canvas.yaml
      defaultConfig: config-types/blueprints/defaults.yaml
      handlers:
        validate: config-types/blueprints/validate
        deploy: config-types/blueprints/deploy
        rollback: config-types/blueprints/rollback
        healthCheck: config-types/blueprints/healthCheck
        driftDetect: config-types/blueprints/driftDetect
        getStatus: config-types/blueprints/getStatus
      targets:
        componentTypes: [kandji-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: tags
      group: "Device Assignment"
      name: Tags
      description: >
        Kandji tenant tags — name only — via GET /api/v1/tags,
        POST /api/v1/tags, PATCH/DELETE /api/v1/tags/{tag_id}. Reconciled by
        (case-insensitive) name; referenced elsewhere in Kandji by tag name
        or id.
      canvasTemplate: config-types/tags/canvas.yaml
      defaultConfig: config-types/tags/defaults.yaml
      handlers:
        validate: config-types/tags/validate
        deploy: config-types/tags/deploy
        rollback: config-types/tags/rollback
        healthCheck: config-types/tags/healthCheck
        driftDetect: config-types/tags/driftDetect
        getStatus: config-types/tags/getStatus
      targets:
        componentTypes: [kandji-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: custom-scripts
      group: "Library Items"
      name: Custom Scripts
      description: >
        Kandji Library "Custom Script" items — name, execution frequency,
        the shell script body, an optional remediation script, restart flag,
        active state and Self Service visibility — via GET/POST
        /api/v1/library/custom-scripts and GET/PATCH/DELETE
        /api/v1/library/custom-scripts/{id}. Reconciled by name (case
        sensitive, matching Kandji's own uniqueness-by-exact-name behavior);
        `self_service_category_id` must be an existing Self Service category
        id from your Kandji tenant (categories are managed in the Kandji web
        app — the API only lists them, see README § Coverage).
      canvasTemplate: config-types/custom-scripts/canvas.yaml
      defaultConfig: config-types/custom-scripts/defaults.yaml
      handlers:
        validate: config-types/custom-scripts/validate
        deploy: config-types/custom-scripts/deploy
        rollback: config-types/custom-scripts/rollback
        healthCheck: config-types/custom-scripts/healthCheck
        driftDetect: config-types/custom-scripts/driftDetect
        getStatus: config-types/custom-scripts/getStatus
      targets:
        componentTypes: [kandji-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: custom-profiles
      group: "Library Items"
      name: Custom Profiles
      description: >
        Kandji Library "Custom Profile" items — name, active state, target
        platforms (Mac/iPhone/iPad/AppleTV) and an OPAQUE `.mobileconfig`
        plist payload — via GET/POST /api/v1/library/custom-profiles and
        GET/PATCH/DELETE /api/v1/library/custom-profiles/{id}. The Kandji API
        transports the profile as a multipart file part (not an embedded JSON
        string); this app builds that multipart body from the plist text you
        author, and never parses or validates the plist itself — see
        config-types/custom-profiles/validate.ts. Reconciled by name.
      canvasTemplate: config-types/custom-profiles/canvas.yaml
      defaultConfig: config-types/custom-profiles/defaults.yaml
      handlers:
        validate: config-types/custom-profiles/validate
        deploy: config-types/custom-profiles/deploy
        rollback: config-types/custom-profiles/rollback
        healthCheck: config-types/custom-profiles/healthCheck
        driftDetect: config-types/custom-profiles/driftDetect
        getStatus: config-types/custom-profiles/getStatus
      targets:
        componentTypes: [kandji-tenant]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/kandji

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: cloud
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: calls GET /api/v1/settings/licensing
# (tenant licensing/utilization — read-only, no query params) to prove the
# Bearer token and tenant host both work.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for calls to the Kandji tenant API.
    default: 30
    required: false
  - key: page_size
    type: number
    label: List Page Size
    description: Page size (limit) used when listing Blueprints / Library Items.
    default: 100
    required: false
