id: carbon-black
name: VMware Carbon Black
version: "0.6.1"
vendor: Veltrix
description: >
  Manage VMware Carbon Black Cloud configuration as code through the CBC API —
  Reputation Overrides, private Threat Feeds, Feed Reports, Watchlists, endpoint
  Policies, Policy Rule Configs, Data Forwarders, Asset Groups, USB Device
  Control (approvals and per-policy blocks), shared Watchlist Reports and RBAC
  Access Grants — with validation, drift detection and rollback handled by the
  Security-as-Code pipeline.
category: EDR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/carbon-black
icon: "🖤"

platform:
  minVersion: "1.0.0"

# Carbon Black brand: near-black primary.
branding:
  primaryColor: "#111820"
  accentColor: "#00B5AD"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: reputation-overrides
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud reputation overrides (allow/ban by SHA256 / certificate / IT-tool path)
    - resource: threat-feeds
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud private threat feeds (a set of IOCs — file hashes, domains, or IPs)
    - resource: watchlists
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud watchlists that subscribe to a threat feed (feed_id classifier)
    - resource: feed-reports
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud feed reports (titled IOC groups nested inside a private threat feed)
    - resource: policies
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud endpoint policies (name, priority level and a validated policy JSON body)
    - resource: data-forwarders
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud data forwarders (event streams shipped to S3 / Azure Blob / GCS storage)
    - resource: asset-groups
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud asset groups (dynamic device grouping with optional policy assignment)
    - resource: device-control-approvals
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud USB device-control approvals (allow-list entries for external storage devices)
    - resource: device-control-blocks
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud per-policy USB device-control blocks (write/execute enforcement toggles)
    - resource: watchlist-reports
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud shared watchlist reports (titled IOC groups referenceable by watchlists)
    - resource: policy-rule-configs
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud policy core-prevention rule configs (BLOCK / REPORT assignment per policy)
    - resource: access-grants
      actions: [read, write, delete]
      description: Manage Carbon Black Cloud RBAC role grants for existing users (additive; never creates users or revokes out-of-band roles)

pipeline:
  configurationTypes:
    - id: threat-feeds
      name: Threat Feeds
      group: "Enterprise EDR"
      description: Private threat feeds — a set of IOCs (hashes / domains / IPs) in a managed report (name-keyed; reconciled)
      canvasTemplate: config-types/threat-feeds/canvas.yaml
      defaultConfig: config-types/threat-feeds/defaults.yaml
      handlers:
        validate: config-types/threat-feeds/validate
        deploy: config-types/threat-feeds/deploy
        rollback: config-types/threat-feeds/rollback
        healthCheck: config-types/threat-feeds/healthCheck
        driftDetect: config-types/threat-feeds/driftDetect
        getStatus: config-types/threat-feeds/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: watchlists
      name: Watchlists
      group: "Enterprise EDR"
      description: Watchlists that subscribe to a threat feed (feed_id classifier) with tagging/alerting (name-keyed; reconciled)
      canvasTemplate: config-types/watchlists/canvas.yaml
      defaultConfig: config-types/watchlists/defaults.yaml
      handlers:
        validate: config-types/watchlists/validate
        deploy: config-types/watchlists/deploy
        rollback: config-types/watchlists/rollback
        healthCheck: config-types/watchlists/healthCheck
        driftDetect: config-types/watchlists/driftDetect
        getStatus: config-types/watchlists/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: feed-reports
      name: Feed Reports
      group: "Enterprise EDR"
      description: Titled IOC groups (reports) nested inside a private threat feed (title-keyed per feed; reconciled)
      canvasTemplate: config-types/feed-reports/canvas.yaml
      defaultConfig: config-types/feed-reports/defaults.yaml
      handlers:
        validate: config-types/feed-reports/validate
        deploy: config-types/feed-reports/deploy
        rollback: config-types/feed-reports/rollback
        healthCheck: config-types/feed-reports/healthCheck
        driftDetect: config-types/feed-reports/driftDetect
        getStatus: config-types/feed-reports/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: policies
      name: Policies
      group: "Endpoint Prevention"
      description: Endpoint policies — name, priority level and a validated policy JSON body (name-keyed; reconciled)
      canvasTemplate: config-types/policies/canvas.yaml
      defaultConfig: config-types/policies/defaults.yaml
      handlers:
        validate: config-types/policies/validate
        deploy: config-types/policies/deploy
        rollback: config-types/policies/rollback
        healthCheck: config-types/policies/healthCheck
        driftDetect: config-types/policies/driftDetect
        getStatus: config-types/policies/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: reputation-overrides
      name: Reputation Overrides
      group: "Endpoint Prevention"
      description: Allow/ban entries by SHA256 hash, signing certificate, or IT-tool path (natural-key matched; delete+recreate on change)
      canvasTemplate: config-types/reputation-overrides/canvas.yaml
      defaultConfig: config-types/reputation-overrides/defaults.yaml
      handlers:
        validate: config-types/reputation-overrides/validate
        deploy: config-types/reputation-overrides/deploy
        rollback: config-types/reputation-overrides/rollback
        healthCheck: config-types/reputation-overrides/healthCheck
        driftDetect: config-types/reputation-overrides/driftDetect
        getStatus: config-types/reputation-overrides/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: data-forwarders
      name: Data Forwarders
      group: "Data & Assets"
      description: Event streams shipped to S3 / Azure Blob / GCS (name-keyed; type & destination immutable → delete+recreate on change)
      canvasTemplate: config-types/data-forwarders/canvas.yaml
      defaultConfig: config-types/data-forwarders/defaults.yaml
      handlers:
        validate: config-types/data-forwarders/validate
        deploy: config-types/data-forwarders/deploy
        rollback: config-types/data-forwarders/rollback
        healthCheck: config-types/data-forwarders/healthCheck
        driftDetect: config-types/data-forwarders/driftDetect
        getStatus: config-types/data-forwarders/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: asset-groups
      name: Asset Groups
      group: "Data & Assets"
      description: Dynamic (query-based) device groups with optional policy assignment (name-keyed; reconciled)
      canvasTemplate: config-types/asset-groups/canvas.yaml
      defaultConfig: config-types/asset-groups/defaults.yaml
      handlers:
        validate: config-types/asset-groups/validate
        deploy: config-types/asset-groups/deploy
        rollback: config-types/asset-groups/rollback
        healthCheck: config-types/asset-groups/healthCheck
        driftDetect: config-types/asset-groups/driftDetect
        getStatus: config-types/asset-groups/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: device-control-approvals
      name: Device Control Approvals
      group: "Device Control"
      description: USB device-control allow-list entries (natural-key matched by vendor/product/serial; bulk create; reconciled)
      canvasTemplate: config-types/device-control-approvals/canvas.yaml
      defaultConfig: config-types/device-control-approvals/defaults.yaml
      handlers:
        validate: config-types/device-control-approvals/validate
        deploy: config-types/device-control-approvals/deploy
        rollback: config-types/device-control-approvals/rollback
        healthCheck: config-types/device-control-approvals/healthCheck
        driftDetect: config-types/device-control-approvals/driftDetect
        getStatus: config-types/device-control-approvals/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: device-control-blocks
      name: Device Control Blocks
      group: "Device Control"
      description: Per-policy USB enforcement — write/execute toggles for approved devices (one block per policy; policy resolved by name)
      canvasTemplate: config-types/device-control-blocks/canvas.yaml
      defaultConfig: config-types/device-control-blocks/defaults.yaml
      handlers:
        validate: config-types/device-control-blocks/validate
        deploy: config-types/device-control-blocks/deploy
        rollback: config-types/device-control-blocks/rollback
        healthCheck: config-types/device-control-blocks/healthCheck
        driftDetect: config-types/device-control-blocks/driftDetect
        getStatus: config-types/device-control-blocks/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: watchlist-reports
      name: Watchlist Reports
      group: "Enterprise EDR"
      description: Shared IOC reports (title-keyed; reconciled by stored report id — the store has no list-all endpoint)
      canvasTemplate: config-types/watchlist-reports/canvas.yaml
      defaultConfig: config-types/watchlist-reports/defaults.yaml
      handlers:
        validate: config-types/watchlist-reports/validate
        deploy: config-types/watchlist-reports/deploy
        rollback: config-types/watchlist-reports/rollback
        healthCheck: config-types/watchlist-reports/healthCheck
        driftDetect: config-types/watchlist-reports/driftDetect
        getStatus: config-types/watchlist-reports/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: policy-rule-configs
      name: Policy Rule Configs (Core Prevention)
      group: "Endpoint Prevention"
      description: Core-prevention rule-config assignment (BLOCK / REPORT) patched per named policy (nested singleton; reset-to-default on removal)
      canvasTemplate: config-types/policy-rule-configs/canvas.yaml
      defaultConfig: config-types/policy-rule-configs/defaults.yaml
      handlers:
        validate: config-types/policy-rule-configs/validate
        deploy: config-types/policy-rule-configs/deploy
        rollback: config-types/policy-rule-configs/rollback
        healthCheck: config-types/policy-rule-configs/healthCheck
        driftDetect: config-types/policy-rule-configs/driftDetect
        getStatus: config-types/policy-rule-configs/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

    - id: access-grants
      name: Access Grants (RBAC)
      description: RBAC role grants for existing users, additively merged (name-keyed by principal email; reconciled)
      group: "Access & Identity"
      canvasTemplate: config-types/access-grants/canvas.yaml
      defaultConfig: config-types/access-grants/defaults.yaml
      handlers:
        validate: config-types/access-grants/validate
        deploy: config-types/access-grants/deploy
        rollback: config-types/access-grants/rollback
        healthCheck: config-types/access-grants/healthCheck
        driftDetect: config-types/access-grants/driftDetect
        getStatus: config-types/access-grants/getStatus
      targets:
        componentTypes: [carbon-black]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/carbon-black

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: runs a minimal reputation-override search.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: base_url
    type: string
    label: Base URL
    description: >
      Your Carbon Black Cloud region host (e.g. https://defense.conferdeploy.net).
      EU/APAC orgs use different hosts.
    required: true
  - key: org_key
    type: string
    label: Org Key
    description: Your Carbon Black Cloud organization key (Settings > General / API Access).
    required: true
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Carbon Black Cloud API calls.
    default: 30
    required: false
