# =============================================================================
# Canvas Template — MISP Noticelists
#
# Declares ONE MISP noticelist toggle (the item). Users add as many as they need.
# Field keys must match config-types/noticelists/validate.ts. Applied via the
# MISP REST API (/noticelists, /noticelists/enableNoticelist/{id}[/true]) on port
# 443. Noticelists ship with MISP; this type only enables or disables the ones
# already present.
# =============================================================================

id: "misp-noticelists"
name: "Noticelists"
toolType: "misp"
entityType: "noticelists"
description: "Enable or disable MISP noticelists by name via the MISP REST API (443)"

item:
  label: "Noticelist"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Noticelist"
      icon: "bell"
      description: "Noticelist identity and desired state"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The noticelist name as MISP knows it, e.g. GDPR. Used as the stable identity for upsert and drift."

        - key: "state"
          label: "State"
          fieldType: "select"
          required: true
          defaultValue: "enabled"
          options:
            - label: "Enabled"
              value: "enabled"
            - label: "Disabled"
              value: "disabled"
          helpText: "Whether MISP enables this noticelist (enabled) or leaves it off (disabled)"

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this noticelist state is configured — recorded for audit"
