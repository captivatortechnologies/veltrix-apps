# =============================================================================
# Canvas Template — MISP Sync Servers
#
# Declares ONE MISP sync server (the item). Users add as many as they need.
# Field keys must match config-types/sync-servers/validate.ts. Applied via the
# MISP REST API (/servers, /servers/add, /servers/edit/{id}) on port 443.
# =============================================================================

id: "misp-sync-servers"
name: "Sync Servers"
toolType: "misp"
entityType: "sync-servers"
description: "Manage MISP sync servers — remote URL, authkey and pull/push flags — via the MISP REST API (443)"

item:
  label: "Sync Server"
  identityField: "url"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Server"
      icon: "server"
      description: "Remote MISP identity and credentials"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Human-readable name for the remote MISP, e.g. Partner MISP"

        - key: "url"
          label: "Remote URL"
          fieldType: "text"
          required: true
          validation:
            pattern: "^https?://.+"
            maxLength: 1000
          helpText: "The remote MISP base URL (http/https). Used as the server's stable identity for upsert and drift."

        - key: "authkey"
          label: "Remote Authkey"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "SENSITIVE — the remote MISP automation key used to authenticate this sync. Treat as a secret; it is written to MISP but never read back."

    - name: "Sync"
      icon: "refresh-cw"
      description: "Which directions this server synchronises"
      fields:
        - key: "pull"
          label: "Pull"
          fieldType: "select"
          required: true
          defaultValue: "no"
          options:
            - label: "Yes"
              value: "yes"
            - label: "No"
              value: "no"
          helpText: "Whether MISP pulls events from the remote server"

        - key: "push"
          label: "Push"
          fieldType: "select"
          required: true
          defaultValue: "no"
          options:
            - label: "Yes"
              value: "yes"
            - label: "No"
              value: "no"
          helpText: "Whether MISP pushes events to the remote server"

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this sync server is configured — recorded for audit"
