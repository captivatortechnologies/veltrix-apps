# =============================================================================
# Canvas Template — MISP Threat Feeds
#
# Declares ONE MISP threat feed (the item). Users add as many as they need.
# Field keys must match config-types/feeds/validate.ts. Applied via the MISP
# REST API (/feeds, /feeds/add, /feeds/edit/{id}) on port 443.
# =============================================================================

id: "misp-feeds"
name: "Threat Feeds"
toolType: "misp"
entityType: "feeds"
description: "Manage MISP threat feeds — provider, feed URL, source format and enabled state — via the MISP REST API (443)"

item:
  label: "Threat Feed"
  identityField: "url"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Feed"
      icon: "rss"
      description: "Feed identity and source"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Human-readable feed name shown in MISP, e.g. CIRCL OSINT Feed"

        - key: "provider"
          label: "Provider"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "Organisation that publishes the feed, e.g. CIRCL"

        - key: "url"
          label: "Feed URL"
          fieldType: "text"
          required: true
          validation:
            pattern: "^https?://.+"
            maxLength: 1000
          helpText: "The feed URL (http/https). Used as the feed's stable identity for upsert and drift."

    - name: "Ingestion"
      icon: "settings"
      description: "How MISP parses and whether the feed runs"
      fields:
        - key: "sourceFormat"
          label: "Source Format"
          fieldType: "select"
          required: true
          defaultValue: "misp"
          options:
            - label: "MISP"
              value: "misp"
            - label: "CSV"
              value: "csv"
            - label: "Freetext"
              value: "freetext"
          helpText: "How MISP interprets the feed contents"

        - key: "enabled"
          label: "State"
          fieldType: "select"
          required: true
          defaultValue: "enabled"
          options:
            - label: "Enabled"
              value: "enabled"
            - label: "Disabled"
              value: "disabled"
          helpText: "Whether MISP fetches this feed (enabled) or leaves it off (disabled)"

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this feed is configured — recorded for audit"
