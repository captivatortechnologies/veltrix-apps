# =============================================================================
# Canvas Template — MISP Warninglists
#
# Declares ONE MISP warninglist toggle (the item). Users add as many as they need.
# Field keys must match config-types/warninglists/validate.ts. Applied via the
# MISP REST API (/warninglists, /warninglists/toggleEnable) on port 443.
# Warninglists ship with MISP; this type only enables or disables the ones already
# present.
# =============================================================================

id: "misp-warninglists"
name: "Warninglists"
toolType: "misp"
entityType: "warninglists"
description: "Enable or disable MISP warninglists by name via the MISP REST API (443)"

item:
  label: "Warninglist"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Warninglist"
      icon: "alert-triangle"
      description: "Warninglist identity and desired state"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The warninglist name as MISP knows it, e.g. List of known IPv4 public DNS resolvers. Used as the stable identity for upsert and drift."

        - key: "state"
          label: "State"
          fieldType: "select"
          required: true
          defaultValue: "enabled"
          options:
            - label: "Enabled"
              value: "enabled"
            - label: "Disabled"
              value: "disabled"
          helpText: "Whether MISP enables this warninglist (enabled) or leaves it off (disabled)"

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this warninglist state is configured — recorded for audit"
