# =============================================================================
# Canvas Template — MISP Sharing Groups
#
# Declares ONE MISP sharing group (the item). Users add as many as they need.
# Field keys must match config-types/sharing-groups/validate.ts. Applied via the
# MISP REST API (/sharing_groups, /sharing_groups/add, /sharing_groups/edit/{id})
# on port 443.
# =============================================================================

id: "misp-sharing-groups"
name: "Sharing Groups"
toolType: "misp"
entityType: "sharing-groups"
description: "Manage MISP sharing groups — name, description and releasability — via the MISP REST API (443)"

item:
  label: "Sharing Group"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Sharing Group"
      icon: "users"
      description: "Sharing group identity and releasability"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Human-readable sharing group name shown in MISP. Used as the stable identity for upsert and drift."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "What this sharing group is for"

        - key: "releasable"
          label: "Releasable"
          fieldType: "select"
          required: true
          defaultValue: "no"
          options:
            - label: "Yes"
              value: "yes"
            - label: "No"
              value: "no"
          helpText: "Whether events shared with this group are marked releasable"

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this sharing group is configured — recorded for audit"
