id: misp
name: MISP
version: "0.5.0"
vendor: Veltrix
description: >
  Manage MISP (open-source Threat Intelligence Platform) as code. Author threat
  feeds and drive them through the Security-as-Code pipeline — validate, deploy,
  health check, drift detection and rollback — over the MISP REST API (HTTPS,
  self-signed tolerated), with BYOL infrastructure provisioning for the MISP
  stack (core + MariaDB + Redis).
category: Threat Intelligence
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/misp
icon: "🧩"

platform:
  minVersion: "1.0.0"

# MISP's brand green. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#2f9e44"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: feeds
      actions: [read, write, delete]
      description: Manage MISP threat feeds (add / edit / enable / disable)
    - resource: taxonomies
      actions: [read, write]
      description: Enable or disable MISP taxonomies
    - resource: warninglists
      actions: [read, write]
      description: Enable or disable MISP warninglists
    - resource: sharing-groups
      actions: [read, write, delete]
      description: Manage MISP sharing groups (add / edit)
    - resource: organisations
      actions: [read, write, delete]
      description: Manage MISP organisations (add / edit)
    - resource: sync-servers
      actions: [read, write, delete]
      description: Manage MISP sync servers (add / edit / pull / push)
    - resource: tags
      actions: [read, write, delete]
      description: Manage MISP tags (add / edit / delete)
    - resource: galaxies
      actions: [read, write, delete]
      description: Manage custom MISP galaxies (add / edit / enable / disable)
    - resource: galaxy-clusters
      actions: [read, write, delete]
      description: Manage MISP galaxy clusters within a galaxy (add / edit / publish)
    - resource: noticelists
      actions: [read, write]
      description: Enable or disable MISP noticelists
    - resource: roles
      actions: [read, write, delete]
      description: Manage MISP user roles and their permission flags (add / edit)
    - resource: users
      actions: [read, write, delete]
      description: Provision MISP user accounts (add / edit) — never manages passwords or auth keys
    - resource: admin-settings
      actions: [read, write]
      description: Manage MISP instance-wide server settings as key/value pairs
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL MISP stack infrastructure
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: misp_

pipeline:
  configurationTypes:
    - id: feeds
      group: "Threat Intelligence"
      name: Threat Feeds
      description: MISP threat feeds — provider, feed URL, source format and enabled state — applied over the MISP REST API (443)
      canvasTemplate: config-types/feeds/canvas.yaml
      defaultConfig: config-types/feeds/defaults.yaml
      handlers:
        validate: config-types/feeds/validate
        deploy: config-types/feeds/deploy
        rollback: config-types/feeds/rollback
        healthCheck: config-types/feeds/healthCheck
        driftDetect: config-types/feeds/driftDetect
        getStatus: config-types/feeds/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: taxonomies
      group: "Vocabularies"
      name: Taxonomies
      description: Enable or disable MISP taxonomies by namespace (e.g. tlp) — applied over the MISP REST API (443)
      canvasTemplate: config-types/taxonomies/canvas.yaml
      defaultConfig: config-types/taxonomies/defaults.yaml
      handlers:
        validate: config-types/taxonomies/validate
        deploy: config-types/taxonomies/deploy
        rollback: config-types/taxonomies/rollback
        healthCheck: config-types/taxonomies/healthCheck
        driftDetect: config-types/taxonomies/driftDetect
        getStatus: config-types/taxonomies/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: warninglists
      group: "Vocabularies"
      name: Warninglists
      description: Enable or disable MISP warninglists by name — applied over the MISP REST API (443)
      canvasTemplate: config-types/warninglists/canvas.yaml
      defaultConfig: config-types/warninglists/defaults.yaml
      handlers:
        validate: config-types/warninglists/validate
        deploy: config-types/warninglists/deploy
        rollback: config-types/warninglists/rollback
        healthCheck: config-types/warninglists/healthCheck
        driftDetect: config-types/warninglists/driftDetect
        getStatus: config-types/warninglists/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: sharing-groups
      group: "Sharing"
      name: Sharing Groups
      description: MISP sharing groups — name, description and releasability — applied over the MISP REST API (443)
      canvasTemplate: config-types/sharing-groups/canvas.yaml
      defaultConfig: config-types/sharing-groups/defaults.yaml
      handlers:
        validate: config-types/sharing-groups/validate
        deploy: config-types/sharing-groups/deploy
        rollback: config-types/sharing-groups/rollback
        healthCheck: config-types/sharing-groups/healthCheck
        driftDetect: config-types/sharing-groups/driftDetect
        getStatus: config-types/sharing-groups/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: organisations
      group: "Sharing"
      name: Organisations
      description: MISP organisations — name, description, nationality and local flag — applied over the MISP REST API (443)
      canvasTemplate: config-types/organisations/canvas.yaml
      defaultConfig: config-types/organisations/defaults.yaml
      handlers:
        validate: config-types/organisations/validate
        deploy: config-types/organisations/deploy
        rollback: config-types/organisations/rollback
        healthCheck: config-types/organisations/healthCheck
        driftDetect: config-types/organisations/driftDetect
        getStatus: config-types/organisations/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: sync-servers
      group: "Sync"
      name: Sync Servers
      description: MISP sync servers — remote URL, authkey and pull/push flags — applied over the MISP REST API (443)
      canvasTemplate: config-types/sync-servers/canvas.yaml
      defaultConfig: config-types/sync-servers/defaults.yaml
      handlers:
        validate: config-types/sync-servers/validate
        deploy: config-types/sync-servers/deploy
        rollback: config-types/sync-servers/rollback
        healthCheck: config-types/sync-servers/healthCheck
        driftDetect: config-types/sync-servers/driftDetect
        getStatus: config-types/sync-servers/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: tags
      group: "Vocabularies"
      name: Tags
      description: MISP tags — name, colour, visibility and numeric weight — applied over the MISP REST API (443)
      canvasTemplate: config-types/tags/canvas.yaml
      defaultConfig: config-types/tags/defaults.yaml
      handlers:
        validate: config-types/tags/validate
        deploy: config-types/tags/deploy
        rollback: config-types/tags/rollback
        healthCheck: config-types/tags/healthCheck
        driftDetect: config-types/tags/driftDetect
        getStatus: config-types/tags/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: galaxies
      group: "Galaxies"
      name: Galaxies
      description: Custom MISP galaxies — taxonomy categories for galaxy clusters — applied over the MISP REST API (443)
      canvasTemplate: config-types/galaxies/canvas.yaml
      defaultConfig: config-types/galaxies/defaults.yaml
      handlers:
        validate: config-types/galaxies/validate
        deploy: config-types/galaxies/deploy
        rollback: config-types/galaxies/rollback
        healthCheck: config-types/galaxies/healthCheck
        driftDetect: config-types/galaxies/driftDetect
        getStatus: config-types/galaxies/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: galaxy-clusters
      group: "Galaxies"
      name: Galaxy Clusters
      description: Entries within a MISP galaxy (default or custom) — value, distribution and metadata — applied over the MISP REST API (443)
      canvasTemplate: config-types/galaxy-clusters/canvas.yaml
      defaultConfig: config-types/galaxy-clusters/defaults.yaml
      handlers:
        validate: config-types/galaxy-clusters/validate
        deploy: config-types/galaxy-clusters/deploy
        rollback: config-types/galaxy-clusters/rollback
        healthCheck: config-types/galaxy-clusters/healthCheck
        driftDetect: config-types/galaxy-clusters/driftDetect
        getStatus: config-types/galaxy-clusters/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: noticelists
      group: "Vocabularies"
      name: Noticelists
      description: Enable or disable MISP noticelists by name — applied over the MISP REST API (443)
      canvasTemplate: config-types/noticelists/canvas.yaml
      defaultConfig: config-types/noticelists/defaults.yaml
      handlers:
        validate: config-types/noticelists/validate
        deploy: config-types/noticelists/deploy
        rollback: config-types/noticelists/rollback
        healthCheck: config-types/noticelists/healthCheck
        driftDetect: config-types/noticelists/driftDetect
        getStatus: config-types/noticelists/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: roles
      group: "Access Control"
      name: Roles
      description: MISP user roles and their permission flags — applied over the MISP REST API (443)
      canvasTemplate: config-types/roles/canvas.yaml
      defaultConfig: config-types/roles/defaults.yaml
      handlers:
        validate: config-types/roles/validate
        deploy: config-types/roles/deploy
        rollback: config-types/roles/rollback
        healthCheck: config-types/roles/healthCheck
        driftDetect: config-types/roles/driftDetect
        getStatus: config-types/roles/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: users
      group: "Access Control"
      name: Users
      description: MISP user accounts — email, organisation, role and account state — applied over the MISP REST API (443)
      canvasTemplate: config-types/users/canvas.yaml
      defaultConfig: config-types/users/defaults.yaml
      handlers:
        validate: config-types/users/validate
        deploy: config-types/users/deploy
        rollback: config-types/users/rollback
        healthCheck: config-types/users/healthCheck
        driftDetect: config-types/users/driftDetect
        getStatus: config-types/users/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: admin-settings
      group: "System Settings"
      name: Admin Settings
      description: MISP instance-wide server settings as declarative key/value pairs — applied over the MISP REST API (443)
      canvasTemplate: config-types/admin-settings/canvas.yaml
      defaultConfig: config-types/admin-settings/defaults.yaml
      handlers:
        validate: config-types/admin-settings/validate
        deploy: config-types/admin-settings/deploy
        rollback: config-types/admin-settings/rollback
        healthCheck: config-types/admin-settings/healthCheck
        driftDetect: config-types/admin-settings/driftDetect
        getStatus: config-types/admin-settings/getStatus
      targets:
        componentTypes: [misp-core, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/misp

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL stack infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs the MISP core (component) with the
    # MISP automation key (credential), with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint + automation
# key against the MISP REST API (HTTPS 443 /servers/getVersion).
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall
  onEvent: hooks/onEvent
  onWebhook: hooks/onWebhook

settings:
  - key: misp_port
    type: number
    label: MISP HTTPS Port
    description: HTTPS port for the MISP web UI / REST API
    default: 443
    required: false
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the MISP endpoint. Off by default —
      MISP commonly ships a self-signed certificate.
    default: false
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
