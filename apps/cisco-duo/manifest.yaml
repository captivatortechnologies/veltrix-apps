id: cisco-duo
name: Cisco Duo
version: "0.5.0"
vendor: Veltrix
description: >
  Manage Cisco Duo configuration as code through the Duo Admin API — Groups,
  Integrations, Administrators, Administrative Units, Policies, Passport and
  account-wide Settings — with validation, drift detection and rollback handled
  by the Security-as-Code pipeline.
category: IAM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/cisco-duo
icon: "🔐"

platform:
  minVersion: "1.0.0"

# Cisco Duo brand: green primary.
branding:
  primaryColor: "#6BBF4E"
  accentColor: "#3C9A3C"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: groups
      actions: [read, write, delete]
      description: Manage Cisco Duo groups (name + description) via the Duo Admin API
    - resource: integrations
      actions: [read, write, delete]
      description: Manage Cisco Duo integrations (name + type) via the Duo Admin API
    - resource: admins
      actions: [read, write, delete]
      description: Manage Cisco Duo administrators (email + name + role) via the Duo Admin API
    - resource: administrative-units
      actions: [read, write, delete]
      description: Manage Cisco Duo administrative units (name + description + restriction flags) via the Duo Admin API
    - resource: policies
      actions: [read, write, delete]
      description: Manage Cisco Duo policies (name + settings sections) via the Duo Admin API v2 (V5-signed)
    - resource: passport-config
      actions: [read, write, delete]
      description: Manage the Cisco Duo Passport singleton configuration via the Duo Admin API v2 (V5-signed)
    - resource: account-settings
      actions: [read, write, delete]
      description: Manage Cisco Duo account-wide (global) settings via the Duo Admin API

pipeline:
  configurationTypes:
    - id: policies
      name: Policies
      description: Duo policies — name + a validated JSON `sections` settings map (V5-signed /admin/v2/policies; name-keyed, policy_key stored for rename-safety; two-step create then PUT sections; the Global Policy is an update-only singleton; reconcile deletes only custom policies this app created). Requires a Duo Access/Essentials (or higher) edition.
      canvasTemplate: config-types/policies/canvas.yaml
      defaultConfig: config-types/policies/defaults.yaml
      handlers:
        validate: config-types/policies/validate
        deploy: config-types/policies/deploy
        rollback: config-types/policies/rollback
        healthCheck: config-types/policies/healthCheck
        driftDetect: config-types/policies/driftDetect
        getStatus: config-types/policies/getStatus
      targets:
        componentTypes: [cisco-duo]
        requiresCredential: true
        requiresConnectivity: false

    - id: passport-config
      name: Passport Configuration
      description: Duo Passport (desktop SSO) enablement — a tenant singleton (V5-signed /admin/v2/passport/config; GET-then-POST patch, no create/delete) covering status plus optional per-group scoping and custom supported browsers
      canvasTemplate: config-types/passport-config/canvas.yaml
      defaultConfig: config-types/passport-config/defaults.yaml
      handlers:
        validate: config-types/passport-config/validate
        deploy: config-types/passport-config/deploy
        rollback: config-types/passport-config/rollback
        healthCheck: config-types/passport-config/healthCheck
        driftDetect: config-types/passport-config/driftDetect
        getStatus: config-types/passport-config/getStatus
      targets:
        componentTypes: [cisco-duo]
        requiresCredential: true
        requiresConnectivity: false

    - id: account-settings
      name: Account Settings
      description: Duo account-wide (global) settings — a tenant singleton (/admin/v1/settings; GET-then-POST patch, no create/delete) covering admin lockout, admin password policy, log retention, fraud reporting, timezone and helpdesk bypass; every field is optional and managed only when set
      canvasTemplate: config-types/account-settings/canvas.yaml
      defaultConfig: config-types/account-settings/defaults.yaml
      handlers:
        validate: config-types/account-settings/validate
        deploy: config-types/account-settings/deploy
        rollback: config-types/account-settings/rollback
        healthCheck: config-types/account-settings/healthCheck
        driftDetect: config-types/account-settings/driftDetect
        getStatus: config-types/account-settings/getStatus
      targets:
        componentTypes: [cisco-duo]
        requiresCredential: true
        requiresConnectivity: false

    - id: administrative-units
      name: Administrative Units
      description: Duo administrative units — name, description and the restrict_by_groups / restrict_by_integrations flags (name-keyed and unique, admin_unit_id stored for rename-safety; admin/group/integration membership is managed in the Duo Admin Panel)
      canvasTemplate: config-types/administrative-units/canvas.yaml
      defaultConfig: config-types/administrative-units/defaults.yaml
      handlers:
        validate: config-types/administrative-units/validate
        deploy: config-types/administrative-units/deploy
        rollback: config-types/administrative-units/rollback
        healthCheck: config-types/administrative-units/healthCheck
        driftDetect: config-types/administrative-units/driftDetect
        getStatus: config-types/administrative-units/getStatus
      targets:
        componentTypes: [cisco-duo]
        requiresCredential: true
        requiresConnectivity: false

    - id: admins
      name: Administrators
      description: Duo administrators — email, name and role (email-keyed, admin_id stored for email-change-safety; creating one sends a Duo activation email)
      canvasTemplate: config-types/admins/canvas.yaml
      defaultConfig: config-types/admins/defaults.yaml
      handlers:
        validate: config-types/admins/validate
        deploy: config-types/admins/deploy
        rollback: config-types/admins/rollback
        healthCheck: config-types/admins/healthCheck
        driftDetect: config-types/admins/driftDetect
        getStatus: config-types/admins/getStatus
      targets:
        componentTypes: [cisco-duo]
        requiresCredential: true
        requiresConnectivity: false

    - id: integrations
      name: Integrations
      description: Duo integrations — name and type (name-keyed, integration_key stored for rename-safety; type immutable)
      canvasTemplate: config-types/integrations/canvas.yaml
      defaultConfig: config-types/integrations/defaults.yaml
      handlers:
        validate: config-types/integrations/validate
        deploy: config-types/integrations/deploy
        rollback: config-types/integrations/rollback
        healthCheck: config-types/integrations/healthCheck
        driftDetect: config-types/integrations/driftDetect
        getStatus: config-types/integrations/getStatus
      targets:
        componentTypes: [cisco-duo]
        requiresCredential: true
        requiresConnectivity: false

    - id: groups
      name: Groups
      description: Duo groups — name and description (name-keyed, group_id stored for rename-safety)
      canvasTemplate: config-types/groups/canvas.yaml
      defaultConfig: config-types/groups/defaults.yaml
      handlers:
        validate: config-types/groups/validate
        deploy: config-types/groups/deploy
        rollback: config-types/groups/rollback
        healthCheck: config-types/groups/healthCheck
        driftDetect: config-types/groups/driftDetect
        getStatus: config-types/groups/getStatus
      targets:
        componentTypes: [cisco-duo]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/cisco-duo

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: signs a request to Duo's /check endpoint.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: api_host
    type: string
    label: API Host
    description: >
      Your Duo Admin API hostname (api-XXXXXXXX.duosecurity.com), from the Admin
      API application details in the Duo Admin Panel.
    required: true
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Duo Admin API calls.
    default: 30
    required: false
