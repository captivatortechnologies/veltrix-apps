# =============================================================================
# Canvas Template — Cisco Duo Shared Device Authentication
#
# Declares ONE Shared Device Authentication configuration (Duo Desktop kiosk /
# shared-workstation auth) — the item. Users add as many as they need.
# Full CRUD via V5(JSON)-signed /admin/v1/desktop_authenticators/shared_device_auth;
# Duo addresses these by an opaque shared_device_key with no lookup-by-name, so
# the app matches a declared configuration to a live one by NAME and stores the
# shared_device_key from the deploy for rename-safety. Reconcile deletes
# configurations this app created but no longer declares.
#
# Scope: a configuration pairs one or more Duo GROUPS (this app's own `groups`
# config type creates those — copy their group_id) with one or more Trusted
# Endpoints MANAGEMENT INTEGRATIONS. Management integrations are created by
# enrolling a device-management system in the Duo Admin Panel's Trusted
# Endpoints setup — the Admin API has no endpoint to create or list them, only
# to reference their ids, so operators copy the id from the Admin Panel.
#
# Field keys must match what config-types/shared-device-auth/validate.ts checks.
# =============================================================================

id: "cisco-duo-shared-device-auth"
name: "Shared Device Authentication"
toolType: "cisco-duo"
entityType: "shared-device-auth"
description: "Define Cisco Duo Shared Device Authentication configurations (Duo Desktop kiosk / shared-workstation auth) as code through the Duo Admin API."

item:
  label: "Shared Device Authentication Configuration"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Configuration"
      icon: "monitor"
      description: "Name, active state and the groups + management integrations it applies to"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: >
            This configuration's name — its identity in this canvas. Duo has no
            lookup-by-name, so the shared_device_key is stored after deploy for
            rename-safety.

        - key: "active"
          label: "Active"
          fieldType: "checkbox"
          required: false
          defaultValue: true
          helpText: "Whether users can authenticate with this shared device authentication configuration."

        - key: "group_ids"
          label: "Group IDs"
          fieldType: "textarea"
          required: true
          helpText: >
            Duo group ids (one per line or comma-separated) this configuration
            applies to — required by the Duo Admin API. Use this app's Groups
            config type to manage the groups themselves and copy their
            group_id.

        - key: "trusted_endpoint_integration_ids"
          label: "Trusted Endpoint Management Integration IDs"
          fieldType: "textarea"
          required: true
          helpText: >
            Duo Trusted Endpoints management integration ids (one per line or
            comma-separated) this configuration authenticates through —
            required by the Duo Admin API. These integrations are created in
            the Duo Admin Panel's Trusted Endpoints setup; the Admin API
            cannot create them, only reference their ids here.
