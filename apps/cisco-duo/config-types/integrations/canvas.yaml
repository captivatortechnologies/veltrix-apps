# =============================================================================
# Canvas Template — Cisco Duo Integrations
#
# Declares ONE Duo integration — the item. Users add as many as they need.
# Duo integrations are addressed by an opaque integration_key (no
# lookup-by-name), so the app matches a declared integration to a live one by
# NAME and stores the integration_key from the deploy for rename-safety. The
# integration TYPE is immutable — a same-name integration with a different type
# is not modified. Reconcile deletes integrations this app created but no longer
# declares.
#
# Field keys must match config-types/integrations/validate.ts.
# =============================================================================

id: "cisco-duo-integrations"
name: "Integration Configuration"
toolType: "cisco-duo"
entityType: "integrations"
description: "Define Cisco Duo integrations (name + type) as code through the Duo Admin API. The type is immutable; integration secrets are generated by Duo and retrieved from the Admin Panel."

item:
  label: "Integration"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Integration"
      icon: "grid"
      description: "Integration name and type"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: >
            The integration's name. Must be unique within this canvas — the app
            matches live Duo integrations on it (Duo has no lookup-by-name, so the
            integration_key is stored after deploy for rename-safety).

        - key: "type"
          label: "Type"
          fieldType: "text"
          required: true
          helpText: >
            The integration type, e.g. websdk, authapi, adminapi, radius. Immutable
            after create — changing it means a rename/recreate.
