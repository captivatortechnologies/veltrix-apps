      canvasTemplate: config-types/ngsiem-dashboards/canvas.yaml
      defaultConfig: config-types/ngsiem-dashboards/defaults.yaml
      handlers:
        validate: config-types/ngsiem-dashboards/validate
        deploy: config-types/ngsiem-dashboards/deploy
        rollback: config-types/ngsiem-dashboards/rollback
        healthCheck: config-types/ngsiem-dashboards/healthCheck
        driftDetect: config-types/ngsiem-dashboards/driftDetect
        getStatus: config-types/ngsiem-dashboards/getStatus
      targets:
        componentTypes: [falcon-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: ngsiem-lookup-files
      group: "Next-Gen SIEM"
      name: Lookup File Configuration
      description: Falcon Next-Gen SIEM lookup files — CSV enrichment tables (repository, key columns, content)
      canvasTemplate: config-types/ngsiem-lookup-files/canvas.yaml
      defaultConfig: config-types/ngsiem-lookup-files/defaults.yaml
      handlers:
        validate: config-types/ngsiem-lookup-files/validate
        deploy: config-types/ngsiem-lookup-files/deploy
        rollback: config-types/ngsiem-lookup-files/rollback
        healthCheck: config-types/ngsiem-lookup-files/healthCheck
        driftDetect: config-types/ngsiem-lookup-files/driftDetect
        getStatus: config-types/ngsiem-lookup-files/getStatus
      targets:
        componentTypes: [falcon-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: ngsiem-data-connections
      group: "Next-Gen SIEM"
      name: Data Connection Configuration
      description: Falcon Next-Gen SIEM data connections — ingest connector instances (source config, target repository, parser); tokens handled as secrets
      canvasTemplate: config-types/ngsiem-data-connections/canvas.yaml
      defaultConfig: config-types/ngsiem-data-connections/defaults.yaml
      handlers:
        validate: config-types/ngsiem-data-connections/validate
        deploy: config-types/ngsiem-data-connections/deploy
        rollback: config-types/ngsiem-data-connections/rollback
        healthCheck: config-types/ngsiem-data-connections/healthCheck
        driftDetect: config-types/ngsiem-data-connections/driftDetect
        getStatus: config-types/ngsiem-data-connections/getStatus
      targets:
        componentTypes: [falcon-tenant]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/crowdstrike-edr

client:
  entry: client/index
  # Embedded left sidebar (grouped Pages / Configurations) rather than a top
  # tab strip — this app will grow to many configuration types, which a
  # horizontal tab bar can't hold.
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — app-level Settings item (Settings nav group). Holds the
    # credentials + endpoint used to reach the Falcon APIs.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings
      order: 1
      layout: standard

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies a Connection's endpoint + API
# client credential against the Falcon APIs (OAuth2 token exchange + a bounded
# authenticated GET).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: falcon_region
    type: select
    label: Falcon Cloud Region
    description: >
      The CrowdStrike cloud your tenant lives in. "Auto" authenticates
      against US-1 and follows the X-Cs-Region hint, which works for all
      commercial clouds. GovCloud tenants (us-gov-1, us-gov-2) never
      auto-discover and must be selected explicitly — or encode the region
      in the component hostname, which always takes precedence.
    default: auto
    required: false
    options:
      - label: Auto-discover (commercial clouds)
        value: auto
      - label: US-1
        value: us-1
      - label: US-2
        value: us-2
      - label: EU-1
        value: eu-1
      - label: US-GOV-1
        value: us-gov-1
      - label: US-GOV-2
        value: us-gov-2
  - key: request_timeout_seconds
    type: number
    label: API Request Timeout (seconds)
    description: Timeout applied to each Falcon API request
    default: 30
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
