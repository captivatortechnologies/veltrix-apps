        deploy: config-types/ngsiem-parsers/deploy
        rollback: config-types/ngsiem-parsers/rollback
        healthCheck: config-types/ngsiem-parsers/healthCheck
        driftDetect: config-types/ngsiem-parsers/driftDetect
        getStatus: config-types/ngsiem-parsers/getStatus
      targets:
        componentTypes: [falcon-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: ngsiem-saved-queries
