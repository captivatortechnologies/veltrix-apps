    - id: filevantage-rule-groups
      group: "File Integrity Monitoring"
      name: FileVantage Rule Group Configuration
      description: Falcon FileVantage rule groups and their monitoring rules (path, depth, watched attributes, include/exclude) — reusable across FileVantage policies
