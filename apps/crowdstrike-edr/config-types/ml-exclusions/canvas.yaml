# =============================================================================
# Canvas Template — CrowdStrike Falcon ML (machine-learning) Exclusions
#
# Declares ONE exclusion — the item. Users add as many exclusions as they need.
# Field keys must match what config-types/ml-exclusions/validate.ts checks.
#
# An ML exclusion's identity in Falcon is its `value` (a glob path); uniqueness
# per canvas is enforced by validate.ts.
# =============================================================================

id: "crowdstrike-edr-ml-exclusions"
name: "ML Exclusion Configuration"
toolType: "crowdstrike-edr"
entityType: "ml-exclusions"
description: "Define machine-learning exclusions (glob path values) as code via the Falcon ML Exclusions API"

item:
  label: "ML Exclusion"
  identityField: "value"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "General"
      icon: "shield-off"
      description: "Exclusion path, what it excludes from, and scope"
      fields:
        - key: "value"
          label: "Value (glob path)"
          fieldType: "text"
          required: true
          validation:
            maxLength: 500
          helpText: "Glob path to exclude from ML, e.g. /opt/app/** or C:\\Program Files\\App\\*. Must be unique per canvas."

        - key: "excludedFrom"
          label: "Excluded From"
          fieldType: "tags"
          helpText: "What the exclusion suppresses: blocking (ML prevention/detection) and/or extraction (uploading the file for cloud analysis). Defaults to blocking."

        - key: "appliedGlobally"
          label: "Apply Globally"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Apply to every host in the tenant. Leave unchecked to target specific host groups instead."

        - key: "hostGroups"
          label: "Host Group IDs"
          fieldType: "tags"
          helpText: "Falcon host group IDs the exclusion applies to — required when not applied globally, ignored otherwise"

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          helpText: "Why this exclusion exists — recorded on the exclusion in the Falcon console"
