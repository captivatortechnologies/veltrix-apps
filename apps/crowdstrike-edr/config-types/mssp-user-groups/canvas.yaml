# =============================================================================
# Canvas Template — CrowdStrike Falcon Flight Control (MSSP) User Groups
#
# Declares ONE user group — the item. Users add as many groups as they need.
# Field keys must match what config-types/mssp-user-groups/validate.ts checks.
#
# A user group's identity in Falcon is its `name`; uniqueness per canvas is
# enforced by validate.ts. Member user UUIDs are embedded here and converged to
# exactly the declared set on deploy. Requires PARENT-CID API credentials with
# the Flight Control (MSSP) scope — only available on MSSP parent tenants.
# =============================================================================

id: "crowdstrike-edr-mssp-user-groups"
name: "MSSP User Group Configuration"
toolType: "crowdstrike-edr"
entityType: "mssp-user-groups"
description: "Define Falcon Flight Control (MSSP) user groups (name, description) and their member user UUIDs as code via the MSSP API. Requires parent-CID credentials with the Flight Control scope."

item:
  label: "User Group"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: "General"
      icon: "users"
      description: "User group identity and member user UUIDs"
      fields:
        - key: "name"
          label: "User Group Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Unique user group name in the MSSP parent tenant. Immutable identity — renaming creates a new group."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          helpText: "What this user group represents — shown in the Falcon console"

        - key: "userUuids"
          label: "Member User UUIDs"
          fieldType: "tags"
          helpText: >
            The Falcon user UUIDs (8-4-4-4-12 hexadecimal) that belong to this
            group. Membership is converged to exactly this set on deploy — users
            present on the group but not listed here are removed. Leave empty for
            an empty group.
