# =============================================================================
# Canvas Template — CrowdStrike Falcon Response (Real Time Response) Policies
#
# Declares ONE response policy — the item. Users add as many policies as
# they need. Field keys must match what
# config-types/response-policies/validate.ts checks.
# =============================================================================

id: "crowdstrike-edr-response-policies"
name: "Response Policy Configuration"
toolType: "crowdstrike-edr"
entityType: "response-policies"
description: "Define Falcon response (Real Time Response) policies (platform, RTR capability tiers, host group assignment) as code via the Response Policy API"

item:
  label: "Response Policy"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 100
  groups:
    - name: "General"
      icon: "terminal"
      description: "Policy identity, assignment, and RTR capability settings"
      fields:
        - key: "name"
          label: "Policy Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Unique policy name per platform in the Falcon tenant"

        - key: "platform"
          label: "Platform"
          fieldType: "select"
          required: true
          defaultValue: "Windows"
          options:
            - label: "Windows"
              value: "Windows"
            - label: "Mac"
              value: "Mac"
            - label: "Linux"
              value: "Linux"
          helpText: "Immutable after creation — the sensor platform this policy applies to"

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          helpText: "What this policy grants — shown in the Falcon console"

        - key: "enabled"
          label: "Enabled"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Whether the policy is active. New Falcon policies always start disabled; deployment converges to this value."

        - key: "hostGroups"
          label: "Host Group IDs"
          fieldType: "tags"
          helpText: "Falcon host group IDs this policy is assigned to. Deployment converges assignments to exactly this list."

        - key: "settings"
          label: "Policy Settings (JSON)"
          fieldType: "textarea"
          helpText: >
            JSON array of Real Time Response capability toggles, each
            {"id": "<SettingId>", "value": {"enabled": true}}. Settings gate the
            RTR command tiers — real-time response (read-only), active-responder
            (custom scripts, get/put/run), and admin. Values are toggles only
            (no ML sliders). Setting IDs are per-platform — only the settings
            listed here are managed; others keep their tenant values.
