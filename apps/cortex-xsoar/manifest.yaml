id: cortex-xsoar
name: Cortex XSOAR
version: "1.3.0"
vendor: Veltrix
description: >
  Manage Palo Alto Networks Cortex XSOAR content configuration as code through the
  XSOAR server REST API. Covers lists, incident types, incident/indicator fields,
  classifiers, mappers, scheduled jobs and integration instances — each
  reconciled by a stable identity with validation, drift detection and rollback
  handled by the Security-as-Code pipeline. Works with
  Cortex XSOAR 6.x (API-key header) and
  Cortex XSOAR 8 / the Cortex platform (API key + x-xdr-auth-id via the API gateway).
category: SOAR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/cortex-xsoar
icon: "🤖"

platform:
  minVersion: "1.0.0"

# Palo Alto Networks brand: the PANW orange with a Cortex cyan accent.
branding:
  primaryColor: "#FA582D"
  accentColor: "#00C0E8"
  logo: ./assets/logo.svg
  logoDark: ./assets/logo-dark.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: xsoar-lists
      actions: [read, write, delete]
      description: Manage Cortex XSOAR lists
    - resource: xsoar-incident-types
      actions: [read, write, delete]
      description: Manage Cortex XSOAR incident types
    - resource: xsoar-jobs
      actions: [read, write, delete]
      description: Manage Cortex XSOAR scheduled jobs
    - resource: xsoar-integration-instances
      actions: [read, write, delete]
      description: Manage Cortex XSOAR integration instances
    - resource: xsoar-incident-fields
      actions: [read, write, delete]
      description: Manage Cortex XSOAR custom incident fields
    - resource: xsoar-indicator-fields
      actions: [read, write, delete]
      description: Manage Cortex XSOAR custom indicator fields
    - resource: xsoar-classifiers
      actions: [read, write, delete]
      description: Manage Cortex XSOAR classifiers
    - resource: xsoar-mappers
      actions: [read, write, delete]
      description: Manage Cortex XSOAR incoming/outgoing mappers

pipeline:
  configurationTypes:
    - id: xsoar-lists
      group: "Content"
      name: Cortex XSOAR Lists
      description: Lists via /lists; name-keyed upsert through /lists/save, removed via /lists/delete on rollback
      canvasTemplate: config-types/xsoar-lists/canvas.yaml
      defaultConfig: config-types/xsoar-lists/defaults.yaml
      handlers:
        validate: config-types/xsoar-lists/validate
        deploy: config-types/xsoar-lists/deploy
        rollback: config-types/xsoar-lists/rollback
        healthCheck: config-types/xsoar-lists/healthCheck
        driftDetect: config-types/xsoar-lists/driftDetect
        getStatus: config-types/xsoar-lists/getStatus
      targets:
        componentTypes: [xsoar-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: xsoar-incident-types
      group: "Incident Management"
      name: Cortex XSOAR Incident Types
      description: Incident types via /incidenttype; name-keyed upsert (version-tracked), removed via /incidenttype/delete on rollback
      canvasTemplate: config-types/xsoar-incident-types/canvas.yaml
      defaultConfig: config-types/xsoar-incident-types/defaults.yaml
      handlers:
        validate: config-types/xsoar-incident-types/validate
        deploy: config-types/xsoar-incident-types/deploy
        rollback: config-types/xsoar-incident-types/rollback
        healthCheck: config-types/xsoar-incident-types/healthCheck
        driftDetect: config-types/xsoar-incident-types/driftDetect
        getStatus: config-types/xsoar-incident-types/getStatus
      targets:
        componentTypes: [xsoar-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: xsoar-incident-fields
      group: "Incident Management"
      name: Cortex XSOAR Incident Fields
      description: Custom incident fields via /incidentfields (shared with indicator fields, discriminated by group/id prefix); cliName-keyed upsert through /incidentfields/import, removed via /incidentfields/delete on rollback
      canvasTemplate: config-types/xsoar-incident-fields/canvas.yaml
      defaultConfig: config-types/xsoar-incident-fields/defaults.yaml
      handlers:
        validate: config-types/xsoar-incident-fields/validate
        deploy: config-types/xsoar-incident-fields/deploy
        rollback: config-types/xsoar-incident-fields/rollback
        healthCheck: config-types/xsoar-incident-fields/healthCheck
        driftDetect: config-types/xsoar-incident-fields/driftDetect
        getStatus: config-types/xsoar-incident-fields/getStatus
      targets:
        componentTypes: [xsoar-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: xsoar-indicator-fields
      group: "Indicators"
      name: Cortex XSOAR Indicator Fields
      description: Custom indicator fields via /incidentfields (shared with incident fields, discriminated by group/id prefix); cliName-keyed upsert through /incidentfields/import, removed via /incidentfields/delete on rollback
      canvasTemplate: config-types/xsoar-indicator-fields/canvas.yaml
      defaultConfig: config-types/xsoar-indicator-fields/defaults.yaml
      handlers:
        validate: config-types/xsoar-indicator-fields/validate
        deploy: config-types/xsoar-indicator-fields/deploy
        rollback: config-types/xsoar-indicator-fields/rollback
        healthCheck: config-types/xsoar-indicator-fields/healthCheck
        driftDetect: config-types/xsoar-indicator-fields/driftDetect
        getStatus: config-types/xsoar-indicator-fields/getStatus
      targets:
        componentTypes: [xsoar-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: xsoar-classifiers
      group: "Classification & Mapping"
      name: Cortex XSOAR Classifiers
      description: Classifiers via /classifier (shared with mappers, discriminated by type); id-keyed upsert through /classifier/import, removed via /classifier/delete on rollback
      canvasTemplate: config-types/xsoar-classifiers/canvas.yaml
      defaultConfig: config-types/xsoar-classifiers/defaults.yaml
      handlers:
        validate: config-types/xsoar-classifiers/validate
        deploy: config-types/xsoar-classifiers/deploy
        rollback: config-types/xsoar-classifiers/rollback
        healthCheck: config-types/xsoar-classifiers/healthCheck
        driftDetect: config-types/xsoar-classifiers/driftDetect
        getStatus: config-types/xsoar-classifiers/getStatus
      targets:
        componentTypes: [xsoar-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: xsoar-mappers
      group: "Classification & Mapping"
      name: Cortex XSOAR Mappers
      description: Incoming/outgoing mappers via /classifier (shared with classifiers, discriminated by type); id-keyed upsert through /classifier/import, removed via /classifier/delete on rollback
      canvasTemplate: config-types/xsoar-mappers/canvas.yaml
      defaultConfig: config-types/xsoar-mappers/defaults.yaml
      handlers:
        validate: config-types/xsoar-mappers/validate
        deploy: config-types/xsoar-mappers/deploy
        rollback: config-types/xsoar-mappers/rollback
        healthCheck: config-types/xsoar-mappers/healthCheck
        driftDetect: config-types/xsoar-mappers/driftDetect
        getStatus: config-types/xsoar-mappers/getStatus
      targets:
        componentTypes: [xsoar-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: xsoar-jobs
      group: "Automation"
      name: Cortex XSOAR Jobs
      description: Scheduled (time-triggered) jobs via /jobs; name-keyed upsert searched through /jobs/search, removed via DELETE /jobs/{id} on rollback
      canvasTemplate: config-types/xsoar-jobs/canvas.yaml
      defaultConfig: config-types/xsoar-jobs/defaults.yaml
      handlers:
        validate: config-types/xsoar-jobs/validate
        deploy: config-types/xsoar-jobs/deploy
        rollback: config-types/xsoar-jobs/rollback
        healthCheck: config-types/xsoar-jobs/healthCheck
        driftDetect: config-types/xsoar-jobs/driftDetect
        getStatus: config-types/xsoar-jobs/getStatus
      targets:
        componentTypes: [xsoar-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: xsoar-integration-instances
      group: "Integrations"
      name: Cortex XSOAR Integration Instances
      description: Integration instances (and their parameters) via /settings/integration; name-keyed upsert searched through /settings/integration/search, removed via DELETE /settings/integration/{id} on rollback
      canvasTemplate: config-types/xsoar-integration-instances/canvas.yaml
      defaultConfig: config-types/xsoar-integration-instances/defaults.yaml
      handlers:
        validate: config-types/xsoar-integration-instances/validate
        deploy: config-types/xsoar-integration-instances/deploy
        rollback: config-types/xsoar-integration-instances/rollback
        healthCheck: config-types/xsoar-integration-instances/healthCheck
        driftDetect: config-types/xsoar-integration-instances/driftDetect
        getStatus: config-types/xsoar-integration-instances/getStatus
      targets:
        componentTypes: [xsoar-server]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/cortex-xsoar

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a Cortex XSOAR server (component)
    # with the API key used to reach it, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the server URL + API key (and the
# x-xdr-auth-id header for XSOAR 8) via GET /user.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: auth_id
    type: string
    label: API Key ID
    description: >
      Cortex XSOAR 8 / Cortex platform only: the numeric id of the API key. When
      set, the app sends the x-xdr-auth-id header and routes requests through the
      /xsoar API gateway path. Leave blank for Cortex XSOAR 6.x.
    default: ""
    required: false
  - key: api_base_path
    type: string
    label: API Base Path
    description: >
      Optional override for the REST API base path appended to the server host
      (e.g. "/xsoar"). Leave blank to auto-select: "/xsoar" when an API Key ID is
      set (XSOAR 8), otherwise the server root (XSOAR 6.x).
    default: ""
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Cortex XSOAR API calls.
    default: 30
    required: false
