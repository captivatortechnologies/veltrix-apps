# Defaults for a new Sentinel policy item.
#
# Intentionally empty: the platform no longer seeds system default values into a
# new item — it starts blank (the canvas defaultValue for enforcementLevel
# ("advisory") pre-fills that field on its own). Users manage their own default
# value sets and can apply one when creating an item. Any values here would be
# a FLAT map keyed by the canvas field keys (scope, name, enforcementLevel,
# paths, policy), since a policy's presentational groups share one flat item
# record.
