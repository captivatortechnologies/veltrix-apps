# Defaults for a new transit key item.
#
# Intentionally empty: the platform no longer seeds system default values into a
# new item — it starts blank (the canvas defaultValue for type ("aes256-gcm96")
# and the boolean flags pre-fill those fields on their own). Users manage their
# own default value sets and can apply one when creating an item. Any values
# here would be a FLAT map keyed by the canvas field keys (mount, name, type,
# derived, convergentEncryption, keySize, deletionAllowed,
# minDecryptionVersion, minEncryptionVersion, autoRotatePeriod, exportable,
# allowPlaintextBackup), since a key's presentational groups share one flat
# item record.
