# =============================================================================
# Canvas Template — Vault Transit Keys (configuration, NOT key material)
#
# Declares ONE transit encryption key — the item. Users add as many as they
# need. A key's identity is the composite (mount, name); config-types/
# transit-keys/deploy.ts creates it at POST {mount}/keys/{name} and tunes it at
# POST {mount}/keys/{name}/config. The mount itself is NOT created here —
# enable the Transit engine via the "Secret Engines" config type first.
#
# THE LINE THIS CANVAS DRAWS: it manages a key's EXISTENCE and CONFIGURATION
# only — type, derivation, exportability, deletion policy, version bounds and
# rotation cadence. The actual key BYTES are generated by Vault, live only
# inside Vault, and this app never reads, writes, exports, or logs them.
# Encrypt/decrypt/sign/rotate are one-shot cryptographic OPERATIONS, not
# config, and are out of scope.
#
# `type`, `derived` and `convergentEncryption` are IMMUTABLE once the key is
# created — Vault generates the key material at creation time and there is no
# in-place conversion. `exportable` and `allowPlaintextBackup` are WRITE-ONCE:
# Vault will not allow either to go back to false once set true.
#
# Field keys must match what config-types/transit-keys/validate.ts checks.
# =============================================================================

id: "hashicorp-vault-transit-keys"
name: "Transit Key Configuration"
toolType: "hashicorp-vault"
entityType: "transit-keys"
description: "Define Vault Transit encryption keys (type, derivation, exportability, deletion policy, rotation) as code through the {mount}/keys API. The key material itself is never read, written, or exported."

item:
  label: "Transit Key"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Key"
      icon: "key"
      description: "Transit mount and key name"
      fields:
        - key: "mount"
          label: "Transit Mount Path"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[A-Za-z0-9_./-]+$"
            message: "Mount path may contain only letters, digits, and the characters _ . / -"
          helpText: >
            The Transit secrets engine's mount path (e.g. "transit"), managed
            by the Secret Engines config type. Part of this key's identity —
            {mount}/keys/{name}.

        - key: "name"
          label: "Key Name"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[A-Za-z0-9_.-]+$"
            message: "Key name may contain only letters, digits, and the characters _ . -"
          helpText: >
            The key's name — callers encrypt/decrypt via {mount}/encrypt/{name}
            and {mount}/decrypt/{name}. Must be unique per mount within this
            canvas.

    - name: "Algorithm (immutable)"
      icon: "lock"
      description: "Fixed at creation — cannot be changed once the key exists"
      fields:
        - key: "type"
          label: "Key Type"
          fieldType: "select"
          required: true
          defaultValue: "aes256-gcm96"
          options:
            - label: "AES-256-GCM96"
              value: "aes256-gcm96"
            - label: "AES-128-GCM96"
              value: "aes128-gcm96"
            - label: "ChaCha20-Poly1305"
              value: "chacha20-poly1305"
            - label: "Ed25519"
              value: "ed25519"
            - label: "ECDSA P-256"
              value: "ecdsa-p256"
            - label: "ECDSA P-384"
              value: "ecdsa-p384"
            - label: "ECDSA P-521"
              value: "ecdsa-p521"
            - label: "RSA-2048"
              value: "rsa-2048"
            - label: "RSA-3072"
              value: "rsa-3072"
            - label: "RSA-4096"
              value: "rsa-4096"
            - label: "HMAC"
              value: "hmac"
          helpText: >
            IMMUTABLE once created. Vault generates the key material for this
            type internally — it is never returned to this app or anyone
            else. If a live key exists with a DIFFERENT type, deploy fails
            rather than deleting and recreating it (which would mint an
            unrelated key and lose the ability to decrypt anything encrypted
            under the old one).

        - key: "derived"
          label: "Derived"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "IMMUTABLE. Enable key derivation — callers supply a context to derive a unique sub-key per encryption. Required if Convergent Encryption is on."

        - key: "convergentEncryption"
          label: "Convergent Encryption"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "IMMUTABLE. The same plaintext + context always produces the same ciphertext. Requires Derived to also be enabled."

        - key: "keySize"
          label: "Key Size (bytes, HMAC only)"
          fieldType: "number"
          helpText: >
            IMMUTABLE. Only meaningful when Key Type is "hmac" (32–512 bytes).
            Ignored for every other key type.

    - name: "Tuning"
      icon: "sliders"
      description: "Deletion policy, version bounds and rotation — converge on every deploy"
      fields:
        - key: "deletionAllowed"
          label: "Deletion Allowed"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Whether DELETE {mount}/keys/{name} is permitted for this key. Vault refuses to delete a key unless this is true."

        - key: "minDecryptionVersion"
          label: "Min Decryption Version"
          fieldType: "number"
          helpText: >
            The oldest key version still usable to DECRYPT. Raising this
            retires old key versions from decryption (they remain usable for
            re-wrapping only if allow_plaintext_backup applies). Blank = no
            restriction beyond Vault's own default (0 = unrestricted).

        - key: "minEncryptionVersion"
          label: "Min Encryption Version"
          fieldType: "number"
          helpText: >
            The oldest key version still usable to ENCRYPT NEW data (0 = always
            use the latest version). Blank leaves Vault's own default (0).

        - key: "autoRotatePeriod"
          label: "Auto Rotate Period"
          fieldType: "text"
          helpText: >
            How often Vault automatically rotates this key, as a Vault
            duration (e.g. "720h" for 30 days). "0" disables automatic
            rotation. When set, must be "0" or at least 1 hour.

        - key: "exportable"
          label: "Exportable"
          fieldType: "checkbox"
          defaultValue: false
          helpText: >
            WRITE-ONCE. Whether the raw key material may ever be exported via
            {mount}/export. Once set to true, Vault will not allow it to be
            set back to false for this key.

        - key: "allowPlaintextBackup"
          label: "Allow Plaintext Backup"
          fieldType: "checkbox"
          defaultValue: false
          helpText: >
            WRITE-ONCE. Whether {mount}/backup/{name} may return this key's
            material in plaintext. Once set to true, Vault will not allow it to
            be set back to false for this key.
