# Defaults for a new PKI role item.
#
# Intentionally empty: the platform no longer seeds system default values into a
# new item — it starts blank (the canvas defaultValue for keyType, issuerRef,
# notBeforeDuration and the boolean flags pre-fill those fields on their own).
# Users manage their own default value sets and can apply one when creating an
# item. Any values here would be a FLAT map keyed by the canvas field keys
# (mount, name, ttl, maxTtl, keyType, keyBits, keyUsage, issuerRef,
# notBeforeDuration, allowedDomains, allowBareDomains, allowSubdomains,
# allowGlobDomains, allowWildcardCertificates, allowLocalhost, allowAnyName,
# enforceHostnames, allowIpSans, serverFlag, clientFlag, codeSigningFlag,
# requireCn, useCsrCommonName, noStore, generateLease), since a role's
# presentational groups share one flat item record.
