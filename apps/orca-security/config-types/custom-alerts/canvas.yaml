# =============================================================================
# Canvas Template — Orca Custom Alerts (custom Sonar rules)
#
# Declares ONE Orca custom alert — the item. Users add as many as they need.
# Alerts are created / updated through the Orca REST API
# (POST /api/sonar/rules, PUT /api/sonar/rules/{id}) and reconciled by the rule
# id this app assigns and persists per item (see deploy.ts) so a rule can be
# renamed without losing its identity.
#
# An alert evaluates a Sonar (DSL) query against the Orca inventory; a matching
# asset raises an alert at the configured risk score.
#
# Field keys must match config-types/custom-alerts/validate.ts + _shared.ts.
# =============================================================================

id: "orca-custom-alerts"
name: "Custom Alerts"
toolType: "orca-security"
entityType: "custom-alerts"
description: "Define Orca custom alerts (custom Sonar rules) as code through the Orca REST API. Each alert pairs a Sonar (DSL) query with a category, risk score and enabled state."

item:
  label: "Custom Alert"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Alert"
      icon: "shield-alert"
      description: "Name, category, score and state"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The alert name — its logical identity. Shown in Orca when the rule fires."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 2000
          helpText: "Optional description of what the alert detects and why it matters (Orca `details`)."

        - key: "category"
          label: "Category"
          fieldType: "select"
          required: true
          defaultValue: "Best practices"
          options:
            - { label: "Access control", value: "Access control" }
            - { label: "Authentication", value: "Authentication" }
            - { label: "Best practices", value: "Best practices" }
            - { label: "Data at risk", value: "Data at risk" }
            - { label: "Data protection", value: "Data protection" }
            - { label: "IAM misconfigurations", value: "IAM misconfigurations" }
            - { label: "Lateral movement", value: "Lateral movement" }
            - { label: "Logging and monitoring", value: "Logging and monitoring" }
            - { label: "Malicious activity", value: "Malicious activity" }
            - { label: "Malware", value: "Malware" }
            - { label: "Neglected assets", value: "Neglected assets" }
            - { label: "Network misconfigurations", value: "Network misconfigurations" }
            - { label: "Source code vulnerabilities", value: "Source code vulnerabilities" }
            - { label: "Suspicious activity", value: "Suspicious activity" }
            - { label: "System integrity", value: "System integrity" }
            - { label: "Vendor services misconfigurations", value: "Vendor services misconfigurations" }
            - { label: "Vulnerabilities", value: "Vulnerabilities" }
            - { label: "Workload misconfigurations", value: "Workload misconfigurations" }
          helpText: "The Orca alert category this rule is grouped under."

        - key: "orcaScore"
          label: "Risk Score"
          fieldType: "number"
          required: true
          defaultValue: 5
          validation:
            min: 1
            max: 10
          helpText: "The base risk score for findings from this rule (1–10). Verify the accepted range against your Orca tenant."

        - key: "contextScore"
          label: "Adjust score with asset context"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Let Orca raise or lower the score using the asset's context (exposure, sensitivity, ...)."

        - key: "enabled"
          label: "Enabled"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Whether the alert is active and evaluated."

    - name: "Detection"
      icon: "radar"
      description: "The Sonar query that defines the rule"
      fields:
        - key: "rule"
          label: "Sonar Query"
          fieldType: "textarea"
          required: true
          validation:
            maxLength: 10000
          helpText: "The Orca Sonar (DSL) query that defines the rule, e.g. AwsEc2Instance with (PublicIpAddress) and (not SecurityGroups.Rules with (...))."
