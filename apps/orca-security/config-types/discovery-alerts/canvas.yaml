# =============================================================================
# Canvas Template — Orca Discovery Alerts
#
# Declares ONE Orca discovery-based custom alert — the item. Users add as many
# as they need. Alerts are created / updated through the Orca REST API
# (POST /api/sonar/rules, PUT /api/sonar/rules/{id}) — the SAME base resource
# as Custom Alerts, but driven by a Discovery (graph) query (JSON) instead of a
# Sonar (DSL) string, with an optional compliance-framework association.
# Reconciled by the rule id this app assigns and persists per item.
#
# NOTE: unlike Custom Alerts, this resource has no enabled/disabled flag, and
# remediation text is not managed here (it lives behind a separate API keyed by
# a server-computed id) — see README Coverage.
#
# Field keys must match config-types/discovery-alerts/validate.ts + _shared.ts.
# =============================================================================

id: "orca-discovery-alerts"
name: "Discovery Alerts"
toolType: "orca-security"
entityType: "discovery-alerts"
description: "Define Orca discovery-based custom alerts as code through the Orca REST API. Each alert pairs a Discovery (graph) query with a category, risk score and optional compliance framework association."

item:
  label: "Discovery Alert"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Alert"
      icon: "search-code"
      description: "Name, category and score"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The alert name — its logical identity. Shown in Orca when the rule fires."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 2000
          helpText: "Optional description of what the alert detects and why it matters (Orca `details`)."

        - key: "category"
          label: "Category"
          fieldType: "select"
          required: true
          defaultValue: "Best practices"
          options:
            - { label: "Access control", value: "Access control" }
            - { label: "Authentication", value: "Authentication" }
            - { label: "Best practices", value: "Best practices" }
            - { label: "Data at risk", value: "Data at risk" }
            - { label: "Data protection", value: "Data protection" }
            - { label: "IAM misconfigurations", value: "IAM misconfigurations" }
            - { label: "Lateral movement", value: "Lateral movement" }
            - { label: "Logging and monitoring", value: "Logging and monitoring" }
            - { label: "Malicious activity", value: "Malicious activity" }
            - { label: "Malware", value: "Malware" }
            - { label: "Neglected assets", value: "Neglected assets" }
            - { label: "Network misconfigurations", value: "Network misconfigurations" }
            - { label: "Source code vulnerabilities", value: "Source code vulnerabilities" }
            - { label: "Suspicious activity", value: "Suspicious activity" }
            - { label: "System integrity", value: "System integrity" }
            - { label: "Vendor services misconfigurations", value: "Vendor services misconfigurations" }
            - { label: "Vulnerabilities", value: "Vulnerabilities" }
            - { label: "Workload misconfigurations", value: "Workload misconfigurations" }
          helpText: "The Orca alert category this rule is grouped under."

        - key: "orcaScore"
          label: "Risk Score"
          fieldType: "number"
          required: true
          defaultValue: 5
          validation:
            min: 1
            max: 10
          helpText: "The base risk score for findings from this rule (1–10, decimals allowed, e.g. 6.2)."

        - key: "contextScore"
          label: "Adjust score with asset context"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "Let Orca raise or lower the score using the asset's context (exposure, sensitivity, ...). This resource has no enabled/disabled flag — it is always active once created."

    - name: "Detection"
      icon: "radar"
      description: "The Discovery (graph) query that defines the rule"
      fields:
        - key: "ruleJson"
          label: "Discovery Query (JSON)"
          fieldType: "textarea"
          required: true
          validation:
            maxLength: 20000
          helpText: 'The Discovery (graph) query as JSON, e.g. {"models":["AzureVNet"],"type":"object_set","with":{...}}. Copy it from the Orca Discovery UI/API.'

    - name: "Compliance"
      icon: "list-checks"
      description: "Optional compliance framework association (JSON)"
      fields:
        - key: "complianceFrameworks"
          label: "Compliance Frameworks (JSON)"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 5000
          helpText: >
            Optional JSON array associating this alert (as a control) with one or more custom
            compliance frameworks: [{"name":"My Framework","section":"Identify/Risk Assessment","priority":"high"}].
            "section" joins up to 3 levels with "/". Leave blank for no association.
