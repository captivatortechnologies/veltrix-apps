id: orca-security
name: Orca Security
version: "0.3.0"
vendor: Veltrix
description: >
  Manage Orca Security (agentless CNAPP / CSPM) configuration as code through the
  Orca REST API. Covers custom alerts (custom Sonar rules), business units
  (filters), automations, discovery views, custom compliance frameworks, system
  alert exceptions, discovery-based custom alerts, notification integrations
  (Jira/Slack/webhook), custom tag rules, custom RBAC roles and trusted cloud
  accounts — created, updated, drift-checked and rolled back by the
  Security-as-Code pipeline. Authenticates with an Orca API token against the
  tenant's regional API endpoint (default https://api.orcasecurity.io).
category: CLOUD
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/orca-security
icon: "🐋"

platform:
  minVersion: "1.0.0"

# Orca Security brand: the Orca teal/aqua.
branding:
  primaryColor: "#12B5A5"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: custom-alerts
      actions: [read, write, delete]
      description: Manage Orca custom alerts (custom Sonar rules)
    - resource: business-units
      actions: [read, write, delete]
      description: Manage Orca business units (filters)
    - resource: automations
      actions: [read, write, delete]
      description: Manage Orca automations
    - resource: discovery-views
      actions: [read, write, delete]
      description: Manage Orca discovery views (saved inventory queries)
    - resource: custom-compliance-frameworks
      actions: [read, write, delete]
      description: Manage Orca custom compliance frameworks (sections/controls)
    - resource: alert-exceptions
      actions: [read, write, delete]
      description: Manage the enabled/disabled state of built-in Orca system alerts
    - resource: discovery-alerts
      actions: [read, write, delete]
      description: Manage Orca discovery-based custom alerts
    - resource: notification-integrations
      actions: [read, write, delete]
      description: Manage Orca notification integrations (Jira Cloud, Slack, webhook)
    - resource: custom-tag-rules
      actions: [read, write, delete]
      description: Manage Orca custom tag rules (auto-tagging by Sonar/discovery query)
    - resource: custom-roles
      actions: [read, write, delete]
      description: Manage Orca custom RBAC roles
    - resource: trusted-cloud-accounts
      actions: [read, write, delete]
      description: Manage Orca trusted cloud accounts

pipeline:
  configurationTypes:
    - id: custom-alerts
      group: "Alerts"
      name: Custom Alerts
      description: >
        Orca custom alerts (custom Sonar rules) via /api/sonar/rules — a Sonar
        (DSL) query, category, risk score and enabled state. Reconciled by the
        rule id this app assigns and persists per item, so a rule can be renamed
        without losing its identity.
      canvasTemplate: config-types/custom-alerts/canvas.yaml
      defaultConfig: config-types/custom-alerts/defaults.yaml
      handlers:
        validate: config-types/custom-alerts/validate
        deploy: config-types/custom-alerts/deploy
        rollback: config-types/custom-alerts/rollback
        healthCheck: config-types/custom-alerts/healthCheck
        driftDetect: config-types/custom-alerts/driftDetect
        getStatus: config-types/custom-alerts/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: business-units
      group: "Organization"
      name: Business Units
      description: >
        Orca business units (filters) via /api/filters — a named scope that
        selects resources by one filter type (cloud providers, accounts, cloud
        tags, account tags or custom tags) plus ownership metadata. Reconciled by
        the filter id this app assigns and persists per item, so a unit can be
        renamed without losing its identity.
      canvasTemplate: config-types/business-units/canvas.yaml
      defaultConfig: config-types/business-units/defaults.yaml
      handlers:
        validate: config-types/business-units/validate
        deploy: config-types/business-units/deploy
        rollback: config-types/business-units/rollback
        healthCheck: config-types/business-units/healthCheck
        driftDetect: config-types/business-units/driftDetect
        getStatus: config-types/business-units/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: automations
      group: "Automation"
      name: Automations
      description: >
        Orca automations via /api/automations — a Sonar query that matches alerts
        plus a JSON action list (notify, ticket, remediate). Reconciled by the
        automation id this app assigns and persists per item; because Orca exposes
        an automations list endpoint, a first deploy also matches by name so an
        existing automation is updated rather than duplicated.
      canvasTemplate: config-types/automations/canvas.yaml
      defaultConfig: config-types/automations/defaults.yaml
      handlers:
        validate: config-types/automations/validate
        deploy: config-types/automations/deploy
        rollback: config-types/automations/rollback
        healthCheck: config-types/automations/healthCheck
        driftDetect: config-types/automations/driftDetect
        getStatus: config-types/automations/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: discovery-views
      group: "Discovery"
      name: Discovery Views
      description: >
        Orca discovery views (saved inventory queries) via /api/user_preferences —
        a Discovery query (query2) optionally shared org-wide. Reconciled by the
        preference id this app assigns and persists per item, so a view can be
        renamed without losing its identity.
      canvasTemplate: config-types/discovery-views/canvas.yaml
      defaultConfig: config-types/discovery-views/defaults.yaml
      handlers:
        validate: config-types/discovery-views/validate
        deploy: config-types/discovery-views/deploy
        rollback: config-types/discovery-views/rollback
        healthCheck: config-types/discovery-views/healthCheck
        driftDetect: config-types/discovery-views/driftDetect
        getStatus: config-types/discovery-views/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: custom-compliance-frameworks
      group: "Compliance"
      name: Custom Compliance Frameworks
      description: >
        Orca custom compliance frameworks via /api/compliance/frameworks — a
        named framework of sections, each containing tests (controls) that map
        an existing Orca rule id to a control identifier (e.g. "1.1"). Orca's
        read endpoint never returns section/test data (write-only), so drift can
        only compare name/description and rollback restores from this app's own
        last-declared body, not a live read. Reconciled by the framework id this
        app assigns and persists per item.
      canvasTemplate: config-types/custom-compliance-frameworks/canvas.yaml
      defaultConfig: config-types/custom-compliance-frameworks/defaults.yaml
      handlers:
        validate: config-types/custom-compliance-frameworks/validate
        deploy: config-types/custom-compliance-frameworks/deploy
        rollback: config-types/custom-compliance-frameworks/rollback
        healthCheck: config-types/custom-compliance-frameworks/healthCheck
        driftDetect: config-types/custom-compliance-frameworks/driftDetect
        getStatus: config-types/custom-compliance-frameworks/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: alert-exceptions
      group: "Alerts"
      name: Alert Exceptions
      description: >
        Declarative enabled/disabled overrides for BUILT-IN Orca system (catalog)
        alerts via PUT /api/sonar/rules/status/{rule_id} — a declarative
        exception to Orca's default alert catalog state. System alerts are
        predefined by Orca and cannot be created or deleted, only toggled, so
        identity is the caller-supplied rule_id (from the Orca Alert Catalog),
        not a server-assigned id.
      canvasTemplate: config-types/alert-exceptions/canvas.yaml
      defaultConfig: config-types/alert-exceptions/defaults.yaml
      handlers:
        validate: config-types/alert-exceptions/validate
        deploy: config-types/alert-exceptions/deploy
        rollback: config-types/alert-exceptions/rollback
        healthCheck: config-types/alert-exceptions/healthCheck
        driftDetect: config-types/alert-exceptions/driftDetect
        getStatus: config-types/alert-exceptions/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: discovery-alerts
      group: "Alerts"
      name: Discovery Alerts
      description: >
        Orca discovery-based custom alerts via /api/sonar/rules — the same base
        resource as Custom Alerts but driven by a Discovery (graph) query
        (rule_json) instead of a Sonar (DSL) string, with an optional custom
        compliance framework association. Unlike Custom Alerts, Orca's discovery
        alert payload has no enabled/disabled flag. Reconciled by the rule id
        this app assigns and persists per item.
      canvasTemplate: config-types/discovery-alerts/canvas.yaml
      defaultConfig: config-types/discovery-alerts/defaults.yaml
      handlers:
        validate: config-types/discovery-alerts/validate
        deploy: config-types/discovery-alerts/deploy
        rollback: config-types/discovery-alerts/rollback
        healthCheck: config-types/discovery-alerts/healthCheck
        driftDetect: config-types/discovery-alerts/driftDetect
        getStatus: config-types/discovery-alerts/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: notification-integrations
      group: "Integrations"
      name: Notification Integrations
      description: >
        Orca notification integrations (Jira Cloud, Slack, generic/vendor
        webhook) via /api/external_service/config — a per-service template that
        controls how Orca alerts are forwarded. Identity is the caller-assigned
        template_name plus service, which the API can look up directly
        (GET .../config?service_name=&template_name=), so this type resolves
        identity live rather than only from rollbackData.
      canvasTemplate: config-types/notification-integrations/canvas.yaml
      defaultConfig: config-types/notification-integrations/defaults.yaml
      handlers:
        validate: config-types/notification-integrations/validate
        deploy: config-types/notification-integrations/deploy
        rollback: config-types/notification-integrations/rollback
        healthCheck: config-types/notification-integrations/healthCheck
        driftDetect: config-types/notification-integrations/driftDetect
        getStatus: config-types/notification-integrations/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: custom-tag-rules
      group: "Organization"
      name: Custom Tag Rules
      description: >
        Orca custom tag rules via /api/custom_tags — automatically apply custom
        tags to every asset matching a Sonar (string) or discovery (JSON) query.
        Reconciled by the rule id this app assigns and persists per item.
      canvasTemplate: config-types/custom-tag-rules/canvas.yaml
      defaultConfig: config-types/custom-tag-rules/defaults.yaml
      handlers:
        validate: config-types/custom-tag-rules/validate
        deploy: config-types/custom-tag-rules/deploy
        rollback: config-types/custom-tag-rules/rollback
        healthCheck: config-types/custom-tag-rules/healthCheck
        driftDetect: config-types/custom-tag-rules/driftDetect
        getStatus: config-types/custom-tag-rules/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: custom-roles
      group: "Access"
      name: Custom Roles
      description: >
        Orca custom RBAC roles via /api/rbac/roles — a named set of permission
        groups (e.g. "assets.asset.read") a user or group can be assigned.
        Reconciled by the role id this app assigns and persists per item. Does
        not manage role ASSIGNMENT to users/groups (a separate, identity-bootstrap
        surface — see README Coverage).
      canvasTemplate: config-types/custom-roles/canvas.yaml
      defaultConfig: config-types/custom-roles/defaults.yaml
      handlers:
        validate: config-types/custom-roles/validate
        deploy: config-types/custom-roles/deploy
        rollback: config-types/custom-roles/rollback
        healthCheck: config-types/custom-roles/healthCheck
        driftDetect: config-types/custom-roles/driftDetect
        getStatus: config-types/custom-roles/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: trusted-cloud-accounts
      group: "Organization"
      name: Trusted Cloud Accounts
      description: >
        Orca trusted cloud accounts via /api/organization/trusted_accounts (id
        carried as a query parameter, not a path segment) — marks a named cloud
        account (e.g. a vendor's account with read access into yours) as
        trusted. Reconciled by the numeric account id this app assigns and
        persists per item.
      canvasTemplate: config-types/trusted-cloud-accounts/canvas.yaml
      defaultConfig: config-types/trusted-cloud-accounts/defaults.yaml
      handlers:
        validate: config-types/trusted-cloud-accounts/validate
        deploy: config-types/trusted-cloud-accounts/deploy
        rollback: config-types/trusted-cloud-accounts/rollback
        healthCheck: config-types/trusted-cloud-accounts/healthCheck
        driftDetect: config-types/trusted-cloud-accounts/driftDetect
        getStatus: config-types/trusted-cloud-accounts/getStatus
      targets:
        componentTypes: [orca-tenant]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/orca-security

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: cloud
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs an Orca tenant (component) with the
    # API token used to reach it, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the API token against the Orca
# REST API via GET /api/alerts/catalog/category.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: api_endpoint
    type: string
    label: API Endpoint
    description: >
      The Orca REST API base URL. Default (US tenants):
      https://api.orcasecurity.io. EU tenants use https://api.eu.orcasecurity.io.
      A per-connection endpoint (the connection's host) overrides this.
    default: "https://api.orcasecurity.io"
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Orca API calls.
    default: 30
    required: false
