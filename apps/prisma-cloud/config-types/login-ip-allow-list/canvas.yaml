# =============================================================================
# Canvas Template — Prisma Cloud Login IP Allow Lists
#
# Declares ONE named login IP allow list — the item. Users add as many as they
# need. Each list holds 1–10 CIDR blocks that are permitted to sign in to the
# Prisma Cloud console. Lists are id-addressed; the app matches a declared list
# to a live one by NAME (storing the id for rename-safety). Enabling/disabling a
# list is a separate activation action and is intentionally out of scope.
# Reconcile deletes lists this app created but no longer declares.
#
# Field keys must match config-types/login-ip-allow-list/validate.ts.
# =============================================================================

id: "prisma-cloud-login-ip-allow-list"
name: "Login IP Allow List Configuration"
toolType: "prisma-cloud"
entityType: "login-ip-allow-list"
description: "Define Prisma Cloud trusted login IP allow lists (name, CIDR blocks) as code through the Prisma Cloud CSPM API."

item:
  label: "Login IP Allow List"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 50
  groups:
    - name: "Login IP Allow List"
      icon: "shield-check"
      description: "List name and allowed CIDR blocks"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: >
            The allow-list name. Must be unique within this canvas — the app
            matches live lists on it (the id is stored after deploy for
            rename-safety).

        - key: "cidr"
          label: "CIDR Blocks (one per line)"
          fieldType: "textarea"
          required: true
          helpText: >
            The CIDR blocks permitted to sign in, one per line (1–10 blocks),
            e.g. 203.0.113.0/24 or 198.51.100.42.

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 2000
          helpText: "Optional description of the allow list."
