id: imperva
name: Imperva
version: "0.3.0"
vendor: Veltrix
description: >
  Manage Imperva Cloud WAF (formerly Incapsula) edge security as code. Author
  site security / ACL rules, delivery / rewrite rules, data centers and origin
  servers, per-rule exceptions, and general site configuration — and drive them
  through the Security-as-Code pipeline: validate, deploy, health check, drift
  detection and rollback. Rules are applied over the legacy Cloud WAF management
  API (Incapsula) v1 (https://my.imperva.com/api/prov/v1), authenticated with an
  API ID + API key.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/imperva
icon: "🛡️"

platform:
  minVersion: "1.0.0"

# Imperva brand red. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#ff5c39"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: acl-rules
      actions: [read, write, delete]
      description: Manage Imperva Cloud WAF site security / ACL rules (add / edit / delete, per site)
    - resource: security-rules
      actions: [read, write]
      description: Configure Imperva Cloud WAF threat protection per site (SQLi / XSS / RFI / illegal resource / backdoor action, DDoS protection, bot access control)
    - resource: acl-configuration
      actions: [read, write]
      description: Manage Imperva Cloud WAF site ACLs (blacklist IPs / countries / URLs, whitelist IPs) as a declarative per-site set
    - resource: delivery-rules
      actions: [read, write, delete]
      description: Manage Imperva Cloud WAF delivery / rewrite rules (redirect, rewrite URL/header/cookie, forward to data center or port, rate-limit, custom error response, add / edit / delete per site)
    - resource: data-centers
      actions: [read, write, delete]
      description: Manage Imperva Cloud WAF data centers (origin server pools) and their origin servers, per site
    - resource: security-rule-exceptions
      actions: [read, write, delete]
      description: Manage Imperva Cloud WAF per-rule allowlist exceptions (bypass one security or ACL rule for specific IPs, countries, URLs, user agents, client apps or parameters)
    - resource: site-configuration
      actions: [read, write]
      description: Manage a site's general configuration (active/bypass, SSL/domain validation, acceleration, trust seal, CNAME/SAN options, log level) as a declarative per-site set

pipeline:
  configurationTypes:
    - id: acl-rules
      group: "Edge Security"
      name: ACL Rules
      description: >
        Imperva Cloud WAF site security / ACL rules — block, alert or challenge
        traffic by client IP, geography or URL — applied over the Cloud WAF
        (Incapsula) management API v1 (POST /sites/incapRules/*, HTTPS 443).
        Upsert by rule name within a site.
      canvasTemplate: config-types/acl-rules/canvas.yaml
      defaultConfig: config-types/acl-rules/defaults.yaml
      handlers:
        validate: config-types/acl-rules/validate
        deploy: config-types/acl-rules/deploy
        rollback: config-types/acl-rules/rollback
        healthCheck: config-types/acl-rules/healthCheck
        driftDetect: config-types/acl-rules/driftDetect
        getStatus: config-types/acl-rules/getStatus
      targets:
        componentTypes: [imperva]
        requiresCredential: true
        requiresConnectivity: false

    - id: security-rules
      group: "Edge Security"
      name: Security Rules
      description: >
        Imperva Cloud WAF threat protection per site — the action for SQL
        injection, cross-site scripting, remote file inclusion, illegal resource
        access and backdoor detections, plus DDoS protection and bot access
        control — SET declaratively over the Cloud WAF (Incapsula) management API
        v1 (POST /sites/configure/security, HTTPS 443). One item per (site, rule).
      canvasTemplate: config-types/security-rules/canvas.yaml
      defaultConfig: config-types/security-rules/defaults.yaml
      handlers:
        validate: config-types/security-rules/validate
        deploy: config-types/security-rules/deploy
        rollback: config-types/security-rules/rollback
        healthCheck: config-types/security-rules/healthCheck
        driftDetect: config-types/security-rules/driftDetect
        getStatus: config-types/security-rules/getStatus
      targets:
        componentTypes: [imperva]
        requiresCredential: true
        requiresConnectivity: false

    - id: acl-configuration
      group: "Edge Security"
      name: ACL Configuration
      description: >
        Imperva Cloud WAF site ACLs — blacklist IPs, countries/continents or URLs,
        or whitelist IPs — managed as a declarative per-site set over the Cloud WAF
        (Incapsula) management API v1 (POST /sites/configure/acl, HTTPS 443). The
        value submitted for an ACL type REPLACES the whole list for that type on
        the site. One item per (site, ACL type).
      canvasTemplate: config-types/acl-configuration/canvas.yaml
      defaultConfig: config-types/acl-configuration/defaults.yaml
      handlers:
        validate: config-types/acl-configuration/validate
        deploy: config-types/acl-configuration/deploy
        rollback: config-types/acl-configuration/rollback
        healthCheck: config-types/acl-configuration/healthCheck
        driftDetect: config-types/acl-configuration/driftDetect
        getStatus: config-types/acl-configuration/getStatus
      targets:
        componentTypes: [imperva]
        requiresCredential: true
        requiresConnectivity: false

    - id: delivery-rules
      group: "Edge Security"
      name: Delivery Rules
      description: >
        Imperva Cloud WAF delivery / rewrite rules — redirect, rewrite URL /
        request or response header / cookie, delete header or cookie, forward to
        a data center or port, rate-limit, custom error response — applied over
        the SAME Cloud WAF (Incapsula) management API v1 IncapRules endpoint ACL
        Rules uses (POST /sites/incapRules/*, HTTPS 443), authoring the delivery
        action subset instead of the security action subset. Upsert by rule name
        within a site. NOT Imperva's newer `delivery_rules_configuration` API,
        which stays out of scope.
      canvasTemplate: config-types/delivery-rules/canvas.yaml
      defaultConfig: config-types/delivery-rules/defaults.yaml
      handlers:
        validate: config-types/delivery-rules/validate
        deploy: config-types/delivery-rules/deploy
        rollback: config-types/delivery-rules/rollback
        healthCheck: config-types/delivery-rules/healthCheck
        driftDetect: config-types/delivery-rules/driftDetect
        getStatus: config-types/delivery-rules/getStatus
      targets:
        componentTypes: [imperva]
        requiresCredential: true
        requiresConnectivity: false

    - id: data-centers
      group: "Origin Infrastructure"
      name: Data Centers
      description: >
        Imperva Cloud WAF data centers (origin server pools) and their origin
        servers, per site — applied over the Cloud WAF (Incapsula) management
        API v1 (POST /sites/dataCenters/*, /sites/dataCenters/servers/*, HTTPS
        443). The data center name is the identity within a site; each server's
        address is the identity within the data center. One item per data
        center, with its servers as a JSON list.
      canvasTemplate: config-types/data-centers/canvas.yaml
      defaultConfig: config-types/data-centers/defaults.yaml
      handlers:
        validate: config-types/data-centers/validate
        deploy: config-types/data-centers/deploy
        rollback: config-types/data-centers/rollback
        healthCheck: config-types/data-centers/healthCheck
        driftDetect: config-types/data-centers/driftDetect
        getStatus: config-types/data-centers/getStatus
      targets:
        componentTypes: [imperva]
        requiresCredential: true
        requiresConnectivity: false

    - id: security-rule-exceptions
      group: "Edge Security"
      name: Security Rule Exceptions
      description: >
        Per-rule allowlist exceptions — let specific IPs, countries/continents,
        URLs, user agents, client apps/app types or request parameters bypass
        ONE security or ACL rule on a site, distinct from ACL Configuration's
        site-wide blacklist. Managed over the Cloud WAF (Incapsula) management
        API v1 (POST /sites/configure/whitelists, HTTPS 443). An exception has no
        operator-facing name — its match condition IS its identity — so
        reconciliation is by content within each (site, rule) group.
      canvasTemplate: config-types/security-rule-exceptions/canvas.yaml
      defaultConfig: config-types/security-rule-exceptions/defaults.yaml
      handlers:
        validate: config-types/security-rule-exceptions/validate
        deploy: config-types/security-rule-exceptions/deploy
        rollback: config-types/security-rule-exceptions/rollback
        healthCheck: config-types/security-rule-exceptions/healthCheck
        driftDetect: config-types/security-rule-exceptions/driftDetect
        getStatus: config-types/security-rule-exceptions/getStatus
      targets:
        componentTypes: [imperva]
        requiresCredential: true
        requiresConnectivity: false

    - id: site-configuration
      group: "Edge Security"
      name: Site Configuration
      description: >
        A site's general configuration — active/bypass, SSL/domain validation,
        acceleration level, trust seal placement, restricted CNAME reuse,
        naked-domain/wildcard SAN, reference ID, and log level — managed as a
        declarative per-site set over the Cloud WAF (Incapsula) management API
        v1 (POST /sites/configure and /sites/setlog, HTTPS 443). One item per
        site; an empty field is left untouched rather than cleared.
      canvasTemplate: config-types/site-configuration/canvas.yaml
      defaultConfig: config-types/site-configuration/defaults.yaml
      handlers:
        validate: config-types/site-configuration/validate
        deploy: config-types/site-configuration/deploy
        rollback: config-types/site-configuration/rollback
        healthCheck: config-types/site-configuration/healthCheck
        driftDetect: config-types/site-configuration/driftDetect
        getStatus: config-types/site-configuration/getStatus
      targets:
        componentTypes: [imperva]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/imperva

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the Imperva API endpoint (component)
    # with the API ID / API key credential, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's API ID + API key
# against the Cloud WAF (Incapsula) management API v1 (POST /account).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request timeout (seconds)
    description: How long to wait for the Imperva API before giving up.
    default: 30
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
