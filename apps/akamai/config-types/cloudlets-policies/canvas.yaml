# =============================================================================
# Canvas Template — Akamai Cloudlets Policies
#
# A Cloudlets policy is a PER-OBJECT resource — Akamai assigns each one a
# server-side numeric id on create — so this reconciles by NAME (list, match,
# update or create), the same shape as Cisco Meraki's Group Policies. The
# matchRules schema is large and cloudlet-type-specific, so — following that
# same precedent — `name`/`cloudletType`/`groupId`/`description` are typed
# canvas fields and the rules themselves are authored as ONE JSON array blob
# (`matchRules`), sent as the policy VERSION body. A version is immutable once
# activated, so deploy always creates a NEW version when matchRules/description
# change rather than guessing draft-vs-immutable state (see _shared.ts).
#
# Activating a policy version onto STAGING/PRODUCTION is a SEPARATE config type
# (cloudlets-policy-activation) — the same content/promotion split already
# used for Network Lists. Field keys must match
# config-types/cloudlets-policies/validate.ts. Applied via the Cloudlets API v3
# (EdgeGrid-signed, shared policies only).
# =============================================================================

id: "akamai-cloudlets-policies"
name: "Cloudlets Policies"
toolType: "akamai"
entityType: "cloudlets-policies"
description: "Manage Akamai Cloudlets shared policies and their match-rule versions via the Cloudlets API v3"

item:
  label: "Cloudlets Policy"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Policy"
      icon: "shield"
      description: "Policy identity, type and placement"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[a-zA-Z0-9_]+$"
            maxLength: 255
          helpText: "Letters, digits and underscores only. The policy's stable identity for upsert and drift — cannot be changed after creation."

        - key: "cloudletType"
          label: "Cloudlet Type"
          fieldType: "select"
          required: true
          options:
            - { label: "API Prioritization (AP)", value: "AP" }
            - { label: "Audience Segmentation (AS)", value: "AS" }
            - { label: "Phased Release (CD)", value: "CD" }
            - { label: "Edge Redirector (ER)", value: "ER" }
            - { label: "Forward Rewrite (FR)", value: "FR" }
            - { label: "Request Control (IG)", value: "IG" }
          helpText: "Which Cloudlet this policy configures. Fixed once the policy is created — the matchRules JSON below must match this type's schema."

        - key: "groupId"
          label: "Group ID"
          fieldType: "number"
          required: true
          validation:
            min: 1
          helpText: "The Akamai group this policy is created under (numeric)."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 255
          helpText: "Notes about this policy — recorded in Akamai for audit."

    - name: "Version"
      icon: "code"
      description: "The current version's match rules"
      fields:
        - key: "versionDescription"
          label: "Version description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 255
          helpText: "Notes recorded on the policy version these match rules belong to."

        - key: "matchRules"
          label: "Match Rules (JSON)"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 200000
          helpText: 'The match rules as a JSON array, evaluated top-to-bottom (no nested child rules or else-statements). Shape depends on Cloudlet Type — e.g. Edge Redirector rules carry "redirectURL"/"statusCode", Request Control rules carry "allowDeny". Leave blank ([]) for a version with no rules yet. A change here creates a NEW immutable version rather than editing in place — see the CHANGELOG.'
