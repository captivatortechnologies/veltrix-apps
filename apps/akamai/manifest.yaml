id: akamai
name: Akamai
version: "0.3.0"
vendor: Veltrix
description: >
  Manage Akamai edge security, DNS and edge delivery as code. Author Network
  Lists and Client Lists (shared IP/GEO/ASN/TLS-fingerprint/etc. sets) and
  activate them onto STAGING / PRODUCTION; manage Edge DNS zones and
  recordsets; author Cloudlets shared policies (Edge Redirector, Request
  Control, API Prioritization, Audience Segmentation, Phased Release, Forward
  Rewrite) and activate their versions; and manage EdgeWorker identities and
  their code-bundle activations. Every surface runs through the
  Security-as-Code pipeline — validate, deploy, health check, drift detection
  and rollback — over the Akamai Network Lists API v2, Client Lists API v1,
  Edge DNS API v2, Cloudlets API v3 and EdgeWorkers API v1, authenticated with
  EdgeGrid (EG1-HMAC-SHA256) request signing.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/akamai
icon: "🌐"

platform:
  minVersion: "1.0.0"

# Akamai brand blue. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#0099cc"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: network-lists
      actions: [read, write, delete]
      description: Manage Akamai Network Lists (create / update / delete, sync elements)
    - resource: network-list-activation
      actions: [read, write]
      description: Activate Akamai Network Lists onto STAGING / PRODUCTION (read status, trigger activation)
    - resource: client-lists
      actions: [read, write, delete]
      description: Manage Akamai Client Lists (create / update / delete, sync entries)
    - resource: dns-zones
      actions: [read, write]
      description: Manage Akamai Edge DNS zones (create / update; deletion is a requested async operation)
    - resource: dns-records
      actions: [read, write, delete]
      description: Manage Akamai Edge DNS recordsets (create / update / delete)
    - resource: cloudlets-policies
      actions: [read, write, delete]
      description: Manage Akamai Cloudlets shared policies and their match-rule versions (create / update / delete)
    - resource: cloudlets-policy-activation
      actions: [read, write]
      description: Activate / deactivate an Akamai Cloudlets policy version onto STAGING / PRODUCTION
    - resource: edgeworkers
      actions: [read, write, delete]
      description: Manage Akamai EdgeWorker identities (name, group, resource tier)
    - resource: edgeworker-activation
      actions: [read, write]
      description: Activate / deactivate an Akamai EdgeWorker code-bundle version onto STAGING / PRODUCTION

pipeline:
  configurationTypes:
    - id: network-lists
      group: "Edge Security"
      name: Network Lists
      description: >
        Akamai Network Lists — a named IP/CIDR or GEO list and its elements —
        applied over the Network Lists API v2 (EdgeGrid-signed, HTTPS 443)
      canvasTemplate: config-types/network-lists/canvas.yaml
      defaultConfig: config-types/network-lists/defaults.yaml
      handlers:
        validate: config-types/network-lists/validate
        deploy: config-types/network-lists/deploy
        rollback: config-types/network-lists/rollback
        healthCheck: config-types/network-lists/healthCheck
        driftDetect: config-types/network-lists/driftDetect
        getStatus: config-types/network-lists/getStatus
      targets:
        componentTypes: [akamai]
        requiresCredential: true
        requiresConnectivity: true

    - id: network-list-activation
      group: "Edge Security"
      name: Network List Activation
      description: >
        Activate an Akamai Network List onto STAGING or PRODUCTION over the
        Network Lists API v2 (EdgeGrid-signed). Deploy TRIGGERS the activation and
        is idempotent — a list already active at its current syncPoint is skipped
      canvasTemplate: config-types/network-list-activation/canvas.yaml
      defaultConfig: config-types/network-list-activation/defaults.yaml
      handlers:
        validate: config-types/network-list-activation/validate
        deploy: config-types/network-list-activation/deploy
        rollback: config-types/network-list-activation/rollback
        healthCheck: config-types/network-list-activation/healthCheck
        driftDetect: config-types/network-list-activation/driftDetect
        getStatus: config-types/network-list-activation/getStatus
      targets:
        componentTypes: [akamai]
        requiresCredential: true
        requiresConnectivity: true

    - id: client-lists
      group: "Edge Security"
      name: Client Lists
      description: >
        Akamai Client Lists — the newer replacement for Network Lists (IP/GEO plus
        ASN, TLS fingerprints, file hashes, user IDs, domains and header
        name/value pairs) — applied over the Client Lists API v1 (EdgeGrid-signed)
      canvasTemplate: config-types/client-lists/canvas.yaml
      defaultConfig: config-types/client-lists/defaults.yaml
      handlers:
        validate: config-types/client-lists/validate
        deploy: config-types/client-lists/deploy
        rollback: config-types/client-lists/rollback
        healthCheck: config-types/client-lists/healthCheck
        driftDetect: config-types/client-lists/driftDetect
        getStatus: config-types/client-lists/getStatus
      targets:
        componentTypes: [akamai]
        requiresCredential: true
        requiresConnectivity: true

    - id: dns-zones
      group: "Edge DNS"
      name: DNS Zones
      description: >
        Akamai Edge DNS zones — primary, secondary or alias — applied over the
        Edge DNS API v2 (EdgeGrid-signed, HTTPS 443)
      canvasTemplate: config-types/dns-zones/canvas.yaml
      defaultConfig: config-types/dns-zones/defaults.yaml
      handlers:
        validate: config-types/dns-zones/validate
        deploy: config-types/dns-zones/deploy
        rollback: config-types/dns-zones/rollback
        healthCheck: config-types/dns-zones/healthCheck
        driftDetect: config-types/dns-zones/driftDetect
        getStatus: config-types/dns-zones/getStatus
      targets:
        componentTypes: [akamai]
        requiresCredential: true
        requiresConnectivity: true

    - id: dns-records
      group: "Edge DNS"
      name: DNS Records
      description: >
        Individual Akamai Edge DNS recordsets — name, type, TTL and raw rdata —
        inside a PRIMARY zone, applied over the Edge DNS API v2 (EdgeGrid-signed)
      canvasTemplate: config-types/dns-records/canvas.yaml
      defaultConfig: config-types/dns-records/defaults.yaml
      handlers:
        validate: config-types/dns-records/validate
        deploy: config-types/dns-records/deploy
        rollback: config-types/dns-records/rollback
        healthCheck: config-types/dns-records/healthCheck
        driftDetect: config-types/dns-records/driftDetect
        getStatus: config-types/dns-records/getStatus
      targets:
        componentTypes: [akamai]
        requiresCredential: true
        requiresConnectivity: true

    - id: cloudlets-policies
      group: "Cloudlets"
      name: Cloudlets Policies
      description: >
        Akamai Cloudlets shared policies (Edge Redirector, Request Control, API
        Prioritization, Audience Segmentation, Phased Release, Forward
        Rewrite) and their match-rule versions, applied over the Cloudlets API
        v3 (EdgeGrid-signed)
      canvasTemplate: config-types/cloudlets-policies/canvas.yaml
      defaultConfig: config-types/cloudlets-policies/defaults.yaml
      handlers:
        validate: config-types/cloudlets-policies/validate
        deploy: config-types/cloudlets-policies/deploy
        rollback: config-types/cloudlets-policies/rollback
        healthCheck: config-types/cloudlets-policies/healthCheck
        driftDetect: config-types/cloudlets-policies/driftDetect
        getStatus: config-types/cloudlets-policies/getStatus
      targets:
        componentTypes: [akamai]
        requiresCredential: true
        requiresConnectivity: true

    - id: cloudlets-policy-activation
      group: "Cloudlets"
      name: Cloudlets Policy Activation
      description: >
        Activate or deactivate an Akamai Cloudlets policy version onto
        STAGING or PRODUCTION over the Cloudlets API v3 (EdgeGrid-signed).
        Deploy TRIGGERS the activation and is idempotent — a policy already
        effective at the declared version is skipped
      canvasTemplate: config-types/cloudlets-policy-activation/canvas.yaml
      defaultConfig: config-types/cloudlets-policy-activation/defaults.yaml
      handlers:
        validate: config-types/cloudlets-policy-activation/validate
        deploy: config-types/cloudlets-policy-activation/deploy
        rollback: config-types/cloudlets-policy-activation/rollback
        healthCheck: config-types/cloudlets-policy-activation/healthCheck
        driftDetect: config-types/cloudlets-policy-activation/driftDetect
        getStatus: config-types/cloudlets-policy-activation/getStatus
      targets:
        componentTypes: [akamai]
        requiresCredential: true
        requiresConnectivity: true

    - id: edgeworkers
      group: "EdgeWorkers"
      name: EdgeWorkers
      description: >
        Akamai EdgeWorker identities (name, group, resource tier) applied over
        the EdgeWorkers API v1 (EdgeGrid-signed). The code bundle itself ships
        via CI/CD or the Akamai CLI — this manages identity only
      canvasTemplate: config-types/edgeworkers/canvas.yaml
      defaultConfig: config-types/edgeworkers/defaults.yaml
      handlers:
        validate: config-types/edgeworkers/validate
        deploy: config-types/edgeworkers/deploy
        rollback: config-types/edgeworkers/rollback
        healthCheck: config-types/edgeworkers/healthCheck
        driftDetect: config-types/edgeworkers/driftDetect
        getStatus: config-types/edgeworkers/getStatus
      targets:
        componentTypes: [akamai]
        requiresCredential: true
        requiresConnectivity: true

    - id: edgeworker-activation
      group: "EdgeWorkers"
      name: EdgeWorker Activation
      description: >
        Activate or deactivate an Akamai EdgeWorker code-bundle version onto
        STAGING or PRODUCTION over the EdgeWorkers API v1 (EdgeGrid-signed).
        Deploy TRIGGERS the activation and is idempotent — an EdgeWorker
        already effective at the declared version is skipped
      canvasTemplate: config-types/edgeworker-activation/canvas.yaml
      defaultConfig: config-types/edgeworker-activation/defaults.yaml
      handlers:
        validate: config-types/edgeworker-activation/validate
        deploy: config-types/edgeworker-activation/deploy
        rollback: config-types/edgeworker-activation/rollback
        healthCheck: config-types/edgeworker-activation/healthCheck
        driftDetect: config-types/edgeworker-activation/driftDetect
        getStatus: config-types/edgeworker-activation/getStatus
      targets:
        componentTypes: [akamai]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/akamai

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the Akamai API host (component) with
    # the EdgeGrid credential, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's host + EdgeGrid
# credential against the Network Lists API v2
# (GET /network-list/v2/network-lists?listType=IP&includeElements=false).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request timeout (seconds)
    description: How long to wait for the Akamai API before giving up.
    default: 30
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
