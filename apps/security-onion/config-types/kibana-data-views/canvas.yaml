# =============================================================================
# Canvas Template — Security Onion Kibana Data Views
#
# Declares ONE Kibana data view / index pattern (the item). Users add as many
# as they need. Field keys must match config-types/kibana-data-views/validate.ts.
# Applied via Kibana's own Data Views REST API, reachable at the SOC console's
# HTTPS port (443) the same way this app's `detections` config type already
# reaches Kibana's Detection Engine API — see README Coverage.
# =============================================================================

id: "security-onion-kibana-data-views"
name: "Kibana Data Views"
toolType: "security-onion"
entityType: "kibana-data-views"
description: "Manage Kibana data views (index patterns) — which indices/data streams appear in Discover, Dashboards and Hunt — via the Kibana REST API on the SOC console (443)"

item:
  label: "Data View"
  identityField: "dataViewId"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Data View"
      icon: "table"
      description: "Identity and the index pattern it matches"
      fields:
        - key: "dataViewId"
          label: "Data View ID"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[a-zA-Z0-9._-]+$"
            maxLength: 200
          helpText: "A stable, unique ID for this data view, e.g. so-custom-syslog"

        - key: "title"
          label: "Index Pattern"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Wildcard index/data-stream pattern this view matches, e.g. logs-custom-syslog-*"

        - key: "name"
          label: "Display Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The name shown for this data view in Kibana/Discover"

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this data view exists — recorded for audit"

    - name: "Time Field"
      icon: "clock"
      description: "The timestamp field used for time-range filtering"
      fields:
        - key: "timeFieldName"
          label: "Time Field Name"
          fieldType: "text"
          required: false
          defaultValue: "@timestamp"
          validation:
            maxLength: 255
          helpText: "Timestamp field for time-based filtering — leave blank for a non-time-based view"
