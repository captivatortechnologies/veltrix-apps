# =============================================================================
# Canvas Template — Security Onion Elasticsearch ILM
#
# Declares ONE Index Lifecycle Management policy (the item). Users add as many
# as they need. Field keys must match config-types/elastic-ilm/validate.ts.
# Applied via the Elasticsearch REST API (_ilm/policy) on port 9200.
# =============================================================================

id: "security-onion-elastic-ilm"
name: "Elasticsearch ILM Policies"
toolType: "security-onion"
entityType: "elastic-ilm"
description: "Manage Elasticsearch Index Lifecycle Management (ILM) policies — hot rollover and total retention — via the Elasticsearch REST API (9200)"

item:
  label: "ILM Policy"
  identityField: "policyName"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Policy"
      icon: "database"
      description: "Index lifecycle policy identity"
      fields:
        - key: "policyName"
          label: "Policy Name"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[a-zA-Z0-9._-]+$"
            maxLength: 255
          helpText: "The ILM policy name, e.g. so-logs-ilm"

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this retention policy is set — recorded for audit"

    - name: "Hot Phase"
      icon: "flame"
      description: "Rollover thresholds for the active (hot) index"
      fields:
        - key: "hotMaxAgeDays"
          label: "Hot Max Age (days)"
          fieldType: "number"
          required: true
          defaultValue: 7
          validation:
            min: 1
          helpText: "Roll over the write index once it reaches this age, in days"

        - key: "hotMaxPrimaryShardSizeGb"
          label: "Hot Max Primary Shard Size (GB)"
          fieldType: "number"
          required: false
          validation:
            min: 1
          helpText: "Optional — also roll over when a primary shard reaches this size, in GB"

    - name: "Retention"
      icon: "clock"
      description: "Total time to keep the data before deletion"
      fields:
        - key: "deleteMinAgeDays"
          label: "Total Retention (days)"
          fieldType: "number"
          required: true
          defaultValue: 30
          validation:
            min: 1
          helpText: "Delete the index this many days after creation (must be >= Hot Max Age)"
