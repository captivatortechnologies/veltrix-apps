id: cybereason
name: Cybereason
version: "0.3.0"
vendor: Veltrix
description: >
  Manage the Cybereason Defense Platform as code. Author custom reputations
  (allowlist / blocklist for file hashes, domains and IPs), sensor groups,
  isolation (exception) rules, sensor policies (anti-malware, anti-exploit,
  behavioral rules engine and more) and per-sensor tags, and drive them through
  the Security-as-Code pipeline — validate, deploy, health check, drift
  detection and rollback — over the Cybereason REST API. Auth is a
  session-cookie login (username / password → JSESSIONID) reused on every
  subsequent /rest call.
category: EDR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/cybereason
icon: "🛡️"

platform:
  minVersion: "1.0.0"

# Cybereason's brand crimson. Used as an accent in defined slots only — never as
# a page-wide theme. Placeholder until the official lockup is added.
branding:
  primaryColor: "#B31E30"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: reputations
      actions: [read, write, delete]
      description: Manage Cybereason custom reputations (allowlist / blocklist for file hashes, domains and IPs)
    - resource: sensor-groups
      actions: [read, write, delete]
      description: Manage Cybereason sensor groups — name, description, assigned policy and optional dynamic assignment rule (/rest/groups)
    - resource: isolation-rules
      actions: [read, write, delete]
      description: Manage Cybereason isolation (exception) rules — which traffic is blocked / allowed while a sensor is isolated (/rest/settings/isolation-rule)
    - resource: sensor-policies
      actions: [read, write, delete]
      description: Manage Cybereason sensor policies — anti-malware, anti-exploit, anti-ransomware, application control, PowerShell protection, the behavioral rules engine and more (/rest/policies)
    - resource: sensor-tags
      actions: [read, write, delete]
      description: Manage per-sensor tags — department, location, device type, critical asset, custom tags (/rest/tagging/process_tags)

pipeline:
  configurationTypes:
    - id: reputations
      group: "Reputations"
      name: Custom Reputations
      description: Cybereason custom reputations — allowlist / blocklist entries for file hashes, domains and IPs, applied over the Cybereason REST API (POST /rest/classification/update)
      canvasTemplate: config-types/reputations/canvas.yaml
      defaultConfig: config-types/reputations/defaults.yaml
      handlers:
        validate: config-types/reputations/validate
        deploy: config-types/reputations/deploy
        rollback: config-types/reputations/rollback
        healthCheck: config-types/reputations/healthCheck
        driftDetect: config-types/reputations/driftDetect
        getStatus: config-types/reputations/getStatus
      targets:
        componentTypes: [cybereason-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: sensor-groups
      group: "Sensor Management"
      name: Sensor Groups
      description: >
        Cybereason sensor groups — name, description, assigned policy and an
        optional dynamic assignment rule — upserted by name over the Cybereason
        REST API (GET/POST /rest/groups, PUT/DELETE /rest/groups/{id}). Listing +
        create/update/delete are all confirmed write paths; the inner shape of the
        dynamic groupAssignRule is FLAGGED (passed through as opaque JSON).
      canvasTemplate: config-types/sensor-groups/canvas.yaml
      defaultConfig: config-types/sensor-groups/defaults.yaml
      handlers:
        validate: config-types/sensor-groups/validate
        deploy: config-types/sensor-groups/deploy
        rollback: config-types/sensor-groups/rollback
        healthCheck: config-types/sensor-groups/healthCheck
        driftDetect: config-types/sensor-groups/driftDetect
        getStatus: config-types/sensor-groups/getStatus
      targets:
        componentTypes: [cybereason-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: isolation-rules
      group: "Isolation"
      name: Isolation Rules
      description: >
        Cybereason isolation (exception) rules — which traffic is blocked / allowed
        while a sensor is isolated (IP address, direction, port, blocking) — upserted
        by the composite identity (ip + direction + port) over the Cybereason REST
        API (GET/POST/PUT /rest/settings/isolation-rule, POST .../delete). Update
        carries the live rule's lastUpdated optimistic-concurrency token.
      canvasTemplate: config-types/isolation-rules/canvas.yaml
      defaultConfig: config-types/isolation-rules/defaults.yaml
      handlers:
        validate: config-types/isolation-rules/validate
        deploy: config-types/isolation-rules/deploy
        rollback: config-types/isolation-rules/rollback
        healthCheck: config-types/isolation-rules/healthCheck
        driftDetect: config-types/isolation-rules/driftDetect
        getStatus: config-types/isolation-rules/getStatus
      targets:
        componentTypes: [cybereason-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: sensor-policies
      group: "Sensor Policies"
      name: Sensor Policies
      description: >
        Cybereason sensor policies — anti-malware, anti-exploit, anti-ransomware,
        application control, PowerShell protection, the behavioral rules engine
        and more — upserted by name over the Cybereason REST API (GET/POST
        /rest/policies, GET/PUT/DELETE /rest/policies/{id}). List/get/create/
        delete are confirmed writes; updating an EXISTING policy (PUT) is
        FLAGGED — inferred by symmetry with the confirmed Groups endpoint and
        not independently confirmed from public sources.
      canvasTemplate: config-types/sensor-policies/canvas.yaml
      defaultConfig: config-types/sensor-policies/defaults.yaml
      handlers:
        validate: config-types/sensor-policies/validate
        deploy: config-types/sensor-policies/deploy
        rollback: config-types/sensor-policies/rollback
        healthCheck: config-types/sensor-policies/healthCheck
        driftDetect: config-types/sensor-policies/driftDetect
        getStatus: config-types/sensor-policies/getStatus
      targets:
        componentTypes: [cybereason-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: sensor-tags
      group: "Sensor Management"
      name: Sensor Tags
      description: >
        Per-sensor tags — department, location, device type, critical asset,
        custom tags — applied by pylumId over the Cybereason REST API (POST
        /rest/tagging/process_tags; read via POST /rest/sensors/query). A field
        left blank removes that tag.
      canvasTemplate: config-types/sensor-tags/canvas.yaml
      defaultConfig: config-types/sensor-tags/defaults.yaml
      handlers:
        validate: config-types/sensor-tags/validate
        deploy: config-types/sensor-tags/deploy
        rollback: config-types/sensor-tags/rollback
        healthCheck: config-types/sensor-tags/healthCheck
        driftDetect: config-types/sensor-tags/driftDetect
        getStatus: config-types/sensor-tags/getStatus
      targets:
        componentTypes: [cybereason-tenant]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/cybereason

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the Cybereason tenant (component)
    # with the username/password credential, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings
      order: 1

# Connection-level connectivity test: verifies a Connection's tenant URL +
# username/password against the Cybereason REST API (session-cookie login).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: API Request Timeout (seconds)
    description: Timeout applied to each Cybereason REST API request
    default: 30
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
