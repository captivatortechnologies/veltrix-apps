id: cisco-ise
name: Cisco ISE
version: "0.3.0"
vendor: Veltrix
description: >
  Manage Cisco Identity Services Engine (ISE) — network access control (NAC) —
  configuration as code through the ISE External RESTful Services (ERS) API.
  Covers endpoint identity groups, network device groups (NDGs), network
  devices (NAS/AAA clients), standard authorization profiles, downloadable
  ACLs, TrustSec Security Group Tags and ACLs, Allowed Protocols services,
  internal users, user identity groups, and individual endpoints — with
  validation, drift detection and rollback handled by the Security-as-Code
  pipeline. Authenticates as an ISE administrator (the ERS-Admin or
  ERS-Operator group) via HTTP Basic auth against the PAN/admin node's
  dedicated ERS port (9060). ISE's newer OpenAPI surface (/api/v1/...) was
  evaluated too — see the README's Coverage section for why every writable
  config type here stays on ERS.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/cisco-ise
icon: "🪪"

platform:
  minVersion: "1.0.0"

# Cisco's brand blue.
branding:
  primaryColor: "#049FD9"
  accentColor: "#005073"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: endpoint-identity-groups
      actions: [read, write, delete]
      description: Manage Cisco ISE endpoint identity groups (non-system-defined) via the ERS API
    - resource: network-device-groups
      actions: [read, write, delete]
      description: Manage Cisco ISE Network Device Groups (NDG hierarchies) via the ERS API
    - resource: network-devices
      actions: [read, write, delete]
      description: Manage Cisco ISE network devices (NAS/AAA clients) via the ERS API
    - resource: authorization-profiles
      actions: [read, write, delete]
      description: Manage Cisco ISE standard (SWITCH) authorization profiles via the ERS API

    - resource: downloadable-acls
      actions: [read, write, delete]
      description: Manage Cisco ISE downloadable ACL policy elements via the ERS API
    - resource: security-group-tags
      actions: [read, write, delete]
      description: Manage writable Cisco TrustSec Security Group Tags via the ERS API
    - resource: security-group-acls
      actions: [read, write, delete]
      description: Manage Cisco TrustSec Security Group ACLs (SGACLs) via the ERS API
    - resource: allowed-protocols
      actions: [read, write, delete]
      description: Manage Cisco ISE Allowed Protocols services (top-level flags) via the ERS API
    - resource: internal-users
      actions: [read, write, delete]
      description: Manage Cisco ISE internal (local) users via the ERS API
    - resource: user-identity-groups
      actions: [read, write, delete]
      description: Manage Cisco ISE (user) Identity Groups via the ERS API
    - resource: endpoints
      actions: [read, write, delete]
      description: Manage individual Cisco ISE endpoints (MAC addresses) via the ERS API

pipeline:
  configurationTypes:
    - id: endpoint-identity-groups
      group: "Identity Management"
      name: Endpoint Identity Groups
      description: >
        Custom endpoint identity groups — name-keyed, upserted against ISE's
        non-system-defined groups — applied over the ERS API
        (/ers/config/endpointgroup). ISE's built-in groups (Unknown, Profiled,
        Cisco-IP-Phone, Blacklist, ...) are never created or modified.
      canvasTemplate: config-types/endpoint-identity-groups/canvas.yaml
      defaultConfig: config-types/endpoint-identity-groups/defaults.yaml
      handlers:
        validate: config-types/endpoint-identity-groups/validate
        deploy: config-types/endpoint-identity-groups/deploy
        rollback: config-types/endpoint-identity-groups/rollback
        healthCheck: config-types/endpoint-identity-groups/healthCheck
        driftDetect: config-types/endpoint-identity-groups/driftDetect
        getStatus: config-types/endpoint-identity-groups/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: network-device-groups
      group: "Network Devices"
      name: Network Device Groups
      description: >
        Network Device Group (NDG) hierarchies — name-keyed by the full
        "#"-path from the NDG root — applied over the ERS API
        (/ers/config/networkdevicegroup). The root category (`othername`) is
        always derived from the name, never authored separately.
      canvasTemplate: config-types/network-device-groups/canvas.yaml
      defaultConfig: config-types/network-device-groups/defaults.yaml
      handlers:
        validate: config-types/network-device-groups/validate
        deploy: config-types/network-device-groups/deploy
        rollback: config-types/network-device-groups/rollback
        healthCheck: config-types/network-device-groups/healthCheck
        driftDetect: config-types/network-device-groups/driftDetect
        getStatus: config-types/network-device-groups/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: network-devices
      group: "Network Devices"
      name: Network Devices
      description: >
        Network devices (NAS/AAA clients) — name-keyed, with IPv4 address(es),
        Network Device Group membership and an optional RADIUS shared secret —
        applied over the ERS API (/ers/config/networkdevice). The shared
        secret is write-only: ISE never returns it, so it is never diffed or
        captured for rollback.
      canvasTemplate: config-types/network-devices/canvas.yaml
      defaultConfig: config-types/network-devices/defaults.yaml
      handlers:
        validate: config-types/network-devices/validate
        deploy: config-types/network-devices/deploy
        rollback: config-types/network-devices/rollback
        healthCheck: config-types/network-devices/healthCheck
        driftDetect: config-types/network-devices/driftDetect
        getStatus: config-types/network-devices/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: authorization-profiles
      group: "Policy Elements"
      name: Authorization Profiles
      description: >
        Standard (SWITCH) authorization profiles — access type, VLAN, DACL/ACL
        and RADIUS advanced attributes — name-keyed, applied over the ERS API
        (/ers/config/authorizationprofile). TrustSec and TACACS+ profile types
        are out of scope.
      canvasTemplate: config-types/authorization-profiles/canvas.yaml
      defaultConfig: config-types/authorization-profiles/defaults.yaml
      handlers:
        validate: config-types/authorization-profiles/validate
        deploy: config-types/authorization-profiles/deploy
        rollback: config-types/authorization-profiles/rollback
        healthCheck: config-types/authorization-profiles/healthCheck
        driftDetect: config-types/authorization-profiles/driftDetect
        getStatus: config-types/authorization-profiles/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: downloadable-acls
      group: "Policy Elements"
      name: Downloadable ACLs
      description: Named downloadable ACL content applied through /ers/config/downloadableacl.
      canvasTemplate: config-types/downloadable-acls/canvas.yaml
      defaultConfig: config-types/downloadable-acls/defaults.yaml
      handlers:
        validate: config-types/downloadable-acls/validate
        deploy: config-types/downloadable-acls/deploy
        rollback: config-types/downloadable-acls/rollback
        healthCheck: config-types/downloadable-acls/healthCheck
        driftDetect: config-types/downloadable-acls/driftDetect
        getStatus: config-types/downloadable-acls/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: security-group-tags
      group: "TrustSec"
      name: Security Group Tags
      description: Writable Cisco TrustSec SGTs applied through /ers/config/sgt; built-in read-only tags are never authored.
      canvasTemplate: config-types/security-group-tags/canvas.yaml
      defaultConfig: config-types/security-group-tags/defaults.yaml
      handlers:
        validate: config-types/security-group-tags/validate
        deploy: config-types/security-group-tags/deploy
        rollback: config-types/security-group-tags/rollback
        healthCheck: config-types/security-group-tags/healthCheck
        driftDetect: config-types/security-group-tags/driftDetect
        getStatus: config-types/security-group-tags/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: security-group-acls
      group: "TrustSec"
      name: Security Group ACLs
      description: >
        TrustSec Security Group ACLs (SGACLs) — name-keyed, with IP-version and
        newline-joined ACL content — applied over the ERS API
        (/ers/config/sgacl). Referenced from the TrustSec egress matrix, which
        this app does not author (see the README's Coverage section).
      canvasTemplate: config-types/security-group-acls/canvas.yaml
      defaultConfig: config-types/security-group-acls/defaults.yaml
      handlers:
        validate: config-types/security-group-acls/validate
        deploy: config-types/security-group-acls/deploy
        rollback: config-types/security-group-acls/rollback
        healthCheck: config-types/security-group-acls/healthCheck
        driftDetect: config-types/security-group-acls/driftDetect
        getStatus: config-types/security-group-acls/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: allowed-protocols
      group: "Policy Elements"
      name: Allowed Protocols
      description: >
        Allowed Protocols services — top-level authentication-method enable
        flags and preferred EAP protocol — applied over the ERS API
        (/ers/config/allowedprotocols). The nested per-protocol
        (EAP-FAST/TLS/TTLS/PEAP/TEAP) sub-configuration is out of scope.
      canvasTemplate: config-types/allowed-protocols/canvas.yaml
      defaultConfig: config-types/allowed-protocols/defaults.yaml
      handlers:
        validate: config-types/allowed-protocols/validate
        deploy: config-types/allowed-protocols/deploy
        rollback: config-types/allowed-protocols/rollback
        healthCheck: config-types/allowed-protocols/healthCheck
        driftDetect: config-types/allowed-protocols/driftDetect
        getStatus: config-types/allowed-protocols/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: internal-users
      group: "Identity Management"
      name: Internal Users
      description: >
        Internal (local) users — username-keyed, with an optional identity
        group assignment (resolved from names) — applied over the ERS API
        (/ers/config/internaluser). The password and TACACS+ enable password
        are write-only: ISE never returns them, so neither is ever diffed or
        captured for rollback.
      canvasTemplate: config-types/internal-users/canvas.yaml
      defaultConfig: config-types/internal-users/defaults.yaml
      handlers:
        validate: config-types/internal-users/validate
        deploy: config-types/internal-users/deploy
        rollback: config-types/internal-users/rollback
        healthCheck: config-types/internal-users/healthCheck
        driftDetect: config-types/internal-users/driftDetect
        getStatus: config-types/internal-users/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: user-identity-groups
      group: "Identity Management"
      name: User Identity Groups
      description: >
        (User) Identity Groups — name-keyed, with an optional parent group
        (resolved from a name, forming a genuine parent/child tree — unlike
        Network Device Groups' "#"-path convention) — applied over the ERS API
        (/ers/config/identitygroup).
      canvasTemplate: config-types/user-identity-groups/canvas.yaml
      defaultConfig: config-types/user-identity-groups/defaults.yaml
      handlers:
        validate: config-types/user-identity-groups/validate
        deploy: config-types/user-identity-groups/deploy
        rollback: config-types/user-identity-groups/rollback
        healthCheck: config-types/user-identity-groups/healthCheck
        driftDetect: config-types/user-identity-groups/driftDetect
        getStatus: config-types/user-identity-groups/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

    - id: endpoints
      group: "Identity Management"
      name: Endpoints
      description: >
        Individual endpoints (MAC addresses) — MAC-keyed (ISE's own identity
        for this resource, not "name") — with an optional static endpoint
        identity group assignment (resolved from a name) — applied over the
        ERS API (/ers/config/endpoint, wrapper "ERSEndPoint"). Profiler policy
        assignment, portal-user linkage and custom attributes are out of scope.
      canvasTemplate: config-types/endpoints/canvas.yaml
      defaultConfig: config-types/endpoints/defaults.yaml
      handlers:
        validate: config-types/endpoints/validate
        deploy: config-types/endpoints/deploy
        rollback: config-types/endpoints/rollback
        healthCheck: config-types/endpoints/healthCheck
        driftDetect: config-types/endpoints/driftDetect
        getStatus: config-types/endpoints/getStatus
      targets:
        componentTypes: [cisco-ise]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/cisco-ise

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs an ISE PAN/admin node (component)
    # with the ERS administrator credential used to reach it, with a per-row
    # connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the endpoint + credential against
# the ERS API (GET /ers/config/endpointgroup?size=1, HTTP Basic, self-signed
# tolerated per the verify_tls setting).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the ISE ERS endpoint. Off by default —
      ISE ships a self-signed certificate on the ERS port until an administrator
      installs a CA-signed one.
    default: false
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for ISE ERS API calls.
    default: 30
    required: false
