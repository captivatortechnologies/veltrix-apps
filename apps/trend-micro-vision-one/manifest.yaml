id: trend-micro-vision-one
name: Trend Micro Vision One
version: "0.3.0"
vendor: Veltrix
description: >
  Manage Trend Micro Vision One threat intelligence, identity and response
  configuration as code. Author the user-defined Suspicious Object List, its
  Exception (safe / allow) List, the Response Management custom-script library,
  IAM user accounts and Cloud Risk Management custom compliance rules, and drive
  them through the Security-as-Code pipeline (validate, deploy, health check,
  drift detection and rollback) over the Trend Vision One public REST API (v3.0
  and beta, Bearer token). The connection endpoint is your regional Vision One
  API host (e.g. api.xdr.trendmicro.com).
category: EDR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/trend-micro-vision-one
icon: "🛡️"

platform:
  minVersion: "1.0.0"

# Trend Micro brand red.
branding:
  primaryColor: "#D71920"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: suspicious-objects
      actions: [read, write, delete]
      description: Manage the Trend Vision One user-defined Suspicious Object List (add / update / remove)
    - resource: exception-list
      actions: [read, write, delete]
      description: Manage the Trend Vision One Suspicious Object Exception List — the safe / allow list (add / update / remove)
    - resource: custom-scripts
      actions: [read, write, delete]
      description: Manage the Trend Vision One Response Management custom-script library (add / update / remove)
    - resource: user-accounts
      actions: [read, write, delete]
      description: Manage Trend Vision One IAM console user accounts — invite by email, assign a role, control status (add / update / remove)
    - resource: custom-compliance-rules
      actions: [read, write, delete]
      description: Manage Trend Vision One Cloud Risk Management custom compliance rules (add / update / remove)

pipeline:
  configurationTypes:
    - id: suspicious-objects
      group: "Threat Intelligence"
      name: Suspicious Objects
      description: >
        Trend Vision One user-defined suspicious objects — type (domain / ip / url /
        fileSha1 / senderMailAddress), value, scan action (block / log), risk level
        and expiration — applied over the Vision One public REST API
        (/v3.0/threatintel/suspiciousObjects).
      canvasTemplate: config-types/suspicious-objects/canvas.yaml
      defaultConfig: config-types/suspicious-objects/defaults.yaml
      handlers:
        validate: config-types/suspicious-objects/validate
        deploy: config-types/suspicious-objects/deploy
        rollback: config-types/suspicious-objects/rollback
        healthCheck: config-types/suspicious-objects/healthCheck
        driftDetect: config-types/suspicious-objects/driftDetect
        getStatus: config-types/suspicious-objects/getStatus
      targets:
        componentTypes: [trend-vision-one-tenant]
        requiresCredential: true
        requiresConnectivity: true

    - id: exception-list
      group: "Threat Intelligence"
      name: Exception List
      description: >
        Trend Vision One Suspicious Object Exception List — the safe / allow list.
        Type (domain / ip / url / fileSha1 / fileSha256 / senderMailAddress), value
        and description, applied over the Vision One public REST API
        (/v3.0/threatintel/suspiciousObjectExceptions). Exceptions keep matching
        objects off the Suspicious Object List.
      canvasTemplate: config-types/exception-list/canvas.yaml
      defaultConfig: config-types/exception-list/defaults.yaml
      handlers:
        validate: config-types/exception-list/validate
        deploy: config-types/exception-list/deploy
        rollback: config-types/exception-list/rollback
        healthCheck: config-types/exception-list/healthCheck
        driftDetect: config-types/exception-list/driftDetect
        getStatus: config-types/exception-list/getStatus
      targets:
        componentTypes: [trend-vision-one-tenant]
        requiresCredential: true
        requiresConnectivity: true

    - id: custom-scripts
      group: "Response Management"
      name: Custom Scripts
      description: >
        Trend Vision One Response Management custom-script library — file name, type
        (PowerShell / Bash), contents and description, upserted by file name over the
        Vision One public REST API (/v3.0/response/customScripts, multipart upload).
      canvasTemplate: config-types/custom-scripts/canvas.yaml
      defaultConfig: config-types/custom-scripts/defaults.yaml
      handlers:
        validate: config-types/custom-scripts/validate
        deploy: config-types/custom-scripts/deploy
        rollback: config-types/custom-scripts/rollback
        healthCheck: config-types/custom-scripts/healthCheck
        driftDetect: config-types/custom-scripts/driftDetect
        getStatus: config-types/custom-scripts/getStatus
      targets:
        componentTypes: [trend-vision-one-tenant]
        requiresCredential: true
        requiresConnectivity: true

    - id: user-accounts
      group: "Identity & Access"
      name: User Accounts
      description: >
        Trend Vision One IAM console user accounts — invite by email, assign a
        role, control sign-in status and record a description — over the Vision
        One public REST API (/v3.0/iam/accounts). Reconciled by email.
      canvasTemplate: config-types/user-accounts/canvas.yaml
      defaultConfig: config-types/user-accounts/defaults.yaml
      handlers:
        validate: config-types/user-accounts/validate
        deploy: config-types/user-accounts/deploy
        rollback: config-types/user-accounts/rollback
        healthCheck: config-types/user-accounts/healthCheck
        driftDetect: config-types/user-accounts/driftDetect
        getStatus: config-types/user-accounts/getStatus
      targets:
        componentTypes: [trend-vision-one-tenant]
        requiresCredential: true
        requiresConnectivity: true

    - id: custom-compliance-rules
      group: "Cloud Risk Management"
      name: Custom Compliance Rules
      description: >
        Trend Vision One Cloud Risk Management custom compliance rules —
        organization-wide, cloud-provider-scoped detection rules evaluated
        against every connected cloud account — over the Vision One Cloud
        Posture beta REST API (/beta/cloudPosture/customRules). Reconciled by
        name.
      canvasTemplate: config-types/custom-compliance-rules/canvas.yaml
      defaultConfig: config-types/custom-compliance-rules/defaults.yaml
      handlers:
        validate: config-types/custom-compliance-rules/validate
        deploy: config-types/custom-compliance-rules/deploy
        rollback: config-types/custom-compliance-rules/rollback
        healthCheck: config-types/custom-compliance-rules/healthCheck
        driftDetect: config-types/custom-compliance-rules/driftDetect
        getStatus: config-types/custom-compliance-rules/getStatus
      targets:
        componentTypes: [trend-vision-one-tenant]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/trend-micro-vision-one

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a Trend Vision One tenant (component)
    # with the API token credential used to reach it, with a connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies the regional API host + API token
# against the Vision One public API (GET /v3.0/threatintel/suspiciousObjects?top=1).
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Trend Vision One API calls.
    default: 30
    required: false
