id: google-secops
name: Google SecOps
version: "0.4.0"
vendor: Veltrix
description: >
  Manage Google Security Operations (Chronicle) configuration as code through the
  SecOps REST API — Reference Lists, Data Tables, Detection Rules, Rule
  Deployments, Data Access Labels and Data Access Scopes — with validation, drift
  detection and rollback handled by the Security-as-Code pipeline.
category: SIEM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/google-secops
icon: "🛰️"

platform:
  minVersion: "1.0.0"

# Google brand: blue primary.
branding:
  primaryColor: "#1A73E8"
  accentColor: "#34A853"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: reference-lists
      actions: [read, write, delete]
      description: Manage Google SecOps reference lists (string / regex / CIDR entry sets)
    - resource: data-tables
      actions: [read, write, delete]
      description: Manage Google SecOps data tables (named, typed columnar tables of rows)
    - resource: rules
      actions: [read, write, delete]
      description: Manage Google SecOps detection rules (YARA-L 2.0 rule text; deployment state is out of scope)
    - resource: rule-deployments
      actions: [read, write, delete]
      description: Manage the deployment state (enabled / alerting / run frequency) of Google SecOps detection rules
    - resource: data-access-labels
      actions: [read, write, delete]
      description: Manage Google SecOps data access labels (named UDM-query tags used to restrict data visibility)
    - resource: data-access-scopes
      actions: [read, write, delete]
      description: Manage Google SecOps data access scopes (boolean expressions of data access labels)

pipeline:
  configurationTypes:
    - id: data-tables
      name: Data Tables
      description: Data tables — named, typed columnar tables (id-keyed; immutable schema; rows reconciled via bulkReplace)
      canvasTemplate: config-types/data-tables/canvas.yaml
      defaultConfig: config-types/data-tables/defaults.yaml
      handlers:
        validate: config-types/data-tables/validate
        deploy: config-types/data-tables/deploy
        rollback: config-types/data-tables/rollback
        healthCheck: config-types/data-tables/healthCheck
        driftDetect: config-types/data-tables/driftDetect
        getStatus: config-types/data-tables/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: reference-lists
      name: Reference Lists
      description: Reference lists — named string / regex / CIDR entry sets (id-keyed; entries reconciled; cannot be deleted, only emptied)
      canvasTemplate: config-types/reference-lists/canvas.yaml
      defaultConfig: config-types/reference-lists/defaults.yaml
      handlers:
        validate: config-types/reference-lists/validate
        deploy: config-types/reference-lists/deploy
        rollback: config-types/reference-lists/rollback
        healthCheck: config-types/reference-lists/healthCheck
        driftDetect: config-types/reference-lists/driftDetect
        getStatus: config-types/reference-lists/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: rules
      name: Detection Rules
      description: Detection rules — YARA-L 2.0 rule text (identity is the rule name; verified then created/updated as new revisions; app-created rules are deleted on reconcile; deployment state is out of scope)
      canvasTemplate: config-types/rules/canvas.yaml
      defaultConfig: config-types/rules/defaults.yaml
      handlers:
        validate: config-types/rules/validate
        deploy: config-types/rules/deploy
        rollback: config-types/rules/rollback
        healthCheck: config-types/rules/healthCheck
        driftDetect: config-types/rules/driftDetect
        getStatus: config-types/rules/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: rule-deployments
      name: Rule Deployments
      description: Rule deployments — the enabled / alerting / run-frequency state of a detection rule (identity is the rule name; nested rules/{id}/deployment sub-resource reconciled by PATCH; never created/deleted, rollback restores prior state; rule text is out of scope)
      canvasTemplate: config-types/rule-deployments/canvas.yaml
      defaultConfig: config-types/rule-deployments/defaults.yaml
      handlers:
        validate: config-types/rule-deployments/validate
        deploy: config-types/rule-deployments/deploy
        rollback: config-types/rule-deployments/rollback
        healthCheck: config-types/rule-deployments/healthCheck
        driftDetect: config-types/rule-deployments/driftDetect
        getStatus: config-types/rule-deployments/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: data-access-labels
      name: Data Access Labels
      description: Data access labels — named UDM-query tags used to restrict who can see matching event data (id-keyed; only the UDM query and description are updatable; app-created labels are deleted on reconcile)
      canvasTemplate: config-types/data-access-labels/canvas.yaml
      defaultConfig: config-types/data-access-labels/defaults.yaml
      handlers:
        validate: config-types/data-access-labels/validate
        deploy: config-types/data-access-labels/deploy
        rollback: config-types/data-access-labels/rollback
        healthCheck: config-types/data-access-labels/healthCheck
        driftDetect: config-types/data-access-labels/driftDetect
        getStatus: config-types/data-access-labels/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: data-access-scopes
      name: Data Access Scopes
      description: Data access scopes — boolean expressions of allowed / denied data access labels that restrict a permission group's data visibility (id-keyed; allow-all is fixed at creation; app-created scopes are deleted on reconcile)
      canvasTemplate: config-types/data-access-scopes/canvas.yaml
      defaultConfig: config-types/data-access-scopes/defaults.yaml
      handlers:
        validate: config-types/data-access-scopes/validate
        deploy: config-types/data-access-scopes/deploy
        rollback: config-types/data-access-scopes/rollback
        healthCheck: config-types/data-access-scopes/healthCheck
        driftDetect: config-types/data-access-scopes/driftDetect
        getStatus: config-types/data-access-scopes/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/google-secops

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: mints a token and lists reference lists.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: region
    type: string
    label: Region
    description: Your Google SecOps region (e.g. us, europe-west2, asia-southeast1).
    default: us
    required: true
  - key: project_id
    type: string
    label: Project ID
    description: The Google Cloud project id that hosts the SecOps instance.
    required: true
  - key: instance_id
    type: string
    label: Instance ID
    description: Your Google SecOps customer / instance GUID.
    required: true
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Google SecOps API calls.
    default: 30
    required: false
