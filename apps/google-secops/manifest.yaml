id: google-secops
name: Google SecOps
version: "0.3.0"
vendor: Veltrix
description: >
  Manage Google Security Operations (Chronicle) configuration as code through the
  SecOps REST API — Reference Lists, Data Tables and Detection Rules — with
  validation, drift detection and rollback handled by the Security-as-Code
  pipeline.
category: SIEM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/google-secops
icon: "🛰️"

platform:
  minVersion: "1.0.0"

# Google brand: blue primary.
branding:
  primaryColor: "#1A73E8"
  accentColor: "#34A853"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: reference-lists
      actions: [read, write, delete]
      description: Manage Google SecOps reference lists (string / regex / CIDR entry sets)
    - resource: data-tables
      actions: [read, write, delete]
      description: Manage Google SecOps data tables (named, typed columnar tables of rows)
    - resource: rules
      actions: [read, write, delete]
      description: Manage Google SecOps detection rules (YARA-L 2.0 rule text; deployment state is out of scope)

pipeline:
  configurationTypes:
    - id: data-tables
      name: Data Tables
      description: Data tables — named, typed columnar tables (id-keyed; immutable schema; rows reconciled via bulkReplace)
      canvasTemplate: config-types/data-tables/canvas.yaml
      defaultConfig: config-types/data-tables/defaults.yaml
      handlers:
        validate: config-types/data-tables/validate
        deploy: config-types/data-tables/deploy
        rollback: config-types/data-tables/rollback
        healthCheck: config-types/data-tables/healthCheck
        driftDetect: config-types/data-tables/driftDetect
        getStatus: config-types/data-tables/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: reference-lists
      name: Reference Lists
      description: Reference lists — named string / regex / CIDR entry sets (id-keyed; entries reconciled; cannot be deleted, only emptied)
      canvasTemplate: config-types/reference-lists/canvas.yaml
      defaultConfig: config-types/reference-lists/defaults.yaml
      handlers:
        validate: config-types/reference-lists/validate
        deploy: config-types/reference-lists/deploy
        rollback: config-types/reference-lists/rollback
        healthCheck: config-types/reference-lists/healthCheck
        driftDetect: config-types/reference-lists/driftDetect
        getStatus: config-types/reference-lists/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: rules
      name: Detection Rules
      description: Detection rules — YARA-L 2.0 rule text (identity is the rule name; verified then created/updated as new revisions; app-created rules are deleted on reconcile; deployment state is out of scope)
      canvasTemplate: config-types/rules/canvas.yaml
      defaultConfig: config-types/rules/defaults.yaml
      handlers:
        validate: config-types/rules/validate
        deploy: config-types/rules/deploy
        rollback: config-types/rules/rollback
        healthCheck: config-types/rules/healthCheck
        driftDetect: config-types/rules/driftDetect
        getStatus: config-types/rules/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/google-secops

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: mints a token and lists reference lists.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: region
    type: string
    label: Region
    description: Your Google SecOps region (e.g. us, europe-west2, asia-southeast1).
    default: us
    required: true
  - key: project_id
    type: string
    label: Project ID
    description: The Google Cloud project id that hosts the SecOps instance.
    required: true
  - key: instance_id
    type: string
    label: Instance ID
    description: Your Google SecOps customer / instance GUID.
    required: true
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Google SecOps API calls.
    default: 30
    required: false
