id: google-secops
name: Google SecOps
version: "0.6.0"
vendor: Veltrix
description: >
  Manage Google Security Operations (Chronicle) configuration as code through the
  SecOps REST API — Reference Lists, Data Tables, Detection Rules, Rule
  Deployments, Data Access Labels and Scopes, Data Feeds, Forwarders and their
  Collectors, Entity Watchlists, Findings Refinements and their Deployments,
  Curated Rule Set Deployments, Custom Parsers and Parser Extensions, Log
  Processing Pipelines, Native Dashboards and BigQuery Export — with validation,
  drift detection and rollback handled by the Security-as-Code pipeline.
category: SIEM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/google-secops
icon: "🛰️"

platform:
  minVersion: "1.0.0"

# Google brand: blue primary.
branding:
  primaryColor: "#1A73E8"
  accentColor: "#34A853"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: reference-lists
      actions: [read, write, delete]
      description: Manage Google SecOps reference lists (string / regex / CIDR entry sets)
    - resource: data-tables
      actions: [read, write, delete]
      description: Manage Google SecOps data tables (named, typed columnar tables of rows)
    - resource: rules
      actions: [read, write, delete]
      description: Manage Google SecOps detection rules (YARA-L 2.0 rule text; deployment state is out of scope)
    - resource: rule-deployments
      actions: [read, write, delete]
      description: Manage the deployment state (enabled / alerting / run frequency) of Google SecOps detection rules
    - resource: data-access-labels
      actions: [read, write, delete]
      description: Manage Google SecOps data access labels (named UDM-query tags used to restrict data visibility)
    - resource: data-access-scopes
      actions: [read, write, delete]
      description: Manage Google SecOps data access scopes (boolean expressions of data access labels)
    - resource: feeds
      actions: [read, write, delete]
      description: Manage Google SecOps data feeds (log-ingestion connectors; per-source settings as a validated JSON blob)
    - resource: forwarders
      actions: [read, write, delete]
      description: Manage Google SecOps forwarders (on-prem collector-agent configurations)
    - resource: watchlists
      actions: [read, write, delete]
      description: Manage Google SecOps entity watchlists (named entity groups whose risk score is boosted)
    - resource: findings-refinements
      actions: [read, write, delete]
      description: Manage Google SecOps findings refinements (detection exclusions; no-delete — reconciled by disabling the deployment)
    - resource: forwarder-collectors
      actions: [read, write, delete]
      description: Manage Google SecOps forwarder collectors (per-forwarder input sources; nested under a forwarder)
    - resource: curated-ruleset-deployments
      actions: [read, write, delete]
      description: Manage the deployment state (enabled / alerting) of Google-curated SecOps rule sets
    - resource: parsers
      actions: [read, write, delete]
      description: Manage Google SecOps custom log parsers (per log type; immutable, versioned, create + activate)
    - resource: parser-extensions
      actions: [read, write, delete]
      description: Manage Google SecOps parser extensions (per log type; CBN snippet extending the base parser; immutable, create + activate)
    - resource: log-processing-pipelines
      actions: [read, write, delete]
      description: Manage Google SecOps log processing pipelines (ingest-time routing / transform steps; client-set id)
    - resource: bigquery-export
      actions: [read, write, delete]
      description: Manage Google SecOps BigQuery Export per-data-source settings (instance singleton; get + patch)
    - resource: findings-refinement-deployments
      actions: [read, write, delete]
      description: Manage the deployment state (enabled, archived and detector scope) of Google SecOps findings refinements
    - resource: native-dashboards
      actions: [read, write, delete]
      description: Manage Google SecOps Native Dashboards (dashboard shell and global filters; chart content is out of scope)

pipeline:
  configurationTypes:
    - id: data-tables
      name: Data Tables
      description: Data tables — named, typed columnar tables (id-keyed; immutable schema; rows reconciled via bulkReplace)
      canvasTemplate: config-types/data-tables/canvas.yaml
      defaultConfig: config-types/data-tables/defaults.yaml
      handlers:
        validate: config-types/data-tables/validate
        deploy: config-types/data-tables/deploy
        rollback: config-types/data-tables/rollback
        healthCheck: config-types/data-tables/healthCheck
        driftDetect: config-types/data-tables/driftDetect
        getStatus: config-types/data-tables/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: reference-lists
      name: Reference Lists
      description: Reference lists — named string / regex / CIDR entry sets (id-keyed; entries reconciled; cannot be deleted, only emptied)
      canvasTemplate: config-types/reference-lists/canvas.yaml
      defaultConfig: config-types/reference-lists/defaults.yaml
      handlers:
        validate: config-types/reference-lists/validate
        deploy: config-types/reference-lists/deploy
        rollback: config-types/reference-lists/rollback
        healthCheck: config-types/reference-lists/healthCheck
        driftDetect: config-types/reference-lists/driftDetect
        getStatus: config-types/reference-lists/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: rules
      name: Detection Rules
      description: Detection rules — YARA-L 2.0 rule text (identity is the rule name; verified then created/updated as new revisions; app-created rules are deleted on reconcile; deployment state is out of scope)
      canvasTemplate: config-types/rules/canvas.yaml
      defaultConfig: config-types/rules/defaults.yaml
      handlers:
        validate: config-types/rules/validate
        deploy: config-types/rules/deploy
        rollback: config-types/rules/rollback
        healthCheck: config-types/rules/healthCheck
        driftDetect: config-types/rules/driftDetect
        getStatus: config-types/rules/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: rule-deployments
      name: Rule Deployments
      description: Rule deployments — the enabled / alerting / run-frequency state of a detection rule (identity is the rule name; nested rules/{id}/deployment sub-resource reconciled by PATCH; never created/deleted, rollback restores prior state; rule text is out of scope)
      canvasTemplate: config-types/rule-deployments/canvas.yaml
      defaultConfig: config-types/rule-deployments/defaults.yaml
      handlers:
        validate: config-types/rule-deployments/validate
        deploy: config-types/rule-deployments/deploy
        rollback: config-types/rule-deployments/rollback
        healthCheck: config-types/rule-deployments/healthCheck
        driftDetect: config-types/rule-deployments/driftDetect
        getStatus: config-types/rule-deployments/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: data-access-labels
      name: Data Access Labels
      description: Data access labels — named UDM-query tags used to restrict who can see matching event data (id-keyed; only the UDM query and description are updatable; app-created labels are deleted on reconcile)
      canvasTemplate: config-types/data-access-labels/canvas.yaml
      defaultConfig: config-types/data-access-labels/defaults.yaml
      handlers:
        validate: config-types/data-access-labels/validate
        deploy: config-types/data-access-labels/deploy
        rollback: config-types/data-access-labels/rollback
        healthCheck: config-types/data-access-labels/healthCheck
        driftDetect: config-types/data-access-labels/driftDetect
        getStatus: config-types/data-access-labels/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: data-access-scopes
      name: Data Access Scopes
      description: Data access scopes — boolean expressions of allowed / denied data access labels that restrict a permission group's data visibility (id-keyed; allow-all is fixed at creation; app-created scopes are deleted on reconcile)
      canvasTemplate: config-types/data-access-scopes/canvas.yaml
      defaultConfig: config-types/data-access-scopes/defaults.yaml
      handlers:
        validate: config-types/data-access-scopes/validate
        deploy: config-types/data-access-scopes/deploy
        rollback: config-types/data-access-scopes/rollback
        healthCheck: config-types/data-access-scopes/healthCheck
        driftDetect: config-types/data-access-scopes/driftDetect
        getStatus: config-types/data-access-scopes/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: feeds
      name: Data Feeds
      description: Data feeds — log-ingestion connectors (identity is the display name; source config is a validated `details` JSON blob with per-source secrets treated as write-only; created/updated/deleted; secrets excluded from drift and not restored on rollback)
      canvasTemplate: config-types/feeds/canvas.yaml
      defaultConfig: config-types/feeds/defaults.yaml
      handlers:
        validate: config-types/feeds/validate
        deploy: config-types/feeds/deploy
        rollback: config-types/feeds/rollback
        healthCheck: config-types/feeds/healthCheck
        driftDetect: config-types/feeds/driftDetect
        getStatus: config-types/feeds/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: forwarders
      name: Forwarders
      description: Forwarders — on-prem collector-agent configurations (identity is the display name; agent settings are a validated `config` JSON blob; created/updated/deleted; input sources are managed by the Forwarder Collectors type)
      canvasTemplate: config-types/forwarders/canvas.yaml
      defaultConfig: config-types/forwarders/defaults.yaml
      handlers:
        validate: config-types/forwarders/validate
        deploy: config-types/forwarders/deploy
        rollback: config-types/forwarders/rollback
        healthCheck: config-types/forwarders/healthCheck
        driftDetect: config-types/forwarders/driftDetect
        getStatus: config-types/forwarders/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: watchlists
      name: Watchlists
      description: Entity watchlists — a named group of entities whose risk score is boosted by a multiplying factor (identity is the display name; created/updated/deleted; entity membership is out of scope)
      canvasTemplate: config-types/watchlists/canvas.yaml
      defaultConfig: config-types/watchlists/defaults.yaml
      handlers:
        validate: config-types/watchlists/validate
        deploy: config-types/watchlists/deploy
        rollback: config-types/watchlists/rollback
        healthCheck: config-types/watchlists/healthCheck
        driftDetect: config-types/watchlists/driftDetect
        getStatus: config-types/watchlists/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: findings-refinements
      name: Findings Refinements
      description: Findings refinements — detection exclusions that suppress detections matching a UDM query (identity is the display name; created/updated; NO delete — a removed refinement's deployment is disabled + archived; rollback disables created ones and restores updated ones)
      canvasTemplate: config-types/findings-refinements/canvas.yaml
      defaultConfig: config-types/findings-refinements/defaults.yaml
      handlers:
        validate: config-types/findings-refinements/validate
        deploy: config-types/findings-refinements/deploy
        rollback: config-types/findings-refinements/rollback
        healthCheck: config-types/findings-refinements/healthCheck
        driftDetect: config-types/findings-refinements/driftDetect
        getStatus: config-types/findings-refinements/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: forwarder-collectors
      name: Forwarder Collectors
      description: Forwarder collectors — per-forwarder input sources (nested child; the parent forwarder is resolved by display name; source config is a validated JSON blob with write-only secrets excluded from drift; created/updated/deleted)
      canvasTemplate: config-types/forwarder-collectors/canvas.yaml
      defaultConfig: config-types/forwarder-collectors/defaults.yaml
      handlers:
        validate: config-types/forwarder-collectors/validate
        deploy: config-types/forwarder-collectors/deploy
        rollback: config-types/forwarder-collectors/rollback
        healthCheck: config-types/forwarder-collectors/healthCheck
        driftDetect: config-types/forwarder-collectors/driftDetect
        getStatus: config-types/forwarder-collectors/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: curated-ruleset-deployments
      name: Curated Rule Set Deployments
      description: Curated rule set deployments — the enabled / alerting state of a Google-curated rule set (identity is category + rule set + precision; state-only reconcile via PATCH; Google owns the content so nothing is created or deleted; rollback restores prior state)
      canvasTemplate: config-types/curated-ruleset-deployments/canvas.yaml
      defaultConfig: config-types/curated-ruleset-deployments/defaults.yaml
      handlers:
        validate: config-types/curated-ruleset-deployments/validate
        deploy: config-types/curated-ruleset-deployments/deploy
        rollback: config-types/curated-ruleset-deployments/rollback
        healthCheck: config-types/curated-ruleset-deployments/healthCheck
        driftDetect: config-types/curated-ruleset-deployments/driftDetect
        getStatus: config-types/curated-ruleset-deployments/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: parsers
      name: Custom Parsers
      description: Custom log parsers — per log type (immutable + versioned; deploy content-hashes the code, then creates a new version and activates it, pruning the version it previously created; identity is the log type; reconcile/rollback re-activate the prior parser and delete the created version)
      canvasTemplate: config-types/parsers/canvas.yaml
      defaultConfig: config-types/parsers/defaults.yaml
      handlers:
        validate: config-types/parsers/validate
        deploy: config-types/parsers/deploy
        rollback: config-types/parsers/rollback
        healthCheck: config-types/parsers/healthCheck
        driftDetect: config-types/parsers/driftDetect
        getStatus: config-types/parsers/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: parser-extensions
      name: Parser Extensions
      description: Parser extensions — a CBN snippet that extends the base parser for a log type (immutable + versioned; deploy content-hashes the snippet, then creates a new extension and activates it, deleting the version it previously created; identity is the log type)
      canvasTemplate: config-types/parser-extensions/canvas.yaml
      defaultConfig: config-types/parser-extensions/defaults.yaml
      handlers:
        validate: config-types/parser-extensions/validate
        deploy: config-types/parser-extensions/deploy
        rollback: config-types/parser-extensions/rollback
        healthCheck: config-types/parser-extensions/healthCheck
        driftDetect: config-types/parser-extensions/driftDetect
        getStatus: config-types/parser-extensions/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: log-processing-pipelines
      name: Log Processing Pipelines
      description: Log processing pipelines — ingest-time routing / transform steps (identity is a client-set id; displayName + description + a validated `processors` JSON array; created/updated/deleted)
      canvasTemplate: config-types/log-processing-pipelines/canvas.yaml
      defaultConfig: config-types/log-processing-pipelines/defaults.yaml
      handlers:
        validate: config-types/log-processing-pipelines/validate
        deploy: config-types/log-processing-pipelines/deploy
        rollback: config-types/log-processing-pipelines/rollback
        healthCheck: config-types/log-processing-pipelines/healthCheck
        driftDetect: config-types/log-processing-pipelines/driftDetect
        getStatus: config-types/log-processing-pipelines/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: bigquery-export
      name: BigQuery Export
      description: BigQuery Export — the instance-wide per-data-source export toggles (a singleton; get + patch of udmEvents / udmEventsAggregates / ruleDetections / iocMatches / entityGraph enable + retention; never created or deleted; rollback restores prior settings)
      canvasTemplate: config-types/bigquery-export/canvas.yaml
      defaultConfig: config-types/bigquery-export/defaults.yaml
      handlers:
        validate: config-types/bigquery-export/validate
        deploy: config-types/bigquery-export/deploy
        rollback: config-types/bigquery-export/rollback
        healthCheck: config-types/bigquery-export/healthCheck
        driftDetect: config-types/bigquery-export/driftDetect
        getStatus: config-types/bigquery-export/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: findings-refinement-deployments
      name: Findings Refinement Deployments
      description: Findings refinement deployments — the enabled / archived state and detector scope (curated rule sets, curated rules, detection rules) of a findings refinement (identity is the parent refinement's displayName; the refinement must already exist; nested findingsRefinements/{id}/deployment sub-resource reconciled by PATCH; never created/deleted, rollback restores prior state; refinement content is out of scope)
      canvasTemplate: config-types/findings-refinement-deployments/canvas.yaml
      defaultConfig: config-types/findings-refinement-deployments/defaults.yaml
      handlers:
        validate: config-types/findings-refinement-deployments/validate
        deploy: config-types/findings-refinement-deployments/deploy
        rollback: config-types/findings-refinement-deployments/rollback
        healthCheck: config-types/findings-refinement-deployments/healthCheck
        driftDetect: config-types/findings-refinement-deployments/driftDetect
        getStatus: config-types/findings-refinement-deployments/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

    - id: native-dashboards
      name: Native Dashboards
      description: Native Dashboards — the dashboard container (display name, description, access, pinned) and its global filters (identity is the display name; the dashboardId is server-assigned; created/updated/deleted; app-created dashboards are deleted on reconcile; only CUSTOM-type dashboards are managed; chart content is out of scope — added via addChart/editChart/removeChart in the SecOps console)
      canvasTemplate: config-types/native-dashboards/canvas.yaml
      defaultConfig: config-types/native-dashboards/defaults.yaml
      handlers:
        validate: config-types/native-dashboards/validate
        deploy: config-types/native-dashboards/deploy
        rollback: config-types/native-dashboards/rollback
        healthCheck: config-types/native-dashboards/healthCheck
        driftDetect: config-types/native-dashboards/driftDetect
        getStatus: config-types/native-dashboards/getStatus
      targets:
        componentTypes: [google-secops]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/google-secops

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: mints a token and lists reference lists.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: region
    type: string
    label: Region
    description: Your Google SecOps region (e.g. us, europe-west2, asia-southeast1).
    default: us
    required: true
  - key: project_id
    type: string
    label: Project ID
    description: The Google Cloud project id that hosts the SecOps instance.
    required: true
  - key: instance_id
    type: string
    label: Instance ID
    description: Your Google SecOps customer / instance GUID.
    required: true
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Google SecOps API calls.
    default: 30
    required: false
