id: illumio
name: Illumio
version: "0.3.0"
vendor: Veltrix
description: >
  Manage Illumio Core (Policy Compute Engine) microsegmentation configuration as
  code through the Illumio REST API v2. Covers Labels (key/value policy
  objects), IP Lists and Services (named security-policy objects), and
  Rulesets (label-scoped security rules referencing labels/IP lists/services by
  name, resolved to hrefs and provisioned into the active policy) — with
  validation, drift detection and rollback handled by the Security-as-Code
  pipeline. Authenticates with a PCE API key (username + secret) over HTTP Basic
  auth against the org-scoped REST API. IP lists, services and rulesets use the
  PCE's DRAFT-then-PROVISION model: every write lands in the draft policy, then
  this app provisions (POST /orgs/{org_id}/sec_policy) the changed hrefs into a
  new active policy version in the same deploy.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/illumio
icon: "🕸️"

platform:
  minVersion: "1.0.0"

# Illumio's brand teal-green. Placeholder until the official lockup is added.
branding:
  primaryColor: "#00A99D"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: illumio-labels
      actions: [read, write, delete]
      description: Manage Illumio Core labels (key/value policy objects) used to scope rulesets, boundaries and map views
    - resource: illumio-ip-lists
      actions: [read, write, delete]
      description: Manage Illumio Core IP lists (named IP/CIDR ranges and FQDNs), provisioned into the active policy
    - resource: illumio-services
      actions: [read, write, delete]
      description: Manage Illumio Core services (named TCP/UDP/ICMP port definitions), provisioned into the active policy
    - resource: illumio-rulesets
      actions: [read, write, delete]
      description: Manage Illumio Core rulesets (label-scoped security rules referencing labels/IP lists/services), provisioned into the active policy
    - resource: illumio-label-groups
      actions: [read, write, delete]
      description: Manage Illumio Core label groups (named sets of same-dimension labels), provisioned into the active policy
    - resource: illumio-enforcement-boundaries
      actions: [read, write, delete]
      description: Manage Illumio Core enforcement boundaries (deny-by-default rules), provisioned into the active policy
    - resource: illumio-virtual-services
      actions: [read, write, delete]
      description: Manage Illumio Core virtual services (named port groups workloads classify under), provisioned into the active policy
    - resource: illumio-pairing-profiles
      actions: [read, write, delete]
      description: Manage Illumio Core pairing profiles (VEN onboarding templates) — takes effect immediately, no provisioning step

pipeline:
  configurationTypes:
    - id: labels
      group: "Policy Objects"
      name: Labels
      description: >
        Illumio Core labels — a key/value pair (e.g. role=R-DB, env=E-Prod) used
        to scope rulesets, enforcement boundaries and the illumination map.
        Identity is the (key, value) pair itself; deploy lists the org's labels,
        creates any that are missing, and reconciles metadata
        (external_data_set / external_data_reference) on ones that already
        exist. The `key` must be one of the PCE's built-in dimensions (role, app,
        env, loc) or a custom label dimension already created in the PCE — this
        app does not yet manage label dimensions (label_dimensions API, PCE
        22.5+; planned for a follow-up release).
      canvasTemplate: config-types/labels/canvas.yaml
      defaultConfig: config-types/labels/defaults.yaml
      handlers:
        validate: config-types/labels/validate
        deploy: config-types/labels/deploy
        rollback: config-types/labels/rollback
        healthCheck: config-types/labels/healthCheck
        driftDetect: config-types/labels/driftDetect
        getStatus: config-types/labels/getStatus
      targets:
        componentTypes: [illumio-pce]
        requiresCredential: true
        requiresConnectivity: false

    - id: ip-lists
      group: "Policy Objects"
      name: IP Lists
      description: >
        Illumio Core IP lists — named IP/CIDR ranges and/or FQDNs
        (/orgs/{org_id}/sec_policy/draft/ip_lists). Identity is the list's
        `name`; deploy lists the org's draft IP lists, upserts by name, and
        PROVISIONS every changed href (create/update/delete) into a new active
        policy version in the same deploy. Reconcile only deletes IP lists
        this app created but no longer declares.
      canvasTemplate: config-types/ip-lists/canvas.yaml
      defaultConfig: config-types/ip-lists/defaults.yaml
      handlers:
        validate: config-types/ip-lists/validate
        deploy: config-types/ip-lists/deploy
        rollback: config-types/ip-lists/rollback
        healthCheck: config-types/ip-lists/healthCheck
        driftDetect: config-types/ip-lists/driftDetect
        getStatus: config-types/ip-lists/getStatus
      targets:
        componentTypes: [illumio-pce]
        requiresCredential: true
        requiresConnectivity: false

    - id: services
      group: "Policy Objects"
      name: Services
      description: >
        Illumio Core services — named TCP/UDP/ICMP port definitions
        (/orgs/{org_id}/sec_policy/draft/services). Identity is the service's
        `name`; deploy lists the org's draft services, upserts by name, and
        PROVISIONS every changed href into a new active policy version in the
        same deploy. Windows services are not supported in this release.
      canvasTemplate: config-types/services/canvas.yaml
      defaultConfig: config-types/services/defaults.yaml
      handlers:
        validate: config-types/services/validate
        deploy: config-types/services/deploy
        rollback: config-types/services/rollback
        healthCheck: config-types/services/healthCheck
        driftDetect: config-types/services/driftDetect
        getStatus: config-types/services/getStatus
      targets:
        componentTypes: [illumio-pce]
        requiresCredential: true
        requiresConnectivity: false

    - id: rulesets
      group: "Security Policy"
      name: Rulesets
      description: >
        Illumio Core rulesets — a label scope plus security rules
        (/orgs/{org_id}/sec_policy/draft/rule_sets, rules at
        {rule_set_href}/sec_rules). Each rule's providers/consumers reference a
        label (key+value), an IP list (by name), or "All Workloads"; services
        reference existing Service names. Every reference is resolved by name
        to an href and FAILS CLOSED — an unresolved reference skips the whole
        ruleset rather than deploying a partial rule. Deploy PROVISIONS every
        changed ruleset href into a new active policy version in the same
        deploy. One scope group per ruleset is supported in this release.
      canvasTemplate: config-types/rulesets/canvas.yaml
      defaultConfig: config-types/rulesets/defaults.yaml
      handlers:
        validate: config-types/rulesets/validate
        deploy: config-types/rulesets/deploy
        rollback: config-types/rulesets/rollback
        healthCheck: config-types/rulesets/healthCheck
        driftDetect: config-types/rulesets/driftDetect
        getStatus: config-types/rulesets/getStatus
      targets:
        componentTypes: [illumio-pce]
        requiresCredential: true
        requiresConnectivity: false

    - id: label-groups
      group: "Policy Objects"
      name: Label Groups
      description: >
        Illumio Core label groups — a named set of same-dimension labels
        (/orgs/{org_id}/sec_policy/draft/label_groups). A group's `key` names
        the dimension every member label must share. Identity is the group's
        `name`; deploy resolves every member label (by key+value) to an href
        and FAILS CLOSED on anything unresolved, then PROVISIONS every
        changed href into a new active policy version in the same deploy.
        Sub-groups (a group containing other groups) are not supported in
        this release.
      canvasTemplate: config-types/label-groups/canvas.yaml
      defaultConfig: config-types/label-groups/defaults.yaml
      handlers:
        validate: config-types/label-groups/validate
        deploy: config-types/label-groups/deploy
        rollback: config-types/label-groups/rollback
        healthCheck: config-types/label-groups/healthCheck
        driftDetect: config-types/label-groups/driftDetect
        getStatus: config-types/label-groups/getStatus
      targets:
        componentTypes: [illumio-pce]
        requiresCredential: true
        requiresConnectivity: false

    - id: enforcement-boundaries
      group: "Security Policy"
      name: Enforcement Boundaries
      description: >
        Illumio Core enforcement boundaries — deny-by-default rules
        (/orgs/{org_id}/sec_policy/draft/enforcement_boundaries). Unlike a
        ruleset, a boundary has no scope wrapper: providers, consumers and
        ingress services (each referencing a label, IP list or "All
        Workloads" by name) sit directly on it. Identity is the boundary's
        `name`; every reference is resolved to an href and FAILS CLOSED —
        an unresolved reference skips the whole boundary. Deploy PROVISIONS
        every changed boundary href into a new active policy version in the
        same deploy.
      canvasTemplate: config-types/enforcement-boundaries/canvas.yaml
      defaultConfig: config-types/enforcement-boundaries/defaults.yaml
      handlers:
        validate: config-types/enforcement-boundaries/validate
        deploy: config-types/enforcement-boundaries/deploy
        rollback: config-types/enforcement-boundaries/rollback
        healthCheck: config-types/enforcement-boundaries/healthCheck
        driftDetect: config-types/enforcement-boundaries/driftDetect
        getStatus: config-types/enforcement-boundaries/getStatus
      targets:
        componentTypes: [illumio-pce]
        requiresCredential: true
        requiresConnectivity: false

    - id: virtual-services
      group: "Policy Objects"
      name: Virtual Services
      description: >
        Illumio Core virtual services — a named port group (or reference to
        an existing Service) workloads can be classified under
        (/orgs/{org_id}/sec_policy/draft/virtual_services), for rules that
        should scope against a service rather than individual workload
        labels. Identity is the service's `name`; deploy resolves the
        optional Service-name and label references to hrefs and FAILS CLOSED
        on anything unresolved, then PROVISIONS every changed href into a new
        active policy version in the same deploy. Exactly one of an existing
        Service or inline service ports (TCP/UDP only) is required.
      canvasTemplate: config-types/virtual-services/canvas.yaml
      defaultConfig: config-types/virtual-services/defaults.yaml
      handlers:
        validate: config-types/virtual-services/validate
        deploy: config-types/virtual-services/deploy
        rollback: config-types/virtual-services/rollback
        healthCheck: config-types/virtual-services/healthCheck
        driftDetect: config-types/virtual-services/driftDetect
        getStatus: config-types/virtual-services/getStatus
      targets:
        componentTypes: [illumio-pce]
        requiresCredential: true
        requiresConnectivity: false

    - id: pairing-profiles
      group: "Workloads"
      name: Pairing Profiles
      description: >
        Illumio Core pairing profiles — VEN onboarding templates
        (/orgs/{org_id}/pairing_profiles) controlling starting labels,
        enforcement mode, visibility level and pairing-key limits. UNLIKE
        every other config type in this app, pairing profiles are NOT
        draft-then-provision — writes take effect immediately, the same
        posture as Labels. Identity is the profile's `name`; deploy resolves
        member label references and FAILS CLOSED on anything unresolved.
        Actual VEN pairing (running the pairing script) and pairing keys
        themselves are out of scope — this manages the reusable profile only.
      canvasTemplate: config-types/pairing-profiles/canvas.yaml
      defaultConfig: config-types/pairing-profiles/defaults.yaml
      handlers:
        validate: config-types/pairing-profiles/validate
        deploy: config-types/pairing-profiles/deploy
        rollback: config-types/pairing-profiles/rollback
        healthCheck: config-types/pairing-profiles/healthCheck
        driftDetect: config-types/pairing-profiles/driftDetect
        getStatus: config-types/pairing-profiles/getStatus
      targets:
        componentTypes: [illumio-pce]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/illumio

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the PCE (via the app's host/port/org
    # settings) with the API key/secret credential, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the PCE host/port/org_id settings
# and the API key/secret credential with GET /orgs/{org_id}/labels?max_results=1.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: host
    type: string
    label: PCE host
    description: >
      The Illumio PCE hostname (no scheme), e.g. pce.example.com. For a
      Supercluster, use the region's PCE FQDN. The REST API is reached at
      https://<host>:<port>/api/v2.
    required: true
  - key: port
    type: number
    label: PCE port
    description: >
      The PCE's HTTPS API port. On-premises PCEs commonly use 8443; some
      deployments expose the API on 443 — check your PCE's "Deployment Type"
      documentation or ask your PCE administrator.
    default: 8443
    required: false
  - key: org_id
    type: number
    label: Organization ID
    description: >
      The PCE organization ID this app manages. Single-org PCEs use 1 (the
      default). Every REST path is scoped under /orgs/{org_id}/.
    default: 1
    required: false
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the PCE endpoint. Off by default —
      on-premises PCEs commonly ship a self-signed or internal-CA certificate.
      Turn on once the PCE presents a certificate this platform trusts.
    default: false
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for PCE REST API calls.
    default: 30
    required: false
