        componentTypes: [sailpoint-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: governance-groups
      name: Governance Groups
      description: ISC governance groups (workgroups) — name, description and owner Identity (name-keyed; id stored for rename-safety)
