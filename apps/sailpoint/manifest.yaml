        healthCheck: config-types/mfa-configs/healthCheck
        driftDetect: config-types/mfa-configs/driftDetect
        getStatus: config-types/mfa-configs/getStatus
      targets:
        componentTypes: [sailpoint-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: correlation-configs
      name: Correlation Configs
      description: ISC account correlation configs (name-keyed; id stored for rename-safety; full-replace PUT; correlation attribute assignments)
      canvasTemplate: config-types/correlation-configs/canvas.yaml
      defaultConfig: config-types/correlation-configs/defaults.yaml
      handlers:
        validate: config-types/correlation-configs/validate
        deploy: config-types/correlation-configs/deploy
        rollback: config-types/correlation-configs/rollback
        healthCheck: config-types/correlation-configs/healthCheck
        driftDetect: config-types/correlation-configs/driftDetect
        getStatus: config-types/correlation-configs/getStatus
      targets:
        componentTypes: [sailpoint-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: managed-clusters
      name: Managed Clusters
      description: ISC managed (VA) clusters — cluster record only, VA bootstrap manual (name-keyed; id stored for rename-safety; JSON-Patch updates)
      canvasTemplate: config-types/managed-clusters/canvas.yaml
      defaultConfig: config-types/managed-clusters/defaults.yaml
      handlers:
        validate: config-types/managed-clusters/validate
        deploy: config-types/managed-clusters/deploy
        rollback: config-types/managed-clusters/rollback
        healthCheck: config-types/managed-clusters/healthCheck
        driftDetect: config-types/managed-clusters/driftDetect
        getStatus: config-types/managed-clusters/getStatus
      targets:
        componentTypes: [sailpoint-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: verified-from-addresses
      name: Verified From-Addresses
      description: ISC verified email from-addresses (email-keyed; create/delete only; SES verification is out-of-band so drift reports pending)
      canvasTemplate: config-types/verified-from-addresses/canvas.yaml
      defaultConfig: config-types/verified-from-addresses/defaults.yaml
      handlers:
        validate: config-types/verified-from-addresses/validate
        deploy: config-types/verified-from-addresses/deploy
        rollback: config-types/verified-from-addresses/rollback
        healthCheck: config-types/verified-from-addresses/healthCheck
        driftDetect: config-types/verified-from-addresses/driftDetect
        getStatus: config-types/verified-from-addresses/getStatus
      targets:
        componentTypes: [sailpoint-tenant]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/sailpoint

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the ISC credential by running the
# OAuth2 client-credentials exchange and calling GET /transforms/v1.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: tenant
    type: string
    label: Tenant (org name)
    description: >
      Your ISC org name — the subdomain of your tenant (e.g. "acme" for
      acme.identitynow.com). The API is reached at
      https://{org}.api.identitynow.com.
    required: true
  - key: api_url
    type: string
    label: API URL (override)
    description: >
      Optional full API base URL override for non-standard hosts (e.g.
      https://acme.api.identitynow.com). Takes precedence over Tenant.
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for SailPoint ISC API calls.
    default: 30
    required: false
