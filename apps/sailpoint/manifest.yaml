id: sailpoint
name: SailPoint
version: "0.5.0"
vendor: Veltrix
description: >
  Manage SailPoint Identity Security Cloud (ISC, formerly IdentityNow)
  configuration as code through the ISC API — connectivity (Sources, Source
  Schemas, Provisioning Policies, Correlation Configs, Managed Clusters),
  identity governance (Identity Profiles, Lifecycle States, Identity Attributes,
  Search Attributes, Roles, Access Profiles, Role Dimensions, Segments,
  Governance Groups), policy & compliance (SOD Policies, Password Policies,
  Password Sync Groups, Campaign Templates, MFA and tenant auth/security
  singletons), automation & integration (Workflows, Trigger Subscriptions,
  Connector Rules, Service Desk / SIM Integrations, Notification Templates,
  Verified From-Addresses), Source Apps, Non-Employee Sources and Transforms —
  with validation, drift detection and rollback handled by the Security-as-Code
  pipeline.
category: IAM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/sailpoint
icon: "🪪"

platform:
  minVersion: "1.0.0"

# SailPoint brand: deep navy primary, teal accent.
branding:
  primaryColor: "#0A2540"
  accentColor: "#00B39B"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: transforms
      actions: [read, write, delete]
      description: Manage SailPoint ISC transforms (name, operation type, type-specific attributes; internal transforms protected)
    - resource: segments
      actions: [read, write, delete]
      description: Manage SailPoint ISC segments (name, description, active)
    - resource: governance-groups
      actions: [read, write, delete]
      description: Manage SailPoint ISC governance groups / workgroups (name, description, owner Identity)
    - resource: access-profiles
      actions: [read, write, delete]
      description: Manage SailPoint ISC access profiles (name, owner, source, entitlements, enabled/requestable)
    - resource: roles
      actions: [read, write, delete]
      description: Manage SailPoint ISC roles (name, owner, bundled access profiles, enabled/requestable)
    - resource: password-policies
      actions: [read, write, delete]
      description: Manage SailPoint ISC password policies (length, composition, expiration and strength rules)
    - resource: sources
      actions: [read, write, delete]
      description: Manage SailPoint ISC sources (connector instances — name, owner, connector, connector attributes, delete threshold)
    - resource: workflows
      actions: [read, write, delete]
      description: Manage SailPoint ISC workflows (name, owner, trigger, definition, enabled)
    - resource: identity-profiles
      actions: [read, write, delete]
      description: Manage SailPoint ISC identity profiles (name, owner, priority, authoritative source, attribute config)
    - resource: lifecycle-states
      actions: [read, write, delete]
      description: Manage SailPoint ISC lifecycle states nested under identity profiles (technical name, access profiles, account actions)
    - resource: sod-policies
      actions: [read, write, delete]
      description: Manage SailPoint ISC separation-of-duties policies (name, owner, state, type, conflict criteria)
    - resource: service-desk-integrations
      actions: [read, write, delete]
      description: Manage SailPoint ISC service desk integrations (name, type, connection attributes — secret-bearing)
    - resource: source-apps
      actions: [read, write, delete]
      description: Manage SailPoint ISC source apps (name, account source, match-all-accounts)
    - resource: campaign-templates
      actions: [read, write, delete]
      description: Manage SailPoint ISC certification campaign templates (name, deadline, embedded campaign definition)
    - resource: source-schemas
      actions: [read, write, delete]
      description: Manage SailPoint ISC source schemas nested under sources (account/group attribute definitions)
    - resource: provisioning-policies
      actions: [read, write, delete]
      description: Manage SailPoint ISC provisioning policies nested under sources (keyed by usage type; attribute field generation)
    - resource: password-sync-groups
      actions: [read, write, delete]
      description: Manage SailPoint ISC password sync groups (name, password policy, synced sources)
    - resource: connector-rules
      actions: [read, write, delete]
      description: Manage SailPoint ISC connector rules (name, type, BeanShell source code)
    - resource: search-attribute-config
      actions: [read, write, delete]
      description: Manage SailPoint ISC extended search attributes (name-keyed; display name, source attribute mappings)
    - resource: identity-attributes
      actions: [read, write, delete]
      description: Manage SailPoint ISC custom identity attributes (name-keyed; display, type, searchable, source mappings; standard/system protected)
    - resource: notification-templates
      actions: [read, write, delete]
      description: Manage SailPoint ISC notification templates (composite key key+medium+locale; subject, body; create replaces, reconcile bulk-deletes)
    - resource: trigger-subscriptions
      actions: [read, write, delete]
      description: Manage SailPoint ISC event trigger subscriptions (HTTP/EventBridge; HTTP config secret-bearing, applied on deploy but not drift-tracked)
    - resource: sim-integrations
      actions: [read, write, delete]
      description: Manage SailPoint ISC SIM integrations (name, type, cluster, connection attributes — secret-bearing)
    - resource: non-employee-sources
      actions: [read, write, delete]
      description: Manage SailPoint ISC non-employee sources (name, owner, management workgroup, approvers, account managers)
    - resource: dimensions
      actions: [read, write, delete]
      description: Manage SailPoint ISC role dimensions nested under roles (owner, access profiles, entitlements, membership)
    - resource: tenant-config-singletons
      actions: [read, write, delete]
      description: Manage SailPoint ISC tenant-wide config singletons (access request, password org, public identities, org, auth-org lockout/session/network/service-provider)
    - resource: mfa-configs
      actions: [read, write, delete]
      description: Manage SailPoint ISC MFA method configs (Duo, Okta Verify; configProperties secret-bearing, applied on deploy but not drift-tracked)
    - resource: correlation-configs
      actions: [read, write, delete]
      description: Manage SailPoint ISC account correlation configs (name, correlation attribute assignments)
    - resource: managed-clusters
      actions: [read, write, delete]
      description: Manage SailPoint ISC managed (VA) clusters (name, type, configuration)
    - resource: verified-from-addresses
      actions: [read, write, delete]
      description: Manage SailPoint ISC verified email from-addresses (create/delete keyed by email; SES verification out-of-band)

pipeline:
  configurationTypes:
    - id: access-profiles
      name: Access Profiles
      description: ISC access profiles — bundle entitlements from a single source (name-keyed; id stored for rename-safety; JSON-Patch updates)
      canvasTemplate: config-types/access-profiles/canvas.yaml
      defaultConfig: config-types/access-profiles/defaults.yaml
      handlers:
        validate: config-types/access-profiles/validate
        deploy: config-types/access-profiles/deploy
        rollback: config-types/access-profiles/rollback
        healthCheck: config-types/access-profiles/healthCheck
        driftDetect: config-types/access-profiles/driftDetect
        getStatus: config-types/access-profiles/getStatus
      targets:
        componentTypes: [sailpoint-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: roles
      name: Roles
      description: ISC roles — bundle access profiles to grant access (name-keyed; id stored for rename-safety; JSON-Patch updates; membership out of scope)
      canvasTemplate: config-types/roles/canvas.yaml
      defaultConfig: config-types/roles/defaults.yaml
      handlers:
        validate: config-types/roles/validate
        deploy: config-types/roles/deploy
        rollback: config-types/roles/rollback
        healthCheck: config-types/roles/healthCheck
        driftDetect: config-types/roles/driftDetect
        getStatus: config-types/roles/getStatus
      targets:
        componentTypes: [sailpoint-tenant]
        requiresCredential: true
        requiresConnectivity: false

    - id: password-policies
      name: Password Policies
      description: ISC password policies — length, composition, expiration and strength rules (name-keyed; id stored for rename-safety; full-replace PUT; default policy protected)
      canvasTemplate: config-types/password-policies/canvas.yaml
      defaultConfig: config-types/password-policies/defaults.yaml
