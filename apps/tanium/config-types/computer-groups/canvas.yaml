# =============================================================================
# Canvas Template — Tanium Computer Groups
#
# Declares ONE Tanium computer group (the item). Users add as many as they need.
# Field keys must match config-types/computer-groups/validate.ts. Two authoring
# modes, both landing in the same /api/v2/groups collection for read/update/delete:
#
#   Filter (dynamic) — POST /api/v2/groups           { name, text, filters? }
#   Manual (static)  — POST /api/v2/computer_groups   { name, computer_specs }
#
# A filter-based group is `{ name, text }` where `text` is a Tanium filter
# expression, e.g. `Operating System contains Windows`. An optional structured
# filter JSON is available for advanced specs — verify its shape against a live
# Tanium. A manual group is an explicit, non-dynamic list of computer names
# and/or IP addresses.
# =============================================================================

id: "tanium-computer-groups"
name: "Computer Groups"
toolType: "tanium"
entityType: "computer-groups"
description: "Manage Tanium computer groups — a dynamic filter expression or an explicit host/IP list — via the Tanium REST v2 API (443)"

item:
  label: "Computer Group"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Group"
      icon: "users"
      description: "Group identity and authoring mode"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Computer group name shown in Tanium. Used as the stable identity for upsert and drift."

        - key: "mode"
          label: "Group Type"
          fieldType: "select"
          required: true
          defaultValue: "filter"
          options:
            - label: "Filter expression (dynamic membership)"
              value: "filter"
            - label: "Manual (explicit computers)"
              value: "manual"
          helpText: "Filter groups recompute membership dynamically from a Tanium filter expression. Manual groups list explicit computer names / IP addresses."

    - name: "Filter"
      icon: "filter"
      description: "Membership filter — used when Group Type is Filter expression"
      fields:
        - key: "filterText"
          label: "Filter Expression"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 2000
          visibleWhen:
            field: "mode"
            equals: "filter"
          helpText: "A Tanium filter expression that selects endpoints, e.g. Operating System contains Windows. Maps to the group's text filter."

        - key: "filterJson"
          label: "Structured Filter (advanced)"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 8000
          visibleWhen:
            field: "mode"
            equals: "filter"
          helpText: "Optional structured filter as JSON for advanced specs. Leave blank to use the filter expression above. Verify the structured shape against your Tanium."

    - name: "Manual Membership"
      icon: "list"
      description: "Explicit membership — used when Group Type is Manual"
      fields:
        - key: "computerNames"
          label: "Computer Names"
          fieldType: "tags"
          required: false
          visibleWhen:
            field: "mode"
            equals: "manual"
          helpText: "Explicit computer (host) names to include in this manual group. Maps to computer_specs[].computer_name."

        - key: "ipAddresses"
          label: "IP Addresses"
          fieldType: "tags"
          required: false
          visibleWhen:
            field: "mode"
            equals: "manual"
          helpText: "Explicit IP addresses to include in this manual group. Maps to computer_specs[].ip_address."

    - name: "Audit"
      icon: "file-text"
      description: "Optional audit note"
      fields:
        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this computer group is configured — recorded for audit"
