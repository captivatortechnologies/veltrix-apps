id: hackerone
name: HackerOne
version: "0.2.0"
vendor: Veltrix
description: >
  Manage HackerOne program asset scope as code. Author a program's Structured
  Scopes — the assets in scope for its bug-bounty / vulnerability-disclosure
  program (asset type, identifier, bounty / submission eligibility, max severity
  and tester instruction) — and drive them through the Security-as-Code pipeline
  (validate, deploy, health check, drift detection and rollback) over the
  HackerOne API (https://api.hackerone.com/v1, HTTP Basic auth, JSON:API). The
  target program is selected per scope by its handle and resolved to its id via
  GET /me/programs. No BYOL / no database — HackerOne is a pure SaaS API.
category: COMPLIANCE
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/hackerone
icon: "🐛"

platform:
  minVersion: "1.0.0"

# HackerOne brand: near-black slate. Placeholder until the official lockup is added.
branding:
  primaryColor: "#242A31"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: structured-scopes
      actions: [read, write, delete]
      description: >
        Manage HackerOne program Structured Scopes — create / update the assets in
        scope for a program and archive scopes this app created — over the
        HackerOne API (GET/POST/PUT /programs/{id}/structured_scopes)
    - resource: credential-inquiries
      actions: [read, write, delete]
      description: >
        Manage HackerOne program Credential Inquiries — per structured scope, the
        description of the information researchers must provide to be issued test
        credentials — over the HackerOne API (GET/POST/PUT/DELETE
        /programs/{id}/credential_inquiries). Requires the Team Management
        permission on the API token.

pipeline:
  configurationTypes:
    - id: structured-scopes
      group: "Program Scope"
      name: Structured Scopes
      description: >
        HackerOne program Structured Scopes — asset type, identifier, bounty /
        submission eligibility, max severity and tester instruction — applied over
        the HackerOne API (https://api.hackerone.com/v1). The program is chosen per
        scope by handle and resolved to its id via GET /me/programs; scopes are
        upserted by asset identifier within that program.
      canvasTemplate: config-types/structured-scopes/canvas.yaml
      defaultConfig: config-types/structured-scopes/defaults.yaml
      handlers:
        validate: config-types/structured-scopes/validate
        deploy: config-types/structured-scopes/deploy
        rollback: config-types/structured-scopes/rollback
        healthCheck: config-types/structured-scopes/healthCheck
        driftDetect: config-types/structured-scopes/driftDetect
        getStatus: config-types/structured-scopes/getStatus
      targets:
        componentTypes: [hackerone-program]
        requiresCredential: true
        requiresConnectivity: false

    - id: credential-inquiries
      group: "Credential Management"
      name: Credential Inquiries
      description: >
        HackerOne program Credential Inquiries — per structured scope, the
        description of the information researchers must provide before the program
        issues them test credentials — applied over the HackerOne API
        (https://api.hackerone.com/v1). The program is chosen per inquiry by
        handle and resolved to its id via GET /me/programs; the asset identifier is
        resolved to a structured_scope_id via the program's scope listing, and the
        inquiry is upserted by the scope it attaches to. Requires the Team
        Management permission on the API token.
      canvasTemplate: config-types/credential-inquiries/canvas.yaml
      defaultConfig: config-types/credential-inquiries/defaults.yaml
      handlers:
        validate: config-types/credential-inquiries/validate
        deploy: config-types/credential-inquiries/deploy
        rollback: config-types/credential-inquiries/rollback
        healthCheck: config-types/credential-inquiries/healthCheck
        driftDetect: config-types/credential-inquiries/driftDetect
        getStatus: config-types/credential-inquiries/getStatus
      targets:
        componentTypes: [hackerone-program]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/hackerone

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the HackerOne API (component, fixed
    # host api.hackerone.com) with the API identifier + token (credential) used to
    # reach it, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies the API identifier + token against
# the HackerOne API (GET https://api.hackerone.com/v1/me/programs).
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for HackerOne API calls.
    default: 30
    required: false
