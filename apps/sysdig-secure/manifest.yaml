id: sysdig-secure
name: Sysdig Secure
version: "0.2.0"
vendor: Veltrix
description: >
  Manage Sysdig Secure threat-detection as code — custom Falco rules, lists and
  macros plus the runtime policies that reference them. Author each and drive it
  through the Security-as-Code pipeline (validate, deploy, health check, drift
  detection and rollback) over the Sysdig Secure REST API with a Bearer API
  token. Sysdig SaaS — no infrastructure to host.
category: CLOUD
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/sysdig-secure
icon: "🛡️"

platform:
  minVersion: "1.0.0"

# Sysdig brand teal-green. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#00c9a7"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: falco-rules
      actions: [read, write, delete]
      description: Manage Sysdig Secure custom Falco rules (create / edit / remove)
    - resource: runtime-policies
      actions: [read, write, delete]
      description: Manage Sysdig Secure runtime policies (create / edit / remove)
    - resource: falco-lists
      actions: [read, write, delete]
      description: Manage Sysdig Secure custom Falco lists (create / edit / remove)
    - resource: falco-macros
      actions: [read, write, delete]
      description: Manage Sysdig Secure custom Falco macros (create / edit / remove)

pipeline:
  configurationTypes:
    - id: falco-rules
      group: "Threat Detection"
      name: Falco Rules
      description: Sysdig Secure custom Falco rules — name, condition, output, priority and source — applied over the Sysdig Secure REST API (/api/secure/rules)
      canvasTemplate: config-types/falco-rules/canvas.yaml
      defaultConfig: config-types/falco-rules/defaults.yaml
      handlers:
        validate: config-types/falco-rules/validate
        deploy: config-types/falco-rules/deploy
        rollback: config-types/falco-rules/rollback
        healthCheck: config-types/falco-rules/healthCheck
        driftDetect: config-types/falco-rules/driftDetect
        getStatus: config-types/falco-rules/getStatus
      targets:
        componentTypes: [sysdig-secure]
        requiresCredential: true
        requiresConnectivity: true

    - id: runtime-policies
      group: "Threat Detection"
      name: Runtime Policies
      description: Sysdig Secure runtime policies — the rules they reference, severity, response actions and scope — applied over the Sysdig Secure REST API (/api/v2/policies)
      canvasTemplate: config-types/runtime-policies/canvas.yaml
      defaultConfig: config-types/runtime-policies/defaults.yaml
      handlers:
        validate: config-types/runtime-policies/validate
        deploy: config-types/runtime-policies/deploy
        rollback: config-types/runtime-policies/rollback
        healthCheck: config-types/runtime-policies/healthCheck
        driftDetect: config-types/runtime-policies/driftDetect
        getStatus: config-types/runtime-policies/getStatus
      targets:
        componentTypes: [sysdig-secure]
        requiresCredential: true
        requiresConnectivity: true

    - id: falco-lists
      group: "Threat Detection"
      name: Falco Lists
      description: Sysdig Secure custom Falco lists — a named set of literals reusable across rules and macros — applied over the Sysdig Secure REST API (/api/secure/falco/lists)
      canvasTemplate: config-types/falco-lists/canvas.yaml
      defaultConfig: config-types/falco-lists/defaults.yaml
      handlers:
        validate: config-types/falco-lists/validate
        deploy: config-types/falco-lists/deploy
        rollback: config-types/falco-lists/rollback
        healthCheck: config-types/falco-lists/healthCheck
        driftDetect: config-types/falco-lists/driftDetect
        getStatus: config-types/falco-lists/getStatus
      targets:
        componentTypes: [sysdig-secure]
        requiresCredential: true
        requiresConnectivity: true

    - id: falco-macros
      group: "Threat Detection"
      name: Falco Macros
      description: Sysdig Secure custom Falco macros — named, reusable condition fragments referenced across rules — applied over the Sysdig Secure REST API (/api/secure/falco/macros)
      canvasTemplate: config-types/falco-macros/canvas.yaml
      defaultConfig: config-types/falco-macros/defaults.yaml
      handlers:
        validate: config-types/falco-macros/validate
        deploy: config-types/falco-macros/deploy
        rollback: config-types/falco-macros/rollback
        healthCheck: config-types/falco-macros/healthCheck
        driftDetect: config-types/falco-macros/driftDetect
        getStatus: config-types/falco-macros/getStatus
      targets:
        componentTypes: [sysdig-secure]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/sysdig-secure

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the Sysdig tenant (region base URL)
    # with a Sysdig API token (credential), with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's region base URL +
# API token against the Sysdig Secure REST API (GET /api/secure/rules/groups).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request timeout (seconds)
    description: Per-request timeout for calls to the Sysdig Secure REST API.
    default: 30
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
