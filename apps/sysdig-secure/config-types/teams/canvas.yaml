# =============================================================================
# Canvas Template — Sysdig Secure Teams
#
# Declares ONE Sysdig Secure team (the item) — a group of users sharing scope
# and capabilities. Field keys must match config-types/teams/validate.ts.
# Applied via the Sysdig Secure REST API (/api/teams).
# =============================================================================

id: "sysdig-secure-teams"
name: "Teams"
toolType: "sysdig-secure"
entityType: "teams"
description: "Manage Sysdig Secure teams — scope, capabilities, zone assignment and members — via the Sysdig Secure REST API (/api/teams)"

item:
  label: "Team"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Team"
      icon: "users"
      description: "Team identity"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Unique team name — the stable identity used for upsert and drift. Must not also exist as a Monitor team."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          validation:
            maxLength: 1000

        - key: "theme"
          label: "Theme Color"
          fieldType: "text"
          defaultValue: "#73A1F7"
          validation:
            pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
          helpText: "Hex color shown next to the team in the Sysdig console"

        - key: "enabled"
          label: "Enabled"
          fieldType: "checkbox"
          defaultValue: true
          helpText: "When on, the team is present in Sysdig Secure. When off, this app DELETES the team and its user-role associations."

    - name: "Scope & Capabilities"
      icon: "shield"
      description: "What this team's members can see and do"
      fields:
        - key: "scopeBy"
          label: "Scope By"
          fieldType: "select"
          defaultValue: "container"
          options:
            - { label: "Container", value: "container" }
            - { label: "Host", value: "host" }
          helpText: "Container-level members see only container information; Host-level members also see host-level information"

        - key: "filter"
          label: "Resource Filter (advanced)"
          fieldType: "textarea"
          validation:
            maxLength: 2000
          helpText: "Optional Sysdig filter expression limiting which resources this team's members can see"

        - key: "useSysdigCapture"
          label: "Allow Sysdig Captures"
          fieldType: "checkbox"
          defaultValue: true

        - key: "canUseAgentCli"
          label: "Allow Agent Console"
          fieldType: "checkbox"
          defaultValue: true

        - key: "canUseRapidResponse"
          label: "Allow Rapid Response"
          fieldType: "checkbox"
          defaultValue: false

        - key: "defaultTeam"
          label: "Default Team"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "New users land in this team. Only one team should be marked default — setting more than one causes Sysdig to keep reconciling on every deploy."

    - name: "Zones"
      icon: "map"
      description: "Which zones this team can see"
      fields:
        - key: "allZones"
          label: "All Zones"
          fieldType: "checkbox"
          defaultValue: false

        - key: "zoneNames"
          label: "Zone Names"
          fieldType: "tags"
          visibleWhen:
            field: "allZones"
            equals: false
          helpText: "Names of Zones (see the Zones config type) this team is scoped to — resolved to ids at deploy. A name that cannot be found is skipped with a warning."

    - name: "Members"
      icon: "user"
      description: "Team members and their roles"
      fields:
        - key: "userRolesJson"
          label: "User Roles (JSON)"
          fieldType: "textarea"
          validation:
            maxLength: 8000
          helpText: >-
            Optional JSON array of {"email":"user@example.com","role":"ROLE_TEAM_STANDARD"}.
            Role is one of ROLE_TEAM_STANDARD, ROLE_TEAM_EDIT, ROLE_TEAM_READ,
            ROLE_TEAM_MANAGER, or the numeric id of a custom role. Account
            administrators are added to every team automatically and do not need
            to be listed. An email that cannot be resolved to an existing user is
            skipped with a warning.
