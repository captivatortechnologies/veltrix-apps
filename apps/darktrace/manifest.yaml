id: darktrace
name: Darktrace
version: "0.2.0"
vendor: Veltrix
description: >
  Manage a Darktrace NDR deployment's writable surfaces as code. Author intel-feed
  watched domains / IPs / hostnames and named tags in the Configuration Canvas and
  drive them through the Security-as-Code pipeline — validate, deploy, health check,
  drift detection and rollback — over the Darktrace REST API (HTTPS, DSA-signed,
  self-signed tolerated). Darktrace's API is read-heavy; the intel feed (/intelfeed)
  and tags (/tags) are its cleanly writable config surfaces, so this app manages
  exactly those.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/darktrace
icon: "📡"

platform:
  minVersion: "1.0.0"

# Darktrace's brand teal. Placeholder until the official lockup is added.
branding:
  primaryColor: "#1ba39c"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: intelfeed
      actions: [read, write, delete]
      description: Manage Darktrace intel-feed watched entries (add / remove domains, IPs, hostnames)
    - resource: tags
      actions: [read, write, delete]
      description: Manage Darktrace tags (create / delete named labels used to group entities)

pipeline:
  configurationTypes:
    - id: intelfeed
      group: "Threat Intelligence"
      name: Watched Domains
      description: Darktrace intel-feed watched entries — domain / IP / hostname, source list, description, expiry and Antigena — applied over the Darktrace REST API (443, DSA-signed)
      canvasTemplate: config-types/intelfeed/canvas.yaml
      defaultConfig: config-types/intelfeed/defaults.yaml
      handlers:
        validate: config-types/intelfeed/validate
        deploy: config-types/intelfeed/deploy
        rollback: config-types/intelfeed/rollback
        healthCheck: config-types/intelfeed/healthCheck
        driftDetect: config-types/intelfeed/driftDetect
        getStatus: config-types/intelfeed/getStatus
      targets:
        componentTypes: [darktrace, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: tags
      group: "Asset Management"
      name: Tags
      description: Darktrace tags — named labels (with an optional colour and description) used to group entities and drive model logic — created / deleted over the Darktrace REST API (443, DSA-signed)
      canvasTemplate: config-types/tags/canvas.yaml
      defaultConfig: config-types/tags/defaults.yaml
      handlers:
        validate: config-types/tags/validate
        deploy: config-types/tags/deploy
        rollback: config-types/tags/rollback
        healthCheck: config-types/tags/healthCheck
        driftDetect: config-types/tags/driftDetect
        getStatus: config-types/tags/getStatus
      targets:
        componentTypes: [darktrace, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/darktrace

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the Darktrace instance (component)
    # with its DSA token pair (credential), with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint + DSA token
# pair against the Darktrace REST API (HTTPS 443, GET /intelfeed?sources=true).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: darktrace_port
    type: number
    label: Darktrace HTTPS Port
    description: HTTPS port for the Darktrace master / appliance REST API
    default: 443
    required: false
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the Darktrace endpoint. Off by default —
      Darktrace appliances commonly ship a self-signed certificate.
    default: false
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
