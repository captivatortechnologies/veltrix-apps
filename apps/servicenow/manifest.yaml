id: servicenow
name: ServiceNow
version: "0.3.0"
vendor: Veltrix
description: >
  Manage ServiceNow configuration as code over the Table API (HTTPS, HTTP Basic
  auth) through the Security-as-Code pipeline (validate, deploy, health check,
  drift detection and rollback). v0.3.0 manages twelve clean, security-relevant,
  writable surfaces across Security & Access (ACLs, roles), Platform Automation
  (business rules, script includes, scheduled jobs, assignment rules, UI
  actions), Forms & UI (UI policies, data policies, client scripts),
  Notifications (email notifications) and Platform Settings (system
  properties) — each upserted by a natural key. ServiceNow is a very large
  platform; see README's Coverage section for what is managed vs intentionally
  excluded and why.
category: SOAR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/servicenow

# ServiceNow brand green — placeholder until the official lockup is added.
icon: "🛎️"
branding:
  primaryColor: "#62D84E"

platform:
  minVersion: "1.0.0"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: business-rules
      actions: [read, write, delete]
      description: Manage ServiceNow business rules (sys_script) — create / edit / delete
    - resource: ui-policies
      actions: [read, write, delete]
      description: Manage ServiceNow UI policies (sys_ui_policy) — create / edit / delete
    - resource: script-includes
      actions: [read, write, delete]
      description: Manage ServiceNow script includes (sys_script_include) — create / edit / delete
    - resource: scheduled-jobs
      actions: [read, write, delete]
      description: Manage ServiceNow scheduled jobs (sysauto_script) — create / edit / delete
    - resource: acls
      actions: [read, write, delete]
      description: Manage ServiceNow Access Control rules (sys_security_acl) — create / edit / delete
    - resource: roles
      actions: [read, write, delete]
      description: Manage ServiceNow roles (sys_user_role) — create / edit / delete
    - resource: email-notifications
      actions: [read, write, delete]
      description: Manage ServiceNow email notifications (sysevent_email_action) — create / edit / delete
    - resource: data-policies
      actions: [read, write, delete]
      description: Manage ServiceNow data policies (sys_data_policy2) — create / edit / delete
    - resource: assignment-rules
      actions: [read, write, delete]
      description: Manage ServiceNow assignment rules (sysrule_assignment) — create / edit / delete
    - resource: ui-actions
      actions: [read, write, delete]
      description: Manage ServiceNow UI actions (sys_ui_action) — create / edit / delete
    - resource: client-scripts
      actions: [read, write, delete]
      description: Manage ServiceNow client scripts (sys_script_client) — create / edit / delete
    - resource: system-properties
      actions: [read, write, delete]
      description: Manage ServiceNow system properties (sys_properties) — create / edit / delete

pipeline:
  configurationTypes:
    - id: business-rules
      group: "Platform Automation"
      name: Business Rules
      description: ServiceNow business rules (sys_script) — name, table, when, triggers, condition and server-side script — applied over the Table API
      canvasTemplate: config-types/business-rules/canvas.yaml
      defaultConfig: config-types/business-rules/defaults.yaml
      handlers:
        validate: config-types/business-rules/validate
        deploy: config-types/business-rules/deploy
        rollback: config-types/business-rules/rollback
        healthCheck: config-types/business-rules/healthCheck
        driftDetect: config-types/business-rules/driftDetect
        getStatus: config-types/business-rules/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: ui-policies
      group: "Forms & UI"
      name: UI Policies
      description: ServiceNow UI policies (sys_ui_policy) — client-side form behavior (show/hide, mandatory, read-only) for a table, driven by a condition — applied over the Table API
      canvasTemplate: config-types/ui-policies/canvas.yaml
      defaultConfig: config-types/ui-policies/defaults.yaml
      handlers:
        validate: config-types/ui-policies/validate
        deploy: config-types/ui-policies/deploy
        rollback: config-types/ui-policies/rollback
        healthCheck: config-types/ui-policies/healthCheck
        driftDetect: config-types/ui-policies/driftDetect
        getStatus: config-types/ui-policies/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: script-includes
      group: "Platform Automation"
      name: Script Includes
      description: ServiceNow script includes (sys_script_include) — reusable server-side classes/functions callable from business rules, scheduled scripts and (when client-callable) GlideAjax — applied over the Table API
      canvasTemplate: config-types/script-includes/canvas.yaml
      defaultConfig: config-types/script-includes/defaults.yaml
      handlers:
        validate: config-types/script-includes/validate
        deploy: config-types/script-includes/deploy
        rollback: config-types/script-includes/rollback
        healthCheck: config-types/script-includes/healthCheck
        driftDetect: config-types/script-includes/driftDetect
        getStatus: config-types/script-includes/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: scheduled-jobs
      group: "Platform Automation"
      name: Scheduled Jobs
      description: ServiceNow scheduled jobs (sysauto_script) — server-side scripts that run on a schedule, optionally as a specific user and gated by a condition — applied over the Table API
      canvasTemplate: config-types/scheduled-jobs/canvas.yaml
      defaultConfig: config-types/scheduled-jobs/defaults.yaml
      handlers:
        validate: config-types/scheduled-jobs/validate
        deploy: config-types/scheduled-jobs/deploy
        rollback: config-types/scheduled-jobs/rollback
        healthCheck: config-types/scheduled-jobs/healthCheck
        driftDetect: config-types/scheduled-jobs/driftDetect
        getStatus: config-types/scheduled-jobs/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: acls
      group: "Security & Access"
      name: ACLs
      description: ServiceNow Access Control rules (sys_security_acl, type=record) — table/field security gated by roles (assigned in ServiceNow), a condition and/or a script — applied over the Table API
      canvasTemplate: config-types/acls/canvas.yaml
      defaultConfig: config-types/acls/defaults.yaml
      handlers:
        validate: config-types/acls/validate
        deploy: config-types/acls/deploy
        rollback: config-types/acls/rollback
        healthCheck: config-types/acls/healthCheck
        driftDetect: config-types/acls/driftDetect
        getStatus: config-types/acls/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: roles
      group: "Security & Access"
      name: Roles
      description: ServiceNow roles (sys_user_role) — the named permission grants ACLs check for — applied over the Table API
      canvasTemplate: config-types/roles/canvas.yaml
      defaultConfig: config-types/roles/defaults.yaml
      handlers:
        validate: config-types/roles/validate
        deploy: config-types/roles/deploy
        rollback: config-types/roles/rollback
        healthCheck: config-types/roles/healthCheck
        driftDetect: config-types/roles/driftDetect
        getStatus: config-types/roles/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: assignment-rules
      group: "Platform Automation"
      name: Assignment Rules
      description: ServiceNow assignment rules (sysrule_assignment) — auto-populate assignment group / assigned to on a task-derived table — applied over the Table API
      canvasTemplate: config-types/assignment-rules/canvas.yaml
      defaultConfig: config-types/assignment-rules/defaults.yaml
      handlers:
        validate: config-types/assignment-rules/validate
        deploy: config-types/assignment-rules/deploy
        rollback: config-types/assignment-rules/rollback
        healthCheck: config-types/assignment-rules/healthCheck
        driftDetect: config-types/assignment-rules/driftDetect
        getStatus: config-types/assignment-rules/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: ui-actions
      group: "Platform Automation"
      name: UI Actions
      description: ServiceNow UI actions (sys_ui_action) — buttons, links and context-menu items on forms/lists that run scripted logic when triggered — applied over the Table API
      canvasTemplate: config-types/ui-actions/canvas.yaml
      defaultConfig: config-types/ui-actions/defaults.yaml
      handlers:
        validate: config-types/ui-actions/validate
        deploy: config-types/ui-actions/deploy
        rollback: config-types/ui-actions/rollback
        healthCheck: config-types/ui-actions/healthCheck
        driftDetect: config-types/ui-actions/driftDetect
        getStatus: config-types/ui-actions/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: data-policies
      group: "Forms & UI"
      name: Data Policies
      description: ServiceNow data policies (sys_data_policy2) — server-side field mandatory/read-only enforcement for a table, driven by a condition — applied over the Table API
      canvasTemplate: config-types/data-policies/canvas.yaml
      defaultConfig: config-types/data-policies/defaults.yaml
      handlers:
        validate: config-types/data-policies/validate
        deploy: config-types/data-policies/deploy
        rollback: config-types/data-policies/rollback
        healthCheck: config-types/data-policies/healthCheck
        driftDetect: config-types/data-policies/driftDetect
        getStatus: config-types/data-policies/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: client-scripts
      group: "Forms & UI"
      name: Client Scripts
      description: ServiceNow client scripts (sys_script_client) — browser-side JavaScript that runs on a form's onLoad/onChange/onSubmit/onCellEdit event — applied over the Table API
      canvasTemplate: config-types/client-scripts/canvas.yaml
      defaultConfig: config-types/client-scripts/defaults.yaml
      handlers:
        validate: config-types/client-scripts/validate
        deploy: config-types/client-scripts/deploy
        rollback: config-types/client-scripts/rollback
        healthCheck: config-types/client-scripts/healthCheck
        driftDetect: config-types/client-scripts/driftDetect
        getStatus: config-types/client-scripts/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: email-notifications
      group: "Notifications"
      name: Email Notifications
      description: ServiceNow event-driven email notifications (sysevent_email_action) — subject, message, recipients and the event that fires them — applied over the Table API
      canvasTemplate: config-types/email-notifications/canvas.yaml
      defaultConfig: config-types/email-notifications/defaults.yaml
      handlers:
        validate: config-types/email-notifications/validate
        deploy: config-types/email-notifications/deploy
        rollback: config-types/email-notifications/rollback
        healthCheck: config-types/email-notifications/healthCheck
        driftDetect: config-types/email-notifications/driftDetect
        getStatus: config-types/email-notifications/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

    - id: system-properties
      group: "Platform Settings"
      name: System Properties
      description: ServiceNow system properties (sys_properties) — instance-wide configuration and security-hardening settings — applied over the Table API
      canvasTemplate: config-types/system-properties/canvas.yaml
      defaultConfig: config-types/system-properties/defaults.yaml
      handlers:
        validate: config-types/system-properties/validate
        deploy: config-types/system-properties/deploy
        rollback: config-types/system-properties/rollback
        healthCheck: config-types/system-properties/healthCheck
        driftDetect: config-types/system-properties/driftDetect
        getStatus: config-types/system-properties/getStatus
      targets:
        componentTypes: [servicenow-instance]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/servicenow

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a ServiceNow instance (component)
    # with an integration-user credential (username + password), with a per-row
    # connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's instance URL + Basic
# credential against the Table API (GET /api/now/table/sys_user?sysparm_limit=1).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request timeout (seconds)
    description: How long to wait for a ServiceNow Table API request before timing out.
    default: 30
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
