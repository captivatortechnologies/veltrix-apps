# =============================================================================
# Canvas Template — ServiceNow Client Scripts
#
# Declares ONE ServiceNow client script (a sys_script_client record).
# Operators add as many as they need. Field keys must match
# config-types/client-scripts/_shared.ts and validate.ts. Applied over the
# ServiceNow Table API (POST/PATCH /api/now/table/sys_script_client).
#
# Identity is the (name, table, type) triple.
# =============================================================================

id: "servicenow-client-scripts"
name: "Client Scripts"
toolType: "servicenow"
entityType: "client-scripts"
description: "Manage ServiceNow client scripts (sys_script_client) as code — browser-side JavaScript that runs on a form's onLoad/onChange/onSubmit/onCellEdit event — via the Table API"

item:
  label: "Client Script"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 300
  groups:
    - name: "Trigger"
      icon: "zap"
      description: "Script identity and when it runs"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Human-readable script name shown in ServiceNow. Identity is this name scoped to the table and type below."

        - key: "table"
          label: "Table"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[a-z][a-z0-9_]*$"
            maxLength: 80
          helpText: "Internal table the script runs on, e.g. incident, sn_si_incident."

        - key: "type"
          label: "Type"
          fieldType: "select"
          required: true
          defaultValue: "onLoad"
          options:
            - { label: "onLoad", value: "onLoad" }
            - { label: "onChange", value: "onChange" }
            - { label: "onSubmit", value: "onSubmit" }
            - { label: "onCellEdit", value: "onCellEdit" }
          helpText: "Which form event runs the script."

        - key: "fieldName"
          label: "Field name"
          fieldType: "text"
          required: false
          validation:
            pattern: "^[a-z][a-z0-9_]*$"
            maxLength: 80
          helpText: "Field that triggers the script. Required for onChange and onCellEdit; ignored for onLoad and onSubmit."

        - key: "active"
          label: "Active"
          fieldType: "checkbox"
          required: false
          defaultValue: true
          helpText: "Whether the script is enabled."

    - name: "Scope"
      icon: "settings"
      description: "Where and how the script runs"
      fields:
        - key: "global"
          label: "Global"
          fieldType: "checkbox"
          required: false
          defaultValue: true
          helpText: "Run on all views of the table (sys_script_client.global). Turn off to scope to specific views in ServiceNow after deploy."

        - key: "uiType"
          label: "UI type"
          fieldType: "select"
          required: false
          defaultValue: "all"
          options:
            - { label: "All", value: "all" }
            - { label: "Desktop", value: "desktop" }
            - { label: "Mobile / Service Portal", value: "mobile_or_service_portal" }
          helpText: "Which interfaces the script runs in. Note: unlike UI Policies' numeric ui_type, client scripts use these string values."

        - key: "appliesExtended"
          label: "Applies to extended tables"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "Also run on tables that extend the table above (sys_script_client.applies_extended)."

        - key: "isolateScript"
          label: "Isolate script"
          fieldType: "checkbox"
          required: false
          defaultValue: true
          helpText: "Run in strict mode, isolated from other client scripts (recommended)."

        - key: "order"
          label: "Order"
          fieldType: "number"
          required: false
          defaultValue: 100
          validation:
            min: 0
            max: 100000
          helpText: "Execution order — lower numbers run first (default 100)."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 4000
          helpText: "Why this script exists — recorded for audit."

    - name: "Script"
      icon: "code"
      description: "The script body"
      fields:
        - key: "script"
          label: "Script"
          fieldType: "textarea"
          required: true
          validation:
            maxLength: 100000
          helpText: "Client-side script body, e.g. function onLoad() { g_form.setMandatory('short_description', true); }"
