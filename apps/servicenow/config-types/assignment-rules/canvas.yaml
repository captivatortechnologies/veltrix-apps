# =============================================================================
# Canvas Template — ServiceNow Assignment Rules
#
# Declares ONE ServiceNow assignment rule (a sysrule_assignment record).
# Operators add as many as they need. Field keys must match
# config-types/assignment-rules/_shared.ts and validate.ts. Applied over the
# ServiceNow Table API (POST/PATCH /api/now/table/sysrule_assignment).
#
# Assignment rules only run on task-derived tables (incident, sn_si_incident,
# problem, change_request, ...) and only when assignment_group/assigned_to are
# still empty on the record.
#
# Identity is the (name, table) pair.
# =============================================================================

id: "servicenow-assignment-rules"
name: "Assignment Rules"
toolType: "servicenow"
entityType: "assignment-rules"
description: "Manage ServiceNow assignment rules (sysrule_assignment) as code — auto-populate assignment group / assigned to on a task-derived table — via the Table API"

item:
  label: "Assignment Rule"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 300
  groups:
    - name: "Rule"
      icon: "code"
      description: "Rule identity and the table it runs on"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 100
          helpText: "Human-readable rule name shown in ServiceNow. Identity is this name scoped to the table below."

        - key: "table"
          label: "Table"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[a-z][a-z0-9_]*$"
            maxLength: 80
          helpText: "Internal name of a task-derived table the rule runs on, e.g. incident, sn_si_incident, change_request. ServiceNow only runs assignment rules on tables that extend task."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 4000
          helpText: "Why this rule exists — recorded for audit."

        - key: "active"
          label: "Active"
          fieldType: "checkbox"
          required: false
          defaultValue: true
          helpText: "Whether the rule is enabled."

        - key: "order"
          label: "Order"
          fieldType: "number"
          required: false
          defaultValue: 100
          validation:
            min: 0
            max: 100000
          helpText: "Execution order — lower numbers run first (default 100)."

    - name: "Condition"
      icon: "filter"
      description: "When the rule applies"
      fields:
        - key: "condition"
          label: "Condition (encoded query)"
          fieldType: "text"
          required: false
          validation:
            maxLength: 1000
          helpText: "Encoded query against the table above, e.g. category=security^priority=1. Leave blank to always match."

    - name: "Assignment"
      icon: "users"
      description: "Who gets assigned — set a group and/or user, or use a script for dynamic assignment"
      fields:
        - key: "group"
          label: "Assignment group (sys_id)"
          fieldType: "text"
          required: false
          validation:
            maxLength: 32
          helpText: "sys_id of the group to assign to. Leave blank if using Script instead."

        - key: "user"
          label: "Assigned to (sys_id)"
          fieldType: "text"
          required: false
          validation:
            maxLength: 32
          helpText: "sys_id of the user to assign to. Leave blank if using Script instead."

        - key: "script"
          label: "Script"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 8000
          helpText: "Server-side script for dynamic assignment (the `current` record is in scope), e.g. current.assignment_group = current.category == 'security' ? '<sys_id>' : ''; . Leave blank to use the static Group / Assigned to above."
