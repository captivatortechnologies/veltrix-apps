# =============================================================================
# Canvas Template — ServiceNow Email Notifications
#
# Declares ONE event-driven ServiceNow email notification (a
# sysevent_email_action record). Operators add as many as they need. Field
# keys must match config-types/email-notifications/_shared.ts and validate.ts.
# Applied over the ServiceNow Table API
# (POST/PATCH /api/now/table/sysevent_email_action).
#
# EVENT-DRIVEN ONLY: Event name is required. Pair with this app's Business
# Rules config type — a rule can call gs.eventQueue('my.event', current) to
# raise the event this notification reacts to.
#
# Identity is the (name, table, event name) triple.
# =============================================================================

id: "servicenow-email-notifications"
name: "Email Notifications"
toolType: "servicenow"
entityType: "email-notifications"
description: "Manage ServiceNow event-driven email notifications (sysevent_email_action) as code via the Table API"

item:
  label: "Notification"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 300
  groups:
    - name: "Trigger"
      icon: "zap"
      description: "What fires this notification"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Human-readable notification name shown in ServiceNow."

        - key: "collection"
          label: "Table"
          fieldType: "text"
          required: true
          validation:
            pattern: "^[a-z][a-z0-9_]*$"
            maxLength: 80
          helpText: "Internal table the triggering event's record belongs to, e.g. incident, sn_si_incident."

        - key: "eventName"
          label: "Event name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 100
          helpText: "The system or custom event that fires this notification, e.g. incident.priority1. Raise a custom event from a managed Business Rule with gs.eventQueue('name', current)."

        - key: "condition"
          label: "Additional condition (encoded query)"
          fieldType: "text"
          required: false
          validation:
            maxLength: 4000
          helpText: "Optional encoded query evaluated against the record in addition to the event firing, e.g. priority=1."

        - key: "active"
          label: "Active"
          fieldType: "checkbox"
          required: false
          defaultValue: true
          helpText: "Whether the notification is enabled."

        - key: "weight"
          label: "Weight"
          fieldType: "number"
          required: false
          defaultValue: 0
          validation:
            min: 0
            max: 1000
          helpText: "Processing priority among notifications matching the same event (higher runs later)."

    - name: "Recipients"
      icon: "users"
      description: "Who receives the email"
      fields:
        - key: "recipientUsers"
          label: "Recipient users (sys_ids)"
          fieldType: "tags"
          required: false
          helpText: "Raw sys_ids of recipient users, one per tag. This app does not resolve user names to sys_ids — copy them from the user's record in ServiceNow."

        - key: "recipientGroups"
          label: "Recipient groups (sys_ids)"
          fieldType: "tags"
          required: false
          helpText: "Raw sys_ids of recipient groups, one per tag."

        - key: "recipientFields"
          label: "Recipient fields"
          fieldType: "tags"
          required: false
          helpText: "Names of fields on the record whose user/group value should also be notified, e.g. caller_id, assigned_to."

        - key: "mandatory"
          label: "Mandatory"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "When on, recipients cannot unsubscribe from this notification."

    - name: "Message"
      icon: "mail"
      description: "The email content"
      fields:
        - key: "subject"
          label: "Subject"
          fieldType: "text"
          required: true
          validation:
            maxLength: 400
          helpText: "Email subject line. ServiceNow email-script placeholders (e.g. ${short_description}) are evaluated at send time."

        - key: "messageHtml"
          label: "Message (HTML)"
          fieldType: "textarea"
          required: true
          validation:
            maxLength: 100000
          helpText: "Email body. HTML and ServiceNow email-script placeholders are evaluated at send time."

        - key: "replyTo"
          label: "Reply-to address"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "Optional reply-to email address. Leave blank to use the instance default."
