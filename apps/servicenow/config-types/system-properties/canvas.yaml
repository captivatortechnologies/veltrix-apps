# =============================================================================
# Canvas Template — ServiceNow System Properties
#
# Declares ONE ServiceNow system property (a sys_properties record). Operators
# add as many as they need. Field keys must match
# config-types/system-properties/_shared.ts and validate.ts. Applied over the
# ServiceNow Table API (POST/PATCH /api/now/table/sys_properties).
#
# PASSWORD TYPES ARE WRITE-ONLY: ServiceNow never returns a password/password2
# property's real value on read. Deploy always re-applies the declared Value;
# drift detection skips comparing it; rollback restores every OTHER field but
# never writes Value back for a password-type property (see README).
#
# Identity is `name`.
# =============================================================================

id: "servicenow-system-properties"
name: "System Properties"
toolType: "servicenow"
entityType: "system-properties"
description: "Manage ServiceNow system properties (sys_properties) as code — instance-wide configuration and security-hardening settings — via the Table API"

item:
  label: "Property"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Property"
      icon: "settings"
      description: "The property and its value"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Conventionally dotted, e.g. glide.security.session.timeout, or <scope>.my.property for a scoped app property. Identity."

        - key: "type"
          label: "Type"
          fieldType: "select"
          required: true
          defaultValue: "string"
          options:
            - { label: "String", value: "string" }
            - { label: "Integer", value: "integer" }
            - { label: "Boolean (true_false)", value: "boolean" }
            - { label: "Choice list", value: "choicelist" }
            - { label: "Password (obscured, single-encrypted)", value: "password" }
            - { label: "Password2 (encrypted)", value: "password2" }
          helpText: "How ServiceNow renders and validates the value. Password/Password2 are write-only — see the note above."

        - key: "value"
          label: "Value"
          fieldType: "textarea"
          required: true
          validation:
            maxLength: 4000
          helpText: "The property's value as a string, e.g. true, 30, or a comma-separated choicelist. For Password/Password2, this is written every deploy but never read back."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 4000
          helpText: "What this property controls — shown to admins in the System Properties list."

    - name: "Visibility"
      icon: "shield"
      description: "Who can see and change this property"
      fields:
        - key: "isPrivate"
          label: "Private"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "Hide from the System Properties list UI for non-admin users (sys_properties.is_private)."

        - key: "ignoreCache"
          label: "Ignore cache"
          fieldType: "checkbox"
          required: false
          defaultValue: true
          helpText: "Read fresh on every access instead of the property cache, so a change takes effect immediately without a node restart. Recommended for most properties."

        - key: "readRoles"
          label: "Read roles"
          fieldType: "tags"
          required: false
          helpText: "Role NAMES (not sys_ids) allowed to read this property, one per tag. Leave blank for no role restriction beyond the base System Properties ACLs."

        - key: "writeRoles"
          label: "Write roles"
          fieldType: "tags"
          required: false
          helpText: "Role NAMES (not sys_ids) allowed to write this property, one per tag."
