id: proofpoint
name: Proofpoint Essentials
version: "1.2.0"
vendor: Veltrix
description: >
  Manage Proofpoint Essentials email security configuration as code through the
  Essentials Interface API (v1). Covers protected domains and their inbound mail
  routing, the organization Safe and Blocked sender lists (organization, user or
  group scoped), the organization security features (URL Defense, Attachment
  Defense, DLP, Encryption, and more), organization-wide MFA and Login/SSO
  policy, SAML Identity Providers, and granular Email Warning/Subject Tag
  settings and their sender exemptions — with validation, drift detection and
  rollback handled by the Security-as-Code pipeline. Objects are scoped to the
  organization named in the Organization (primary domain) setting.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/proofpoint
icon: "📧"

platform:
  minVersion: "1.0.0"

# Proofpoint brand: the Proofpoint teal-green with a lighter teal accent.
branding:
  primaryColor: "#008576"
  accentColor: "#37B6AB"
  logo: ./assets/logo.svg
  logoDark: ./assets/logo-dark.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: pp-domains
      actions: [read, write, delete]
      description: Manage Proofpoint Essentials protected domains
    - resource: pp-sender-lists
      actions: [read, write, delete]
      description: Manage Proofpoint Essentials Safe / Blocked sender lists (organization, user or group scoped)
    - resource: pp-org-features
      actions: [read, write]
      description: Manage Proofpoint Essentials organization security features (URL Defense, Attachment Defense, DLP, ...)
    - resource: pp-authentication-settings
      actions: [read, write]
      description: Manage Proofpoint Essentials organization-wide MFA and Login/SSO policy
    - resource: pp-identity-providers
      actions: [read, write, delete]
      description: Manage Proofpoint Essentials SAML Identity Providers (SSO)
    - resource: pp-email-tagging
      actions: [read, write]
      description: Manage Proofpoint Essentials granular Email Warning Tag and Email Subject Tag settings
    - resource: pp-email-tagging-exemptions
      actions: [read, write, delete]
      description: Manage Proofpoint Essentials Email Tagging exempt-sender list

pipeline:
  configurationTypes:
    - id: pp-domains
      name: Proofpoint Domains
      description: Protected domains + inbound mail routing (is_active / relay + destination / failovers) via /orgs/{org}/domains; upsert keyed on the domain name
      canvasTemplate: config-types/pp-domains/canvas.yaml
      defaultConfig: config-types/pp-domains/defaults.yaml
      handlers:
        validate: config-types/pp-domains/validate
        deploy: config-types/pp-domains/deploy
        rollback: config-types/pp-domains/rollback
        healthCheck: config-types/pp-domains/healthCheck
        driftDetect: config-types/pp-domains/driftDetect
        getStatus: config-types/pp-domains/getStatus
      targets:
        componentTypes: [proofpoint]
        requiresCredential: true
        requiresConnectivity: false

    - id: pp-sender-lists
      name: Proofpoint Sender Lists
      description: Safe (allow) and Blocked (deny) sender entries via the sender-lists resource, scoped to the organization, a user or a group (/orgs/{org}[/users/{email}|/groups/{id}]/sender-lists); additive by (scope, sender) value
      canvasTemplate: config-types/pp-sender-lists/canvas.yaml
      defaultConfig: config-types/pp-sender-lists/defaults.yaml
      handlers:
        validate: config-types/pp-sender-lists/validate
        deploy: config-types/pp-sender-lists/deploy
        rollback: config-types/pp-sender-lists/rollback
        healthCheck: config-types/pp-sender-lists/healthCheck
        driftDetect: config-types/pp-sender-lists/driftDetect
        getStatus: config-types/pp-sender-lists/getStatus
      targets:
        componentTypes: [proofpoint]
        requiresCredential: true
        requiresConnectivity: false

    - id: pp-org-features
      name: Proofpoint Organization Features
      description: Organization security/protection features (URL Defense, Attachment Defense + sandboxing, DLP, Encryption, Anti-Spoofing, ...) via /orgs/{org}/features (GET/PUT); read-modify-write upsert keyed on the feature name
      canvasTemplate: config-types/pp-org-features/canvas.yaml
      defaultConfig: config-types/pp-org-features/defaults.yaml
      handlers:
        validate: config-types/pp-org-features/validate
        deploy: config-types/pp-org-features/deploy
        rollback: config-types/pp-org-features/rollback
        healthCheck: config-types/pp-org-features/healthCheck
        driftDetect: config-types/pp-org-features/driftDetect
        getStatus: config-types/pp-org-features/getStatus
      targets:
        componentTypes: [proofpoint]
        requiresCredential: true
        requiresConnectivity: false

    - id: pp-authentication-settings
      name: Proofpoint Authentication Settings
      description: Organization-wide MFA policy and Login/SSO policy via /orgs/{org}/authentication/settings/{mfa,login} (GET/PUT); singleton, always declares the full managed state
      canvasTemplate: config-types/pp-authentication-settings/canvas.yaml
      defaultConfig: config-types/pp-authentication-settings/defaults.yaml
      handlers:
        validate: config-types/pp-authentication-settings/validate
        deploy: config-types/pp-authentication-settings/deploy
        rollback: config-types/pp-authentication-settings/rollback
        healthCheck: config-types/pp-authentication-settings/healthCheck
        driftDetect: config-types/pp-authentication-settings/driftDetect
        getStatus: config-types/pp-authentication-settings/getStatus
      targets:
        componentTypes: [proofpoint]
        requiresCredential: true
        requiresConnectivity: false

    - id: pp-identity-providers
      name: Proofpoint Identity Providers
      description: SAML Identity Providers (SSO) via /orgs/{org}/authentication/settings/idps (GET/POST list+create, GET/PUT/DELETE by id); upsert keyed on the IDP name
      canvasTemplate: config-types/pp-identity-providers/canvas.yaml
      defaultConfig: config-types/pp-identity-providers/defaults.yaml
      handlers:
        validate: config-types/pp-identity-providers/validate
        deploy: config-types/pp-identity-providers/deploy
        rollback: config-types/pp-identity-providers/rollback
        healthCheck: config-types/pp-identity-providers/healthCheck
        driftDetect: config-types/pp-identity-providers/driftDetect
        getStatus: config-types/pp-identity-providers/getStatus
      targets:
        componentTypes: [proofpoint]
        requiresCredential: true
        requiresConnectivity: false

    - id: pp-email-tagging
      name: Proofpoint Email Tagging
      description: Granular Email Warning Tags and Email Subject Tags settings via /orgs/{org}/email-tagging (GET/PUT); singleton, always declares the full managed state
      canvasTemplate: config-types/pp-email-tagging/canvas.yaml
      defaultConfig: config-types/pp-email-tagging/defaults.yaml
      handlers:
        validate: config-types/pp-email-tagging/validate
        deploy: config-types/pp-email-tagging/deploy
        rollback: config-types/pp-email-tagging/rollback
        healthCheck: config-types/pp-email-tagging/healthCheck
        driftDetect: config-types/pp-email-tagging/driftDetect
        getStatus: config-types/pp-email-tagging/getStatus
      targets:
        componentTypes: [proofpoint]
        requiresCredential: true
        requiresConnectivity: false

    - id: pp-email-tagging-exemptions
      name: Proofpoint Email Tagging Exemptions
      description: Email Tagging exempt-sender list via /orgs/{org}/email-tagging/exemptions (GET/POST/DELETE); additive by sender value
      canvasTemplate: config-types/pp-email-tagging-exemptions/canvas.yaml
      defaultConfig: config-types/pp-email-tagging-exemptions/defaults.yaml
      handlers:
        validate: config-types/pp-email-tagging-exemptions/validate
        deploy: config-types/pp-email-tagging-exemptions/deploy
        rollback: config-types/pp-email-tagging-exemptions/rollback
        healthCheck: config-types/pp-email-tagging-exemptions/healthCheck
        driftDetect: config-types/pp-email-tagging-exemptions/driftDetect
        getStatus: config-types/pp-email-tagging-exemptions/getStatus
      targets:
        componentTypes: [proofpoint]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/proofpoint

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a Proofpoint Essentials stack host
    # (component) with the admin credentials used to reach it, with a per-row
    # connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the stack host + admin credentials
# and that the configured organization is visible via GET /orgs/{org}.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: org_domain
    type: string
    label: Organization (primary domain)
    description: >
      The primary domain of the Proofpoint Essentials organization this
      configuration manages (e.g. acme.com). All domain and sender-list changes are
      applied to /orgs/<this-domain>.
    default: ""
    required: true
  - key: stack_host
    type: string
    label: Stack host
    description: >
      The Essentials data-region host (us1–us5 or eu1), used when the connection
      does not set an endpoint. Example: us1.proofpointessentials.com.
    default: "us1.proofpointessentials.com"
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Proofpoint Essentials API calls.
    default: 30
    required: false
