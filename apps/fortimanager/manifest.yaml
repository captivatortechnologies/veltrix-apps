      defaultConfig: config-types/firewall-service-groups/defaults.yaml
      handlers:
        validate: config-types/firewall-service-groups/validate
        deploy: config-types/firewall-service-groups/deploy
        rollback: config-types/firewall-service-groups/rollback
        healthCheck: config-types/firewall-service-groups/healthCheck
        driftDetect: config-types/firewall-service-groups/driftDetect
        getStatus: config-types/firewall-service-groups/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-ip-pools
