id: fortimanager
name: FortiManager
version: "0.6.0"
vendor: Veltrix
description: >
  Manage Fortinet FortiManager configuration as code through the FortiManager
  JSON-RPC API — firewall address objects (IPv4 and IPv6), wildcard FQDNs, custom
  services, address / IPv6 address / service / schedule groups, IP pools (v4 and v6), virtual IPs
  and VIP groups, multicast and explicit-proxy addresses, traffic shapers and
  shaping profiles, custom Internet Services, security profiles (application
  control, IPS, antivirus, web / DNS filtering, SSL/SSH inspection) and user
  authentication (LDAP / RADIUS / FSSO servers and user groups) — with validation,
  drift detection and rollback handled by the Security-as-Code pipeline.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/fortimanager
icon: "🧱"

platform:
  minVersion: "1.0.0"

# Fortinet brand: red primary.
branding:
  primaryColor: "#DA291C"
  accentColor: "#EE3124"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: firewall-addresses
      actions: [read, write, delete]
      description: Manage FortiManager firewall address objects (ipmask / iprange / fqdn / geography) in the ADOM object database
    - resource: firewall-services
      actions: [read, write, delete]
      description: Manage FortiManager custom firewall service objects (TCP/UDP/SCTP, ICMP, IP) in the ADOM object database
    - resource: firewall-address-groups
      actions: [read, write, delete]
      description: Manage FortiManager firewall address groups (named sets of member address objects) in the ADOM object database
    - resource: firewall-service-groups
      actions: [read, write, delete]
      description: Manage FortiManager firewall service groups (named sets of member service objects) in the ADOM object database
    - resource: firewall-ip-pools
      actions: [read, write, delete]
      description: Manage FortiManager IPv4 IP pools (overload / one-to-one source-NAT ranges) in the ADOM object database
    - resource: firewall-schedules-recurring
      actions: [read, write, delete]
      description: Manage FortiManager recurring firewall schedules (weekly day + time windows) in the ADOM object database
    - resource: firewall-schedules-onetime
      actions: [read, write, delete]
      description: Manage FortiManager one-time firewall schedules (single date-time windows) in the ADOM object database
    - resource: firewall-addresses6
      actions: [read, write, delete]
      description: Manage FortiManager firewall IPv6 address objects (ipprefix / iprange / fqdn) in the ADOM object database
    - resource: firewall-address-groups6
      actions: [read, write, delete]
      description: Manage FortiManager firewall IPv6 address groups (named sets of member address6 objects) in the ADOM object database
    - resource: firewall-wildcard-fqdns
      actions: [read, write, delete]
      description: Manage FortiManager wildcard-FQDN address objects (e.g. *.example.com) in the ADOM object database
    - resource: firewall-vips
      actions: [read, write, delete]
      description: Manage FortiManager firewall virtual IPs (IPv4 static-NAT / DNAT with optional port forwarding) in the ADOM object database
    - resource: firewall-vip-groups
      actions: [read, write, delete]
      description: Manage FortiManager firewall VIP groups (named sets of member virtual IP objects) in the ADOM object database
    - resource: firewall-schedule-groups
      actions: [read, write, delete]
      description: Manage FortiManager firewall schedule groups (named sets of member one-time / recurring schedules) in the ADOM object database
    - resource: firewall-ippools6
      actions: [read, write, delete]
      description: Manage FortiManager IPv6 IP pools (overload source-NAT ranges) in the ADOM object database
    - resource: firewall-proxy-addresses
      actions: [read, write, delete]
      description: Manage FortiManager explicit-proxy address objects (host-regex / url / method / ua matchers) in the ADOM object database
    - resource: firewall-proxy-address-groups
      actions: [read, write, delete]
      description: Manage FortiManager explicit-proxy address groups (named sets of member proxy-address objects) in the ADOM object database
    - resource: firewall-multicast-addresses
      actions: [read, write, delete]
      description: Manage FortiManager firewall multicast address objects (multicast IP ranges or broadcast subnets) in the ADOM object database
    - resource: firewall-traffic-shapers
      actions: [read, write, delete]
      description: Manage FortiManager shared traffic shapers (guaranteed / maximum bandwidth, priority, DiffServ marking) in the ADOM object database
    - resource: firewall-per-ip-shapers
      actions: [read, write, delete]
      description: Manage FortiManager per-IP traffic shapers (per-source bandwidth and concurrent-session limits) in the ADOM object database
    - resource: firewall-shaping-profiles
      actions: [read, write, delete]
      description: Manage FortiManager traffic shaping profiles (ToS / queuing classes with per-class bandwidth guarantees) in the ADOM object database
    - resource: firewall-internet-service-custom
      actions: [read, write, delete]
      description: Manage FortiManager custom Internet Services (ISDB extensions with protocol / port-range / destination entries) in the ADOM object database
    - resource: firewall-internet-service-custom-groups
      actions: [read, write, delete]
      description: Manage FortiManager custom Internet Service groups (named sets of member custom internet services) in the ADOM object database
    - resource: application-control-lists
      actions: [read, write, delete]
      description: Manage FortiManager application control profiles (default actions plus per-category / application rules) in the ADOM object database
    - resource: ips-sensors
      actions: [read, write, delete]
      description: Manage FortiManager IPS sensors (signature filter entries plus botnet / malicious-URL controls) in the ADOM object database
    - resource: antivirus-profiles
      actions: [read, write, delete]
      description: Manage FortiManager antivirus profiles (inspection mode, scan mode and per-protocol scanning behaviour) in the ADOM object database
    - resource: webfilter-profiles
      actions: [read, write, delete]
      description: Manage FortiManager web filter security profiles in the ADOM object database
    - resource: dnsfilter-profiles
      actions: [read, write, delete]
      description: Manage FortiManager DNS filter security profiles in the ADOM object database
    - resource: ssl-ssh-profiles
      actions: [read, write, delete]
      description: Manage FortiManager SSL/SSH inspection security profiles in the ADOM object database
    - resource: user-ldap-servers
      actions: [read, write, delete]
      description: Manage FortiManager LDAP authentication servers in the ADOM object database
    - resource: user-radius-servers
      actions: [read, write, delete]
      description: Manage FortiManager RADIUS authentication servers in the ADOM object database
    - resource: user-fsso-agents
      actions: [read, write, delete]
      description: Manage FortiManager FSSO collector-agent connections in the ADOM object database
    - resource: user-groups
      actions: [read, write, delete]
      description: Manage FortiManager user groups (named sets of members and auth servers) in the ADOM object database

