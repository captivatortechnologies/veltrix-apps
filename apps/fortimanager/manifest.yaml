server:
  entry: server/index
  routes:
    prefix: /api/apps/fortimanager

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the JSON-RPC login + ADOM access.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: host
    type: string
    label: Host
    description: >
      FortiManager hostname or URL (e.g. fmg.example.com). The JSON-RPC endpoint
      is https://{host}/jsonrpc. Must present a certificate the platform trusts.
    required: true
  - key: adom
    type: string
    label: ADOM
    description: The Administrative Domain (ADOM) whose object database to manage.
    default: root
    required: false
  - key: workspace_mode
    type: boolean
    label: Workspace mode
    description: >
      Enable if the ADOM uses workspace/workflow mode. Deploys then wrap their
      changes in a lock / commit / unlock transaction.
    default: false
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for FortiManager JSON-RPC calls.
    default: 30
    required: false
