id: fortimanager
name: FortiManager
version: "0.4.0"
vendor: Veltrix
description: >
  Manage Fortinet FortiManager configuration as code through the FortiManager
  JSON-RPC API — Firewall Address objects (IPv4 and IPv6), Wildcard FQDNs, custom
  Firewall Service objects, Address and Service Groups, IP Pools, and recurring /
  one-time Schedules — with validation, drift detection and rollback handled by
  the Security-as-Code pipeline.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/fortimanager
icon: "🧱"

platform:
  minVersion: "1.0.0"

# Fortinet brand: red primary.
branding:
  primaryColor: "#DA291C"
  accentColor: "#EE3124"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: firewall-addresses
      actions: [read, write, delete]
      description: Manage FortiManager firewall address objects (ipmask / iprange / fqdn / geography) in the ADOM object database
    - resource: firewall-services
      actions: [read, write, delete]
      description: Manage FortiManager custom firewall service objects (TCP/UDP/SCTP, ICMP, IP) in the ADOM object database
    - resource: firewall-address-groups
      actions: [read, write, delete]
      description: Manage FortiManager firewall address groups (named sets of member address objects) in the ADOM object database
    - resource: firewall-service-groups
      actions: [read, write, delete]
      description: Manage FortiManager firewall service groups (named sets of member service objects) in the ADOM object database
    - resource: firewall-ip-pools
      actions: [read, write, delete]
      description: Manage FortiManager IPv4 IP pools (overload / one-to-one source-NAT ranges) in the ADOM object database
    - resource: firewall-schedules-recurring
      actions: [read, write, delete]
      description: Manage FortiManager recurring firewall schedules (weekly day + time windows) in the ADOM object database
    - resource: firewall-schedules-onetime
      actions: [read, write, delete]
      description: Manage FortiManager one-time firewall schedules (single date-time windows) in the ADOM object database
    - resource: firewall-addresses6
      actions: [read, write, delete]
      description: Manage FortiManager firewall IPv6 address objects (ipprefix / iprange / fqdn) in the ADOM object database
    - resource: firewall-wildcard-fqdns
      actions: [read, write, delete]
      description: Manage FortiManager wildcard-FQDN address objects (e.g. *.example.com) in the ADOM object database

pipeline:
  configurationTypes:
    - id: firewall-service-groups
      name: Firewall Service Groups
      description: Firewall service groups — a named set of member service objects (name-keyed, upserted per ADOM)
      canvasTemplate: config-types/firewall-service-groups/canvas.yaml
      defaultConfig: config-types/firewall-service-groups/defaults.yaml
      handlers:
        validate: config-types/firewall-service-groups/validate
        deploy: config-types/firewall-service-groups/deploy
        rollback: config-types/firewall-service-groups/rollback
        healthCheck: config-types/firewall-service-groups/healthCheck
        driftDetect: config-types/firewall-service-groups/driftDetect
        getStatus: config-types/firewall-service-groups/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-ip-pools
      name: Firewall IP Pools
      description: IPv4 IP pools — overload (PAT) or one-to-one source-NAT ranges (name-keyed, upserted per ADOM)
      canvasTemplate: config-types/firewall-ip-pools/canvas.yaml
      defaultConfig: config-types/firewall-ip-pools/defaults.yaml
      handlers:
        validate: config-types/firewall-ip-pools/validate
        deploy: config-types/firewall-ip-pools/deploy
        rollback: config-types/firewall-ip-pools/rollback
        healthCheck: config-types/firewall-ip-pools/healthCheck
        driftDetect: config-types/firewall-ip-pools/driftDetect
        getStatus: config-types/firewall-ip-pools/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-schedules-recurring
      name: Recurring Schedules
      description: Recurring firewall schedules — weekly day(s) + start/end time window (name-keyed, upserted per ADOM)
      canvasTemplate: config-types/firewall-schedules-recurring/canvas.yaml
      defaultConfig: config-types/firewall-schedules-recurring/defaults.yaml
      handlers:
        validate: config-types/firewall-schedules-recurring/validate
        deploy: config-types/firewall-schedules-recurring/deploy
        rollback: config-types/firewall-schedules-recurring/rollback
        healthCheck: config-types/firewall-schedules-recurring/healthCheck
        driftDetect: config-types/firewall-schedules-recurring/driftDetect
        getStatus: config-types/firewall-schedules-recurring/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-schedules-onetime
      name: One-time Schedules
      description: One-time firewall schedules — a single start/end date-time window (name-keyed, upserted per ADOM)
      canvasTemplate: config-types/firewall-schedules-onetime/canvas.yaml
      defaultConfig: config-types/firewall-schedules-onetime/defaults.yaml
      handlers:
        validate: config-types/firewall-schedules-onetime/validate
        deploy: config-types/firewall-schedules-onetime/deploy
        rollback: config-types/firewall-schedules-onetime/rollback
        healthCheck: config-types/firewall-schedules-onetime/healthCheck
        driftDetect: config-types/firewall-schedules-onetime/driftDetect
        getStatus: config-types/firewall-schedules-onetime/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-addresses6
      name: Firewall IPv6 Addresses
      description: Firewall IPv6 address objects — IPv6 prefix, range or FQDN (name-keyed, upserted per ADOM)
      canvasTemplate: config-types/firewall-addresses6/canvas.yaml
      defaultConfig: config-types/firewall-addresses6/defaults.yaml
      handlers:
        validate: config-types/firewall-addresses6/validate
        deploy: config-types/firewall-addresses6/deploy
        rollback: config-types/firewall-addresses6/rollback
        healthCheck: config-types/firewall-addresses6/healthCheck
        driftDetect: config-types/firewall-addresses6/driftDetect
        getStatus: config-types/firewall-addresses6/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-wildcard-fqdns
      name: Wildcard FQDNs
      description: Wildcard-FQDN address objects — domain patterns with "*" wildcards, e.g. *.example.com (name-keyed, upserted per ADOM)
      canvasTemplate: config-types/firewall-wildcard-fqdns/canvas.yaml
      defaultConfig: config-types/firewall-wildcard-fqdns/defaults.yaml
      handlers:
        validate: config-types/firewall-wildcard-fqdns/validate
        deploy: config-types/firewall-wildcard-fqdns/deploy
        rollback: config-types/firewall-wildcard-fqdns/rollback
        healthCheck: config-types/firewall-wildcard-fqdns/healthCheck
        driftDetect: config-types/firewall-wildcard-fqdns/driftDetect
        getStatus: config-types/firewall-wildcard-fqdns/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-address-groups
      name: Firewall Address Groups
      description: Firewall address groups — a named set of member address objects (name-keyed, upserted per ADOM)
      canvasTemplate: config-types/firewall-address-groups/canvas.yaml
      defaultConfig: config-types/firewall-address-groups/defaults.yaml
      handlers:
        validate: config-types/firewall-address-groups/validate
        deploy: config-types/firewall-address-groups/deploy
        rollback: config-types/firewall-address-groups/rollback
        healthCheck: config-types/firewall-address-groups/healthCheck
        driftDetect: config-types/firewall-address-groups/driftDetect
        getStatus: config-types/firewall-address-groups/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-services
      name: Firewall Services
      description: Custom firewall service objects — TCP/UDP/SCTP port ranges, ICMP, or IP protocol (name-keyed, upserted per ADOM)
      canvasTemplate: config-types/firewall-services/canvas.yaml
      defaultConfig: config-types/firewall-services/defaults.yaml
      handlers:
        validate: config-types/firewall-services/validate
        deploy: config-types/firewall-services/deploy
        rollback: config-types/firewall-services/rollback
        healthCheck: config-types/firewall-services/healthCheck
        driftDetect: config-types/firewall-services/driftDetect
        getStatus: config-types/firewall-services/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-addresses
      name: Firewall Addresses
      description: Firewall address objects — IP subnet, range, FQDN or geography (name-keyed, upserted per ADOM)
      canvasTemplate: config-types/firewall-addresses/canvas.yaml
      defaultConfig: config-types/firewall-addresses/defaults.yaml
      handlers:
        validate: config-types/firewall-addresses/validate
        deploy: config-types/firewall-addresses/deploy
        rollback: config-types/firewall-addresses/rollback
        healthCheck: config-types/firewall-addresses/healthCheck
        driftDetect: config-types/firewall-addresses/driftDetect
        getStatus: config-types/firewall-addresses/getStatus
      targets:
        componentTypes: [fortimanager]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/fortimanager

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the JSON-RPC login + ADOM access.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: host
    type: string
    label: Host
    description: >
      FortiManager hostname or URL (e.g. fmg.example.com). The JSON-RPC endpoint
      is https://{host}/jsonrpc. Must present a certificate the platform trusts.
    required: true
  - key: adom
    type: string
    label: ADOM
    description: The Administrative Domain (ADOM) whose object database to manage.
    default: root
    required: false
  - key: workspace_mode
    type: boolean
    label: Workspace mode
    description: >
      Enable if the ADOM uses workspace/workflow mode. Deploys then wrap their
      changes in a lock / commit / unlock transaction.
    default: false
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for FortiManager JSON-RPC calls.
    default: 30
    required: false
