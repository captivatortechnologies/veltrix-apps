<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 40" width="176" height="40" role="img" aria-label="FortiManager">
  <defs>
    <linearGradient id="vfm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DA291C"/>
      <stop offset="1" stop-color="#EE3124"/>
    </linearGradient>
  </defs>
  <!-- Original abstract "wall / shield" mark of stacked bricks. Not a
       trademarked Fortinet logo. -->
  <rect x="5" y="8" width="26" height="24" rx="4" fill="url(#vfm)"/>
  <rect x="9" y="12" width="7.5" height="6" rx="1" fill="#fff" opacity="0.9"/>
  <rect x="19.5" y="12" width="7.5" height="6" rx="1" fill="#fff" opacity="0.9"/>
  <rect x="9" y="20" width="18" height="6" rx="1" fill="#fff" opacity="0.9"/>
  <text x="40" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="currentColor">FortiManager</text>
</svg>
