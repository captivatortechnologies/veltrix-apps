id: mimecast
name: Mimecast
version: "0.6.0"
vendor: Veltrix
description: >
  Manage Mimecast configuration as code through the Mimecast API 2.0 — Managed
  URLs, Blocked Sender, Anti-Spoofing Bypass and Address Alteration policies,
  Address Alteration Sets and Definitions, Directory Profile Groups, Web
  Security block/allow policies, and — via the newer Policy Management v1 REST
  surface — Anti-Spoofing, Greylisting, Delivery Route and DNS Authentication
  (outbound DKIM) definitions and policies — with validation, drift detection
  and rollback handled by the Security-as-Code pipeline.
category: COMPLIANCE
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/mimecast
icon: "✉️"

platform:
  minVersion: "1.0.0"

# Mimecast brand: red primary.
branding:
  primaryColor: "#D6002A"
  accentColor: "#F5333F"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: managed-urls
      actions: [read, write, delete]
      description: Manage Mimecast Targeted Threat Protection managed URLs (permit/block by exact URL or domain)
    - resource: blocked-senders
      actions: [read, write, delete]
      description: Manage Mimecast blocked sender policies (block a sender email/domain from reaching recipients)
    - resource: anti-spoofing-bypass
      actions: [read, write, delete]
      description: Manage Mimecast anti-spoofing bypass policies (bypass anti-spoofing checks for trusted senders)
    - resource: address-alteration
      actions: [read, write, delete]
      description: Manage Mimecast address alteration policies (apply an address alteration set to scoped senders/recipients)
    - resource: address-alteration-set
      actions: [read, write, delete]
      description: Manage Mimecast address alteration sets (reusable folders that address alteration policies reference)
    - resource: address-alteration-definition
      actions: [read, write, delete]
      description: Manage Mimecast address alteration definitions (the rewrite rules inside an address alteration set)
    - resource: directory-groups
      actions: [read, write, delete]
      description: Manage Mimecast directory profile groups (cloud groups of email addresses and domains, with membership)
    - resource: web-security-policy
      actions: [read, write, delete]
      description: Manage Mimecast Web Security block/allow policies (Secure Web Gateway allow-block list)
    - resource: anti-spoofing
      actions: [read, write, delete]
      description: Manage Mimecast Anti-Spoofing enforcement policies (Policy Management v1) — whether mail failing the spoofing check is rejected
    - resource: greylisting
      actions: [read, write, delete]
      description: Manage Mimecast Greylisting policies (Policy Management v1) — temporarily defer unrecognized senders
    - resource: delivery-route-definition
      actions: [read, write, delete]
      description: Manage Mimecast Delivery Route definitions (Policy Management v1) — the destination mail server for routed mail
    - resource: delivery-route-policy
      actions: [read, write, delete]
      description: Manage Mimecast Delivery Route policies (Policy Management v1) — which mail is routed through a Delivery Route definition
    - resource: dns-authentication-outbound-definition
      actions: [read, write, delete]
      description: Manage Mimecast DNS Authentication - Outbound (DKIM) definitions (Policy Management v1) — outbound DKIM signing per domain
    - resource: dns-authentication-outbound-policy
      actions: [read, write, delete]
      description: Manage Mimecast DNS Authentication - Outbound policies (Policy Management v1) — which outbound mail is DKIM-signed by a definition

pipeline:
  configurationTypes:
    - id: blocked-senders
      name: Blocked Senders
      description: Blocked sender policies — block a sender email/domain from recipients (description-keyed; delete+recreate on change)
      canvasTemplate: config-types/blocked-senders/canvas.yaml
      defaultConfig: config-types/blocked-senders/defaults.yaml
      handlers:
        validate: config-types/blocked-senders/validate
        deploy: config-types/blocked-senders/deploy
        rollback: config-types/blocked-senders/rollback
        healthCheck: config-types/blocked-senders/healthCheck
        driftDetect: config-types/blocked-senders/driftDetect
        getStatus: config-types/blocked-senders/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: anti-spoofing-bypass
      name: Anti-Spoofing Bypass
      description: Anti-spoofing bypass policies — bypass anti-spoofing checks for trusted senders, optionally scoped to SPF domains (description-keyed; delete+recreate on change)
      canvasTemplate: config-types/anti-spoofing-bypass/canvas.yaml
      defaultConfig: config-types/anti-spoofing-bypass/defaults.yaml
      handlers:
        validate: config-types/anti-spoofing-bypass/validate
        deploy: config-types/anti-spoofing-bypass/deploy
        rollback: config-types/anti-spoofing-bypass/rollback
        healthCheck: config-types/anti-spoofing-bypass/healthCheck
        driftDetect: config-types/anti-spoofing-bypass/driftDetect
        getStatus: config-types/anti-spoofing-bypass/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: address-alteration
      name: Address Alteration
      description: Address alteration policies — apply an address alteration set to scoped senders/recipients (description-keyed; delete+recreate on change)
      canvasTemplate: config-types/address-alteration/canvas.yaml
      defaultConfig: config-types/address-alteration/defaults.yaml
      handlers:
        validate: config-types/address-alteration/validate
        deploy: config-types/address-alteration/deploy
        rollback: config-types/address-alteration/rollback
        healthCheck: config-types/address-alteration/healthCheck
        driftDetect: config-types/address-alteration/driftDetect
        getStatus: config-types/address-alteration/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: address-alteration-set
      name: Address Alteration Sets
      description: Address alteration sets — reusable folders that address alteration policies reference (description-keyed under a parent; ensure-exists, never pruned — Mimecast has no delete/update-set API)
      canvasTemplate: config-types/address-alteration-set/canvas.yaml
      defaultConfig: config-types/address-alteration-set/defaults.yaml
      handlers:
        validate: config-types/address-alteration-set/validate
        deploy: config-types/address-alteration-set/deploy
        rollback: config-types/address-alteration-set/rollback
        healthCheck: config-types/address-alteration-set/healthCheck
        driftDetect: config-types/address-alteration-set/driftDetect
        getStatus: config-types/address-alteration-set/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: address-alteration-definition
      name: Address Alteration Definitions
      description: Address alteration definitions — the rewrite rules inside a set (tuple-keyed; no update API, so a change is a new rule and reconcile deletes only app-created definitions)
      canvasTemplate: config-types/address-alteration-definition/canvas.yaml
      defaultConfig: config-types/address-alteration-definition/defaults.yaml
      handlers:
        validate: config-types/address-alteration-definition/validate
        deploy: config-types/address-alteration-definition/deploy
        rollback: config-types/address-alteration-definition/rollback
        healthCheck: config-types/address-alteration-definition/healthCheck
        driftDetect: config-types/address-alteration-definition/driftDetect
        getStatus: config-types/address-alteration-definition/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: directory-groups
      name: Directory Profile Groups
      description: Directory profile groups — cloud groups of email addresses and domains with membership (name-keyed under a parent; adds/removes only members it owns; LDAP-synced groups skipped; reconcile deletes only app-created groups)
      canvasTemplate: config-types/directory-groups/canvas.yaml
      defaultConfig: config-types/directory-groups/defaults.yaml
      handlers:
        validate: config-types/directory-groups/validate
        deploy: config-types/directory-groups/deploy
        rollback: config-types/directory-groups/rollback
        healthCheck: config-types/directory-groups/healthCheck
        driftDetect: config-types/directory-groups/driftDetect
        getStatus: config-types/directory-groups/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: web-security-policy
      name: Web Security Policies
      description: Web Security (Secure Web Gateway) block/allow policies — description-keyed with a URL block/allow list and a sender/recipient scope (delete+recreate on change; reconcile deletes only app-created policies)
      canvasTemplate: config-types/web-security-policy/canvas.yaml
      defaultConfig: config-types/web-security-policy/defaults.yaml
      handlers:
        validate: config-types/web-security-policy/validate
        deploy: config-types/web-security-policy/deploy
        rollback: config-types/web-security-policy/rollback
        healthCheck: config-types/web-security-policy/healthCheck
        driftDetect: config-types/web-security-policy/driftDetect
        getStatus: config-types/web-security-policy/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: managed-urls
      name: Managed URLs
      description: TTP managed URLs — permit/block by exact URL or domain (URL-keyed; delete+recreate on change)
      canvasTemplate: config-types/managed-urls/canvas.yaml
      defaultConfig: config-types/managed-urls/defaults.yaml
      handlers:
        validate: config-types/managed-urls/validate
        deploy: config-types/managed-urls/deploy
        rollback: config-types/managed-urls/rollback
        healthCheck: config-types/managed-urls/healthCheck
        driftDetect: config-types/managed-urls/driftDetect
        getStatus: config-types/managed-urls/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: anti-spoofing
      name: Anti-Spoofing
      description: Anti-Spoofing enforcement policies (Policy Management v1) — whether mail failing the spoofing check is rejected, scoped to a from/to target (description-keyed; real update via PATCH — no delete+recreate)
      canvasTemplate: config-types/anti-spoofing/canvas.yaml
      defaultConfig: config-types/anti-spoofing/defaults.yaml
      handlers:
        validate: config-types/anti-spoofing/validate
        deploy: config-types/anti-spoofing/deploy
        rollback: config-types/anti-spoofing/rollback
        healthCheck: config-types/anti-spoofing/healthCheck
        driftDetect: config-types/anti-spoofing/driftDetect
        getStatus: config-types/anti-spoofing/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: greylisting
      name: Greylisting
      description: Greylisting policies (Policy Management v1) — temporarily defer unrecognized senders, scoped to a from target (description-keyed; real update via PATCH — no delete+recreate)
      canvasTemplate: config-types/greylisting/canvas.yaml
      defaultConfig: config-types/greylisting/defaults.yaml
      handlers:
        validate: config-types/greylisting/validate
        deploy: config-types/greylisting/deploy
        rollback: config-types/greylisting/rollback
        healthCheck: config-types/greylisting/healthCheck
        driftDetect: config-types/greylisting/driftDetect
        getStatus: config-types/greylisting/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: delivery-route-definition
      name: Delivery Route Definitions
      description: Delivery Route definitions (Policy Management v1) — the destination mail server for routed mail (description-keyed; real update via PATCH; SMTP authentication is intentionally not modeled — see README Coverage)
      canvasTemplate: config-types/delivery-route-definition/canvas.yaml
      defaultConfig: config-types/delivery-route-definition/defaults.yaml
      handlers:
        validate: config-types/delivery-route-definition/validate
        deploy: config-types/delivery-route-definition/deploy
        rollback: config-types/delivery-route-definition/rollback
        healthCheck: config-types/delivery-route-definition/healthCheck
        driftDetect: config-types/delivery-route-definition/driftDetect
        getStatus: config-types/delivery-route-definition/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: delivery-route-policy
      name: Delivery Route Policies
      description: Delivery Route policies (Policy Management v1) — which mail is routed through a Delivery Route Definition, scoped to a from/to target (description-keyed; real update via PATCH — no delete+recreate)
      canvasTemplate: config-types/delivery-route-policy/canvas.yaml
      defaultConfig: config-types/delivery-route-policy/defaults.yaml
      handlers:
        validate: config-types/delivery-route-policy/validate
        deploy: config-types/delivery-route-policy/deploy
        rollback: config-types/delivery-route-policy/rollback
        healthCheck: config-types/delivery-route-policy/healthCheck
        driftDetect: config-types/delivery-route-policy/driftDetect
        getStatus: config-types/delivery-route-policy/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: dns-authentication-outbound-definition
      name: DNS Authentication - Outbound Definitions
      description: Outbound DKIM signing definitions (Policy Management v1) — Mimecast generates and holds the DKIM keypair; only description/domain/selector/keyLength are ever sent (description-keyed; real update via PATCH)
      canvasTemplate: config-types/dns-authentication-outbound-definition/canvas.yaml
      defaultConfig: config-types/dns-authentication-outbound-definition/defaults.yaml
      handlers:
        validate: config-types/dns-authentication-outbound-definition/validate
        deploy: config-types/dns-authentication-outbound-definition/deploy
        rollback: config-types/dns-authentication-outbound-definition/rollback
        healthCheck: config-types/dns-authentication-outbound-definition/healthCheck
        driftDetect: config-types/dns-authentication-outbound-definition/driftDetect
        getStatus: config-types/dns-authentication-outbound-definition/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

    - id: dns-authentication-outbound-policy
      name: DNS Authentication - Outbound Policies
      description: Outbound DKIM policies (Policy Management v1) — which outbound mail is signed by a DNS Authentication - Outbound Definition, scoped to a from/to target (description-keyed; real update via PATCH — no delete+recreate)
      canvasTemplate: config-types/dns-authentication-outbound-policy/canvas.yaml
      defaultConfig: config-types/dns-authentication-outbound-policy/defaults.yaml
      handlers:
        validate: config-types/dns-authentication-outbound-policy/validate
        deploy: config-types/dns-authentication-outbound-policy/deploy
        rollback: config-types/dns-authentication-outbound-policy/rollback
        healthCheck: config-types/dns-authentication-outbound-policy/healthCheck
        driftDetect: config-types/dns-authentication-outbound-policy/driftDetect
        getStatus: config-types/dns-authentication-outbound-policy/getStatus
      targets:
        componentTypes: [mimecast]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/mimecast

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: acquires a token and lists managed URLs.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: base_url
    type: string
    label: API Base URL
    description: >
      The Mimecast API base URL. Defaults to https://api.services.mimecast.com;
      override only if your tenant uses a different gateway host.
    default: https://api.services.mimecast.com
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Mimecast API calls.
    default: 30
    required: false
