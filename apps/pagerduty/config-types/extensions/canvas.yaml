# =============================================================================
# Canvas Template — PagerDuty Extensions
#
# Declares ONE PagerDuty service extension (the item) — a generic webhook or
# vendor integration (Slack, ServiceNow, ...) attached to one or more services.
# Users add as many as they need. Field keys must match
# config-types/extensions/_shared.ts. Applied via the PagerDuty REST API v2
# (/extensions) at https://api.pagerduty.com.
#
# PagerDuty assigns the server id, so identity for reconciliation is the
# extension `name`. Every extension references an extension schema (the vendor
# integration type) and one or more services; the operator supplies both by
# NAME and the deploy resolves them to ids.
# =============================================================================

id: "pagerduty-extensions"
name: "Extensions"
toolType: "pagerduty"
entityType: "extensions"
description: "Manage PagerDuty service extensions — generic webhooks and vendor integrations attached to one or more services — via the PagerDuty REST API v2 (/extensions). Reconciled by name."

item:
  label: "Extension"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Extension"
      icon: "link"
      description: "Extension identity, its vendor schema and the services it applies to"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The extension name shown in PagerDuty. Used as the stable identity for upsert and drift."

        - key: "extension_schema"
          label: "Extension Schema (name)"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The NAME of the extension schema (vendor integration) to use, e.g. \"Generic V2 Webhook\", \"Slack\" or \"ServiceNow\". Resolved to its id at deploy time; the deploy fails if no schema with this name exists in the account."

        - key: "endpoint_url"
          label: "Endpoint URL"
          fieldType: "text"
          required: false
          validation:
            maxLength: 2048
          helpText: >
            The URL the extension calls. Whether this is required depends on the
            chosen extension schema — some vendors (e.g. a generic webhook)
            require it, others (e.g. some Slack integrations) don't. If the
            chosen schema requires one and this is left blank, PagerDuty
            rejects the deploy with an error. May contain a vendor secret (e.g.
            a webhook token embedded in the URL) — this is the extension's own
            credential, not this app's platform credential, and it is stored
            and displayed like any other declared field (visible in the
            Configuration Canvas, drift diffs, and audit history).

        - key: "extension_objects"
          label: "Applies To (service names, JSON array)"
          fieldType: "textarea"
          required: true
          helpText: >
            Required JSON array of service NAMES this extension applies to,
            e.g. ["My Web App", "Checkout API"]. Each name is resolved to a
            service id at deploy time; the deploy fails if any named service
            does not exist in the account.

        - key: "config"
          label: "Vendor Config (JSON)"
          fieldType: "textarea"
          required: false
          helpText: >
            Optional vendor-specific configuration object, passed through as
            declared (e.g. { "restrict": "any", "notify_types": { "resolve":
            false } }). May contain a vendor secret (e.g. an access_token) —
            this is the extension's own credential, not this app's platform
            credential, and it is stored and displayed like any other declared
            field (visible in the Configuration Canvas, drift diffs, and audit
            history).
