# =============================================================================
# Canvas Template — PagerDuty Services
#
# Declares ONE PagerDuty service (the item). Users add as many as they need.
# Field keys must match config-types/services/_shared.ts. Applied via the
# PagerDuty REST API v2 (/services) at https://api.pagerduty.com.
#
# PagerDuty assigns the server id, so identity for reconciliation is the service
# `name`. Every service references an escalation policy; the operator supplies the
# policy NAME here and the deploy resolves it to an id (escalation_policy_reference).
# =============================================================================

id: "pagerduty-services"
name: "Services"
toolType: "pagerduty"
entityType: "services"
description: "Manage PagerDuty services — name, description, the escalation policy that backs them, alert/ack timeouts and alert-creation mode — via the PagerDuty REST API v2 (/services). Reconciled by name."

item:
  label: "Service"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Service"
      icon: "server"
      description: "Service identity, its escalation policy and incident behavior"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The service name shown in PagerDuty. Used as the stable identity for upsert and drift."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 1024
          helpText: "Optional description of what this service represents."

        - key: "escalation_policy"
          label: "Escalation Policy (name)"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The NAME of an existing escalation policy to attach. Resolved to its id at deploy time; the deploy fails if no policy with this name exists in the account."

        - key: "auto_resolve_timeout"
          label: "Auto-resolve Timeout (seconds)"
          fieldType: "number"
          required: false
          validation:
            min: 0
          helpText: "How long (seconds) before an unresolved incident auto-resolves. Leave blank to use the PagerDuty default."

        - key: "acknowledgement_timeout"
          label: "Acknowledgement Timeout (seconds)"
          fieldType: "number"
          required: false
          validation:
            min: 0
          helpText: "How long (seconds) before an acknowledged incident is un-acknowledged and re-escalates. Leave blank to use the PagerDuty default (1800)."

        - key: "alert_creation"
          label: "Alert Creation"
          fieldType: "select"
          required: false
          defaultValue: "create_alerts_and_incidents"
          options:
            - label: "Create alerts and incidents"
              value: "create_alerts_and_incidents"
            - label: "Create incidents (no alerts)"
              value: "create_incidents"
          helpText: "Whether incoming events open alerts + incidents or only incidents. Note: PagerDuty has deprecated this field — all services are migrating to alerts and incidents."
