# =============================================================================
# Canvas Template — PagerDuty Business Services
#
# Declares ONE PagerDuty business service (the item). Users add as many as they
# need. Field keys must match config-types/business-services/_shared.ts. Applied
# via the PagerDuty REST API v2 (/business_services) at https://api.pagerduty.com.
#
# PagerDuty assigns the server id, so identity for reconciliation is the business
# service `name`. A business service models a capability that spans multiple
# technical services and may optionally be owned by a team; the operator supplies
# the team by NAME here and the deploy resolves it to an id.
#
# NOT YET MANAGED: business service subscribers and cross-service dependencies
# (service_dependencies) are real PagerDuty features but are out of scope for this
# config type — see the app README for a note on this planned future addition.
# =============================================================================

id: "pagerduty-business-services"
name: "Business Services"
toolType: "pagerduty"
entityType: "business-services"
description: "Manage PagerDuty business services — name, description, point of contact and owning team — via the PagerDuty REST API v2 (/business_services). Reconciled by name."

item:
  label: "Business Service"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Business Service"
      icon: "briefcase"
      description: "Business service identity, ownership and the team it belongs to"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The business service name shown in PagerDuty. Used as the stable identity for upsert and drift."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 1024
          helpText: "Optional description of the business capability this service represents."

        - key: "point_of_contact"
          label: "Point of Contact"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "Freeform name of the person or team accountable for this business service (e.g. \"Jane Doe\" or \"SRE Team\"). Stored as plain text by PagerDuty — not resolved against any directory."

        - key: "team"
          label: "Team (name)"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "The NAME of an existing PagerDuty team to own this business service. Resolved to its id at deploy time; the deploy fails if no team with this name exists in the account. Leave blank so only admins have access."
