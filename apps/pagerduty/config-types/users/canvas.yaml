              value: "teal"
            - label: "Orange"
              value: "orange"
            - label: "Brown"
              value: "brown"
            - label: "Turquoise"
              value: "turquoise"
            - label: "Dark Slate Blue"
              value: "dark-slate-blue"
            - label: "Cayenne"
              value: "cayenne"
            - label: "Orange Red"
              value: "orange-red"
            - label: "Dark Orchid"
              value: "dark-orchid"
            - label: "Dark Slate Grey"
              value: "dark-slate-grey"
            - label: "Lime"
              value: "lime"
            - label: "Dark Magenta"
              value: "dark-magenta"
            - label: "Lime Green"
              value: "lime-green"
            - label: "Midnight Blue"
              value: "midnight-blue"
            - label: "Deep Pink"
