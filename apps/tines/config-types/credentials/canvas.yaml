# =============================================================================
# Canvas Template — Tines Credentials (metadata only)
#
# Declares ONE Tines Credential's METADATA (the item) — name, mode, sharing,
# non-secret metadata and expiry. Applied via the Tines REST API
# (POST/PUT/GET/DELETE /api/v1/user_credentials).
#
# ⚠ Secret material is WRITE-ONLY — Tines never returns it, so it cannot be
# diffed, logged, or captured for rollback. See secret_value / secret_config
# below and config-types/credentials/_shared.ts.
#
# Only modes whose secret material is a FLAT set of fields are modeled:
# TEXT, AWS, JWT, OAUTH, MTLS. HTTP_REQUEST_AGENT and MULTI_REQUEST are
# intentionally excluded — see the README Coverage section for why.
# =============================================================================

id: "tines-credentials"
name: "Credentials"
toolType: "tines"
entityType: "credentials"
description: "Manage Tines Credential metadata (name, mode, sharing, non-secret metadata, expiry) via the Tines REST API (/api/v1/user_credentials). Secret material is write-only and never read back. Reconciled by name, scoped to Team."

item:
  label: "Credential"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Identity"
      icon: "key"
      description: "Credential identity, mode and scope"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The credential name shown in Tines, referenced from a Story as CREDENTIAL.<name>. Combined with Team, this is the stable identity used for upsert and drift."

        - key: "team_id"
          label: "Team"
          fieldType: "remote-select"
          optionsSource: "teams"
          required: true
          helpText: "The Tines Team that owns this credential."

        - key: "mode"
          label: "Mode"
          fieldType: "select"
          required: true
          defaultValue: "TEXT"
          options:
            - { label: "Text (single secret value)", value: "TEXT" }
            - { label: "AWS", value: "AWS" }
            - { label: "JWT", value: "JWT" }
            - { label: "OAuth", value: "OAUTH" }
            - { label: "Mutual TLS (mTLS)", value: "MTLS" }
          helpText: "Which credential shape Tines stores. HTTP Request and Multi Request modes are not supported by this config type — see the app README."

        - key: "folder_name"
          label: "Folder Name"
          fieldType: "text"
          required: false
          validation:
            maxLength: 255
          helpText: "Optional. The NAME of an existing Credential-type folder in this Team (see the Folders config type). Leave blank for the team root."

    - name: "Secret Material (write-only)"
      icon: "lock"
      description: "Sent to Tines but never read back, diffed or restored on rollback"
      fields:
        - key: "secret_value"
          label: "Value (Text mode)"
          fieldType: "password"
          required: false
          visibleWhen:
            field: "mode"
            equals: "TEXT"
          helpText: >
            ⚠ WRITE-ONLY secret. Required by Tines when creating a NEW Text
            credential; leaving it blank on an EXISTING credential keeps its
            current value unchanged.

        - key: "secret_config"
          label: "Secret Fields (AWS / JWT / OAuth / mTLS)"
          fieldType: "keyvalue"
          required: false
          visibleWhen:
            field: "mode"
            in: ["AWS", "JWT", "OAUTH", "MTLS"]
          helpText: >
            ⚠ WRITE-ONLY secret fields, as flat key → value pairs matching the
            mode's Tines API fields — AWS: aws_authentication_type,
            aws_access_key, aws_secret_key, aws_assumed_role_arn; JWT: the
            signing key and claim fields; OAuth: client_id, client_secret,
            token_url, scope; mTLS: cert, key. Required by Tines when creating
            a NEW credential of that mode; leave blank on an EXISTING
            credential to keep its current secret material unchanged.

    - name: "Non-secret Metadata"
      icon: "info"
      description: "Round-tripped and diffable — never secret material"
      fields:
        - key: "description"
          label: "Description"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 2000
          helpText: "What this credential is used for — shown in the Tines UI."

        - key: "metadata"
          label: "Metadata"
          fieldType: "keyvalue"
          required: false
          helpText: "Arbitrary non-secret key/value pairs Tines stores alongside the credential (e.g. owner, rotation_schedule)."

        - key: "allowed_hosts"
          label: "Allowed Hosts"
          fieldType: "tags"
          required: false
          helpText: "Domains (wildcards supported, e.g. *.example.com) this credential's value may be sent to from an HTTP Request action. Leave empty for no restriction."

        - key: "expires_at"
          label: "Expires At (ISO 8601)"
          fieldType: "text"
          required: false
          validation:
            maxLength: 40
          helpText: "Optional expiration timestamp, e.g. 2027-01-01T00:00:00Z."

        - key: "expiry_notifications_enabled"
          label: "Expiry Notifications Enabled"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "Whether Tines sends expiry-approaching notifications for this credential."

    - name: "Sharing"
      icon: "share"
      description: "Which teams can use this credential"
      fields:
        - key: "read_access"
          label: "Read Access"
          fieldType: "select"
          required: false
          defaultValue: "TEAM"
          options:
            - { label: "This team only", value: "TEAM" }
            - { label: "Every team in the tenant", value: "GLOBAL" }
            - { label: "Specific teams", value: "SPECIFIC_TEAMS" }
          helpText: "Which teams besides the owning team can reference this credential."

        - key: "shared_team_slugs"
          label: "Shared Team Slugs"
          fieldType: "tags"
          required: false
          visibleWhen:
            field: "read_access"
            equals: "SPECIFIC_TEAMS"
          helpText: "Team slugs allowed to reference this credential, used only when Read Access is Specific teams."
