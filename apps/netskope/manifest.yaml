id: netskope
name: Netskope
version: "0.4.0"
vendor: Veltrix
description: >
  Manage Netskope configuration as code through the Netskope REST API v2 — URL
  Lists, Device Classification Tags, RBAC Labels, NPA Publishers and NPA Private
  Apps — with validation, drift detection and rollback handled by the
  Security-as-Code pipeline.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/netskope
icon: "🌐"

platform:
  minVersion: "1.0.0"

# Netskope brand: teal primary.
branding:
  primaryColor: "#005B92"
  accentColor: "#00A6CE"
  logo: ./assets/logo.svg

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: url-lists
      actions: [read, write, delete]
      description: Manage Netskope URL lists (exact URLs/IPs or regex patterns) via the REST API v2
    - resource: device-classification-tags
      actions: [read, write, delete]
      description: Manage Netskope device classification tags (name + description) via the REST API v2
    - resource: rbac-labels
      actions: [read, write, delete]
      description: Manage Netskope RBAC labels (name + color) via the REST API v2
    - resource: npa-publishers
      actions: [read, write, delete]
      description: Manage Netskope Private Access (NPA) publishers (name + local broker connect) via the REST API v2
    - resource: private-apps
      actions: [read, write, delete]
      description: Manage Netskope Private Access (NPA) private apps (host, protocols, publishers) via the REST API v2

pipeline:
  configurationTypes:
    - id: npa-publishers
      name: NPA Publishers
      description: NPA publishers — name + local broker connect (name-keyed; publisher_id stored for rename-safety; PATCH update, no deploy step)
      canvasTemplate: config-types/npa-publishers/canvas.yaml
      defaultConfig: config-types/npa-publishers/defaults.yaml
      handlers:
        validate: config-types/npa-publishers/validate
        deploy: config-types/npa-publishers/deploy
        rollback: config-types/npa-publishers/rollback
        healthCheck: config-types/npa-publishers/healthCheck
        driftDetect: config-types/npa-publishers/driftDetect
        getStatus: config-types/npa-publishers/getStatus
      targets:
        componentTypes: [netskope]
        requiresCredential: true
        requiresConnectivity: false

    - id: private-apps
      name: Private Apps
      description: NPA private apps — host, TCP/UDP protocols and publishers (name-keyed; id stored for rename-safety; PUT replaces the full spec, no deploy step; publishers resolved to ids)
      canvasTemplate: config-types/private-apps/canvas.yaml
      defaultConfig: config-types/private-apps/defaults.yaml
      handlers:
        validate: config-types/private-apps/validate
        deploy: config-types/private-apps/deploy
        rollback: config-types/private-apps/rollback
        healthCheck: config-types/private-apps/healthCheck
        driftDetect: config-types/private-apps/driftDetect
        getStatus: config-types/private-apps/getStatus
      targets:
        componentTypes: [netskope]
        requiresCredential: true
        requiresConnectivity: false

    - id: rbac-labels
      name: RBAC Labels
      description: RBAC labels — name + color (name-keyed; id stored for rename-safety; PATCH update, no deploy step)
      canvasTemplate: config-types/rbac-labels/canvas.yaml
      defaultConfig: config-types/rbac-labels/defaults.yaml
      handlers:
        validate: config-types/rbac-labels/validate
        deploy: config-types/rbac-labels/deploy
        rollback: config-types/rbac-labels/rollback
        healthCheck: config-types/rbac-labels/healthCheck
        driftDetect: config-types/rbac-labels/driftDetect
        getStatus: config-types/rbac-labels/getStatus
      targets:
        componentTypes: [netskope]
        requiresCredential: true
        requiresConnectivity: false

    - id: device-classification-tags
      name: Device Classification Tags
      description: Device classification tags — name + description (name-keyed; id stored for rename-safety; no deploy step)
      canvasTemplate: config-types/device-classification-tags/canvas.yaml
      defaultConfig: config-types/device-classification-tags/defaults.yaml
      handlers:
        validate: config-types/device-classification-tags/validate
        deploy: config-types/device-classification-tags/deploy
        rollback: config-types/device-classification-tags/rollback
        healthCheck: config-types/device-classification-tags/healthCheck
        driftDetect: config-types/device-classification-tags/driftDetect
        getStatus: config-types/device-classification-tags/getStatus
      targets:
        componentTypes: [netskope]
        requiresCredential: true
        requiresConnectivity: false

    - id: url-lists
      name: URL Lists
      description: URL lists — exact URLs/IPs or regex patterns (name-keyed; staged then applied with a single deploy)
      canvasTemplate: config-types/url-lists/canvas.yaml
      defaultConfig: config-types/url-lists/defaults.yaml
      handlers:
        validate: config-types/url-lists/validate
        deploy: config-types/url-lists/deploy
        rollback: config-types/url-lists/rollback
        healthCheck: config-types/url-lists/healthCheck
        driftDetect: config-types/url-lists/driftDetect
        getStatus: config-types/url-lists/getStatus
      targets:
        componentTypes: [netskope]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/netskope

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the token against GET /policy/urllist.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: tenant
    type: string
    label: Tenant
    description: >
      Your Netskope tenant host (e.g. acme.goskope.com). The API base is
      https://{tenant}/api/v2.
    required: true
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Netskope REST API v2 calls.
    default: 30
    required: false
