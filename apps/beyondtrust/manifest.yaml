id: beyondtrust
name: BeyondTrust
version: "0.3.0"
vendor: Veltrix
description: >
  Manage BeyondTrust Password Safe (privileged access management) as code. Author
  Password Safe functional accounts and drive them through the Security-as-Code
  pipeline — validate, deploy, health check, drift detection and rollback — over
  the BeyondInsight / Password Safe REST API (PS-Auth session, HTTPS, self-signed
  tolerated).
category: IAM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/beyondtrust
icon: "🔐"

platform:
  minVersion: "1.0.0"

# BeyondTrust brand orange. Placeholder until the official lockup is added.
branding:
  primaryColor: "#f26a1b"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: functional-accounts
      actions: [read, write, delete]
      description: Manage Password Safe functional accounts (create / list / delete)
    - resource: user-groups
      actions: [read, write, delete]
      description: Manage BeyondInsight user groups (create / list / delete)
    - resource: workgroups
      actions: [read, write]
      description: >
        Manage BeyondInsight workgroups (create / list). Password Safe has no
        delete endpoint for workgroups, so there is no delete action.
    - resource: managed-systems
      actions: [read, write]
      description: >
        Manage Password Safe managed systems scoped to an existing workgroup
        (create / list). No confirmed delete endpoint for a managed system
        created this way, so there is no delete action.
    - resource: managed-accounts
      actions: [read, write, delete]
      description: >
        Manage Password Safe auto-managed accounts on an existing managed
        system (create / update / list / delete). Never authors a password,
        private key or passphrase — Password Safe generates and rotates the
        secret itself.
    - resource: directories
      actions: [read, write, delete]
      description: >
        Manage BeyondInsight directory bindings (Active Directory / LDAP)
        scoped to an existing workgroup (create / update / list / delete).
        Never authors a bind credential — provision the matching Directory
        Credential separately in BeyondInsight.
    - resource: address-groups
      actions: [read, write, delete]
      description: >
        Manage BeyondInsight address groups and their member IP addresses
        (create / reconcile membership / list / delete).
    - resource: attributes
      actions: [read, write, delete]
      description: >
        Manage BeyondInsight attribute types and values used to tag managed
        accounts/systems for Smart Rule scoping (create / list / delete
        values). Attribute types are create-if-absent and never auto-deleted.

pipeline:
  configurationTypes:
    - id: functional-accounts
      group: "Password Safe"
      name: Functional Accounts
      description: >
        Password Safe functional accounts — the service accounts Password Safe uses
        to manage systems (platform, account name, domain, elevation) — applied over
        the BeyondInsight REST API (PS-Auth session).
      canvasTemplate: config-types/functional-accounts/canvas.yaml
      defaultConfig: config-types/functional-accounts/defaults.yaml
      handlers:
        validate: config-types/functional-accounts/validate
        deploy: config-types/functional-accounts/deploy
        rollback: config-types/functional-accounts/rollback
        healthCheck: config-types/functional-accounts/healthCheck
        driftDetect: config-types/functional-accounts/driftDetect
        getStatus: config-types/functional-accounts/getStatus
      targets:
        componentTypes: [beyondtrust-passwordsafe, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: user-groups
      group: "Password Safe"
      name: User Groups
      description: >
        BeyondInsight user groups — the BeyondInsight-type groups that carry
        Password Safe roles and Smart Rule access (name, description, active
        flag) — applied over the BeyondInsight REST API (PS-Auth session).
        BeyondInsight-type groups only; Active Directory / LDAP / Entra ID
        groups require a bound directory and are out of scope.
      canvasTemplate: config-types/user-groups/canvas.yaml
      defaultConfig: config-types/user-groups/defaults.yaml
      handlers:
        validate: config-types/user-groups/validate
        deploy: config-types/user-groups/deploy
        rollback: config-types/user-groups/rollback
        healthCheck: config-types/user-groups/healthCheck
        driftDetect: config-types/user-groups/driftDetect
        getStatus: config-types/user-groups/getStatus
      targets:
        componentTypes: [beyondtrust-passwordsafe, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: workgroups
      group: "Password Safe"
      name: Workgroups
      description: >
        BeyondInsight workgroups — the containers that organize assets and
        managed systems (name, optional organization) — applied over the
        BeyondInsight REST API (PS-Auth session). Create-if-absent: Password
        Safe has no update or delete endpoint for workgroups.
      canvasTemplate: config-types/workgroups/canvas.yaml
      defaultConfig: config-types/workgroups/defaults.yaml
      handlers:
        validate: config-types/workgroups/validate
        deploy: config-types/workgroups/deploy
        rollback: config-types/workgroups/rollback
        healthCheck: config-types/workgroups/healthCheck
        driftDetect: config-types/workgroups/driftDetect
        getStatus: config-types/workgroups/getStatus
      targets:
        componentTypes: [beyondtrust-passwordsafe, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: managed-systems
      group: "Password Safe"
      name: Managed Systems
      description: >
        Password Safe managed systems scoped to an existing workgroup
        (platform, timeout, password/DSS key rules, release windows) —
        applied over the BeyondInsight REST API (PS-Auth session). Create-if-
        absent: no confirmed update or delete endpoint for a managed system
        created via a workgroup.
      canvasTemplate: config-types/managed-systems/canvas.yaml
      defaultConfig: config-types/managed-systems/defaults.yaml
      handlers:
        validate: config-types/managed-systems/validate
        deploy: config-types/managed-systems/deploy
        rollback: config-types/managed-systems/rollback
        healthCheck: config-types/managed-systems/healthCheck
        driftDetect: config-types/managed-systems/driftDetect
        getStatus: config-types/managed-systems/getStatus
      targets:
        componentTypes: [beyondtrust-passwordsafe, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: managed-accounts
      group: "Password Safe"
      name: Managed Accounts
      description: >
        Password Safe auto-managed accounts on an existing managed system
        (account name, domain, password/release policy) — applied over the
        BeyondInsight REST API (PS-Auth session). Real upsert (create or
        update) and delete. Always AutoManagementFlag — never authors a
        password, private key or passphrase.
      canvasTemplate: config-types/managed-accounts/canvas.yaml
      defaultConfig: config-types/managed-accounts/defaults.yaml
      handlers:
        validate: config-types/managed-accounts/validate
        deploy: config-types/managed-accounts/deploy
        rollback: config-types/managed-accounts/rollback
        healthCheck: config-types/managed-accounts/healthCheck
        driftDetect: config-types/managed-accounts/driftDetect
        getStatus: config-types/managed-accounts/getStatus
      targets:
        componentTypes: [beyondtrust-passwordsafe, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: directories
      group: "Password Safe"
      name: Directories
      description: >
        BeyondInsight directory bindings (Active Directory / LDAP domain,
        forest, NetBIOS name, connection settings) scoped to an existing
        workgroup — applied over the BeyondInsight REST API (PS-Auth
        session). Real upsert (create or update) and delete. Never authors a
        bind credential — provision the matching Directory Credential
        separately in BeyondInsight.
      canvasTemplate: config-types/directories/canvas.yaml
      defaultConfig: config-types/directories/defaults.yaml
      handlers:
        validate: config-types/directories/validate
        deploy: config-types/directories/deploy
        rollback: config-types/directories/rollback
        healthCheck: config-types/directories/healthCheck
        driftDetect: config-types/directories/driftDetect
        getStatus: config-types/directories/getStatus
      targets:
        componentTypes: [beyondtrust-passwordsafe, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: address-groups
      group: "Password Safe"
      name: Address Groups
      description: >
        BeyondInsight address groups — named IP address / range collections
        used to scope access policies and Smart Rules — applied over the
        BeyondInsight REST API (PS-Auth session). Membership is
        authoritative: the declared address list is reconciled against the
        live group on every deploy.
      canvasTemplate: config-types/address-groups/canvas.yaml
      defaultConfig: config-types/address-groups/defaults.yaml
      handlers:
        validate: config-types/address-groups/validate
        deploy: config-types/address-groups/deploy
        rollback: config-types/address-groups/rollback
        healthCheck: config-types/address-groups/healthCheck
        driftDetect: config-types/address-groups/driftDetect
        getStatus: config-types/address-groups/getStatus
      targets:
        componentTypes: [beyondtrust-passwordsafe, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: attributes
      group: "Password Safe"
      name: Attributes
      description: >
        BeyondInsight attribute types and values used to tag managed
        accounts/systems for Smart Rule scoping — applied over the
        BeyondInsight REST API (PS-Auth session). Create-if-absent at both
        tiers; a shared attribute type is never auto-deleted by rollback.
      canvasTemplate: config-types/attributes/canvas.yaml
      defaultConfig: config-types/attributes/defaults.yaml
      handlers:
        validate: config-types/attributes/validate
        deploy: config-types/attributes/deploy
        rollback: config-types/attributes/rollback
        healthCheck: config-types/attributes/healthCheck
        driftDetect: config-types/attributes/driftDetect
        getStatus: config-types/attributes/getStatus
      targets:
        componentTypes: [beyondtrust-passwordsafe, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/beyondtrust

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the Password Safe host (component)
    # with the API key + run-as user (credential), with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's host + API key + run-as
# user against the BeyondInsight REST API (POST /Auth/SignAppIn, HTTPS 443).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: ps_port
    type: number
    label: Password Safe HTTPS Port
    description: HTTPS port for the BeyondInsight / Password Safe web API
    default: 443
    required: false
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the Password Safe endpoint. Off by default —
      on-premises BeyondInsight commonly ships a self-signed certificate.
    default: false
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
