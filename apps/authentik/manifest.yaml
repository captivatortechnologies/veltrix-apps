id: authentik
name: authentik
version: "0.3.0"
vendor: Veltrix
description: >
  Manage authentik (open-source Identity Provider) as code. Author authentik
  Applications, OAuth2/OpenID Providers, Groups and Flows and drive them through
  the Security-as-Code pipeline (validate, deploy, health check, drift
  detection, rollback) over the authentik REST API (HTTPS, self-signed
  tolerated), authenticated with a static API token. Applications bind to a
  Provider (now authorable as OAuth2/OpenID Providers) via policy-based access
  control. Now with BYOL infrastructure provisioning for the authentik stack
  (server + worker nodes and PostgreSQL — authentik removed its Redis
  dependency in the 2025.10 release).
category: IAM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/authentik
icon: "🔑"

platform:
  minVersion: "1.0.0"

# authentik's orange brand accent — placeholder until the official lockup is added.
branding:
  primaryColor: "#fd4b2d"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: applications
      actions: [read, write, delete]
      description: Manage authentik Applications (create / edit / delete)
    - resource: oauth2-providers
      actions: [read, write, delete]
      description: Manage authentik OAuth2/OpenID Providers (create / edit / delete)
    - resource: groups
      actions: [read, write, delete]
      description: Manage authentik Groups (create / edit / delete)
    - resource: flows
      actions: [read, write, delete]
      description: Manage authentik Flows (create / edit / delete)
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL authentik stack infrastructure
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: authentik_

pipeline:
  configurationTypes:
    - id: applications
      group: "Applications"
      name: Applications
      description: authentik Applications — name, slug, provider binding (by existing provider pk), UI group, policy engine mode and metadata — applied over the authentik Core REST API (/api/v3/core/applications/)
      canvasTemplate: config-types/applications/canvas.yaml
      defaultConfig: config-types/applications/defaults.yaml
      handlers:
        validate: config-types/applications/validate
        deploy: config-types/applications/deploy
        rollback: config-types/applications/rollback
        healthCheck: config-types/applications/healthCheck
        driftDetect: config-types/applications/driftDetect
        getStatus: config-types/applications/getStatus
      targets:
        componentTypes: [authentik-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: oauth2-providers
      group: "Providers"
      name: OAuth2/OpenID Providers
      description: authentik OAuth2/OpenID Providers — name, authorization/invalidation flow (by Flow UUID), client type/id, signing key, redirect URIs and scope mappings — applied over the authentik Core REST API (/api/v3/providers/oauth2/). Upserts by NAME (the API path key is a server-assigned id); the client secret is never read or captured.
      canvasTemplate: config-types/oauth2-providers/canvas.yaml
      defaultConfig: config-types/oauth2-providers/defaults.yaml
      handlers:
        validate: config-types/oauth2-providers/validate
        deploy: config-types/oauth2-providers/deploy
        rollback: config-types/oauth2-providers/rollback
        healthCheck: config-types/oauth2-providers/healthCheck
        driftDetect: config-types/oauth2-providers/driftDetect
        getStatus: config-types/oauth2-providers/getStatus
      targets:
        componentTypes: [authentik-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: groups
      group: "Directory"
      name: Groups
      description: authentik Groups — name, superuser flag, an optional parent group and custom attributes — applied over the authentik Core REST API (/api/v3/core/groups/). Upserts by NAME (the API path key is a server-assigned UUID); group membership and RBAC roles are not authored here.
      canvasTemplate: config-types/groups/canvas.yaml
      defaultConfig: config-types/groups/defaults.yaml
      handlers:
        validate: config-types/groups/validate
        deploy: config-types/groups/deploy
        rollback: config-types/groups/rollback
        healthCheck: config-types/groups/healthCheck
        driftDetect: config-types/groups/driftDetect
        getStatus: config-types/groups/getStatus
      targets:
        componentTypes: [authentik-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: flows
      group: "Flows"
      name: Flows
      description: authentik Flows — name, slug, title, designation and required authentication level — applied over the authentik Flows REST API (/api/v3/flows/instances/). A deployed flow's UUID can be referenced by the OAuth2/OpenID Providers configuration type.
      canvasTemplate: config-types/flows/canvas.yaml
      defaultConfig: config-types/flows/defaults.yaml
      handlers:
        validate: config-types/flows/validate
        deploy: config-types/flows/deploy
        rollback: config-types/flows/rollback
        healthCheck: config-types/flows/healthCheck
        driftDetect: config-types/flows/driftDetect
        getStatus: config-types/flows/getStatus
      targets:
        componentTypes: [authentik-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/authentik

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL stack infrastructure — Settings nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: settings
    # Connections — Settings nav group. Pairs the authentik instance (component)
    # with the static API token credential, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies the endpoint + static API token
# against the authentik Core REST API (GET /api/v3/core/applications/?page_size=1).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the authentik endpoint. Off by default —
      a self-hosted authentik instance commonly runs behind a self-signed
      certificate until a real one is issued.
    default: false
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
