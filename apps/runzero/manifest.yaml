id: runzero
name: runZero
version: "0.3.0"
vendor: Veltrix
description: >
  Manage runZero (asset discovery / attack-surface / network inventory) as code.
  Author runZero Sites, Scan Tasks and Scan Templates, plus account-level
  Organizations, Users, Groups, SSO Group Mappings, Asset Ownership Types and
  Custom Integrations, and Explorer scan-concurrency/site settings — driven
  through the Security-as-Code pipeline: validate, deploy, health check, drift
  detection and rollback, over the runZero console REST API (Organization or
  account-scoped API key, Bearer auth, https://console.runzero.com/api/v1.0).
category: COMPLIANCE
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/runzero
icon: "🛰️"

platform:
  minVersion: "1.0.0"

# runZero brand: near-black with the signature runZero red accent.
branding:
  primaryColor: "#111111"
  accentColor: "#E4002B"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: sites
      actions: [read, write, delete]
      description: Manage runZero Sites (create / edit / delete) and their scan scope
    - resource: scan-tasks
      actions: [read, write]
      description: Manage runZero scan tasks — schedule / update recurring scans of a Site (stop to roll back)
    - resource: scan-templates
      actions: [read, write, delete]
      description: Manage runZero reusable scan templates (create / edit / delete) — requires an account-scoped API key
    - resource: organizations
      actions: [read, write, delete]
      description: Manage runZero Organizations (create / edit / delete) — requires an account-scoped API key
    - resource: users
      actions: [read, write, delete]
      description: Manage runZero user accounts and role assignments (create / edit / delete) — requires an account-scoped API key
    - resource: groups
      actions: [read, write, delete]
      description: Manage runZero groups — bundled default and per-organization role assignments (create / edit / delete) — requires an account-scoped API key
    - resource: sso-group-mappings
      actions: [read, write, delete]
      description: Manage runZero SSO group mappings (create / edit / delete) — requires an account-scoped API key
    - resource: asset-ownership-types
      actions: [read, write, delete]
      description: Manage the runZero asset-ownership picklist (create / edit / delete) — requires an account-scoped API key
    - resource: custom-integrations
      actions: [read, write, delete]
      description: Manage runZero custom-integration registrations (create / edit / delete) — requires an account-scoped API key
    - resource: explorer-settings
      actions: [read, write]
      description: Tune an existing runZero Explorer's site assignment and scan concurrency (no create/delete — Explorers are installed out-of-band)

pipeline:
  configurationTypes:
    - id: sites
      group: "Inventory"
      name: Sites
      description: >
        runZero Sites — name, description and default scan scope (subnets/CIDRs) —
        applied over the runZero console REST API (/org/sites)
      canvasTemplate: config-types/sites/canvas.yaml
      defaultConfig: config-types/sites/defaults.yaml
      handlers:
        validate: config-types/sites/validate
        deploy: config-types/sites/deploy
        rollback: config-types/sites/rollback
        healthCheck: config-types/sites/healthCheck
        driftDetect: config-types/sites/driftDetect
        getStatus: config-types/sites/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: scan-tasks
      group: "Scanning"
      name: Scan Tasks
      description: >
        runZero scan tasks — recurring scans of a Site (name, target scope, frequency and
        optional tuning), created with PUT /org/sites/{site}/scan and updated via PATCH
        /org/tasks/{id} over the runZero console REST API
      canvasTemplate: config-types/scan-tasks/canvas.yaml
      defaultConfig: config-types/scan-tasks/defaults.yaml
      handlers:
        validate: config-types/scan-tasks/validate
        deploy: config-types/scan-tasks/deploy
        rollback: config-types/scan-tasks/rollback
        healthCheck: config-types/scan-tasks/healthCheck
        driftDetect: config-types/scan-tasks/driftDetect
        getStatus: config-types/scan-tasks/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: scan-templates
      group: "Scanning"
      name: Scan Templates
      description: >
        runZero reusable scan templates — named scan-parameter sets a scan task can be based on,
        applied over the runZero console REST API (/account/tasks/templates). ACCOUNT-scoped:
        requires an account-scoped runZero API key.
      canvasTemplate: config-types/scan-templates/canvas.yaml
      defaultConfig: config-types/scan-templates/defaults.yaml
      handlers:
        validate: config-types/scan-templates/validate
        deploy: config-types/scan-templates/deploy
        rollback: config-types/scan-templates/rollback
        healthCheck: config-types/scan-templates/healthCheck
        driftDetect: config-types/scan-templates/driftDetect
        getStatus: config-types/scan-templates/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: organizations
      group: "Account"
      name: Organizations
      description: >
        runZero Organizations — tenant containers for sites, assets and scans, including
        hierarchy and data-retention settings — applied over the runZero console REST API
        (/account/orgs). ACCOUNT-scoped: requires an account-scoped runZero API key.
      canvasTemplate: config-types/organizations/canvas.yaml
      defaultConfig: config-types/organizations/defaults.yaml
      handlers:
        validate: config-types/organizations/validate
        deploy: config-types/organizations/deploy
        rollback: config-types/organizations/rollback
        healthCheck: config-types/organizations/healthCheck
        driftDetect: config-types/organizations/driftDetect
        getStatus: config-types/organizations/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: users
      group: "Account"
      name: Users
      description: >
        runZero user accounts — name, default role and per-organization role overrides — applied
        over the runZero console REST API (/account/users, /account/users/invite). No secrets are
        ever set or read. ACCOUNT-scoped: requires an account-scoped runZero API key.
      canvasTemplate: config-types/users/canvas.yaml
      defaultConfig: config-types/users/defaults.yaml
      handlers:
        validate: config-types/users/validate
        deploy: config-types/users/deploy
        rollback: config-types/users/rollback
        healthCheck: config-types/users/healthCheck
        driftDetect: config-types/users/driftDetect
        getStatus: config-types/users/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: groups
      group: "Account"
      name: Groups
      description: >
        runZero groups — bundled default and per-organization role assignments applied to every
        member — applied over the runZero console REST API (/account/groups). ACCOUNT-scoped:
        requires an account-scoped runZero API key.
      canvasTemplate: config-types/groups/canvas.yaml
      defaultConfig: config-types/groups/defaults.yaml
      handlers:
        validate: config-types/groups/validate
        deploy: config-types/groups/deploy
        rollback: config-types/groups/rollback
        healthCheck: config-types/groups/healthCheck
        driftDetect: config-types/groups/driftDetect
        getStatus: config-types/groups/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: sso-group-mappings
      group: "Account"
      name: SSO Group Mappings
      description: >
        Maps identity-provider attribute/value pairs to runZero groups, applied over the runZero
        console REST API (/account/sso/groups). ACCOUNT-scoped: requires an account-scoped
        runZero API key.
      canvasTemplate: config-types/sso-group-mappings/canvas.yaml
      defaultConfig: config-types/sso-group-mappings/defaults.yaml
      handlers:
        validate: config-types/sso-group-mappings/validate
        deploy: config-types/sso-group-mappings/deploy
        rollback: config-types/sso-group-mappings/rollback
        healthCheck: config-types/sso-group-mappings/healthCheck
        driftDetect: config-types/sso-group-mappings/driftDetect
        getStatus: config-types/sso-group-mappings/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: asset-ownership-types
      group: "Inventory"
      name: Asset Ownership Types
      description: >
        The runZero asset-ownership picklist (e.g. Asset Owner, Security Contact), applied over
        the runZero console REST API's batch endpoints (/account/assets/ownership-types).
        ACCOUNT-scoped: requires an account-scoped runZero API key.
      canvasTemplate: config-types/asset-ownership-types/canvas.yaml
      defaultConfig: config-types/asset-ownership-types/defaults.yaml
      handlers:
        validate: config-types/asset-ownership-types/validate
        deploy: config-types/asset-ownership-types/deploy
        rollback: config-types/asset-ownership-types/rollback
        healthCheck: config-types/asset-ownership-types/healthCheck
        driftDetect: config-types/asset-ownership-types/driftDetect
        getStatus: config-types/asset-ownership-types/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: custom-integrations
      group: "Integrations"
      name: Custom Integrations
      description: >
        runZero custom-integration registrations (name/icon/description for third-party
        asset-data feeds) — applied over the runZero console REST API (/account/custom-integrations).
        Registration metadata only; the Starlark ingestion script is authored separately.
        ACCOUNT-scoped: requires an account-scoped runZero API key.
      canvasTemplate: config-types/custom-integrations/canvas.yaml
      defaultConfig: config-types/custom-integrations/defaults.yaml
      handlers:
        validate: config-types/custom-integrations/validate
        deploy: config-types/custom-integrations/deploy
        rollback: config-types/custom-integrations/rollback
        healthCheck: config-types/custom-integrations/healthCheck
        driftDetect: config-types/custom-integrations/driftDetect
        getStatus: config-types/custom-integrations/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: explorer-settings
      group: "Scanning"
      name: Explorer Settings
      description: >
        Tunes an already-installed runZero Explorer's Site assignment and scan concurrency,
        applied via PATCH /org/explorers/{id} over the runZero console REST API. No create/delete
        — Explorers are installed/uninstalled out-of-band.
      canvasTemplate: config-types/explorer-settings/canvas.yaml
      defaultConfig: config-types/explorer-settings/defaults.yaml
      handlers:
        validate: config-types/explorer-settings/validate
        deploy: config-types/explorer-settings/deploy
        rollback: config-types/explorer-settings/rollback
        healthCheck: config-types/explorer-settings/healthCheck
        driftDetect: config-types/explorer-settings/driftDetect
        getStatus: config-types/explorer-settings/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/runzero

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the runZero organization (component)
    # with its Organization API key (credential), with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint + API key
# against the runZero console API (GET /org/sites).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for runZero console API calls.
    default: 15
    required: false
