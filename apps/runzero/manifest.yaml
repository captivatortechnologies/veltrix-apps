id: runzero
name: runZero
version: "0.2.0"
vendor: Veltrix
description: >
  Manage runZero (asset discovery / attack-surface / network inventory) as code.
  Author runZero Sites — the scan-scope containers assets are grouped under — and
  drive them through the Security-as-Code pipeline: validate, deploy, health
  check, drift detection and rollback, over the runZero console REST API
  (Organization API key, Bearer auth, https://console.runzero.com/api/v1.0).
category: COMPLIANCE
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/runzero
icon: "🛰️"

platform:
  minVersion: "1.0.0"

# runZero brand: near-black with the signature runZero red accent.
branding:
  primaryColor: "#111111"
  accentColor: "#E4002B"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: sites
      actions: [read, write, delete]
      description: Manage runZero Sites (create / edit / delete) and their scan scope
    - resource: scan-tasks
      actions: [read, write]
      description: Manage runZero scan tasks — schedule / update recurring scans of a Site (stop to roll back)
    - resource: scan-templates
      actions: [read, write, delete]
      description: Manage runZero reusable scan templates (create / edit / delete) — requires an account-scoped API key

pipeline:
  configurationTypes:
    - id: sites
      group: "Inventory"
      name: Sites
      description: >
        runZero Sites — name, description and default scan scope (subnets/CIDRs) —
        applied over the runZero console REST API (/org/sites)
      canvasTemplate: config-types/sites/canvas.yaml
      defaultConfig: config-types/sites/defaults.yaml
      handlers:
        validate: config-types/sites/validate
        deploy: config-types/sites/deploy
        rollback: config-types/sites/rollback
        healthCheck: config-types/sites/healthCheck
        driftDetect: config-types/sites/driftDetect
        getStatus: config-types/sites/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: scan-tasks
      group: "Scanning"
      name: Scan Tasks
      description: >
        runZero scan tasks — recurring scans of a Site (name, target scope, frequency and
        optional tuning), created with PUT /org/sites/{site}/scan and updated via PATCH
        /org/tasks/{id} over the runZero console REST API
      canvasTemplate: config-types/scan-tasks/canvas.yaml
      defaultConfig: config-types/scan-tasks/defaults.yaml
      handlers:
        validate: config-types/scan-tasks/validate
        deploy: config-types/scan-tasks/deploy
        rollback: config-types/scan-tasks/rollback
        healthCheck: config-types/scan-tasks/healthCheck
        driftDetect: config-types/scan-tasks/driftDetect
        getStatus: config-types/scan-tasks/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

    - id: scan-templates
      group: "Scanning"
      name: Scan Templates
      description: >
        runZero reusable scan templates — named scan-parameter sets a scan task can be based on,
        applied over the runZero console REST API (/account/tasks/templates). ACCOUNT-scoped:
        requires an account-scoped runZero API key.
      canvasTemplate: config-types/scan-templates/canvas.yaml
      defaultConfig: config-types/scan-templates/defaults.yaml
      handlers:
        validate: config-types/scan-templates/validate
        deploy: config-types/scan-templates/deploy
        rollback: config-types/scan-templates/rollback
        healthCheck: config-types/scan-templates/healthCheck
        driftDetect: config-types/scan-templates/driftDetect
        getStatus: config-types/scan-templates/getStatus
      targets:
        componentTypes: [runzero-org, standalone]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/runzero

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the runZero organization (component)
    # with its Organization API key (credential), with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint + API key
# against the runZero console API (GET /org/sites).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for runZero console API calls.
    default: 15
    required: false
