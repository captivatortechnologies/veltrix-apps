id: datadog
name: Datadog
version: "0.3.0"
vendor: Veltrix
description: >
  Manage Datadog as code: Security Monitoring rules/suppressions/filters,
  Sensitive Data Scanner (DLP), Log Management (pipelines/archives/
  metrics/indexes), Monitors, SLOs and RBAC Roles — through the Datadog REST
  API — with validation, drift detection and rollback handled by the Veltrix
  Security-as-Code pipeline. Authenticates with a Datadog API key +
  Application key pair against the organization's Datadog site
  (datadoghq.com, datadoghq.eu, us3/us5.datadoghq.com, ap1/ap2.datadoghq.com,
  ddog-gov.com).
category: SIEM
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/datadog
icon: "🐶"

platform:
  minVersion: "1.0.0"

# Datadog brand purple.
branding:
  primaryColor: "#632CA6"
  accentColor: "#7B3FE4"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: security-monitoring-rules
      actions: [read, write, delete]
      description: Manage Datadog Security Monitoring detection rules via the Security Monitoring Rules API
    - resource: security-monitoring-suppressions
      actions: [read, write, delete]
      description: Manage Datadog Security Monitoring suppression rules via the Suppression Rules API
    - resource: log-pipelines
      actions: [read, write, delete]
      description: Manage Datadog Log Management pipelines via the Logs Pipelines API
    - resource: monitors
      actions: [read, write, delete]
      description: Manage Datadog Monitors via the Monitors API
    - resource: security-filters
      actions: [read, write, delete]
      description: Manage Datadog Security Monitoring security filters (log exclusion from security analysis) via the Security Filters API
    - resource: sensitive-data-scanner
      actions: [read, write, delete]
      description: Manage Datadog Sensitive Data Scanner (DLP) scanning groups and rules via the Sensitive Data Scanner API
    - resource: log-archives
      actions: [read, write, delete]
      description: Manage Datadog Log Management archives via the Logs Archives API
    - resource: log-metrics
      actions: [read, write, delete]
      description: Manage Datadog log-based metrics via the Logs Metrics API
    - resource: log-indexes
      actions: [read, write, delete]
      description: Manage Datadog Log Management indexes via the Logs Indexes API
    - resource: roles
      actions: [read, write, delete]
      description: Manage Datadog RBAC roles and their permission grants via the Roles API
    - resource: slos
      actions: [read, write, delete]
      description: Manage Datadog Service Level Objectives via the SLO API

pipeline:
  configurationTypes:
    - id: security-monitoring-rules
      group: "Detection"
      name: Security Monitoring Rules
      description: >
        Datadog Security Monitoring detection rules — log_detection,
        workload_security, application_security, signal_correlation and
        cloud_configuration — via GET/POST/PUT/DELETE
        /api/v2/security_monitoring/rules. Reconciled by rule name; a matched
        rule's prior full state (including its optimistic-lock version) is
        captured before every update for rollback.
      canvasTemplate: config-types/security-monitoring-rules/canvas.yaml
      defaultConfig: config-types/security-monitoring-rules/defaults.yaml
      handlers:
        validate: config-types/security-monitoring-rules/validate
        deploy: config-types/security-monitoring-rules/deploy
        rollback: config-types/security-monitoring-rules/rollback
        healthCheck: config-types/security-monitoring-rules/healthCheck
        driftDetect: config-types/security-monitoring-rules/driftDetect
        getStatus: config-types/security-monitoring-rules/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: security-monitoring-suppressions
      group: "Detection"
      name: Security Monitoring Suppressions
      description: >
        Datadog Security Monitoring suppression rules — silence signals from
        matching detection rules without disabling them — via
        GET/POST/PATCH/DELETE
        /api/v2/security_monitoring/configuration/suppressions (a JSON:API
        resource). Reconciled by rule name; PATCH is a partial update, but
        this app always sends every managed attribute so each deploy fully
        replaces the declared state.
      canvasTemplate: config-types/security-monitoring-suppressions/canvas.yaml
      defaultConfig: config-types/security-monitoring-suppressions/defaults.yaml
      handlers:
        validate: config-types/security-monitoring-suppressions/validate
        deploy: config-types/security-monitoring-suppressions/deploy
        rollback: config-types/security-monitoring-suppressions/rollback
        healthCheck: config-types/security-monitoring-suppressions/healthCheck
        driftDetect: config-types/security-monitoring-suppressions/driftDetect
        getStatus: config-types/security-monitoring-suppressions/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: log-pipelines
      group: "Log Management"
      name: Log Pipelines
      description: >
        Datadog Log Management pipelines — an ordered set of processors
        (grok parsers, remappers, enrichers, …) applied to matching logs —
        via GET/POST/PUT/DELETE /api/v1/logs/config/pipelines[/{pipeline_id}].
        Reconciled by pipeline name. Datadog-managed integration pipelines
        (is_read_only) are protected and never modified. Does NOT manage
        pipeline order (a separate GET/PUT
        /api/v1/logs/config/pipeline-order singleton) — out of scope for this
        release; new pipelines are appended by Datadog and may need manual
        reordering.
      canvasTemplate: config-types/log-pipelines/canvas.yaml
      defaultConfig: config-types/log-pipelines/defaults.yaml
      handlers:
        validate: config-types/log-pipelines/validate
        deploy: config-types/log-pipelines/deploy
        rollback: config-types/log-pipelines/rollback
        healthCheck: config-types/log-pipelines/healthCheck
        driftDetect: config-types/log-pipelines/driftDetect
        getStatus: config-types/log-pipelines/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: monitors
      group: "Monitors"
      name: Monitors
      description: >
        Datadog Monitors — metric/log/APM/… alerting rules — via
        GET/POST/PUT/DELETE /api/v1/monitor[/{monitor_id}]. Reconciled by
        monitor name.
      canvasTemplate: config-types/monitors/canvas.yaml
      defaultConfig: config-types/monitors/defaults.yaml
      handlers:
        validate: config-types/monitors/validate
        deploy: config-types/monitors/deploy
        rollback: config-types/monitors/rollback
        healthCheck: config-types/monitors/healthCheck
        driftDetect: config-types/monitors/driftDetect
        getStatus: config-types/monitors/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: security-filters
      group: "Detection"
      name: Security Filters
      description: >
        Datadog Security Monitoring security filters — exclude logs from
        security analysis entirely (distinct from a suppression, which still
        analyzes but silences the resulting signal) — via a JSON:API resource
        at GET/POST/PATCH/DELETE
        /api/v2/security_monitoring/configuration/security_filters[/{id}].
        Reconciled by filter name; PATCH is partial but this app always sends
        every managed attribute, including the filter's current
        optimistic-lock version.
      canvasTemplate: config-types/security-filters/canvas.yaml
      defaultConfig: config-types/security-filters/defaults.yaml
      handlers:
        validate: config-types/security-filters/validate
        deploy: config-types/security-filters/deploy
        rollback: config-types/security-filters/rollback
        healthCheck: config-types/security-filters/healthCheck
        driftDetect: config-types/security-filters/driftDetect
        getStatus: config-types/security-filters/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: sensitive-data-scanner
      group: "Data Security"
      name: Sensitive Data Scanner
      description: >
        Datadog Sensitive Data Scanner (DLP) scanning groups, each with a
        nested list of scanning rules — via the JSON:API relationship-based
        resource at /api/v2/sensitive-data-scanner/config/groups[/{id}] and
        /api/v2/sensitive-data-scanner/config/rules[/{id}]. Reconciled by
        group name (rules by name within their group; a rule no longer
        declared in its group is deleted). Does NOT manage group/rule
        ORDERING (a separate PATCH /api/v2/sensitive-data-scanner/config
        reorder operation) — out of scope for this release.
      canvasTemplate: config-types/sensitive-data-scanner/canvas.yaml
      defaultConfig: config-types/sensitive-data-scanner/defaults.yaml
      handlers:
        validate: config-types/sensitive-data-scanner/validate
        deploy: config-types/sensitive-data-scanner/deploy
        rollback: config-types/sensitive-data-scanner/rollback
        healthCheck: config-types/sensitive-data-scanner/healthCheck
        driftDetect: config-types/sensitive-data-scanner/driftDetect
        getStatus: config-types/sensitive-data-scanner/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: log-archives
      group: "Log Management"
      name: Log Archives
      description: >
        Datadog Log Management archives — long-term cold storage of logs in a
        customer-owned S3/GCS/Azure destination via a pre-configured cloud
        integration — via GET/POST/PUT/DELETE
        /api/v2/logs/config/archives[/{archive_id}]. Reconciled by archive
        name. Does NOT manage archive ORDER (a separate GET/PUT
        /api/v2/logs/config/archive-order singleton) or reader-role grants (a
        separate .../readers sub-resource) — out of scope for this release.
      canvasTemplate: config-types/log-archives/canvas.yaml
      defaultConfig: config-types/log-archives/defaults.yaml
      handlers:
        validate: config-types/log-archives/validate
        deploy: config-types/log-archives/deploy
        rollback: config-types/log-archives/rollback
        healthCheck: config-types/log-archives/healthCheck
        driftDetect: config-types/log-archives/driftDetect
        getStatus: config-types/log-archives/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: log-metrics
      group: "Log Management"
      name: Log-Based Metrics
      description: >
        Datadog log-based metrics — turn matching logs into a custom metric
        via GET/POST/PATCH/DELETE
        /api/v2/logs/config/metrics/{metric_id}, where the metric_id IS the
        user-chosen metric name (no separate server-assigned id, so this
        reconciles by direct lookup rather than a list+match). compute.
        aggregation_type and compute.path are create-only; update sends only
        the mutable fields (filter, group_by, include_percentiles).
      canvasTemplate: config-types/log-metrics/canvas.yaml
      defaultConfig: config-types/log-metrics/defaults.yaml
      handlers:
        validate: config-types/log-metrics/validate
        deploy: config-types/log-metrics/deploy
        rollback: config-types/log-metrics/rollback
        healthCheck: config-types/log-metrics/healthCheck
        driftDetect: config-types/log-metrics/driftDetect
        getStatus: config-types/log-metrics/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: log-indexes
      group: "Log Management"
      name: Log Indexes
      description: >
        Datadog Log Management indexes — retention, daily quota and exclusion
        filters for the logs an index retains — via
        GET/POST/PUT/DELETE /api/v1/logs/config/indexes/{name}, where the
        index name IS its permanent identity (a direct lookup, not a
        list+match). Does NOT manage index ORDER (a separate GET/PUT
        /api/v1/logs/config/index-order singleton, which controls which index
        a log lands in first) — out of scope for this release.
      canvasTemplate: config-types/log-indexes/canvas.yaml
      defaultConfig: config-types/log-indexes/defaults.yaml
      handlers:
        validate: config-types/log-indexes/validate
        deploy: config-types/log-indexes/deploy
        rollback: config-types/log-indexes/rollback
        healthCheck: config-types/log-indexes/healthCheck
        driftDetect: config-types/log-indexes/driftDetect
        getStatus: config-types/log-indexes/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: roles
      group: "Access"
      name: Roles
      description: >
        Datadog RBAC roles and their permission grants — via the JSON:API
        resource at GET/POST/PATCH/DELETE /api/v2/roles[/{role_id}] plus the
        permissions relationship sub-resource
        (GET/POST/DELETE /api/v2/roles/{role_id}/permissions). Reconciled by
        role name; permission names are resolved to Datadog's opaque
        permission ids via GET /api/v2/permissions, then GRANTED
        additively — a role's permission set is never pruned, since Datadog
        auto-adds several baseline read permissions to every new role that
        this app must not fight.
      canvasTemplate: config-types/roles/canvas.yaml
      defaultConfig: config-types/roles/defaults.yaml
      handlers:
        validate: config-types/roles/validate
        deploy: config-types/roles/deploy
        rollback: config-types/roles/rollback
        healthCheck: config-types/roles/healthCheck
        driftDetect: config-types/roles/driftDetect
        getStatus: config-types/roles/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

    - id: slos
      group: "Monitors"
      name: SLOs
      description: >
        Datadog Service Level Objectives (metric-based or monitor-based) via
        GET/POST/PUT/DELETE /api/v1/slo[/{slo_id}]. Reconciled by SLO name.
      canvasTemplate: config-types/slos/canvas.yaml
      defaultConfig: config-types/slos/defaults.yaml
      handlers:
        validate: config-types/slos/validate
        deploy: config-types/slos/deploy
        rollback: config-types/slos/rollback
        healthCheck: config-types/slos/healthCheck
        driftDetect: config-types/slos/driftDetect
        getStatus: config-types/slos/getStatus
      targets:
        componentTypes: [datadog-org]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/datadog

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: activity
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a Datadog org (component, hostname
    # holds the Datadog SITE) with the API key + Application key credential used
    # to reach it, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies the site + API key via
# GET /api/v1/validate (API key only — no Application key required by this
# specific endpoint, per https://docs.datadoghq.com/api/latest/authentication/validate-api-key/).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for calls to the Datadog API.
    default: 30
    required: false
