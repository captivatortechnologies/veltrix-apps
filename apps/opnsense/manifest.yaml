id: opnsense
name: OPNsense
version: "0.3.0"
vendor: Veltrix
description: >
  Manage OPNsense open-source firewall configuration as code through the
  OPNsense REST API (/api/<module>/<controller>/<command>) — firewall
  aliases/categories/rules, outbound source NAT, 1:1 NAT, DNS Resolver
  (Unbound) host and domain overrides, traffic-shaper pipes/queues/rules, and
  static routes — with validation, drift detection and rollback handled by
  the Security-as-Code pipeline. OPNsense's own model stages every
  create/update/delete into the pending configuration; nothing takes effect on
  the target subsystem until an explicit apply/reconfigure call runs, so every
  deploy/rollback stages its changes first, then applies them once as one
  unit. Firewall Rules and Source NAT require OPNsense 24.1+; 1:1 NAT requires
  24.1.9+ — see README.md's Coverage section for what is managed, what is
  intentionally excluded (VPN key material, certificates, hardware/interface
  provisioning, system actions), and why.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/opnsense
icon: "🧱"

platform:
  minVersion: "1.0.0"

# OPNsense's signature orange, with a dark slate accent.
branding:
  primaryColor: "#D94F00"
  accentColor: "#2B2B2B"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: firewall-aliases
      actions: [read, write, delete]
      description: >
        Manage OPNsense firewall aliases (addItem / setItem / delItem against
        /api/firewall/alias) and apply them (reconfigure) on the firewall
    - resource: firewall-categories
      actions: [read, write, delete]
      description: >
        Manage OPNsense firewall categories (addItem / setItem / delItem
        against /api/firewall/category) — pure metadata tags, no apply step
    - resource: firewall-rules
      actions: [read, write, delete]
      description: >
        Manage OPNsense firewall (pf) rules (addRule / setRule / delRule
        against /api/firewall/filter) and apply them on the firewall.
        Requires OPNsense 24.1+.
    - resource: source-nat
      actions: [read, write, delete]
      description: >
        Manage OPNsense outbound (source) NAT rules (addRule / setRule /
        delRule against /api/firewall/source_nat) and apply them on the
        firewall. Requires OPNsense 24.1+ and Outbound NAT mode set to
        Hybrid or Manual to take effect.
    - resource: one-to-one-nat
      actions: [read, write, delete]
      description: >
        Manage OPNsense 1:1 NAT rules (addRule / setRule / delRule against
        /api/firewall/one_to_one) and apply them on the firewall. Requires
        OPNsense 24.1.9+.
    - resource: unbound-host-overrides
      actions: [read, write, delete]
      description: >
        Manage OPNsense DNS Resolver (Unbound) host overrides (addHostOverride
        / setHostOverride / delHostOverride against /api/unbound/settings) and
        apply them (reconfigure — restarts Unbound).
    - resource: unbound-domain-overrides
      actions: [read, write, delete]
      description: >
        Manage OPNsense DNS Resolver (Unbound) per-domain forwarding overrides
        (addForward / setForward / delForward against /api/unbound/settings)
        and apply them (reconfigure — restarts Unbound).
    - resource: traffic-shaper-pipes
      actions: [read, write, delete]
      description: >
        Manage OPNsense traffic-shaper bandwidth pipes (addPipe / setPipe /
        delPipe against /api/trafficshaper/settings) and apply them on the
        firewall.
    - resource: traffic-shaper-queues
      actions: [read, write, delete]
      description: >
        Manage OPNsense traffic-shaper queues (addQueue / setQueue / delQueue
        against /api/trafficshaper/settings), referencing a pipe by name, and
        apply them on the firewall.
    - resource: traffic-shaper-rules
      actions: [read, write, delete]
      description: >
        Manage OPNsense traffic-shaper classifier rules (addRule / setRule /
        delRule against /api/trafficshaper/settings), referencing a pipe or
        queue by name, and apply them on the firewall.
    - resource: static-routes
      actions: [read, write, delete]
      description: >
        Manage OPNsense static routes (addroute / setroute / delroute against
        /api/routes/routes) and apply them (reconfigure).

pipeline:
  configurationTypes:
    - id: firewall-aliases
      name: Firewall Aliases
      group: "Firewall"
      description: >
        Firewall alias objects — host, network, port, MAC, ASN, GeoIP, network
        group, URL (table) and dynamic-IPv6-host lists — managed through
        /api/firewall/alias (addItem / setItem / delItem against searchItem),
        identified by alias name. Missing aliases are created, existing ones
        are updated to the declared spec, and aliases this app previously
        created but no longer declares are removed. Every deploy that touches
        an alias finishes with one /api/firewall/alias/reconfigure call, which
        is the step that actually reloads the pf filter/alias tables — staged
        changes have no effect on traffic until it runs.
      canvasTemplate: config-types/firewall-aliases/canvas.yaml
      defaultConfig: config-types/firewall-aliases/defaults.yaml
      handlers:
        validate: config-types/firewall-aliases/validate
        deploy: config-types/firewall-aliases/deploy
        rollback: config-types/firewall-aliases/rollback
        healthCheck: config-types/firewall-aliases/healthCheck
        driftDetect: config-types/firewall-aliases/driftDetect
        getStatus: config-types/firewall-aliases/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-categories
      name: Firewall Categories
      group: "Firewall"
      description: >
        Pure metadata tags (addItem / setItem / delItem against
        /api/firewall/category), identified by name, referenced from
        aliases/rules/NAT for grouping and color-coding. No live pf effect —
        no apply step. System-managed categories (auto: "1") are never
        touched by this app.
      canvasTemplate: config-types/firewall-categories/canvas.yaml
      defaultConfig: config-types/firewall-categories/defaults.yaml
      handlers:
        validate: config-types/firewall-categories/validate
        deploy: config-types/firewall-categories/deploy
        rollback: config-types/firewall-categories/rollback
        healthCheck: config-types/firewall-categories/healthCheck
        driftDetect: config-types/firewall-categories/driftDetect
        getStatus: config-types/firewall-categories/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-rules
      name: Firewall Rules
      group: "Firewall"
      description: >
        *** Requires OPNsense 24.1 "Savvy Shark" (Jan 2024) or later *** — the
        Firewall Automation filter API shipped in core starting with 24.1
        (formerly a separate "os-firewall" plugin); every call 404s on an
        un-upgraded pre-24.1 box. Pf rules (addRule / setRule / delRule
        against /api/firewall/filter), identified by the canvas item's own id
        (pf rules have no name field) tracked across deploys. Ordering is
        honest: `sequence` only orders rules within the automatically-computed
        floating/interface-group/single-interface bucket a rule falls into —
        see README.md. Every deploy that touches a rule finishes with one
        /api/firewall/filter/apply call, reloading the pf ruleset.
      canvasTemplate: config-types/firewall-rules/canvas.yaml
      defaultConfig: config-types/firewall-rules/defaults.yaml
      handlers:
        validate: config-types/firewall-rules/validate
        deploy: config-types/firewall-rules/deploy
        rollback: config-types/firewall-rules/rollback
        healthCheck: config-types/firewall-rules/healthCheck
        driftDetect: config-types/firewall-rules/driftDetect
        getStatus: config-types/firewall-rules/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: source-nat
      name: Source NAT (Outbound)
      group: "NAT"
      description: >
        *** Requires OPNsense 24.1+ (same Firewall Automation import as
        Firewall Rules) AND Outbound NAT mode set to Hybrid or Manual to take
        effect *** — in the default Automatic mode, declared rules stage and
        apply successfully but have ZERO real effect. Outbound NAT rules
        (addRule / setRule / delRule against /api/firewall/source_nat),
        identified by the canvas item's own id (no name field). Every deploy
        that touches a rule finishes with one /api/firewall/source_nat/apply
        call — the SAME underlying pf reload Firewall Rules' apply runs.
      canvasTemplate: config-types/source-nat/canvas.yaml
      defaultConfig: config-types/source-nat/defaults.yaml
      handlers:
        validate: config-types/source-nat/validate
        deploy: config-types/source-nat/deploy
        rollback: config-types/source-nat/rollback
        healthCheck: config-types/source-nat/healthCheck
        driftDetect: config-types/source-nat/driftDetect
        getStatus: config-types/source-nat/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: one-to-one-nat
      name: 1:1 NAT
      group: "NAT"
      description: >
        *** Requires OPNsense 24.1.9 (June 2024) or later *** — more precise
        than Firewall Rules/Source NAT's 24.1 floor; OneToOneController's own
        API was added after the base 24.1 import (verified via the exact core
        commit and the 24.1.9 changelog entry — see README.md). 1:1 NAT rules
        (addRule / setRule / delRule against /api/firewall/one_to_one),
        identified by the canvas item's own id (no name field, same as
        Firewall Rules/Source NAT). Every deploy that touches a rule finishes
        with one /api/firewall/one_to_one/apply call — the SAME underlying pf
        reload Firewall Rules/Source NAT's apply runs.
      canvasTemplate: config-types/one-to-one-nat/canvas.yaml
      defaultConfig: config-types/one-to-one-nat/defaults.yaml
      handlers:
        validate: config-types/one-to-one-nat/validate
        deploy: config-types/one-to-one-nat/deploy
        rollback: config-types/one-to-one-nat/rollback
        healthCheck: config-types/one-to-one-nat/healthCheck
        driftDetect: config-types/one-to-one-nat/driftDetect
        getStatus: config-types/one-to-one-nat/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: unbound-host-overrides
      name: Unbound Host Overrides
      group: "Services"
      description: >
        DNS Resolver (Unbound) host overrides (addHostOverride /
        setHostOverride / delHostOverride against /api/unbound/settings),
        identified by the (hostname, domain) pair. Every deploy that touches
        an override finishes with one /api/unbound/service/reconfigure call —
        which, per the generic mutable-service base class's default, STOPS
        THEN STARTS the Unbound resolver (a brief DNS gap, not a soft reload).
      canvasTemplate: config-types/unbound-host-overrides/canvas.yaml
      defaultConfig: config-types/unbound-host-overrides/defaults.yaml
      handlers:
        validate: config-types/unbound-host-overrides/validate
        deploy: config-types/unbound-host-overrides/deploy
        rollback: config-types/unbound-host-overrides/rollback
        healthCheck: config-types/unbound-host-overrides/healthCheck
        driftDetect: config-types/unbound-host-overrides/driftDetect
        getStatus: config-types/unbound-host-overrides/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: unbound-domain-overrides
      name: Unbound Domain Overrides
      group: "Services"
      description: >
        The modern MVC equivalent of the legacy "Domain Override" concept —
        mapped onto Unbound's `dots.dot` model with type "forward" (verified;
        there is no separate endpoint for it). addForward / setForward /
        delForward against /api/unbound/settings, identified by domain. Same
        apply step (and full-resolver-restart caveat) as Unbound Host
        Overrides.
      canvasTemplate: config-types/unbound-domain-overrides/canvas.yaml
      defaultConfig: config-types/unbound-domain-overrides/defaults.yaml
      handlers:
        validate: config-types/unbound-domain-overrides/validate
        deploy: config-types/unbound-domain-overrides/deploy
        rollback: config-types/unbound-domain-overrides/rollback
        healthCheck: config-types/unbound-domain-overrides/healthCheck
        driftDetect: config-types/unbound-domain-overrides/driftDetect
        getStatus: config-types/unbound-domain-overrides/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: traffic-shaper-pipes
      name: Traffic Shaper Pipes
      group: "Traffic Shaping"
      description: >
        Bandwidth-cap pipes (addPipe / setPipe / delPipe against
        /api/trafficshaper/settings), identified by description (required by
        the model itself). The pf dnpipe `number` is server-assigned and never
        set by this app. Every deploy that touches a pipe finishes with one
        /api/trafficshaper/service/reconfigure call.
      canvasTemplate: config-types/traffic-shaper-pipes/canvas.yaml
      defaultConfig: config-types/traffic-shaper-pipes/defaults.yaml
      handlers:
        validate: config-types/traffic-shaper-pipes/validate
        deploy: config-types/traffic-shaper-pipes/deploy
        rollback: config-types/traffic-shaper-pipes/rollback
        healthCheck: config-types/traffic-shaper-pipes/healthCheck
        driftDetect: config-types/traffic-shaper-pipes/driftDetect
        getStatus: config-types/traffic-shaper-pipes/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: traffic-shaper-queues
      name: Traffic Shaper Queues
      group: "Traffic Shaping"
      description: >
        Weighted queues attached to a pipe (addQueue / setQueue / delQueue
        against /api/trafficshaper/settings), identified by description. The
        target pipe is declared by NAME and resolved to its live uuid at
        deploy time. Same apply step as Traffic Shaper Pipes.
      canvasTemplate: config-types/traffic-shaper-queues/canvas.yaml
      defaultConfig: config-types/traffic-shaper-queues/defaults.yaml
      handlers:
        validate: config-types/traffic-shaper-queues/validate
        deploy: config-types/traffic-shaper-queues/deploy
        rollback: config-types/traffic-shaper-queues/rollback
        healthCheck: config-types/traffic-shaper-queues/healthCheck
        driftDetect: config-types/traffic-shaper-queues/driftDetect
        getStatus: config-types/traffic-shaper-queues/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: traffic-shaper-rules
      name: Traffic Shaper Rules
      group: "Traffic Shaping"
      description: >
        Traffic classifier rules that match packets into a pipe or queue
        (addRule / setRule / delRule against /api/trafficshaper/settings —
        TrafficShaper's OWN rules.rule, a different model than Firewall's).
        Identified by the canvas item's own id (no required name field). The
        target pipe/queue is declared by NAME and resolved to its live uuid
        at deploy time (both resources are searched). Same apply step as
        Traffic Shaper Pipes/Queues.
      canvasTemplate: config-types/traffic-shaper-rules/canvas.yaml
      defaultConfig: config-types/traffic-shaper-rules/defaults.yaml
      handlers:
        validate: config-types/traffic-shaper-rules/validate
        deploy: config-types/traffic-shaper-rules/deploy
        rollback: config-types/traffic-shaper-rules/rollback
        healthCheck: config-types/traffic-shaper-rules/healthCheck
        driftDetect: config-types/traffic-shaper-rules/driftDetect
        getStatus: config-types/traffic-shaper-rules/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: static-routes
      name: Static Routes
      group: "Routing"
      description: >
        Static routes (addroute / setroute / delroute against
        /api/routes/routes — note the all-lowercase action names, the literal
        PHP method names on this controller), identified by destination
        network. `gateway` is a NAME from OPNsense's own configured gateway
        list, passed through as-is. Every deploy that touches a route
        finishes with one /api/routes/routes/reconfigure call
        (`interface routes configure`).
      canvasTemplate: config-types/static-routes/canvas.yaml
      defaultConfig: config-types/static-routes/defaults.yaml
      handlers:
        validate: config-types/static-routes/validate
        deploy: config-types/static-routes/deploy
        rollback: config-types/static-routes/rollback
        healthCheck: config-types/static-routes/healthCheck
        driftDetect: config-types/static-routes/driftDetect
        getStatus: config-types/static-routes/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/opnsense

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: GET /api/core/firmware/status — reachable
# with any valid API key/secret and no ACL grant beyond the default, so it
# proves the host, credential and HTTP Basic auth all work without staging or
# applying any firewall change.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the OPNsense GUI/API endpoint. Off by
      default — an OPNsense box ships a self-signed certificate until an
      administrator installs a CA-signed one.
    default: false
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for OPNsense API calls.
    default: 30
    required: false
