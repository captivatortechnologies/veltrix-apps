id: opnsense
name: OPNsense
version: "0.2.0"
vendor: Veltrix
description: >
  Manage OPNsense open-source firewall configuration as code through the
  OPNsense REST API (/api/<module>/<controller>/<command>) — firewall aliases,
  firewall categories, firewall (pf) rules and outbound source NAT rules —
  with validation, drift detection and rollback handled by the
  Security-as-Code pipeline. OPNsense's own model stages every
  create/update/delete into the pending configuration; nothing takes effect on
  the firewall until an explicit apply/reconfigure call reloads the pf
  ruleset and alias tables, so every deploy/rollback stages its changes first,
  then applies them once as one unit. Firewall rules and source NAT require
  OPNsense 24.1 "Savvy Shark" (Jan 2024) or later — see README.md.
category: NETWORK
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/opnsense
icon: "🧱"

platform:
  minVersion: "1.0.0"

# OPNsense's signature orange, with a dark slate accent.
branding:
  primaryColor: "#D94F00"
  accentColor: "#2B2B2B"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: firewall-aliases
      actions: [read, write, delete]
      description: >
        Manage OPNsense firewall aliases (addItem / setItem / delItem against
        /api/firewall/alias) and apply them (reconfigure) on the firewall
    - resource: firewall-categories
      actions: [read, write, delete]
      description: >
        Manage OPNsense firewall categories (addItem / setItem / delItem
        against /api/firewall/category) — pure metadata tags, no apply step
    - resource: firewall-rules
      actions: [read, write, delete]
      description: >
        Manage OPNsense firewall (pf) rules (addRule / setRule / delRule
        against /api/firewall/filter) and apply them on the firewall.
        Requires OPNsense 24.1+.
    - resource: source-nat
      actions: [read, write, delete]
      description: >
        Manage OPNsense outbound (source) NAT rules (addRule / setRule /
        delRule against /api/firewall/source_nat) and apply them on the
        firewall. Requires OPNsense 24.1+ and Outbound NAT mode set to
        Hybrid or Manual to take effect.

pipeline:
  configurationTypes:
    - id: firewall-aliases
      name: Firewall Aliases
      group: "Firewall"
      description: >
        Firewall alias objects — host, network, port, MAC, ASN, GeoIP, network
        group, URL (table) and dynamic-IPv6-host lists — managed through
        /api/firewall/alias (addItem / setItem / delItem against searchItem),
        identified by alias name. Missing aliases are created, existing ones
        are updated to the declared spec, and aliases this app previously
        created but no longer declares are removed. Every deploy that touches
        an alias finishes with one /api/firewall/alias/reconfigure call, which
        is the step that actually reloads the pf filter/alias tables — staged
        changes have no effect on traffic until it runs.
      canvasTemplate: config-types/firewall-aliases/canvas.yaml
      defaultConfig: config-types/firewall-aliases/defaults.yaml
      handlers:
        validate: config-types/firewall-aliases/validate
        deploy: config-types/firewall-aliases/deploy
        rollback: config-types/firewall-aliases/rollback
        healthCheck: config-types/firewall-aliases/healthCheck
        driftDetect: config-types/firewall-aliases/driftDetect
        getStatus: config-types/firewall-aliases/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-categories
      name: Firewall Categories
      group: "Firewall"
      description: >
        Pure metadata tags (addItem / setItem / delItem against
        /api/firewall/category), identified by name, referenced from
        aliases/rules/NAT for grouping and color-coding. No live pf effect —
        no apply step. System-managed categories (auto: "1") are never
        touched by this app.
      canvasTemplate: config-types/firewall-categories/canvas.yaml
      defaultConfig: config-types/firewall-categories/defaults.yaml
      handlers:
        validate: config-types/firewall-categories/validate
        deploy: config-types/firewall-categories/deploy
        rollback: config-types/firewall-categories/rollback
        healthCheck: config-types/firewall-categories/healthCheck
        driftDetect: config-types/firewall-categories/driftDetect
        getStatus: config-types/firewall-categories/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: firewall-rules
      name: Firewall Rules
      group: "Firewall"
      description: >
        *** Requires OPNsense 24.1 "Savvy Shark" (Jan 2024) or later *** — the
        Firewall Automation filter API shipped in core starting with 24.1
        (formerly a separate "os-firewall" plugin); every call 404s on an
        un-upgraded pre-24.1 box. Pf rules (addRule / setRule / delRule
        against /api/firewall/filter), identified by the canvas item's own id
        (pf rules have no name field) tracked across deploys. Ordering is
        honest: `sequence` only orders rules within the automatically-computed
        floating/interface-group/single-interface bucket a rule falls into —
        see README.md. Every deploy that touches a rule finishes with one
        /api/firewall/filter/apply call, reloading the pf ruleset.
      canvasTemplate: config-types/firewall-rules/canvas.yaml
      defaultConfig: config-types/firewall-rules/defaults.yaml
      handlers:
        validate: config-types/firewall-rules/validate
        deploy: config-types/firewall-rules/deploy
        rollback: config-types/firewall-rules/rollback
        healthCheck: config-types/firewall-rules/healthCheck
        driftDetect: config-types/firewall-rules/driftDetect
        getStatus: config-types/firewall-rules/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

    - id: source-nat
      name: Source NAT (Outbound)
      group: "NAT"
      description: >
        *** Requires OPNsense 24.1+ (same Firewall Automation import as
        Firewall Rules) AND Outbound NAT mode set to Hybrid or Manual to take
        effect *** — in the default Automatic mode, declared rules stage and
        apply successfully but have ZERO real effect. Outbound NAT rules
        (addRule / setRule / delRule against /api/firewall/source_nat),
        identified by the canvas item's own id (no name field). Every deploy
        that touches a rule finishes with one /api/firewall/source_nat/apply
        call — the SAME underlying pf reload Firewall Rules' apply runs.
      canvasTemplate: config-types/source-nat/canvas.yaml
      defaultConfig: config-types/source-nat/defaults.yaml
      handlers:
        validate: config-types/source-nat/validate
        deploy: config-types/source-nat/deploy
        rollback: config-types/source-nat/rollback
        healthCheck: config-types/source-nat/healthCheck
        driftDetect: config-types/source-nat/driftDetect
        getStatus: config-types/source-nat/getStatus
      targets:
        componentTypes: [opnsense-firewall]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/opnsense

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: GET /api/core/firmware/status — reachable
# with any valid API key/secret and no ACL grant beyond the default, so it
# proves the host, credential and HTTP Basic auth all work without staging or
# applying any firewall change.
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the OPNsense GUI/API endpoint. Off by
      default — an OPNsense box ships a self-signed certificate until an
      administrator installs a CA-signed one.
    default: false
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for OPNsense API calls.
    default: 30
    required: false
