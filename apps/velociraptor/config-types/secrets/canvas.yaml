# =============================================================================
# Canvas Template — Velociraptor Secrets
#
# Declares ONE named secret (the item): its type, content and who can read it.
# Field keys must match config-types/secrets/validate.ts. Applied over the gRPC
# API (mutual TLS) via secret_add() (content) + secret_modify() (grants). The
# secret's content is WRITE-ONLY — sent on every deploy, never read back (the
# server only ever returns grant metadata, not the stored value).
# =============================================================================

id: "velociraptor-secrets"
name: "Secrets"
toolType: "velociraptor"
entityType: "secrets"
description: "Manage Velociraptor secret definitions and their grants — content via secret_add, grants via secret_modify, over the gRPC API (mutual TLS)"

item:
  label: "Secret"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Secret"
      icon: "key"
      description: "The secret's identity, type and content"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "The secret's name, e.g. smtp-relay or aws-backup-role. Referenced by artifacts that need it. Used as the stable identity for upsert and rollback."

        - key: "type"
          label: "Type"
          fieldType: "text"
          required: true
          defaultValue: "generic"
          validation:
            maxLength: 64
          helpText: "A freeform type tag artifacts use to look up this secret, e.g. generic, smtp, aws. Matches Velociraptor's own secret_add \"type\" argument."

        - key: "secretData"
          label: "Secret Content"
          fieldType: "password"
          required: true
          validation:
            maxLength: 20000
          helpText: "One key: value pair per line, e.g. username: svc-mail / password: hunter2. Sent to the server on every deploy and never read back — the server only ever returns who has access, not the stored content."

    - name: "Access"
      icon: "lock"
      description: "Who can read this secret"
      fields:
        - key: "grantedUsers"
          label: "Granted Users"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 5000
          helpText: "Newline- or comma-separated usernames granted read access to this secret. Reconciled exactly — a user removed from this list loses access."

        - key: "grantedOrgs"
          label: "Granted Orgs"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 5000
          helpText: "Newline- or comma-separated org ids granted access (multi-org deployments only). Leave blank for a single-org deployment."

        - key: "visibleToAllOrgs"
          label: "Visible To All Orgs"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "When on, every org in a multi-org deployment can see this secret's metadata."
