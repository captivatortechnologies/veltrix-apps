id: velociraptor
name: Velociraptor
version: "0.2.0"
vendor: Veltrix
description: >
  Manage Velociraptor (open-source endpoint DFIR / hunting platform) as code.
  Author custom VQL artifacts, client + server event monitoring, and GUI users /
  roles, and drive them through the Security-as-Code pipeline — validate, deploy,
  health check, drift detection and rollback — over the Velociraptor gRPC API
  (mutual TLS), executing VQL against the server.
category: EDR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/velociraptor
icon: "🦖"

platform:
  minVersion: "1.0.0"

# Velociraptor's brand teal. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#0b7285"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: artifacts
      actions: [read, write, delete]
      description: Manage Velociraptor custom VQL artifacts (add / edit / delete)
    - resource: monitoring
      actions: [read, write]
      description: Manage Velociraptor client + server event monitoring tables
    - resource: users
      actions: [read, write, delete]
      description: Manage Velociraptor GUI users and their roles

pipeline:
  configurationTypes:
    - id: custom-artifacts
      group: "Artifacts"
      name: Custom Artifacts
      description: >
        Velociraptor custom VQL artifacts — name, type and the artifact YAML/VQL —
        applied over the gRPC API (mutual TLS) via artifact_set()
      canvasTemplate: config-types/custom-artifacts/canvas.yaml
      defaultConfig: config-types/custom-artifacts/defaults.yaml
      handlers:
        validate: config-types/custom-artifacts/validate
        deploy: config-types/custom-artifacts/deploy
        rollback: config-types/custom-artifacts/rollback
        healthCheck: config-types/custom-artifacts/healthCheck
        driftDetect: config-types/custom-artifacts/driftDetect
        getStatus: config-types/custom-artifacts/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: client-monitoring
      group: "Monitoring"
      name: Client Monitoring
      description: >
        Velociraptor client event-collection rules — the persistent monitoring
        artifacts a client label group runs — applied over the gRPC API (mutual
        TLS) via set_client_monitoring()
      canvasTemplate: config-types/client-monitoring/canvas.yaml
      defaultConfig: config-types/client-monitoring/defaults.yaml
      handlers:
        validate: config-types/client-monitoring/validate
        deploy: config-types/client-monitoring/deploy
        rollback: config-types/client-monitoring/rollback
        healthCheck: config-types/client-monitoring/healthCheck
        driftDetect: config-types/client-monitoring/driftDetect
        getStatus: config-types/client-monitoring/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: server-monitoring
      group: "Monitoring"
      name: Server Monitoring
      description: >
        Velociraptor server-wide event artifacts (the singleton server monitoring
        table) — applied over the gRPC API (mutual TLS) via set_server_monitoring()
      canvasTemplate: config-types/server-monitoring/canvas.yaml
      defaultConfig: config-types/server-monitoring/defaults.yaml
      handlers:
        validate: config-types/server-monitoring/validate
        deploy: config-types/server-monitoring/deploy
        rollback: config-types/server-monitoring/rollback
        healthCheck: config-types/server-monitoring/healthCheck
        driftDetect: config-types/server-monitoring/driftDetect
        getStatus: config-types/server-monitoring/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: users-acls
      group: "Access"
      name: Users & ACLs
      description: >
        Velociraptor GUI users and their roles — created / updated via user_create
        over the gRPC API (mutual TLS)
      canvasTemplate: config-types/users-acls/canvas.yaml
      defaultConfig: config-types/users-acls/defaults.yaml
      handlers:
        validate: config-types/users-acls/validate
        deploy: config-types/users-acls/deploy
        rollback: config-types/users-acls/rollback
        healthCheck: config-types/users-acls/healthCheck
        driftDetect: config-types/users-acls/driftDetect
        getStatus: config-types/users-acls/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/velociraptor

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs the Velociraptor server (component)
    # with the api-client config bundle (credential), with a connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's api-client config
# against the Velociraptor gRPC API by running `SELECT * FROM info()`.
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall
  onEvent: hooks/onEvent
  onWebhook: hooks/onWebhook

settings:
  - key: vql_timeout_seconds
    type: number
    label: VQL timeout (seconds)
    description: How long to wait for a VQL query to stream its rows before giving up.
    default: 30
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
