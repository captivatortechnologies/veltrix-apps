id: velociraptor
name: Velociraptor
version: "0.4.0"
vendor: Veltrix
description: >
  Manage Velociraptor (open-source endpoint DFIR / hunting platform) as code.
  Author custom VQL artifacts, client + server event monitoring, client label
  membership, server metadata tags, GUI users / roles / fine-grained ACLs,
  secret definitions and third-party tool pins, and drive them through the
  Security-as-Code pipeline — validate, deploy, health check, drift detection
  and rollback — over the Velociraptor gRPC API (mutual TLS), executing VQL
  against the server, with BYOL infrastructure provisioning for the Velociraptor
  stack (frontends + shared MinIO datastore).
category: EDR
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/velociraptor
icon: "🦖"

platform:
  minVersion: "1.0.0"

# Velociraptor's brand teal. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#0b7285"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: artifacts
      actions: [read, write, delete]
      description: Manage Velociraptor custom VQL artifacts (add / edit / delete)
    - resource: monitoring
      actions: [read, write]
      description: Manage Velociraptor client + server event monitoring tables
    - resource: users
      actions: [read, write, delete]
      description: Manage Velociraptor GUI users, their roles and fine-grained custom ACL permissions
    - resource: server
      actions: [read, write]
      description: Manage Velociraptor server-level metadata tags
    - resource: clients
      actions: [read, write]
      description: Manage Velociraptor client label membership
    - resource: secrets
      actions: [read, write, delete]
      description: Manage Velociraptor secret definitions and their grants
    - resource: tools
      actions: [read, write]
      description: Manage Velociraptor third-party tool inventory pins
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL Velociraptor stack infrastructure
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: velociraptor_

pipeline:
  configurationTypes:
    - id: custom-artifacts
      group: "Artifacts"
      name: Custom Artifacts
      description: >
        Velociraptor custom VQL artifacts — name, type and the artifact YAML/VQL —
        applied over the gRPC API (mutual TLS) via artifact_set()
      canvasTemplate: config-types/custom-artifacts/canvas.yaml
      defaultConfig: config-types/custom-artifacts/defaults.yaml
      handlers:
        validate: config-types/custom-artifacts/validate
        deploy: config-types/custom-artifacts/deploy
        rollback: config-types/custom-artifacts/rollback
        healthCheck: config-types/custom-artifacts/healthCheck
        driftDetect: config-types/custom-artifacts/driftDetect
        getStatus: config-types/custom-artifacts/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: client-monitoring
      group: "Monitoring"
      name: Client Monitoring
      description: >
        Velociraptor client event-collection rules — the persistent monitoring
        artifacts a client label group runs — applied over the gRPC API (mutual
        TLS) via set_client_monitoring()
      canvasTemplate: config-types/client-monitoring/canvas.yaml
      defaultConfig: config-types/client-monitoring/defaults.yaml
      handlers:
        validate: config-types/client-monitoring/validate
        deploy: config-types/client-monitoring/deploy
        rollback: config-types/client-monitoring/rollback
        healthCheck: config-types/client-monitoring/healthCheck
        driftDetect: config-types/client-monitoring/driftDetect
        getStatus: config-types/client-monitoring/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: server-monitoring
      group: "Monitoring"
      name: Server Monitoring
      description: >
        Velociraptor server-wide event artifacts (the singleton server monitoring
        table) — applied over the gRPC API (mutual TLS) via set_server_monitoring()
      canvasTemplate: config-types/server-monitoring/canvas.yaml
      defaultConfig: config-types/server-monitoring/defaults.yaml
      handlers:
        validate: config-types/server-monitoring/validate
        deploy: config-types/server-monitoring/deploy
        rollback: config-types/server-monitoring/rollback
        healthCheck: config-types/server-monitoring/healthCheck
        driftDetect: config-types/server-monitoring/driftDetect
        getStatus: config-types/server-monitoring/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: users-acls
      group: "Access"
      name: Users & ACLs
      description: >
        Velociraptor GUI users, their roles and fine-grained custom ACL
        permissions — created / updated via user_create + user_grant over the
        gRPC API (mutual TLS)
      canvasTemplate: config-types/users-acls/canvas.yaml
      defaultConfig: config-types/users-acls/defaults.yaml
      handlers:
        validate: config-types/users-acls/validate
        deploy: config-types/users-acls/deploy
        rollback: config-types/users-acls/rollback
        healthCheck: config-types/users-acls/healthCheck
        driftDetect: config-types/users-acls/driftDetect
        getStatus: config-types/users-acls/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: secrets
      group: "Access"
      name: Secrets
      description: >
        Velociraptor secret definitions and their grants — content applied via
        secret_add(), grants (users/orgs/visibility) via secret_modify(), over
        the gRPC API (mutual TLS)
      canvasTemplate: config-types/secrets/canvas.yaml
      defaultConfig: config-types/secrets/defaults.yaml
      handlers:
        validate: config-types/secrets/validate
        deploy: config-types/secrets/deploy
        rollback: config-types/secrets/rollback
        healthCheck: config-types/secrets/healthCheck
        driftDetect: config-types/secrets/driftDetect
        getStatus: config-types/secrets/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: client-labels
      group: "Fleet"
      name: Client Labels
      description: >
        Pin a Velociraptor client label to an explicit list of client ids —
        reconciled via the gRPC API (label())
      canvasTemplate: config-types/client-labels/canvas.yaml
      defaultConfig: config-types/client-labels/defaults.yaml
      handlers:
        validate: config-types/client-labels/validate
        deploy: config-types/client-labels/deploy
        rollback: config-types/client-labels/rollback
        healthCheck: config-types/client-labels/healthCheck
        driftDetect: config-types/client-labels/driftDetect
        getStatus: config-types/client-labels/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: server-metadata
      group: "Server"
      name: Server Metadata
      description: >
        Free-form server-level metadata tags (e.g. environment, owner,
        compliance tier) — applied over the gRPC API (mutual TLS) via
        server_set_metadata()
      canvasTemplate: config-types/server-metadata/canvas.yaml
      defaultConfig: config-types/server-metadata/defaults.yaml
      handlers:
        validate: config-types/server-metadata/validate
        deploy: config-types/server-metadata/deploy
        rollback: config-types/server-metadata/rollback
        healthCheck: config-types/server-metadata/healthCheck
        driftDetect: config-types/server-metadata/driftDetect
        getStatus: config-types/server-metadata/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

    - id: third-party-tools
      group: "Tools"
      name: Third-Party Tools
      description: >
        Pin the third-party tool binaries Velociraptor artifacts download to
        endpoints (version, URL, hash) — a supply-chain integrity control
        applied over the gRPC API (mutual TLS) via inventory_add()
      canvasTemplate: config-types/third-party-tools/canvas.yaml
      defaultConfig: config-types/third-party-tools/defaults.yaml
      handlers:
        validate: config-types/third-party-tools/validate
        deploy: config-types/third-party-tools/deploy
        rollback: config-types/third-party-tools/rollback
        healthCheck: config-types/third-party-tools/healthCheck
        driftDetect: config-types/third-party-tools/driftDetect
        getStatus: config-types/third-party-tools/getStatus
      targets:
        componentTypes: [velociraptor-server, standalone]
        requiresCredential: true
        requiresConnectivity: true

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/velociraptor

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL stack infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs the Velociraptor server (component)
    # with the api-client config bundle (credential), with a connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's api-client config
# against the Velociraptor gRPC API by running `SELECT * FROM info()`.
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall
  onEvent: hooks/onEvent
  onWebhook: hooks/onWebhook

settings:
  - key: vql_timeout_seconds
    type: number
    label: VQL timeout (seconds)
    description: How long to wait for a VQL query to stream its rows before giving up.
    default: 30
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
