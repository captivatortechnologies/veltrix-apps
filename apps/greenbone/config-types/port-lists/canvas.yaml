# =============================================================================
# Canvas Template — Greenbone Port Lists
#
# Declares ONE Greenbone port list (the item). Users add as many as they need. A
# port list is a named set of TCP/UDP port ranges a scan target scans. Field keys
# must match config-types/port-lists/validate.ts. Applied over GMP (XML over a TLS
# socket, default port 9390) via create_port_list / modify_port_list /
# delete_port_list.
#
# FLAG (GMP 22.5): modify_port_list only changes name/comment — the port ranges are
# immutable via modify. A range edit needs a recreate (surfaced at deploy/drift).
# =============================================================================

id: "greenbone-port-lists"
name: "Port Lists"
toolType: "greenbone"
entityType: "port-lists"
description: "Manage Greenbone port lists — named TCP/UDP port ranges — over GMP (XML over TLS, 9390)"

item:
  label: "Port List"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Port List"
      icon: "list"
      description: "Port-list identity"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Human-readable port-list name shown in Greenbone, e.g. Web + DB Ports. Used as the stable identity for upsert and drift."

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500
          helpText: "Why this port list exists — recorded in Greenbone for audit."

    - name: "Ports"
      icon: "hash"
      description: "TCP/UDP port ranges"
      fields:
        - key: "portRange"
          label: "Port Ranges"
          fieldType: "textarea"
          required: true
          defaultValue: "T:1-1024"
          validation:
            maxLength: 4000
          helpText: "Comma-separated ranges. Prefix T: for TCP and U: for UDP; a range is a single port or start-end. e.g. T:1-1024,U:53,T:3389. Note: gvmd cannot change these on an existing list — a range edit needs a recreate."
