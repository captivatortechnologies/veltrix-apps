# =============================================================================
# Canvas Template — Greenbone Groups
#
# Declares ONE Greenbone group (the item) — a named set of existing GMP users,
# usable as a permission subject. Field keys must match
# config-types/groups/validate.ts. Applied over GMP (XML over a TLS socket,
# default port 9390) via create_group / modify_group / delete_group.
#
# FLAG (GMP 22.5): "Give members full access to each other" is CREATE-ONLY —
# modify_group cannot change it once set (see lib/gmp/groups.ts's module doc).
# =============================================================================

id: "greenbone-groups"
name: "Groups"
toolType: "greenbone"
entityType: "groups"
description: "Manage Greenbone groups — named sets of existing GMP users — over GMP (XML over TLS, 9390)"

item:
  label: "Group"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Group"
      icon: "users"
      description: "Identity and membership"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 255
          helpText: "Human-readable group name shown in Greenbone. Used as the stable identity for upsert and drift."

        - key: "comment"
          label: "Comment"
          fieldType: "textarea"
          required: false
          validation:
            maxLength: 500

        - key: "users"
          label: "Members (usernames)"
          fieldType: "tags"
          required: false
          helpText: "Existing GMP usernames (not ids) to add as members. This app does not manage GMP users — the usernames must already exist."

        - key: "specialsFull"
          label: "Give members full access to each other"
          fieldType: "checkbox"
          required: false
          defaultValue: false
          helpText: "CREATE-ONLY: grants every member full access to each other's entities. modify_group cannot change this later — changing it after creation requires deleting and recreating the group (surfaced as a deploy note, never silently applied)."
