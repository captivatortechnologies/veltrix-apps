id: jfrog-xray
name: JFrog Xray
version: "0.3.0"
vendor: Veltrix
description: >
  Manage JFrog Xray (software composition analysis / supply-chain security)
  configuration as code through the Xray REST API. Covers security, license
  and operational-risk policies, watches (the scope + policy binding that
  makes a policy actually take effect), ignore rules (violation suppression),
  custom issues (manually-authored vulnerability records), webhooks (named
  HTTP callback targets), and JFrog Curation policies (pre-Artifactory
  open-source package governance) — with validation, drift detection and
  rollback handled by the Security-as-Code pipeline. Authenticates with a
  JFrog Platform Access Token (Bearer). See README.md for a full coverage
  map of the Xray REST API and what is intentionally out of scope.
category: COMPLIANCE
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/jfrog-xray
icon: "🩻"

platform:
  minVersion: "1.0.0"

# JFrog brand green. Approximate — no official hex was published in the brand
# guidelines page consulted; adjust if JFrog's brand portal (brand.jfrog.com)
# publishes an exact value. No logo asset shipped yet (placeholder, like the
# Auth0 app) until an official lockup is added.
branding:
  primaryColor: "#41BF47"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: security-policies
      actions: [read, write, delete]
      description: Manage JFrog Xray security policies (create / edit / delete)
    - resource: license-policies
      actions: [read, write, delete]
      description: Manage JFrog Xray license policies (create / edit / delete)
    - resource: watches
      actions: [read, write, delete]
      description: Manage JFrog Xray watches — the scope + policy binding that makes a policy take effect
    - resource: ignore-rules
      actions: [read, write, delete]
      description: Manage JFrog Xray ignore rules (create / delete — Xray has no update endpoint)
    - resource: operational-risk-policies
      actions: [read, write, delete]
      description: Manage JFrog Xray operational-risk policies (create / edit / delete)
    - resource: custom-issues
      actions: [read, write, delete]
      description: Author custom Xray issues (vulnerabilities) for components Xray's own database doesn't cover
    - resource: webhooks
      actions: [read, write, delete]
      description: Manage JFrog Xray webhooks — named HTTP callback targets policy actions can reference
    - resource: curation-policies
      actions: [read, write, delete]
      description: Manage JFrog Curation policies governing which package versions may flow through Artifactory remote repositories

pipeline:
  configurationTypes:
    - id: security-policies
      group: "Policies"
      name: Security Policies
      description: >
        JFrog Xray security policies — a minimum severity or CVSS-range gate
        per rule, with build/release-blocking, notification and ticketing
        actions — applied over the Xray REST API v2 (/xray/api/v2/policies).
        Upserts by policy name.
      canvasTemplate: config-types/security-policies/canvas.yaml
      defaultConfig: config-types/security-policies/defaults.yaml
      handlers:
        validate: config-types/security-policies/validate
        deploy: config-types/security-policies/deploy
        rollback: config-types/security-policies/rollback
        healthCheck: config-types/security-policies/healthCheck
        driftDetect: config-types/security-policies/driftDetect
        getStatus: config-types/security-policies/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: license-policies
      group: "Policies"
      name: License Policies
      description: >
        JFrog Xray license policies — allowed/banned OSS licenses and
        unknown-license handling per rule, with build/release-blocking,
        notification and ticketing actions — applied over the SAME
        Xray REST API v2 endpoint as security-policies
        (/xray/api/v2/policies, a policy of type "license"). Upserts by
        policy name.
      canvasTemplate: config-types/license-policies/canvas.yaml
      defaultConfig: config-types/license-policies/defaults.yaml
      handlers:
        validate: config-types/license-policies/validate
        deploy: config-types/license-policies/deploy
        rollback: config-types/license-policies/rollback
        healthCheck: config-types/license-policies/healthCheck
        driftDetect: config-types/license-policies/driftDetect
        getStatus: config-types/license-policies/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: watches
      group: "Watches"
      name: Watches
      description: >
        JFrog Xray watches — the resource scope (all repositories, one
        repository, or an advanced JSON scope covering builds/release
        bundles/projects/git repos) and the security/license policies bound
        to it — applied over the Xray REST API v2
        (/xray/api/v2/watches). This is what makes a policy actually take
        effect. Upserts by watch name.
      canvasTemplate: config-types/watches/canvas.yaml
      defaultConfig: config-types/watches/defaults.yaml
      handlers:
        validate: config-types/watches/validate
        deploy: config-types/watches/deploy
        rollback: config-types/watches/rollback
        healthCheck: config-types/watches/healthCheck
        driftDetect: config-types/watches/driftDetect
        getStatus: config-types/watches/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: ignore-rules
      group: "Ignore Rules"
      name: Ignore Rules
      description: >
        JFrog Xray ignore rules — suppress violations matching CVE/
        vulnerability/license/scope filters, optionally until an expiry date
        — applied over the Xray REST API v1 (/xray/api/v1/ignore_rules).
        Xray assigns no user-chosen name and exposes NO update endpoint for
        this object (create + delete only); a changed rule is recreated.
      canvasTemplate: config-types/ignore-rules/canvas.yaml
      defaultConfig: config-types/ignore-rules/defaults.yaml
      handlers:
        validate: config-types/ignore-rules/validate
        deploy: config-types/ignore-rules/deploy
        rollback: config-types/ignore-rules/rollback
        healthCheck: config-types/ignore-rules/healthCheck
        driftDetect: config-types/ignore-rules/driftDetect
        getStatus: config-types/ignore-rules/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: operational-risk-policies
      group: "Policies"
      name: Operational Risk Policies
      description: Project-maturity and end-of-life risk gates managed as operational_risk policies through /xray/api/v2/policies.
      canvasTemplate: config-types/operational-risk-policies/canvas.yaml
      defaultConfig: config-types/operational-risk-policies/defaults.yaml
      handlers:
        validate: config-types/operational-risk-policies/validate
        deploy: config-types/operational-risk-policies/deploy
        rollback: config-types/operational-risk-policies/rollback
        healthCheck: config-types/operational-risk-policies/healthCheck
        driftDetect: config-types/operational-risk-policies/driftDetect
        getStatus: config-types/operational-risk-policies/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: custom-issues
      group: "Data"
      name: Custom Issues
      description: >
        Manually-authored Xray issues (vulnerabilities) for components not
        covered by Xray's own vulnerability database — applied over
        `/xray/api/v1/events` (create/update) and `/xray/api/v2/events/{id}`
        (read). Upserts by a USER-CHOSEN issue id (Xray assigns no id of its
        own for this object).
      canvasTemplate: config-types/custom-issues/canvas.yaml
      defaultConfig: config-types/custom-issues/defaults.yaml
      handlers:
        validate: config-types/custom-issues/validate
        deploy: config-types/custom-issues/deploy
        rollback: config-types/custom-issues/rollback
        healthCheck: config-types/custom-issues/healthCheck
        driftDetect: config-types/custom-issues/driftDetect
        getStatus: config-types/custom-issues/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: webhooks
      group: "Integrations"
      name: Webhooks
      description: >
        Named HTTP callback targets that a policy's "Webhooks" action list
        can reference by name — applied over Xray's OWN webhook registry
        (`/xray/api/v1/webhooks`), distinct from the JFrog Platform's
        separate Event/Webhooks service. Upserts by webhook name.
      canvasTemplate: config-types/webhooks/canvas.yaml
      defaultConfig: config-types/webhooks/defaults.yaml
      handlers:
        validate: config-types/webhooks/validate
        deploy: config-types/webhooks/deploy
        rollback: config-types/webhooks/rollback
        healthCheck: config-types/webhooks/healthCheck
        driftDetect: config-types/webhooks/driftDetect
        getStatus: config-types/webhooks/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: curation-policies
      group: "Policies"
      name: Curation Policies
      description: >
        JFrog Curation policies — package-based governance blocking (or
        dry-running) risky open-source package versions before they reach an
        Artifactory remote repository — applied over
        `/xray/api/v1/curation/policies`. Upserts by policy name (the write
        URLs key off a server-assigned policy id, resolved via the list
        endpoint). Custom curation conditions/templates are out of scope —
        `condition_id` references an existing condition by id.
      canvasTemplate: config-types/curation-policies/canvas.yaml
      defaultConfig: config-types/curation-policies/defaults.yaml
      handlers:
        validate: config-types/curation-policies/validate
        deploy: config-types/curation-policies/deploy
        rollback: config-types/curation-policies/rollback
        healthCheck: config-types/curation-policies/healthCheck
        driftDetect: config-types/curation-policies/driftDetect
        getStatus: config-types/curation-policies/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/jfrog-xray

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a JFrog Platform host (component)
    # with the Access Token used to reach it, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the host + Access Token via an
# authenticated GET /xray/api/v2/policies (proves both reachability AND that
# the token carries the Read Policies permission — an unauthenticated ping
# alone would not).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Xray API calls.
    default: 30
    required: false
