id: jfrog-xray
name: JFrog Xray
version: "0.2.0"
vendor: Veltrix
description: >
  Manage JFrog Xray (software composition analysis / supply-chain security)
  configuration as code through the Xray REST API. Covers security policies
  (severity/CVSS gates), license policies (allowed/banned OSS licenses),
  watches (the scope + policy binding that makes a policy actually take
  effect) and ignore rules (violation suppression) — with validation, drift
  detection and rollback handled by the Security-as-Code pipeline.
  Authenticates with a JFrog Platform Access Token (Bearer).
category: COMPLIANCE
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/jfrog-xray
icon: "🩻"

platform:
  minVersion: "1.0.0"

# JFrog brand green. Approximate — no official hex was published in the brand
# guidelines page consulted; adjust if JFrog's brand portal (brand.jfrog.com)
# publishes an exact value. No logo asset shipped yet (placeholder, like the
# Auth0 app) until an official lockup is added.
branding:
  primaryColor: "#41BF47"

permissions:
  platform:
    - configuration-canvas:read
    - component:read
    - credential:read
  app:
    - resource: security-policies
      actions: [read, write, delete]
      description: Manage JFrog Xray security policies (create / edit / delete)
    - resource: license-policies
      actions: [read, write, delete]
      description: Manage JFrog Xray license policies (create / edit / delete)
    - resource: watches
      actions: [read, write, delete]
      description: Manage JFrog Xray watches — the scope + policy binding that makes a policy take effect
    - resource: ignore-rules
      actions: [read, write, delete]
      description: Manage JFrog Xray ignore rules (create / delete — Xray has no update endpoint)

pipeline:
  configurationTypes:
    - id: security-policies
      group: "Policies"
      name: Security Policies
      description: >
        JFrog Xray security policies — a minimum severity or CVSS-range gate
        per rule, with build/release-blocking, notification and ticketing
        actions — applied over the Xray REST API v2 (/xray/api/v2/policies).
        Upserts by policy name.
      canvasTemplate: config-types/security-policies/canvas.yaml
      defaultConfig: config-types/security-policies/defaults.yaml
      handlers:
        validate: config-types/security-policies/validate
        deploy: config-types/security-policies/deploy
        rollback: config-types/security-policies/rollback
        healthCheck: config-types/security-policies/healthCheck
        driftDetect: config-types/security-policies/driftDetect
        getStatus: config-types/security-policies/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: license-policies
      group: "Policies"
      name: License Policies
      description: >
        JFrog Xray license policies — allowed/banned OSS licenses and
        unknown-license handling per rule, with build/release-blocking,
        notification and ticketing actions — applied over the SAME
        Xray REST API v2 endpoint as security-policies
        (/xray/api/v2/policies, a policy of type "license"). Upserts by
        policy name.
      canvasTemplate: config-types/license-policies/canvas.yaml
      defaultConfig: config-types/license-policies/defaults.yaml
      handlers:
        validate: config-types/license-policies/validate
        deploy: config-types/license-policies/deploy
        rollback: config-types/license-policies/rollback
        healthCheck: config-types/license-policies/healthCheck
        driftDetect: config-types/license-policies/driftDetect
        getStatus: config-types/license-policies/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: watches
      group: "Watches"
      name: Watches
      description: >
        JFrog Xray watches — the resource scope (all repositories, one
        repository, or an advanced JSON scope covering builds/release
        bundles/projects/git repos) and the security/license policies bound
        to it — applied over the Xray REST API v2
        (/xray/api/v2/watches). This is what makes a policy actually take
        effect. Upserts by watch name.
      canvasTemplate: config-types/watches/canvas.yaml
      defaultConfig: config-types/watches/defaults.yaml
      handlers:
        validate: config-types/watches/validate
        deploy: config-types/watches/deploy
        rollback: config-types/watches/rollback
        healthCheck: config-types/watches/healthCheck
        driftDetect: config-types/watches/driftDetect
        getStatus: config-types/watches/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

    - id: ignore-rules
      group: "Ignore Rules"
      name: Ignore Rules
      description: >
        JFrog Xray ignore rules — suppress violations matching CVE/
        vulnerability/license/scope filters, optionally until an expiry date
        — applied over the Xray REST API v1 (/xray/api/v1/ignore_rules).
        Xray assigns no user-chosen name and exposes NO update endpoint for
        this object (create + delete only); a changed rule is recreated.
      canvasTemplate: config-types/ignore-rules/canvas.yaml
      defaultConfig: config-types/ignore-rules/defaults.yaml
      handlers:
        validate: config-types/ignore-rules/validate
        deploy: config-types/ignore-rules/deploy
        rollback: config-types/ignore-rules/rollback
        healthCheck: config-types/ignore-rules/healthCheck
        driftDetect: config-types/ignore-rules/driftDetect
        getStatus: config-types/ignore-rules/getStatus
      targets:
        componentTypes: [jfrog-xray-instance]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/jfrog-xray

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # Connections — Settings nav group. Pairs a JFrog Platform host (component)
    # with the Access Token used to reach it, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

# Connection-level connectivity test: verifies the host + Access Token via an
# authenticated GET /xray/api/v2/policies (proves both reachability AND that
# the token carries the Read Policies permission — an unauthenticated ping
# alone would not).
connectivity:
  testHandler: handlers/testConnection

settings:
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for Xray API calls.
    default: 30
    required: false
