# =============================================================================
# Canvas Template — JFrog Xray Operational Risk Policies
#
# Declares ONE Xray operational-risk policy (the item) — a policy of
# `type: "operational_risk"` against the SAME /xray/api/v2/policies endpoints
# as security-policies and license-policies, just a different criteria shape
# (a named minimum risk level, OR a custom multi-factor risk rule based on
# project maturity signals — EOL status, release age, commit/committer
# activity). Users add as many as they need. Identified for reconciliation by
# its `name`.
#
# The "Actions" groups below are intentionally identical to
# config-types/security-policies/canvas.yaml — the actions schema is the same
# for every Xray policy type (verified against JFrog's own Terraform provider
# docs; see config-types/operational-risk-policies/deploy.ts header).
#
# Field keys must match config-types/operational-risk-policies/_shared.ts.
# =============================================================================

id: "jfrog-xray-operational-risk-policies"
name: "Xray Operational Risk Policy"
toolType: "jfrog-xray"
entityType: "operational-risk-policies"
description: "Define JFrog Xray operational-risk policies as code through the Xray REST API v2. Reconciled by policy name; each policy gates on a named minimum risk level or a custom multi-factor risk rule (EOL status, release age, commit/committer activity), with build/release-blocking, notification and ticketing actions."

item:
  label: "Operational Risk Policy"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 200
  groups:
    - name: "Policy"
      icon: "shield"
      description: "Identity and description"
      fields:
        - key: "name"
          label: "Policy Name"
          fieldType: "text"
          required: true
          validation:
            maxLength: 200
          helpText: "The policy's logical identity in Xray — also the URL path segment for reads/updates/deletes, so avoid \"/\" or \"\\\"."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          helpText: "Optional description shown in the Xray console."

    - name: "Rule"
      icon: "list"
      description: "The policy's primary rule"
      fields:
        - key: "rule_name"
          label: "Rule Name"
          fieldType: "text"
          required: true
          defaultValue: "default-rule"
          helpText: "Every Xray rule needs its own name, distinct from the policy name."

        - key: "priority"
          label: "Priority"
          fieldType: "number"
          validation:
            min: 1
          helpText: "Evaluation order among this policy's rules — lower runs first. Leave blank to let Xray assign the default order."

    - name: "Criteria — Operational Risk"
      icon: "alert-triangle"
      description: "How this rule assesses a component's operational risk"
      fields:
        - key: "risk_mode"
          label: "Risk Mode"
          fieldType: "select"
          required: true
          defaultValue: "min_risk"
          options:
            - { label: "Named minimum risk level", value: "min_risk" }
            - { label: "Custom multi-factor rule", value: "custom" }
          helpText: "A simple named threshold, or a custom rule built from project-maturity signals (EOL, release age, commit activity, …)."

        - key: "min_risk"
          label: "Minimum Risk"
          fieldType: "select"
          defaultValue: "Medium"
          visibleWhen:
            field: "risk_mode"
            equals: "min_risk"
          options:
            - { label: "High", value: "High" }
            - { label: "Medium", value: "Medium" }
            - { label: "Low", value: "Low" }
          helpText: "The rule matches components Xray assesses at or above this operational-risk level."

        - key: "custom_use_and_condition"
          label: "Require ALL custom conditions (AND)"
          fieldType: "checkbox"
          defaultValue: true
          visibleWhen:
            field: "risk_mode"
            equals: "custom"
          helpText: "Checked = every enabled condition below must match (AND). Unchecked = any one matching is enough (OR)."

        - key: "custom_is_eol"
          label: "Component version is end-of-life"
          fieldType: "checkbox"
          defaultValue: false
          visibleWhen:
            field: "risk_mode"
            equals: "custom"

        - key: "custom_release_date_months"
          label: "Release age greater than (months)"
          fieldType: "number"
          visibleWhen:
            field: "risk_mode"
            equals: "custom"
          validation:
            min: 1
            max: 999
          helpText: "1–999 months since the component version's release date."

        - key: "custom_newer_versions"
          label: "Newer releases since, greater than"
          fieldType: "select"
          visibleWhen:
            field: "risk_mode"
            equals: "custom"
          options:
            - { label: "1", value: "1" }
            - { label: "2", value: "2" }
            - { label: "3", value: "3" }
            - { label: "4", value: "4" }
            - { label: "5", value: "5" }

        - key: "custom_release_cadence"
          label: "Annual release cadence less than"
          fieldType: "number"
          visibleWhen:
            field: "risk_mode"
            equals: "custom"
          validation:
            min: 0
          helpText: "Releases per year below this count."

        - key: "custom_commits_less_than"
          label: "Commits per year less than"
          fieldType: "select"
          visibleWhen:
            field: "risk_mode"
            equals: "custom"
          options:
            - { label: "10", value: "10" }
            - { label: "25", value: "25" }
            - { label: "50", value: "50" }
            - { label: "100", value: "100" }

        - key: "custom_committers_less_than"
          label: "Committers per year less than"
          fieldType: "select"
          visibleWhen:
            field: "risk_mode"
            equals: "custom"
          options:
            - { label: "1", value: "1" }
            - { label: "2", value: "2" }
            - { label: "3", value: "3" }
            - { label: "4", value: "4" }
            - { label: "5", value: "5" }

        - key: "custom_risk"
          label: "Resulting Risk"
          fieldType: "select"
          defaultValue: "Medium"
          visibleWhen:
            field: "risk_mode"
            equals: "custom"
          options:
            - { label: "High", value: "High" }
            - { label: "Medium", value: "Medium" }
            - { label: "Low", value: "Low" }
          helpText: "The risk severity Xray assigns a component that matches these custom conditions."

    - name: "Actions — Build & Release"
      icon: "ban"
      description: "What happens when the rule matches"
      fields:
        - key: "fail_build"
          label: "Fail build"
          fieldType: "checkbox"
          defaultValue: false

        - key: "build_failure_grace_period_days"
          label: "Build failure grace period (days)"
          fieldType: "number"
          validation:
            min: 0
          helpText: "Delay build failures by this many days after a match is first found. Only applies when \"Fail build\" is on."

        - key: "block_download_unscanned"
          label: "Block download of unscanned artifacts"
          fieldType: "checkbox"
          defaultValue: false

        - key: "block_download_active"
          label: "Block download of violating artifacts"
          fieldType: "checkbox"
          defaultValue: false

        - key: "block_release_bundle_distribution"
          label: "Block release bundle distribution"
          fieldType: "checkbox"
          defaultValue: false

        - key: "block_release_bundle_promotion"
          label: "Block release bundle promotion"
          fieldType: "checkbox"
          defaultValue: false

    - name: "Actions — Notify"
      icon: "bell"
      description: "Who gets told"
      fields:
        - key: "notify_watch_recipients"
          label: "Notify watch recipients"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Notify the recipients configured on any watch this policy is assigned to."

        - key: "notify_deployer"
          label: "Notify deployer"
          fieldType: "checkbox"
          defaultValue: false

        - key: "mails"
          label: "Additional email recipients"
          fieldType: "tags"
          helpText: "Extra email addresses to notify, beyond a watch's own recipients."

        - key: "webhooks"
          label: "Webhooks"
          fieldType: "tags"
          helpText: "Names of webhook integrations already configured in Xray (this app's Webhooks config type, or Administration > General > Webhooks)."

        - key: "create_ticket_enabled"
          label: "Create a ticket"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Requires a Jira integration already configured in Xray."

        - key: "fail_pull_request"
          label: "Fail pull request checks"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "JFrog Advanced Security Git-repository scanning only."

    - name: "Advanced (JSON)"
      icon: "code"
      description: "Escape valves for anything the fields above don't cover"
      fields:
        - key: "criteria_json"
          label: "Additional Criteria (JSON)"
          fieldType: "textarea"
          helpText: 'Extra criteria fields merged into this rule''s criteria. The typed fields above win on a key collision.'

        - key: "actions_json"
          label: "Additional Actions (JSON)"
          fieldType: "textarea"
          helpText: 'Extra action fields merged into this rule''s actions, e.g. {"custom_severity":"High"}. The typed fields above win on a key collision.'

        - key: "additional_rules_json"
          label: "Additional Rules (JSON)"
          fieldType: "textarea"
          validation:
            maxLength: 8000
          helpText: 'Extra rules appended after the primary rule above, for multi-tier policies — a JSON array of {"name","criteria","actions"} objects.'
