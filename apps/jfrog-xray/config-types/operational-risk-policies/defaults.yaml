# Defaults for a new operational-risk-policy item.
#
# Intentionally empty: the platform starts a new item blank and the field-level
# `defaultValue`s in canvas.yaml (rule_name: "default-rule", risk_mode:
# "min_risk", min_risk: "Medium", every checkbox: false) already give a
# sensible starting point. Any values here would be a FLAT map keyed by the
# canvas field keys (name, description, rule_name, priority, risk_mode,
# min_risk, custom_use_and_condition, custom_is_eol, custom_release_date_months,
# custom_newer_versions, custom_release_cadence, custom_commits_less_than,
# custom_committers_less_than, custom_risk, fail_build,
# build_failure_grace_period_days, block_download_unscanned,
# block_download_active, block_release_bundle_distribution,
# block_release_bundle_promotion, notify_watch_recipients, notify_deployer,
# mails, webhooks, create_ticket_enabled, fail_pull_request, criteria_json,
# actions_json, additional_rules_json).
