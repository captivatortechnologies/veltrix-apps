# =============================================================================
# Canvas Template — Wiz Projects
#
# Declares ONE Wiz Project — the item. Users add as many as they need. A
# Project groups cloud accounts/organizations/Kubernetes clusters, owners and a
# risk profile so Issues, findings and Controls can be scoped and reported on
# per business unit or application. Created / updated through the GraphQL
# createProject / updateProject mutations, identified for reconciliation by
# `name`.
#
# VERIFIED against the generated Wiz GraphQL SDK type surface (terraform-
# provider-wiz's internal/wiz Go package, github.com/AxtonGrams/terraform-
# provider-wiz) plus its resource_project.go for the literal create/read/update
# GraphQL text (reused verbatim by config-types/wiz-projects/deploy.ts). The
# `projects` LIST query (needed to reconcile by name) is inferred from the
# now-repeated plural-list / singular-by-id naming convention this app already
# relies on elsewhere in this schema.
#
# CAVEAT — Wiz has NO deleteProject mutation (verified absent from the schema
# dump — every other type this app manages has one). A project can only be
# ARCHIVED (`archived: true`), never deleted. Consequently:
#   - rollback of a newly-CREATED project archives it instead of deleting it.
#   - `is_folder` is CREATE-TIME ONLY — `UpdateProjectPatch` has no such field.
#
# The nested cloud-account / cloud-organization / Kubernetes-cluster links are
# authored as one JSON blob (`resource_links_json`) — following this app's
# established "typed scalar fields, JSON blob for a deeply-nested long tail"
# convention (see wiz-cloud-config-rules' IaC matcher, or Cisco Meraki's Group
# Policies) — since each link type carries its own nested resource tags/groups.
#
# Field keys must match config-types/wiz-projects/validate.ts.
# =============================================================================

id: "wiz-projects"
name: "Wiz Project"
toolType: "wiz"
entityType: "wiz-projects"
description: "Define Wiz Projects (the grouping construct for cloud accounts, owners and risk profile) as code through the GraphQL API. Reconciled by project name. Projects have no delete API — only archive."

item:
  label: "Project"
  identityField: "name"
  repeatable: true
  minItems: 1
  maxItems: 500
  groups:
    - name: "Project"
      icon: "folder"
      description: "Name, hierarchy and state"
      fields:
        - key: "name"
          label: "Name"
          fieldType: "text"
          required: true
          helpText: "The project name — its logical identity in the tenant."

        - key: "description"
          label: "Description"
          fieldType: "textarea"
          helpText: "Optional description shown in the Wiz console."

        - key: "business_unit"
          label: "Business Unit"
          fieldType: "text"
          helpText: "The business unit this project belongs to."

        - key: "is_folder"
          label: "Is Folder"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Whether this is a folder project (a grouping container for child projects) rather than a project with its own resources. CREATE-TIME ONLY — Wiz has no API to change this after creation."

        - key: "parent_project_id"
          label: "Parent Project ID"
          fieldType: "text"
          helpText: "Optional Wiz project id of a parent (folder) project."

        - key: "archived"
          label: "Archived"
          fieldType: "checkbox"
          defaultValue: false
          helpText: "Whether the project is archived/inactive. Wiz has no API to delete a project — archiving is the only way to retire one, and is exactly what this app's rollback does to a project it created."

    - name: "People"
      icon: "users"
      description: "Owners and identifiers"
      fields:
        - key: "identifiers"
          label: "Identifiers"
          fieldType: "tags"
          helpText: "Optional free-text identifiers for this project (e.g. cost-center codes)."

        - key: "project_owners"
          label: "Project Owner User IDs"
          fieldType: "tags"
          helpText: "Optional Wiz user ids who own this project."

        - key: "security_champions"
          label: "Security Champion User IDs"
          fieldType: "tags"
          helpText: "Optional Wiz user ids acting as security champions for this project."

    - name: "Risk Profile"
      icon: "alert-triangle"
      description: "Drives risk scoring and compliance reporting for the project"
      fields:
        - key: "risk_business_impact"
          label: "Business Impact"
          fieldType: "select"
          defaultValue: "MBI"
          options:
            - { label: "Low Business Impact", value: "LBI" }
            - { label: "Medium Business Impact", value: "MBI" }
            - { label: "High Business Impact", value: "HBI" }

        - key: "risk_has_authentication"
          label: "Requires Authentication"
          fieldType: "select"
          defaultValue: "UNKNOWN"
          options:
            - { label: "Yes", value: "YES" }
            - { label: "No", value: "NO" }
            - { label: "Unknown", value: "UNKNOWN" }

        - key: "risk_has_exposed_api"
          label: "Exposes An API"
          fieldType: "select"
          defaultValue: "UNKNOWN"
          options:
            - { label: "Yes", value: "YES" }
            - { label: "No", value: "NO" }
            - { label: "Unknown", value: "UNKNOWN" }

        - key: "risk_is_internet_facing"
          label: "Internet Facing"
          fieldType: "select"
          defaultValue: "UNKNOWN"
          options:
            - { label: "Yes", value: "YES" }
            - { label: "No", value: "NO" }
            - { label: "Unknown", value: "UNKNOWN" }

        - key: "risk_is_customer_facing"
          label: "Customer Facing"
          fieldType: "select"
          defaultValue: "UNKNOWN"
          options:
            - { label: "Yes", value: "YES" }
            - { label: "No", value: "NO" }
            - { label: "Unknown", value: "UNKNOWN" }

        - key: "risk_stores_data"
          label: "Stores Data"
          fieldType: "select"
          defaultValue: "UNKNOWN"
          options:
            - { label: "Yes", value: "YES" }
            - { label: "No", value: "NO" }
            - { label: "Unknown", value: "UNKNOWN" }

        - key: "risk_is_regulated"
          label: "Regulated"
          fieldType: "select"
          defaultValue: "UNKNOWN"
          options:
            - { label: "Yes", value: "YES" }
            - { label: "No", value: "NO" }
            - { label: "Unknown", value: "UNKNOWN" }

        - key: "risk_is_actively_developed"
          label: "Actively Developed"
          fieldType: "select"
          defaultValue: "UNKNOWN"
          options:
            - { label: "Yes", value: "YES" }
            - { label: "No", value: "NO" }
            - { label: "Unknown", value: "UNKNOWN" }

        - key: "risk_sensitive_data_types"
          label: "Sensitive Data Types"
          fieldType: "multiselect"
          options:
            - { label: "Classified", value: "CLASSIFIED" }
            - { label: "Health", value: "HEALTH" }
            - { label: "PII", value: "PII" }
            - { label: "PCI", value: "PCI" }
            - { label: "Financial", value: "FINANCIAL" }
            - { label: "Customer", value: "CUSTOMER" }

        - key: "risk_regulatory_standards"
          label: "Regulatory Standards"
          fieldType: "multiselect"
          options:
            - { label: "ISO 20000-1:2011", value: "ISO_20000_1_2011" }
            - { label: "ISO 22301", value: "ISO_22301" }
            - { label: "ISO 27001", value: "ISO_27001" }
            - { label: "ISO 27017", value: "ISO_27017" }
            - { label: "ISO 27018", value: "ISO_27018" }
            - { label: "ISO 27701", value: "ISO_27701" }
            - { label: "ISO 9001", value: "ISO_9001" }
            - { label: "SOC", value: "SOC" }
            - { label: "FedRAMP", value: "FEDRAMP" }
            - { label: "NIST 800-171", value: "NIST_800_171" }
            - { label: "NIST CSF", value: "NIST_CSF" }
            - { label: "HIPAA/HITECH", value: "HIPPA_HITECH" }
            - { label: "HITRUST", value: "HITRUST" }
            - { label: "PCI DSS", value: "PCI_DSS" }
            - { label: "SEC 17a-4", value: "SEC_17A_4" }
            - { label: "SEC Regulation SCI", value: "SEC_REGULATION_SCI" }
            - { label: "SOX", value: "SOX" }
            - { label: "GDPR", value: "GDPR" }

    - name: "Resource Links"
      icon: "link"
      description: "Cloud accounts, organizations and Kubernetes clusters in scope"
      fields:
        - key: "resource_links_json"
          label: "Resource Links (JSON)"
          fieldType: "textarea"
          helpText: >-
            Optional JSON object with up to three arrays —
            "cloudAccountLinks" ({"cloudAccount":"<id>","environment":"PRODUCTION|STAGING|DEVELOPMENT|TESTING|OTHER","shared":false,"resourceTags":[{"key":"..","value":".."}],"resourceGroups":["..."]}),
            "cloudOrganizationLinks" ({"cloudOrganization":"<id>",...same shape}) and
            "kubernetesClusterLinks" ({"kubernetesCluster":"<id>","environment":"...","shared":true,"namespaces":["..."]}).
            Leave empty for a project with no directly-linked resources yet.
            Example: {"cloudAccountLinks":[{"cloudAccount":"acct-1","environment":"PRODUCTION"}]}
