id: sonarqube
name: SonarQube
version: "0.4.0"
vendor: Veltrix
description: >
  Manage SonarQube as code. Author quality gates, quality profiles (with per-rule
  overrides), webhooks, permission templates, global settings, new code periods,
  global permissions and ALM (DevOps Platform) settings — and drive them through
  the Security-as-Code pipeline (validate, deploy, health check, drift detection
  and rollback) over the SonarQube Web API (token authentication, self-signed TLS
  tolerated), with BYOL infrastructure provisioning for the SonarQube stack
  (SonarQube web/compute + Elasticsearch search + PostgreSQL).
category: COMPLIANCE
license: Apache-2.0
homepage: https://github.com/captivatortechnologies/veltrix-apps/tree/main/apps/sonarqube
icon: "🛡️"

platform:
  minVersion: "1.0.0"

# SonarQube brand blue. Assets are placeholders until the official lockup is added.
branding:
  primaryColor: "#4E9BCD"

permissions:
  platform:
    - configuration-canvas:read
    - configuration-canvas:write
    - component:read
    - credential:read
  app:
    - resource: quality-gates
      actions: [read, write, delete]
      description: Manage SonarQube quality gates and their conditions (create / edit / set default)
    - resource: quality-profiles
      actions: [read, write, delete]
      description: Manage SonarQube quality profiles (create / inherit / activate rules / set default)
    - resource: webhooks
      actions: [read, write, delete]
      description: Manage SonarQube global and project webhooks (create / update / delete)
    - resource: permission-templates
      actions: [read, write, delete]
      description: Manage SonarQube permission templates and their group grants (create / edit / delete)
    - resource: global-settings
      actions: [read, write, delete]
      description: Manage SonarQube global instance settings (sonar.* properties)
    - resource: new-code-periods
      actions: [read, write, delete]
      description: Manage the SonarQube New Code definition at the global, project or branch level
    - resource: global-permissions
      actions: [read, write, delete]
      description: Manage SonarQube global permission grants to groups
    - resource: quality-profile-rule-overrides
      actions: [read, write, delete]
      description: Manage per-rule severity, parameter and prioritization overrides within a quality profile
    - resource: alm-settings
      actions: [read, write, delete]
      description: Manage SonarQube DevOps Platform (ALM) integration settings
    - resource: byol
      actions: [read, write, delete]
      description: Manage BYOL SonarQube stack infrastructure
    - resource: usage
      actions: [read, write]
      description: Read BYOL infrastructure usage metering

database:
  migrations: migrations
  tablePrefix: sonarqube_

pipeline:
  configurationTypes:
    - id: quality-gates
      group: "Quality Standards"
      name: Quality Gates
      description: >
        SonarQube quality gates — name, default flag and pass/fail conditions
        (metric / operator / error threshold, e.g. new_coverage LT 80) — applied
        over the SonarQube Web API (/api/qualitygates)
      canvasTemplate: config-types/quality-gates/canvas.yaml
      defaultConfig: config-types/quality-gates/defaults.yaml
      handlers:
        validate: config-types/quality-gates/validate
        deploy: config-types/quality-gates/deploy
        rollback: config-types/quality-gates/rollback
        healthCheck: config-types/quality-gates/healthCheck
        driftDetect: config-types/quality-gates/driftDetect
        getStatus: config-types/quality-gates/getStatus
      targets:
        componentTypes: [sonarqube-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: quality-profiles
      group: "Quality Standards"
      name: Quality Profiles
      description: >
        SonarQube quality profiles — name, language, parent (inheritance), default
        flag and activated rule keys — applied over the SonarQube Web API
        (/api/qualityprofiles). Upserted by (name, language) so ids need not be tracked.
      canvasTemplate: config-types/quality-profiles/canvas.yaml
      defaultConfig: config-types/quality-profiles/defaults.yaml
      handlers:
        validate: config-types/quality-profiles/validate
        deploy: config-types/quality-profiles/deploy
        rollback: config-types/quality-profiles/rollback
        healthCheck: config-types/quality-profiles/healthCheck
        driftDetect: config-types/quality-profiles/driftDetect
        getStatus: config-types/quality-profiles/getStatus
      targets:
        componentTypes: [sonarqube-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: webhooks
      group: "Integrations"
      name: Webhooks
      description: >
        SonarQube webhooks — name, delivery URL, optional HMAC secret and global or
        project scope — applied over the SonarQube Web API (/api/webhooks). Upserted
        by name within a scope.
      canvasTemplate: config-types/webhooks/canvas.yaml
      defaultConfig: config-types/webhooks/defaults.yaml
      handlers:
        validate: config-types/webhooks/validate
        deploy: config-types/webhooks/deploy
        rollback: config-types/webhooks/rollback
        healthCheck: config-types/webhooks/healthCheck
        driftDetect: config-types/webhooks/driftDetect
        getStatus: config-types/webhooks/getStatus
      targets:
        componentTypes: [sonarqube-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: permission-templates
      group: "Access & Governance"
      name: Permission Templates
      description: >
        SonarQube permission templates — name, description, project-key pattern and
        group grants — applied over the SonarQube Web API (/api/permissions/*_template).
        Upserted by name; only declared groups are reconciled.
      canvasTemplate: config-types/permission-templates/canvas.yaml
      defaultConfig: config-types/permission-templates/defaults.yaml
      handlers:
        validate: config-types/permission-templates/validate
        deploy: config-types/permission-templates/deploy
        rollback: config-types/permission-templates/rollback
        healthCheck: config-types/permission-templates/healthCheck
        driftDetect: config-types/permission-templates/driftDetect
        getStatus: config-types/permission-templates/getStatus
      targets:
        componentTypes: [sonarqube-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: global-settings
      group: "Instance Configuration"
      name: Global Settings
      description: >
        Arbitrary SonarQube instance-wide sonar.* properties — key, and a single
        value or a multi-value list — applied over the SonarQube Web API
        (/api/settings). Global scope only; PROPERTY_SET (fieldValues) settings
        are not supported.
      canvasTemplate: config-types/global-settings/canvas.yaml
      defaultConfig: config-types/global-settings/defaults.yaml
      handlers:
        validate: config-types/global-settings/validate
        deploy: config-types/global-settings/deploy
        rollback: config-types/global-settings/rollback
        healthCheck: config-types/global-settings/healthCheck
        driftDetect: config-types/global-settings/driftDetect
        getStatus: config-types/global-settings/getStatus
      targets:
        componentTypes: [sonarqube-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: new-code-periods
      group: "Quality Standards"
      name: New Code Periods
      description: >
        The SonarQube New Code definition (previous version, number of days,
        reference branch or specific analysis) at the global, project or branch
        level — applied over the SonarQube Web API (/api/new_code_periods).
      canvasTemplate: config-types/new-code-periods/canvas.yaml
      defaultConfig: config-types/new-code-periods/defaults.yaml
      handlers:
        validate: config-types/new-code-periods/validate
        deploy: config-types/new-code-periods/deploy
        rollback: config-types/new-code-periods/rollback
        healthCheck: config-types/new-code-periods/healthCheck
        driftDetect: config-types/new-code-periods/driftDetect
        getStatus: config-types/new-code-periods/getStatus
      targets:
        componentTypes: [sonarqube-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: global-permissions
      group: "Access & Governance"
      name: Global Permissions
      description: >
        Direct instance-wide SonarQube permission grants to groups (admin,
        gateadmin, profileadmin, provisioning, scan, applicationcreator,
        portfoliocreator) — applied over the SonarQube Web API
        (/api/permissions add_group/remove_group, global scope). Only the
        groups you declare are reconciled.
      canvasTemplate: config-types/global-permissions/canvas.yaml
      defaultConfig: config-types/global-permissions/defaults.yaml
      handlers:
        validate: config-types/global-permissions/validate
        deploy: config-types/global-permissions/deploy
        rollback: config-types/global-permissions/rollback
        healthCheck: config-types/global-permissions/healthCheck
        driftDetect: config-types/global-permissions/driftDetect
        getStatus: config-types/global-permissions/getStatus
      targets:
        componentTypes: [sonarqube-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: quality-profile-rule-overrides
      group: "Quality Standards"
      name: Quality Profile Rule Overrides
      description: >
        Per-rule severity, parameter and prioritization overrides within a
        quality profile — applied over the SonarQube Web API
        (/api/qualityprofiles/activate_rule, /deactivate_rule). Complements
        the Quality Profiles config type's bulk rule activation.
      canvasTemplate: config-types/quality-profile-rule-overrides/canvas.yaml
      defaultConfig: config-types/quality-profile-rule-overrides/defaults.yaml
      handlers:
        validate: config-types/quality-profile-rule-overrides/validate
        deploy: config-types/quality-profile-rule-overrides/deploy
        rollback: config-types/quality-profile-rule-overrides/rollback
        healthCheck: config-types/quality-profile-rule-overrides/healthCheck
        driftDetect: config-types/quality-profile-rule-overrides/driftDetect
        getStatus: config-types/quality-profile-rule-overrides/getStatus
      targets:
        componentTypes: [sonarqube-server]
        requiresCredential: true
        requiresConnectivity: false

    - id: alm-settings
      group: "Integrations"
      name: ALM Settings
      description: >
        SonarQube DevOps Platform (ALM) integration settings — GitHub, GitLab,
        Bitbucket Server, Bitbucket Cloud and Azure DevOps connections —
        applied over the SonarQube Web API (/api/alm_settings). Instance-level
        settings only; per-project repository bindings are out of scope.
      canvasTemplate: config-types/alm-settings/canvas.yaml
      defaultConfig: config-types/alm-settings/defaults.yaml
      handlers:
        validate: config-types/alm-settings/validate
        deploy: config-types/alm-settings/deploy
        rollback: config-types/alm-settings/rollback
        healthCheck: config-types/alm-settings/healthCheck
        driftDetect: config-types/alm-settings/driftDetect
        getStatus: config-types/alm-settings/getStatus
      targets:
        componentTypes: [sonarqube-server]
        requiresCredential: true
        requiresConnectivity: false

  pipelineEvents:
    - canvas:validated
    - canvas:deployed
    - canvas:rollback
    - drift:detected

server:
  entry: server/index
  routes:
    prefix: /api/apps/sonarqube

client:
  entry: client/index
  navLayout: sidebar
  pages:
    - path: /overview
      component: OverviewPage
      label: Overview
      icon: shield
      nav: sidebar
    - path: /setup
      component: SetupGuidePage
      label: Setup Guide
      icon: book
      nav: sidebar
    # BYOL stack infrastructure — Config nav group. Wraps the SDK
    # <ByolInfrastructureManager> over this app's app-owned /byol routes.
    - path: /byol
      component: BYOLPage
      label: Infrastructure
      icon: server
      nav: sidebar
      group: config
    # Connections — Settings nav group. Pairs a SonarQube server (component) with
    # the API token used to reach it, with a per-row connectivity test.
    - path: /connections
      component: ConnectionsPage
      label: Connections
      icon: link
      nav: sidebar
      group: settings

# Connection-level connectivity test: verifies a Connection's endpoint + API token
# against the SonarQube Web API (GET /api/system/status + /api/authentication/validate).
connectivity:
  testHandler: handlers/testConnection

hooks:
  onInstall: hooks/onInstall
  onUninstall: hooks/onUninstall

settings:
  - key: verify_tls
    type: boolean
    label: Verify TLS certificate
    description: >
      Enforce a valid TLS certificate on the SonarQube endpoint. Off by default —
      self-hosted SonarQube servers commonly sit behind a self-signed certificate.
    default: false
    required: false
  - key: request_timeout_seconds
    type: number
    label: Request Timeout (seconds)
    description: Per-request timeout for SonarQube Web API calls.
    default: 30
    required: false

events:
  - component:created
  - component:deleted
  - credential:updated
